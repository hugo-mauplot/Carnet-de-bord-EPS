<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EPS Dashboard" />
  <meta name="theme-color" content="#0f1117" />
  <title>EPS Collège — Tableau de bord pédagogique</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236c8cff' width='100' height='100' rx='20'/><text x='50' y='68' text-anchor='middle' font-size='48' fill='white' font-family='sans-serif' font-weight='bold'>EPS</text></svg>" />
  <style>
    /* ========== VARIABLES & RESET ========== */
    :root {
      --bg: #0f1117;
      --bg-elevated: #161922;
      --surface: rgba(30, 34, 45, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8eaef;
      --text-muted: #9aa3b2;
      --accent: #6c8cff;
      --accent-soft: rgba(108, 140, 255, 0.18);
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --sidebar-w: 260px;
    }
    [data-theme="light"] {
      --bg: #f4f6fb;
      --bg-elevated: #ffffff;
      --surface: rgba(255, 255, 255, 0.78);
      --border: rgba(15, 23, 42, 0.08);
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.12);
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 10% -10%, rgba(108, 140, 255, 0.15), transparent),
        radial-gradient(900px 500px at 100% 0%, rgba(52, 211, 153, 0.1), transparent), var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background 0.35s ease, color 0.25s ease;
    }
    a { color: var(--accent); text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    ul { list-style: none; }
    .hidden { display: none !important; }

    /* ========== LAYOUT ========== */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      padding: 1.25rem 1rem;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.3s ease;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.35rem 0.5rem;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: #fff;
      box-shadow: var(--shadow);
    }
    .brand h1 { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand span { font-size: 0.72rem; color: var(--text-muted); }
    .nav-section { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); padding: 0.5rem 0.75rem; }
    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .nav-btn:hover { background: var(--accent-soft); color: var(--text); }
    .nav-btn.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
    .nav-btn svg { width: 18px; height: 18px; opacity: 0.85; }
    .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .theme-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 0.85rem; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg-elevated);
      font-size: 0.8rem;
    }
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 1.25rem 1.5rem 2rem;
      max-width: 1400px;
    }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 1.25rem;
    }
    .topbar h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em; }
    .search-wrap {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.45rem 0.85rem; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      backdrop-filter: blur(12px); min-width: 220px;
    }
    .search-wrap input { border: none; background: transparent; flex: 1; outline: none; font-size: 0.85rem; }

    /* ========== CARDS & KPI ========== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .kpi {
      padding: 1rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      animation: kpiIn 0.45s ease backwards;
    }
    @keyframes kpiIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .kpi-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .kpi-value { font-size: 1.55rem; font-weight: 800; margin-top: 0.25rem; letter-spacing: -0.03em; }
    .kpi-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }

    .card {
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      padding: 1.1rem 1.2rem;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      margin-bottom: 0.85rem;
    }
    .card-header h3 { font-size: 1rem; font-weight: 700; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.25rem;
      font-size: 0.68rem; font-weight: 600; padding: 0.2rem 0.55rem;
      border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    }
    .badge.warn { background: rgba(251, 191, 36, 0.15); color: var(--warning); }
    .badge.danger { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
    .badge.ok { background: rgba(52, 211, 153, 0.15); color: var(--success); }

    /* ========== BUTTONS ========== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.5rem 1rem; border-radius: 10px; font-weight: 600; font-size: 0.82rem;
      border: 1px solid var(--border); background: var(--bg-elevated);
      transition: transform 0.12s, box-shadow 0.2s, background 0.2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #818cf8); color: #fff; border-color: transparent; }
    .btn-ghost { background: transparent; }
    .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.75rem; }
    .btn-danger { background: rgba(248, 113, 113, 0.15); color: var(--danger); border-color: rgba(248, 113, 113, 0.35); }

    /* ========== TABLES ========== */
    .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { padding: 0.65rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); background: var(--bg-elevated); }
    tr:hover td { background: rgba(108, 140, 255, 0.04); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.35rem; vertical-align: middle; }

    /* ========== CLASS CARDS GRID ========== */
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .class-card {
      border-radius: var(--radius);
      padding: 1rem;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .class-card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--cc, var(--accent));
    }
    .class-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .class-card h4 { font-size: 1.05rem; margin-bottom: 0.35rem; }
    .class-card .meta { font-size: 0.78rem; color: var(--text-muted); }

    /* ========== PROGRESS ========== */
    .progress {
      height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; margin-top: 0.5rem;
    }
    .progress > span {
      display: block; height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), #34d399);
      transition: width 0.5s ease;
    }

    /* ========== TIMELINE ========== */
    .timeline { position: relative; padding-left: 1.25rem; }
    .timeline::before {
      content: ""; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px;
      background: var(--border); border-radius: 2px;
    }
    .tl-item { position: relative; padding-bottom: 1rem; }
    .tl-item::before {
      content: ""; position: absolute; left: -1.25rem; top: 4px; width: 12px; height: 12px;
      border-radius: 50%; background: var(--tl, var(--accent)); border: 2px solid var(--bg-elevated);
    }

    /* ========== CALENDAR ========== */
    .cal-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      font-size: 0.72rem;
    }
    .cal-dow { text-align: center; color: var(--text-muted); padding: 0.35rem; font-weight: 600; }
    .cal-cell {
      min-height: 72px;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 4px;
      background: var(--bg-elevated);
      transition: background 0.15s;
    }
    .cal-cell.muted { opacity: 0.45; }
    .cal-cell.today { outline: 2px solid var(--accent); }
    .cal-cell .num { font-weight: 700; font-size: 0.75rem; }
    .cal-chip {
      font-size: 0.58rem; padding: 1px 4px; border-radius: 4px; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ========== CHARTS (sans librairie) ========== */
    .bar-chart { display: flex; flex-direction: column; gap: 0.5rem; }
    .bar-row { display: grid; grid-template-columns: 100px 1fr 40px; align-items: center; gap: 0.5rem; font-size: 0.78rem; }
    .bar-track { height: 10px; border-radius: 99px; background: var(--border); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }

    /* ========== MODAL ========== */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal {
      width: min(520px, 100%);
      max-height: 90vh; overflow: auto;
      border-radius: var(--radius);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 1.25rem;
      transform: translateY(12px); transition: transform 0.25s;
    }
    .modal-backdrop.open .modal { transform: translateY(0); }
    .modal h3 { margin-bottom: 1rem; font-size: 1.1rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.5rem 0.65rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }

    /* ========== MOBILE ========== */
    .menu-toggle {
      display: none; position: fixed; bottom: 1rem; right: 1rem; z-index: 50;
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      color: #fff; box-shadow: var(--shadow); align-items: center; justify-content: center;
    }
    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .menu-toggle { display: flex; }
    }

    /* ========== PRINT ========== */
    .year-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.5rem;
      font-size: 0.7rem;
    }
    .year-month {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem;
      background: var(--bg-elevated);
    }
    .year-month strong { display: block; margin-bottom: 0.25rem; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .flex-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .print-only { display: none; }

    .dashboard-classes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.15rem;
      margin-top: 1rem;
    }
    .dash-class-card {
      border-radius: var(--radius);
      padding: 1.2rem 1.25rem;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      border-left: 5px solid var(--dash-c, var(--accent));
      animation: kpiIn 0.42s ease backwards;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .dash-class-card:hover { transform: translateY(-2px); box-shadow: 0 22px 50px rgba(0, 0, 0, 0.35); }
    .dash-class-card h3 { font-size: 1.15rem; margin-bottom: 0.35rem; letter-spacing: -0.02em; }
    .dash-days { font-size: 0.88rem; color: var(--text-muted); margin: 0.5rem 0 0.75rem; line-height: 1.4; }
    .dash-class-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
      margin-top: 0.5rem;
      text-align: center;
    }
    .dash-class-metrics .num { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.03em; }
    .dash-class-metrics .lbl {
      display: block;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-top: 0.15rem;
    }

    @media print {
      .sidebar, .menu-toggle, .no-print, .nav-btn, .theme-toggle, .search-wrap { display: none !important; }
      .main { margin: 0; max-width: none; padding: 0.5rem; }
      body { background: #fff; color: #000; }
      .card, .kpi { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">EPS</div>
        <div>
          <h1>Studio EPS</h1>
          <span>Collège — cycles & séances</span>
        </div>
      </div>
      <div class="nav-section">Menu principal</div>
      <nav id="main-nav"></nav>
      <div class="sidebar-footer">
        <div class="theme-toggle">
          <span>Thème</span>
          <button type="button" class="btn btn-sm" id="btn-theme">Sombre / Clair</button>
        </div>
        <button type="button" class="btn btn-sm btn-ghost" id="btn-print">Imprimer la vue</button>
      </div>
    </aside>
    <button type="button" class="menu-toggle no-print" id="btn-menu" aria-label="Menu">☰</button>
    <main class="main" id="main"><div style="padding:2rem;text-align:center;color:#6c8cff;font-size:1.2rem">⏳ Chargement…</div></main>
  </div>
  <div class="modal-backdrop" id="modal-root"></div>

  <script>
    window.onerror = function(msg, src, line, col, err) {
      var m = document.getElementById("main");
      if (m) m.innerHTML = "<div style='padding:2rem;color:red;font-size:1rem;word-break:break-all'><h2>Erreur JS</h2><p><b>" + msg + "</b></p><p>Ligne " + line + ", col " + col + "</p><pre style='white-space:pre-wrap'>" + (err && err.stack ? err.stack : "") + "</pre></div>";
    };
  </script>
  <script>
    /**
     * =============================================================================
     * EPS COLLÈGE — APPLICATION MONOLITHIQUE (HTML + CSS + JS, sans dépendance)
     * =============================================================================
     *
     * ARCHITECTURE (extensible) :
     * 1) DONNÉES — `appData` : classes, créneaux (schedules), APSA (activities),
     *    événements calendaires (holidays), annulations, séances générées (sessions).
     * 2) PERSISTANCE — localStorage (auto), export/import JSON, reset.
     * 3) MOTEUR — `regenerateSessions()` : parcourt l'année, applique chaque créneau (jour, alternance
     *    semaine A/B depuis la rentrée), exclut jours bloquants, rattache l'APSA par chevauchement de dates
     *    et par jours de pratique cochés sur l'APSA. `computeSessionStatus()` : annulation > férié > passé/futur.
     * 4) PRÉSENTATION — `render()` : vue « Tableau de bord », puis une vue par classe
     *    (`class:<id>` avec liste des séances et annulations), puis « Réglages & données »
     *    (sous-panneaux EDT / APSA / etc.). `wireEvents()` attache les interactions.
     *
     * Pour ajouter un module : étendre `appData`, créer les fonctions CRUD + une
     * fonction `viewMonModule()` puis une entrée dans `VIEWS` et le `switch` de render.
     * =============================================================================
     */

    /** @typedef {'dashboard'|'tools'|string} ViewId — les vues classe sont `class:<uuid>`. */

    const STORAGE_KEY = "eps_college_dashboard_v1";

    /**
     * Stockage compatible fichier local / AirDrop (iOS Safari) : `localStorage` peut être
     * indisponible ou lever SecurityError sur `file://`. On teste une fois puis repli mémoire.
     */
    const LS_MEMORY = {};
    let lsUsable = null;
    /** true si les données ne survivent pas au rechargement (mode fichier sans localStorage). */
    let appStorageIsMemory = false;
    function lsWorks() {
      if (lsUsable !== null) return lsUsable;
      try {
        if (typeof localStorage === "undefined" || !localStorage) {
          lsUsable = false;
          appStorageIsMemory = true;
          return false;
        }
        var t = "__eps_ls_probe__";
        localStorage.setItem(t, "1");
        localStorage.removeItem(t);
        lsUsable = true;
        appStorageIsMemory = false;
        return true;
      } catch (e) {
        lsUsable = false;
        appStorageIsMemory = true;
        return false;
      }
    }
    function lsGet(key) {
      if (lsWorks()) {
        try {
          return localStorage.getItem(key);
        } catch (e) {}
      }
      return Object.prototype.hasOwnProperty.call(LS_MEMORY, key) ? LS_MEMORY[key] : null;
    }
    function lsSet(key, val) {
      if (lsWorks()) {
        try {
          localStorage.setItem(key, val);
          return;
        } catch (e) {}
      }
      LS_MEMORY[key] = val;
    }
    function lsRemove(key) {
      if (lsWorks()) {
        try {
          localStorage.removeItem(key);
        } catch (e) {}
      }
      delete LS_MEMORY[key];
    }

    /**
     * État global de l'application (source de vérité en mémoire).
     * sessions : générées automatiquement à partir des créneaux, vacances, fériés, APSA.
     */
    const appData = {
      settings: {
        schoolYearStart: "2025-09-01",
        schoolYearEnd: "2026-07-05",
        zone: "C",
      },
      classes: [],
      schedules: [],
      activities: [],
      holidays: [],
      cancellations: [],
      sessions: [],
      exemptions: [],
      periods: [],
      venues: [],
      forgottenGear: [],
      todoList: [],
    };

    let currentView = "dashboard";
    const viewHistory = [];
    let calendarMode = "month";
    let calendarCursor = new Date();

    /* -------------------------------------------------------------------------- */
    /* UTILITAIRES                                                                */
    /* -------------------------------------------------------------------------- */

    function uid() {
      try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e) {}
      return "id-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    }

    function parseISODate(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function fmtISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function addDays(d, n) {
      const x = new Date(d);
      x.setDate(x.getDate() + n);
      return x;
    }

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function dayIndexMon0(d) {
      const i = d.getDay();
      return i === 0 ? 6 : i - 1;
    }

    /** Numéro de semaine (lundi → lundi) depuis le début d'année scolaire — pour alternance A/B. */
    function schoolWeekIndex(date) {
      const start = parseISODate(appData.settings.schoolYearStart);
      const monStart = addDays(start, -dayIndexMon0(start));
      const monD = addDays(new Date(date.getFullYear(), date.getMonth(), date.getDate()), -dayIndexMon0(date));
      const diff = Math.round((monD - monStart) / (7 * 86400000));
      return diff >= 0 ? diff : 0;
    }

    /** Créneau « semaine A » (pairs) ou « semaine B » (impairs) depuis la rentrée. */
    function matchesWeekParity(slot, date) {
      const p = slot.weekParity || "all";
      if (p === "all") return true;
      const idx = schoolWeekIndex(date);
      if (p === "A") return idx % 2 === 0;
      if (p === "B") return idx % 2 === 1;
      return true;
    }

    function weekParityLabel(slot) {
      const p = slot.weekParity || "all";
      if (p === "A") return "Semaine A";
      if (p === "B") return "Semaine B";
      return "Toutes";
    }

    function isDateInRange(date, startStr, endStr) {
      const t = fmtISODate(date);
      return t >= startStr && t <= endStr;
    }

    function todayStart() {
      const n = new Date();
      n.setHours(0, 0, 0, 0);
      return n;
    }

    function saveData() {

    function loadData() {

        return true;
      } catch {

    function exportJSON() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `eps-backup-${fmtISODate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(a.href);

    function importJSONFile(file) {
      const reader = new FileReader();
      reader.onload = () => {

            if (o[k] !== undefined) appData[k] = o[k];
          });
          regenerateSessions();
          saveData();
          render();
          alert("Import réussi.");
        } catch {
          alert("Fichier JSON invalide.");
        }
      };
      reader.readAsText(file);

    function getClassById(id) {
      return appData.classes.find((c) => c.id === id);
    }

    function schedulesForClass(classId) {
      return appData.schedules.filter((s) => s.classId === classId);
    }

    function activitiesForClass(classId) {
      return appData.activities
        .filter((a) => a.classId === classId)
        .slice()
        .sort((a, b) => a.startDate.localeCompare(b.startDate));
    }

    function sessionsForClass(classId) {
      return appData.sessions.filter((s) => s.classId === classId);
    }

    /** APSA dont la période contient la date `dateStr` (ISO). */
    function activitiesOnDatePeriod(classId, dateStr) {
      return activitiesForClass(classId).filter((a) => dateStr >= a.startDate && dateStr <= a.endDate);
    }

    function activityIdsOnPeriodToday(classId) {
      const t = fmtISODate(new Date());
      return new Set(activitiesOnDatePeriod(classId, t).map((a) => a.id));
    }

    function sessionStatsForSessions(list) {
      let done = 0, cancelled = 0, remaining = 0;
      list.forEach((s) => {
        const st = computeSessionStatus(s);
        if (st.code === "cancelled") cancelled++;
        else if (st.code === "holiday") {
        } else if (st.code === "done") done++;
        else if (st.code === "today" || st.code === "planned") remaining++;
      });
      const total = list.length;
      const denom = Math.max(1, total - cancelled);
      const pct = Math.min(100, Math.round((done / denom) * 100));
      return { total, done, cancelled, remaining, realized: done, pct };
    }

    function sessionStatsForClass(classId) {
      return sessionStatsForSessions(sessionsForClass(classId));
    }

    /** Stats séances rattachées aux APSA « en cours » aujourd'hui (période calendaire). */
    function sessionStatsForCurrentPeriod(classId) {
      const ids = activityIdsOnPeriodToday(classId);
      if (!ids.size) return { total: 0, done: 0, cancelled: 0, remaining: 0, pct: 0, realized: 0 };
      const list = sessionsForClass(classId).filter((s) => s.activityId && ids.has(s.activityId));
      return sessionStatsForSessions(list);
    }

    /** Jours affichés au tableau de bord : jours cochés sur les APSA en cours, sinon créneaux EDT. */
    function weekdaysForDashboardClass(classId, refDateISO) {
      const acts = activitiesOnDatePeriod(classId, refDateISO || fmtISODate(new Date()));
      const daySet = new Set();
      acts.forEach((a) => {
        if (Array.isArray(a.dayIndices) && a.dayIndices.length) a.dayIndices.forEach((d) => daySet.add(d));
      });
      if (daySet.size) return [...daySet].sort((a, b) => a - b).map((i) => DOW[i]).join(" · ");
      return weekdaysForClass(classId);
    }

    function formatDayIndicesLabel(act) {
      if (!act.dayIndices || !act.dayIndices.length) return "Tous les jours de créneau (période)";
      return act.dayIndices
        .slice()
        .sort((a, b) => a - b)
        .map((i) => DOW[i])
        .join(", ");
    }

    /**
     * Détermine si une date tombe dans un événement « bloquant » (vacances, férié, etc.).
     */
    function isBlockedByHoliday(dateStr) {
      return appData.holidays.some((h) => dateStr >= h.startDate && dateStr <= h.endDate && h.blocksSessions);
    }

    function getHolidayOnDate(dateStr) {
      return appData.holidays.find((h) => dateStr >= h.startDate && dateStr <= h.endDate);
    }

    /**
     * APSA pour une séance : période [début, fin] + jours cochés (sinon tous les jours de la période).
     * En cas de chevauchement, priorité aux APSA avec jour explicite correspondant au créneau.
     */
    function pickActivityForSession(classId, dateStr, dayIndex) {
      const inRange = activitiesForClass(classId).filter((a) => dateStr >= a.startDate && dateStr <= a.endDate);
      if (!inRange.length) return null;
      const withDay = inRange.filter((a) => Array.isArray(a.dayIndices) && a.dayIndices.length && a.dayIndices.includes(dayIndex));
      const pool = withDay.length ? withDay : inRange.filter((a) => !a.dayIndices || !a.dayIndices.length);
      if (!pool.length) return null;
      pool.sort((a, b) => a.startDate.localeCompare(b.startDate));
      return pool[0];
    }

    function pickActivityForDate(classId, dateStr) {
      const d = parseISODate(dateStr);
      return pickActivityForSession(classId, dateStr, dayIndexMon0(d));
    }

    function cancellationForSession(session) {
      return appData.cancellations.find(
        (c) => c.sessionId === session.id || (c.classId === session.classId && c.date === session.date && c.startTime === session.startTime)
      );
    }

    /**
     * Statut final d'une séance : annulée > vacances/férié > effectuée / prévue.
     */
    function computeSessionStatus(session) {
      const canc = cancellationForSession(session);
      if (canc) return { code: "cancelled", label: "Annulée", reason: canc.reasonType };
      const hol = getHolidayOnDate(session.date);
      if (hol && hol.blocksSessions)
        return { code: "holiday", label: hol.type === "ferie" ? "Jour férié" : "Vacances / événement", reason: hol.name };
      const d = parseISODate(session.date);
      const now = todayStart();
      if (d < now) return { code: "done", label: "Effectuée", reason: "" };
      if (isSameDay(d, now)) return { code: "today", label: "Aujourd'hui", reason: "" };
      return { code: "planned", label: "Prévue", reason: "" };
    }

    function migrateDataModel() {
      appData.schedules.forEach((s) => {
        if (s.weekParity !== "A" && s.weekParity !== "B" && s.weekParity !== "all") s.weekParity = "all";
      });
      appData.activities.forEach((a) => {
        if (!Array.isArray(a.dayIndices)) a.dayIndices = [];
      });
      if (!Array.isArray(appData.exemptions)) appData.exemptions = [];
      if (!Array.isArray(appData.periods)) appData.periods = [];
      if (!Array.isArray(appData.venues)) appData.venues = [];
      if (appData.progEtabPdf === undefined) appData.progEtabPdf = null;
      if (!Array.isArray(appData.forgottenGear)) appData.forgottenGear = [];
      appData.classes.forEach((cl) => { if (!Array.isArray(cl.students)) cl.students = []; });
      appData.sessions.forEach((s) => { if (!s.attendance) s.attendance = {}; });
      if (!Array.isArray(appData.todoList)) appData.todoList = [];
      if (!appData.settings.academy) appData.settings.academy = "";
    }

    function exemptionsForClass(classId) {
      return appData.exemptions.filter((e) => e.classId === classId);
    }

    function isExemptionActive(ex) {
      const today = fmtISODate(new Date());
      return today >= ex.startDate && today <= ex.endDate;
    }

    /* -------------------------------------------------------------------------- */
    /* GÉNÉRATION AUTOMATIQUE DES SÉANCES                                         */
    /* -------------------------------------------------------------------------- */

    function regenerateSessions() {
      migrateDataModel();
      const start = parseISODate(appData.settings.schoolYearStart);
      const end = parseISODate(appData.settings.schoolYearEnd);
      const oldCanc = appData.cancellations.slice();
      const oldByKey = new Map();
      appData.sessions.forEach((s) => {
        oldByKey.set(`${s.classId}|${s.date}|${s.startTime}`, s.id);
      });

      const extraSessions = appData.sessions.filter((s) => s.extra);
      const nextSessions = [];

      appData.classes.forEach((cl) => {
        const slots = schedulesForClass(cl.id);
        slots.forEach((slot) => {
          let cursor = new Date(start);
          while (cursor <= end) {
            if (dayIndexMon0(cursor) === slot.dayIndex) {
              const dateStr = fmtISODate(cursor);
              const di = dayIndexMon0(cursor);
              if (!isBlockedByHoliday(dateStr) && matchesWeekParity(slot, cursor)) {
                const act = pickActivityForSession(cl.id, dateStr, di);
                const sid = oldByKey.get(`${cl.id}|${dateStr}|${slot.startTime}`) || uid();
                nextSessions.push({
                  id: sid,
                  classId: cl.id,
                  scheduleId: slot.id,
                  activityId: act ? act.id : null,
                  date: dateStr,
                  startTime: slot.startTime,
                  endTime: slot.endTime,
                  venue: slot.venue,
                  comment: "",
                });
              }
            }
            cursor = addDays(cursor, 1);
          }
        });
      });

      nextSessions.push(...extraSessions);
      nextSessions.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      appData.sessions = nextSessions;

      /** Réassocie les annulations aux nouveaux ids de séance après régénération. */
      oldCanc.forEach((c) => {
        const match = appData.sessions.find(
          (s) =>
            s.id === c.sessionId ||
            (s.classId === c.classId && s.date === c.date && s.startTime === c.startTime)
        );
        if (match) {
          c.sessionId = match.id;
          c.date = match.date;
          c.startTime = match.startTime;
        }
      });
      appData.cancellations = oldCanc.filter((c) => appData.sessions.some((s) => s.id === c.sessionId));
      saveData();
    }

    function dashboardKPIs(refDate) {
      const ref = refDate || new Date();
      const todayStr = fmtISODate(ref);
      const refStart = new Date(ref); refStart.setHours(0,0,0,0);
      const startWeek = addDays(refStart, -dayIndexMon0(refStart));
      const endWeek = addDays(startWeek, 6);
      let classesToday = 0;
      const next3Weeks = [0, 1, 2].map((offset) => {
        const ws = addDays(startWeek, offset * 7);
        const we = addDays(ws, 6);
        return { start: ws, end: we, cancelled: [], extras: [] };
      });
      appData.classes.forEach((cl) => {
        const hasToday = sessionsForClass(cl.id).some((s) => s.date === todayStr);
        if (hasToday) classesToday++;
        sessionsForClass(cl.id).forEach((s) => {
          const d = parseISODate(s.date);
          const st = computeSessionStatus(s);
          const fmtDD = (date) => String(date.getDate()).padStart(2,"0") + "/" + String(date.getMonth()+1).padStart(2,"0");
          for (const w of next3Weeks) {
            if (d >= w.start && d <= w.end) {
              const timeLabel = s.startTime ? " " + s.startTime + (s.endTime ? "–" + s.endTime : "") : "";
              if (st.code === "cancelled") {
                w.cancelled.push(cl.name + " – " + fmtDD(d) + timeLabel);
              }
              if (s.extra) {
                w.extras.push(cl.name + " – " + fmtDD(d) + timeLabel);
              }
              break;
            }
          }
        });
      });
      const cycleAlerts = appData.classes.filter((cl) => {
        const ids = new Set(activitiesOnDatePeriod(cl.id, todayStr).map((a) => a.id));
        if (!ids.size) return false;
        const acts = activitiesForClass(cl.id).filter((a) => ids.has(a.id));
        for (const cur of acts) {
          const list = sessionsForClass(cl.id).filter((s) => s.activityId === cur.id);
          const doneInAct = list.filter((s) => computeSessionStatus(s).code === "done").length;
          const totalInAct = list.length;
          if (totalInAct > 0 && doneInAct / totalInAct > 0.85) return true;
        }
        return false;
      });
      return { classesToday, next3Weeks, cycleAlerts, classCount: appData.classes.length };
    }

    function recentCancellations(limit = 6) {
      return appData.cancellations
        .map((c) => {
          const s = appData.sessions.find((x) => x.id === c.sessionId) || { classId: c.classId, date: c.date };
          const cl = getClassById(s.classId);
          return { ...c, className: cl ? cl.name : "?" };
        })
        .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
        .slice(0, limit);
    }

    /** Libellés des jours de cours (emploi du temps) pour une classe. */
    function weekdaysForClass(classId) {
      const slots = schedulesForClass(classId);
      if (!slots.length) return "";
      const idxs = [...new Set(slots.map((s) => s.dayIndex))].sort((a, b) => a - b);
      return idxs.map((i) => DOW[i]).join(" · ");

    function fmtDateFr(iso) {
      const p = String(iso).split("-");

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function matchesSearch(text) {
      if (!searchQuery.trim()) return true;

    /**
     * Prochaine séance = première à venir (aujourd'hui inclus) non annulée.
     * Dernière effectuée = dernière date passée marquée effectuée.
     */
    function nextAndLastSession(classId) {
      const sorted = sessionsForClass(classId).slice().sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      const today = todayStart();
      let next = null;
      let lastDone = null;
      sorted.forEach((s) => {
        const st = computeSessionStatus(s);
        const d = parseISODate(s.date);
        d.setHours(0, 0, 0, 0);
        if (st.code === "done") lastDone = s;
        if (!next && (st.code === "planned" || st.code === "today")) {
          if (st.code === "today") next = s;
          else if (d.getTime() >= today.getTime()) next = s;
        }
      });
      return { next, lastDone };
    }

    function statsPerActivity(classId, actId) {
      const list = sessionsForClass(classId).filter((s) => s.activityId === actId);
      let done = 0, cancelled = 0, remaining = 0;
      list.forEach((s) => {
        const st = computeSessionStatus(s);
        if (st.code === "cancelled") cancelled++;
        else if (st.code === "done") done++;
        else if (st.code === "planned" || st.code === "today") remaining++;
      });
      const total = list.length;
      const pct = total - cancelled > 0 ? Math.round((done / (total - cancelled)) * 100) : 0;
      return { total, done, cancelled, remaining, pct };
    }

    /** Date ISO de la dernière séance (toutes, pas seulement effectuées) d'une APSA. */
    function lastSessionDateForActivity(classId, actId) {
      const list = sessionsForClass(classId)
        .filter((s) => s.activityId === actId)
        .map((s) => s.date)
        .sort();
      return list.length ? list[list.length - 1] : null;
    }

    function globalSessionCounts(refDate) {
      let todayN = 0, planned = 0, done = 0, cancelled = 0;
      const todayDetails = [];
      const tStr = fmtISODate(refDate || new Date());
      appData.sessions.forEach((s) => {
        const st = computeSessionStatus(s);
        if (s.date === tStr && st.code !== "cancelled") {
          todayN++;
          const cl = getClassById(s.classId);
          todayDetails.push({ className: cl ? cl.name : "—", startTime: s.startTime || "—", endTime: s.endTime || "" });
        }
        if (st.code === "cancelled") cancelled++;
        else if (st.code === "done") done++;
        else if (st.code === "planned" || st.code === "today") planned++;
      });
      todayDetails.sort((a, b) => a.startTime.localeCompare(b.startTime));
      return { todayN, todayDetails, planned, done, cancelled, total: appData.sessions.length };
    }

    function avgCycleProgress() {
      if (!appData.classes.length) return 0;
      let sum = 0;
      appData.classes.forEach((cl) => {
        sum += sessionStatsForClass(cl.id).pct;
      });
      return Math.round(sum / appData.classes.length);
    }

      const map = {};

      const bCancel = el(`<button type="button" class="btn btn-ghost">Annuler</button>`);
      const bOk = el(`<button type="button" class="btn btn-primary">Valider</button>`);
      foot.append(bCancel, bOk);
      bCancel.onclick = () => {
        root.classList.remove("open");
        root.innerHTML = "";
      };
      bOk.onclick = () => {
        onConfirm();

      root.appendChild(wrap);

    function buildAttendanceBlock(session) {
      const cl = getClassById(session.classId);
      const students = (cl && cl.students) || [];
      if (!session.attendance) session.attendance = {};
      const wrap = document.createElement("div");
      wrap.style.cssText = "margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem";

      const renderUI = () => {
        const att = session.attendance;
        const list = students.length ? students : Object.keys(att);
        const presentCount = list.filter((n) => att[n] === "present").length;
        const absentCount = list.filter((n) => att[n] === "absent").length;
        const lateCount = list.filter((n) => att[n] === "late").length;
        const notMarked = list.length - presentCount - absentCount - lateCount;

        const btnStyle = (name, val) => {
          const active = att[name] === val;
          const colors = { present: "#16a34a", absent: "#dc2626", late: "#d97706" };
          return active
            ? `background:${colors[val]};color:#fff;font-weight:700;border:none`
            : `background:transparent;color:var(--fg);border:1px solid var(--border)`;
        };

        let rows = "";
        if (students.length) {
          rows = list.map((name) =>
            `<div style="display:flex;align-items:center;gap:.4rem;padding:.35rem 0;border-bottom:1px solid var(--border)" data-student="${escapeHtml(name)}">
              <span style="flex:1;font-size:.88rem;font-weight:500">${escapeHtml(name)}</span>
              <button type="button" class="btn btn-sm att-btn" data-name="${escapeHtml(name)}" data-val="present" style="padding:.2rem .55rem;font-size:.75rem;border-radius:20px;${btnStyle(name, "present")}">Présent</button>
              <button type="button" class="btn btn-sm att-btn" data-name="${escapeHtml(name)}" data-val="late" style="padding:.2rem .55rem;font-size:.75rem;border-radius:20px;${btnStyle(name, "late")}">Retard</button>
              <button type="button" class="btn btn-sm att-btn" data-name="${escapeHtml(name)}" data-val="absent" style="padding:.2rem .55rem;font-size:.75rem;border-radius:20px;${btnStyle(name, "absent")}">Absent</button>
            </div>`
          ).join("");
        } else {
          rows = `<p class="kpi-sub">Aucun élève importé pour cette classe. Ajoutez-les via Réglages > Mes classes > ⚙️.</p>`;
        }

        const allPresentBtn = students.length
          ? `<button type="button" class="btn btn-sm" id="att-all-present" style="background:#16a34a;color:#fff;font-weight:700;font-size:.78rem;padding:.3rem .7rem;border-radius:20px">✓ Tous présents</button>`
          : "";

        wrap.innerHTML =
          `<div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;flex-wrap:wrap">
            <p style="font-weight:700;margin:0">📋 Appel</p>
            ${allPresentBtn}
            <span class="kpi-sub" style="margin-left:auto">${presentCount > 0 ? `<span style="color:#16a34a;font-weight:600">${presentCount} P</span>` : ""}${lateCount > 0 ? ` <span style="color:#d97706;font-weight:600">${lateCount} R</span>` : ""}${absentCount > 0 ? ` <span style="color:#dc2626;font-weight:600">${absentCount} A</span>` : ""}${notMarked > 0 ? ` <span>${notMarked} non pointé(s)</span>` : ""}</span>
          </div>
          <div style="max-height:280px;overflow-y:auto">${rows}</div>`;

        wrap.querySelectorAll(".att-btn").forEach((b) => {
          b.addEventListener("click", () => {
            const name = b.getAttribute("data-name");
            const val = b.getAttribute("data-val");
            session.attendance[name] = session.attendance[name] === val ? undefined : val;
            if (session.attendance[name] === undefined) delete session.attendance[name];
            saveData();
            renderUI();
          });

        const allBtn = wrap.querySelector("#att-all-present");
        if (allBtn) {
          allBtn.addEventListener("click", () => {
            students.forEach((n) => { session.attendance[n] = "present"; });
            saveData();
            renderUI();
          });
        }
      };

      renderUI();
      return wrap;
    }

          <div class="kpi" style="animation-delay:0.05s" id="weather-kpi"><div class="kpi-label">🌤️ Météo — Roissy-en-Brie</div><div class="kpi-value" id="weather-temp">…</div><div class="kpi-sub" id="weather-desc">Chargement…</div></div>
          <div class="kpi" style="animation-delay:0.1s"><div class="kpi-label">Séances ${isToday ? "aujourd'hui" : "ce jour"}</div><div class="kpi-value">${g.todayN}</div>${
            g.todayDetails.length
              ? `<div class="kpi-sub" style="text-align:left;margin-top:.35rem;line-height:1.55;font-size:.78rem">${g.todayDetails.map(d => escapeHtml(d.className) + " · " + escapeHtml(d.startTime) + (d.endTime ? "–" + escapeHtml(d.endTime) : "")).join("<br>")}</div>`
              : '<div class="kpi-sub">Aucun cours prévu</div>'
          }</div>
          ${(() => {
            const todayDate = dISO;
            const todayEx = (appData.exemptions || []).filter((e) =>
              todayDate >= e.startDate && todayDate <= e.endDate &&
              sessionsForClass(e.classId).some((s) => s.date === todayDate && computeSessionStatus(s).code !== "cancelled")
            );
            const count = todayEx.length;
            const detail = todayEx
              .slice()
              .sort((a, b) => a.endDate.localeCompare(b.endDate))
              .map((ex) => {
                const cl = getClassById(ex.classId);
                return `<strong style="color:var(--danger)">${escapeHtml(ex.studentName)}</strong>` + " (" + escapeHtml(cl ? cl.name : "—") + ") → " + fmtDateFr(ex.endDate);
              })
              .join("<br>");
            return `<div class="kpi" style="animation-delay:0.15s"><div class="kpi-label">🏥 Élèves dispensés ${isToday ? "aujourd'hui" : "ce jour"}</div><div class="kpi-value" style="${count ? "color:var(--danger)" : ""}">${count}</div>${count ? `<div class="kpi-sub" style="text-align:left;margin-top:.35rem;line-height:1.55;font-size:.78rem">${detail}</div>` : '<div class="kpi-sub">Aucun élève dispensé ayant cours</div>'}</div>`;
          })()}
        </div>
        ${(() => {
          const todayISO = dISO;
          const todaySessions = appData.sessions.filter((s) => s.date === todayISO)
            .slice().sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""));
          if (!todaySessions.length) return '';
          const lines = todaySessions.map((s) => {
            const cl = getClassById(s.classId);
            const act = activityById(s.activityId);
            const stt = computeSessionStatus(s);
            const col = stt.code === "cancelled" ? "var(--danger)" : stt.code === "done" ? "var(--success)" : "var(--accent)";
            const canc = cancellationForSession(s);
            const motif = canc ? (REASON_TYPES.find((x) => x[0] === canc.reasonType)?.[1] || canc.reasonType) : stt.reason || "";
            const statusHtml = `<span class="status-dot" style="background:${col}"></span>${escapeHtml(stt.label)}`;
            let sessionNumBadge = "";
            if (act) {
              const actSess = appData.sessions
                .filter((x) => x.classId === s.classId && x.activityId === act.id)
                .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
              const valid = actSess.filter((x) => { const c = computeSessionStatus(x).code; return c !== "cancelled" && c !== "holiday"; });
              const idx = valid.findIndex((x) => x.id === s.id);
              if (idx >= 0) sessionNumBadge = ` <span style="font-size:.75rem;font-weight:700;color:#fff;background:var(--accent);padding:.15rem .5rem;border-radius:10px;margin-left:.25rem">n°${idx + 1}/${valid.length}</span>`;
            }
            const hasSummary = s.summary && s.summary.trim();
            return `<div class="btn-today-session" data-session-id="${s.id}" style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.55rem .4rem;border-top:1px solid var(--border);cursor:pointer;border-radius:6px;transition:background .15s" onmouseover="this.style.background='var(--hover)'" onmouseout="this.style.background='transparent'">
              <span class="legend-dot" style="background:${cl ? cl.color : '#888'}"></span>
              <strong style="min-width:4rem">${escapeHtml(cl ? cl.name : "—")}</strong>
              <span style="font-size:.85rem">${s.startTime || ""}–${s.endTime || ""}</span>
              <span style="font-size:.82rem;color:var(--text-muted)">${escapeHtml(s.venue || "")}</span>
              <span style="font-size:.82rem">${act ? escapeHtml(act.name) : "—"}${sessionNumBadge}</span>
              <span style="font-size:.82rem">${statusHtml}</span>
              ${motif ? `<span style="font-size:.78rem;color:var(--text-muted)">(${escapeHtml(motif)})</span>` : ""}
              ${hasSummary ? '<span style="font-size:.85rem" title="Résumé rédigé">📝</span>' : ""}
              ${s.sessionPdf ? '<span style="font-size:.85rem" title="PDF joint">📄</span>' : ""}
              ${(() => { const att = s.attendance || {}; const keys = Object.keys(att); if (!keys.length) return ""; const p = keys.filter((k) => att[k] === "present").length; const a = keys.filter((k) => att[k] === "absent").length; const l = keys.filter((k) => att[k] === "late").length; return `<span style="font-size:.75rem;font-weight:600;padding:.15rem .5rem;border-radius:10px;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0" title="Appel effectué">${p}P${l ? " " + l + "R" : ""}${a ? " " + a + "A" : ""}</span>`; })()}
            </div>`;
          }).join("");
          return `<div class="kpi" style="animation-delay:0.25s;width:100%;margin-bottom:1rem"><div class="kpi-label">Cours ${isToday ? "du jour" : "de la journée"}</div>
            <div style="display:flex;flex-direction:column;margin-top:.5rem">${lines}</div>
          </div>`;
        })()}
        <div style="display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap">
          <div class="kpi no-print" style="animation-delay:0.25s;min-width:160px;margin-bottom:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center" id="btn-goto-classes">
            <span style="font-size:1.6rem;margin-bottom:.3rem">📋</span>
            <div class="kpi-label" style="display:flex;align-items:center;gap:.4rem">Mes classes <span style="font-size:1.05rem">⚙️</span></div>
          </div>
          <div class="kpi no-print" style="animation-delay:0.28s;min-width:160px;margin-bottom:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center" id="btn-goto-tools">
            <span style="font-size:1.6rem;margin-bottom:.3rem">⚙️</span>
            <div class="kpi-label">Réglages</div>
          </div>
          ${(() => {
            const threshold = forgottenGearThreshold;
            const todayStr = dISO;
            const alerts = [];
            appData.classes.forEach((cl) => {
              const clPeriods = periodsForClass(cl.id);
              const curPeriod = clPeriods.find((p) => todayStr >= p.startDate && todayStr <= p.endDate);
              if (!curPeriod) return;
              const items = (appData.forgottenGear || []).filter((f) => f.classId === cl.id && f.date >= curPeriod.startDate && f.date <= curPeriod.endDate);
              const byStudent = {};
              items.forEach((f) => { byStudent[f.studentName] = (byStudent[f.studentName] || 0) + 1; });
              Object.entries(byStudent).forEach(([name, count]) => {
                if (count >= threshold) alerts.push({ name, className: cl.name, classId: cl.id, count });
              });
            });
            alerts.sort((a, b) => b.count - a.count);
            const total = alerts.length;
            const detail = alerts.map((a) => `<a href="#" class="link-fg-student" data-classid="${a.classId}" data-student="${escapeHtml(a.name)}" style="color:var(--danger);font-weight:700;text-decoration:underline;cursor:pointer">${escapeHtml(a.name)}</a> (${escapeHtml(a.className)}) — ${a.count} oubli(s)`).join("<br>");
            return `<div class="kpi" style="animation-delay:0.3s;flex:1;min-width:220px;margin-bottom:0"><div class="kpi-label" style="display:flex;align-items:center;gap:.4rem">⚠️ Oublis de matériel répétés <button type="button" id="btn-fg-threshold" title="Régler le seuil d'oublis" style="background:none;border:none;cursor:pointer;font-size:1.05rem;padding:0;line-height:1">⚙️</button></div>${total ? `<div class="kpi-sub" style="text-align:left;margin-top:.5rem;line-height:1.55;font-size:.78rem">${detail}</div>` : '<div class="kpi-sub" style="margin-top:.5rem">Aucun élève concerné</div>'}</div>`;
          })()}
          <div class="kpi" style="animation-delay:0.35s;flex:1;min-width:280px;margin-bottom:0"><div class="kpi-label">Modifications de l'emploi du temps à venir</div>
            <div style="display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem">${
              dash.next3Weeks.map((w, i) => {
                const label = i === 0 ? "Cette semaine" : i === 1 ? "Semaine prochaine" : "Dans 2 semaines";
                const dd = (d) => String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
                const range = dd(w.start) + " – " + dd(w.end);
                const cancPart = w.cancelled.length
                  ? `<span style="color:var(--danger);font-weight:600;font-size:.82rem">❌ ${w.cancelled.length} cours annulé(s) : ${w.cancelled.map(d => escapeHtml(d)).join(" · ")}</span>`
                  : "";
                const extraPart = w.extras.length
                  ? `<span style="color:#16a34a;font-weight:600;font-size:.82rem">➕ ${w.extras.length} cours ajouté(s) : ${w.extras.map(d => escapeHtml(d)).join(" · ")}</span>`
                  : "";
                const details = [cancPart, extraPart].filter(Boolean).join("<br>");
                return `<div><strong>${label}</strong> <span style="font-size:.72rem;color:var(--text-muted)">(${range})</span>${details ? "<br>" + details : " — <span class=\"kpi-sub\">Aucune modification</span>"}</div>`;
              }).join("")
            }</div>
          </div>
        </div>
        <div class="card" style="margin-bottom:1rem;padding:1rem">
          <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem">
            <h3 style="margin:0">📝 À faire</h3>
          </div>
          <div style="display:flex;gap:.4rem;margin-bottom:.7rem">
            <input type="text" id="todo-input" placeholder="Ajouter une tâche…" style="flex:1;padding:.45rem .65rem;border:1px solid var(--border);border-radius:var(--radius);font-size:.9rem;background:var(--card);color:var(--fg)" />
            <button type="button" class="btn btn-sm btn-primary" id="btn-todo-add" style="font-weight:700;padding:.45rem .8rem">+</button>
          </div>
          <div id="todo-list">${appData.todoList.map((t, i) =>
            `<div style="display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--border)" data-idx="${i}">
              <input type="checkbox" class="todo-check" data-idx="${i}" ${t.done ? "checked" : ""} style="width:1.1rem;height:1.1rem;cursor:pointer;accent-color:var(--accent)" />
              <span style="flex:1;font-size:.88rem;${t.done ? "text-decoration:line-through;color:var(--text-muted)" : ""}">${escapeHtml(t.text)}</span>
              <button type="button" class="btn btn-sm todo-del" data-idx="${i}" style="padding:.1rem .35rem;font-size:.7rem;color:var(--danger);background:none;border:none;cursor:pointer" title="Supprimer">✕</button>
            </div>`
          ).join("") || '<p class="kpi-sub">Aucune tâche pour le moment.</p>'}</div>
        </div>
        <div class="card" style="margin-bottom:1rem">
          <div class="card-header"><h3>📚 Séquences en cours</h3></div>
          <div class="dashboard-classes" style="margin-top:.5rem">${classCards || '<p class="kpi-sub">Aucune classe — utilisez « Réglages & données » &gt; Mes classes pour en ajouter.</p>'}</div>
        </div>
        <div class="print-only"><h1>EPS — Tableau de bord</h1><p>Généré le ${escapeHtml(dISO)}</p></div>`;
    }

    function viewClassesBody() {
      return `<div class="class-grid">
          ${appData.classes
            .filter((c) => matchesSearch(c.name))
            .map((cl) => {
              const pact = activitiesOnDatePeriod(cl.id, fmtISODate(new Date()));
              const curLabel = pact.length ? pact.map((a) => a.name).join(", ") : "—";
              const st = sessionStatsForClass(cl.id);
              return `<article class="class-card nav-to-class" data-view="${getClassViewId(cl.id)}" style="--cc:${cl.color};position:relative;cursor:pointer">
                <button type="button" class="btn btn-sm btn-edit-class" data-id="${cl.id}" style="position:absolute;top:.6rem;right:.6rem;background:none;border:none;cursor:pointer;font-size:1.15rem;padding:0;line-height:1" title="Modifier la classe">⚙️</button>
                <h4>${escapeHtml(cl.name)}</h4>
                <p class="meta">${cycleLabel(cl.cycleYears)} — Effectif ${cl.enrollment}</p>
                <p class="meta">APSA (période du jour) : ${escapeHtml(curLabel)}</p>
                <div class="progress"><span style="width:${st.pct}%"></span></div>
                <p class="meta" style="margin-top:.5rem">${st.done} effectuées · ${st.remaining} restantes · ${st.cancelled} annulées</p>
                <div class="flex-row" style="margin-top:.75rem">
                  <button type="button" class="btn btn-sm btn-ghost nav-to-class" data-view="${getClassViewId(cl.id)}">Séances</button>
                  <button type="button" class="btn btn-sm btn-ghost btn-show-students" data-id="${cl.id}">Élèves</button>
                  <button type="button" class="btn btn-sm btn-danger btn-del-class" data-id="${cl.id}">Supprimer</button>
                </div>
              </article>`;

    function viewClasses() {
      return (
        renderTopbar("Mes classes", `<button type="button" class="btn btn-sm btn-primary" id="btn-add-class">+ Classe</button>`) +
        viewClassesBody()
      );

    function viewPeriodsBody() {
      const classCheckboxes = (selectedIds) => appData.classes.map((c) =>
        `<label style="display:inline-flex;align-items:center;gap:.3rem;margin-right:.75rem;font-size:.85rem;cursor:pointer">
          <input type="checkbox" class="period-class-cb" value="${c.id}" ${selectedIds.includes(c.id) ? "checked" : ""} />
          <span class="legend-dot" style="background:${c.color}"></span>${escapeHtml(c.name)}
        </label>`
      ).join("");

      const rows = appData.periods
        .slice()
        .sort((a, b) => a.startDate.localeCompare(b.startDate))
        .map((p) => {
          const clNames = (p.classIds || []).map((id) => { const c = getClassById(id); return c ? c.name : "?"; }).join(", ");
          const today = fmtISODate(new Date());
          const isCurrent = today >= p.startDate && today <= p.endDate;
          const badge = isCurrent
            ? '<span class="badge" style="background:var(--accent);color:#fff">En cours</span>'
            : today > p.endDate ? '<span class="badge">Terminée</span>' : '<span class="badge" style="border:1px solid var(--accent);color:var(--accent)">À venir</span>';
          return `<tr>
            <td><strong>${escapeHtml(p.name)}</strong></td>
            <td>${fmtDateFr(p.startDate)}</td>
            <td>${fmtDateFr(p.endDate)}</td>
            <td>${escapeHtml(clNames) || "<em>Aucune</em>"}</td>
            <td>${badge}</td>
            <td class="no-print">
              <button type="button" class="btn btn-sm btn-ghost btn-edit-period" data-id="${p.id}">Modifier</button>
              <button type="button" class="btn btn-sm btn-danger btn-del-period" data-id="${p.id}">Supprimer</button>
            </td>
          </tr>`;
        })
        .join("");

      return `<div class="card">
        <div class="card-header"><h3>Périodes</h3><button type="button" class="btn btn-sm btn-primary" id="btn-add-period">+ Période</button></div>
        <p class="kpi-sub" style="margin-bottom:.75rem">Définissez les périodes de l'année scolaire et les classes concernées par chacune.</p>
        <div class="table-wrap"><table><thead><tr><th>Nom</th><th>Début</th><th>Fin</th><th>Classes</th><th>Statut</th><th class="no-print">Actions</th></tr></thead><tbody>
        ${rows || '<tr><td colspan="6">Aucune période créée.</td></tr>'}
        </tbody></table></div>
      </div>`;
    }

    function viewScheduleBody() {
      return (
        `<div class="card"><p class="kpi-sub">Créneaux hebdomadaires : jour, horaires, lieu, alternance <strong>semaine A / B</strong> (depuis le début d'année scolaire : semaines paires = A, impaires = B). La génération des séances exclut vacances et jours fériés bloquants.</p>
        <div class="form-group"><label>Filtrer classe</label>
          <select id="sched-class-filter"><option value="">— Toutes —</option>${appData.classes.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}</select>

                <button type="button" class="btn btn-sm btn-primary btn-add-slot" data-class="${cl.id}">+ Créneau</button></div>
              <div class="table-wrap"><table><thead><tr><th>Jour</th><th>Début</th><th>Fin</th><th>Installation</th><th>Semaine</th><th></th></tr></thead><tbody>
              ${slots

                  (s) =>
                    `<tr><td>${DOW[s.dayIndex]}</td><td>${s.startTime}</td><td>${s.endTime}</td><td>${escapeHtml(s.venue)}</td><td>${weekParityLabel(s)}</td>
                    <td><button type="button" class="btn btn-sm btn-danger btn-del-slot" data-id="${s.id}">Suppr.</button></td></tr>`

    function viewSchedule() {
      return renderTopbar("Emploi du temps", "") + viewScheduleBody();

    function periodsForClass(classId) {
      return (appData.periods || []).filter((p) => (p.classIds || []).includes(classId))
        .slice().sort((a, b) => a.startDate.localeCompare(b.startDate));
    }

    function viewActivitiesBody() {
      return appData.classes
        .map((cl) => {
          const clPeriods = periodsForClass(cl.id);
          const acts = activitiesForClass(cl.id).filter((a) => matchesSearch(a.name) || matchesSearch(cl.name));

          const periodBlocks = clPeriods.map((p) => {
            const periodActs = acts.filter((a) => a.periodId === p.id);
            const today = fmtISODate(new Date());
            const isCurrent = today >= p.startDate && today <= p.endDate;
            const badge = isCurrent
              ? '<span class="badge" style="background:var(--accent);color:#fff">En cours</span>'
              : today > p.endDate ? '<span class="badge">Terminée</span>' : '<span class="badge" style="border:1px solid var(--accent);color:var(--accent)">À venir</span>';

            const actItems = periodActs.map((a) => {
              const cnt = statsPerActivity(cl.id, a.id);
              return `<div class="tl-item" style="--tl:${a.color}">
                <strong>${escapeHtml(a.name)}</strong> <span class="badge">${escapeHtml(a.field)}</span>
                <p class="kpi-sub"><strong>Jours de pratique :</strong> ${formatDayIndicesLabel(a)}</p>
                <p class="kpi-sub">${escapeHtml(a.venue || "—")}</p>
                <p class="kpi-sub">Séances générées : <strong>${cnt.total}</strong> (effectuées ${cnt.done}, annulées ${cnt.cancelled})</p>
                <button type="button" class="btn btn-sm btn-ghost btn-edit-activity" data-id="${a.id}">Modifier</button>
                <button type="button" class="btn btn-sm btn-danger btn-del-activity" data-id="${a.id}">Supprimer</button>
              </div>`;
            }).join("");

            return `<div style="border:1px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:.75rem">
              <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem">
                <div><strong>${escapeHtml(p.name)}</strong> <span class="kpi-sub">${fmtDateFr(p.startDate)} → ${fmtDateFr(p.endDate)}</span> ${badge}</div>
                <button type="button" class="btn btn-sm btn-primary btn-add-activity-period" data-class="${cl.id}" data-period="${p.id}">+ Activité</button>
              </div>
              <div class="timeline">${actItems || '<p class="kpi-sub">Aucune activité sur cette période.</p>'}</div>
            </div>`;
          }).join("");

          const orphanActs = acts.filter((a) => !a.periodId || !clPeriods.some((p) => p.id === a.periodId));
          const orphanBlock = orphanActs.length ? `<div style="border:1px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:.75rem">
            <div style="margin-bottom:.5rem"><strong>Sans période</strong> <span class="kpi-sub">(APSA non rattachées à une période)</span></div>
            <div class="timeline">${orphanActs.map((a) => {
              const cnt = statsPerActivity(cl.id, a.id);
              return `<div class="tl-item" style="--tl:${a.color}">
                <strong>${escapeHtml(a.name)}</strong> <span class="badge">${escapeHtml(a.field)}</span>
                <p class="kpi-sub"><strong>Jours de pratique :</strong> ${formatDayIndicesLabel(a)}</p>
                <p class="kpi-sub">${a.startDate} → ${a.endDate} · ${escapeHtml(a.venue)}</p>
                <p class="kpi-sub">Séances générées : <strong>${cnt.total}</strong> (effectuées ${cnt.done}, annulées ${cnt.cancelled})</p>
                <button type="button" class="btn btn-sm btn-ghost btn-edit-activity" data-id="${a.id}">Modifier</button>
                <button type="button" class="btn btn-sm btn-danger btn-del-activity" data-id="${a.id}">Supprimer</button>
              </div>`;
            }).join("")}</div>
          </div>` : "";

          const noPeriods = !clPeriods.length ? '<p class="kpi-sub" style="margin:.5rem 0">Aucune période associée à cette classe — créez des périodes dans l\'onglet « Périodes ».</p>' : "";

          return `<div class="card"><div class="card-header"><h3><span class="legend-dot" style="background:${cl.color}"></span> ${escapeHtml(cl.name)}</h3></div>
            ${noPeriods}${periodBlocks}${orphanBlock}
          </div>`;
        })
        .join("");
    }

    function viewActivities() {
      return renderTopbar("APSA & cycles", "") + viewActivitiesBody();
    }

      const hasDoc = appData.progEtabPdf && appData.progEtabPdf.length > 100;
      return `<div class="card">

    function viewCalendarBody() {
      const y = calendarCursor.getFullYear();
      const m = calendarCursor.getMonth();
      const first = new Date(y, m, 1);
      const startPad = (first.getDay() + 6) % 7;
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let cells = "";
      for (let i = 0; i < startPad; i++) cells += `<div class="cal-cell muted"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = fmtISODate(new Date(y, m, d));
        const today = fmtISODate(new Date());
        const sess = sessionsOnDate(dateStr).filter((s) => {
          const cl = getClassById(s.classId);
          return matchesSearch(cl?.name || "") || matchesSearch(activityById(s.activityId || "")?.name || "");
        });
        const hol = appData.holidays.find((h) => dateStr >= h.startDate && dateStr <= h.endDate);
        cells += `<div class="cal-cell ${dateStr === today ? "today" : ""}">
          <div class="num">${d}</div>
          ${hol ? `<div class="cal-chip" style="background:${hol.color}33">${escapeHtml(hol.name)}</div>` : ""}
          ${sess
            .map((s) => {
              const cl = getClassById(s.classId);
              const act = activityById(s.activityId);
              return `<div class="cal-chip" style="background:${cl?.color}44">${escapeHtml(cl?.name)} ${s.startTime}${act ? " · " + escapeHtml(act.name) : ""}</div>`;
            })
            .join("")}
        </div>`;
      }
      const weekHtml = (() => {
        const mon = addDays(calendarCursor, -dayIndexMon0(calendarCursor));
        let rows = "";
        for (let i = 0; i < 7; i++) {
          const day = addDays(mon, i);
          const ds = fmtISODate(day);
          const list = sessionsOnDate(ds);
          rows += `<div class="card" style="padding:.6rem"><strong>${DOW[i]} ${ds}</strong>
            ${list
              .map((s) => {
                const cl = getClassById(s.classId);
                return `<div class="cal-chip" style="background:${cl?.color}44">${s.startTime}-${s.endTime} ${escapeHtml(cl?.name)}</div>`;
              })
              .join("") || '<p class="kpi-sub">Aucune séance</p>'}
          </div>`;
        }
        return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem">${rows}</div>`;
      })();

      const yearHtml = `<div class="year-grid">${["Sept", "Oct", "Nov", "Déc", "Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil"]
        .map((name, idx) => `<div class="year-month"><strong>${name}</strong><p class="kpi-sub">${y}</p></div>`)
        .join("")}</div>`;

      return (
        (calendarMode === "month"
          ? `<div class="card"><div class="cal-toolbar"><strong>${new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" }).format(new Date(y, m))}</strong></div>
          <div class="cal-grid">${["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"].map((d) => `<div class="cal-dow">${d}</div>`).join("")}${cells}</div></div>`
          : "") +
        (calendarMode === "week" ? `<div class="card">${weekHtml}</div>` : "") +
        (calendarMode === "year" ? `<div class="card">${yearHtml}</div>` : "")
      );
    }

    /**
     * Lignes de tableau pour une liste de séances (même colonnes que l'ancienne vue annuelle).
     */
    function renderSessionRowsHtml(sessions) {
      const sorted = sessions.slice().sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      const rows = sorted
        .filter((s) => matchesSearch(s.date) || matchesSearch(activityById(s.activityId)?.name || ""))
        .map((s) => {
          const stt = computeSessionStatus(s);
          const act = activityById(s.activityId);
          const d = parseISODate(s.date);
          const jour = new Intl.DateTimeFormat("fr-FR", { weekday: "long" }).format(d);
          const canc = cancellationForSession(s);
          let action = "—";
          if (canc) {
            action = `<button type="button" class="btn btn-sm btn-ghost btn-remove-canc-row" data-canc-id="${canc.id}">Lever l'annulation</button>`;
          } else if (stt.code === "planned" || stt.code === "today") {
            action = `<button type="button" class="btn btn-sm btn-danger btn-cancel-session" data-session-id="${s.id}">Annuler</button>`;
          }
          if (s.extra) {
            action += `<button type="button" class="btn btn-sm btn-danger btn-del-extra-session" data-session-id="${s.id}" style="margin-left:.3rem" title="Supprimer ce cours ajouté">Supprimer</button>`;
          }
          const col = stt.code === "cancelled" ? "var(--danger)" : stt.code === "done" ? "var(--success)" : "var(--accent)";
          const isToday = stt.code === "today";
          const hasSummary = s.summary && s.summary.trim();
          const hasPdf = !!s.sessionPdf;
          const summaryIcon = hasSummary ? "📝" : "＋";
          const summaryStyle = hasSummary ? "color:var(--accent);font-weight:700" : "color:var(--text-muted)";
          const pdfIcon = hasPdf ? '<span style="color:var(--danger);font-size:1rem;margin-right:.2rem" title="PDF joint">📄</span>' : "";
          return `<tr style="${isToday ? "background:#16a34a22;font-weight:600" : ""};cursor:pointer" class="btn-session-summary" data-session-id="${s.id}" title="${hasSummary ? "Voir / modifier le résumé" : "Ajouter un résumé"}">
            <td>${fmtDateFr(s.date)}</td>
            <td>${escapeHtml(jour)}</td>
            <td>${s.startTime}–${s.endTime}</td>
            <td>${escapeHtml(s.venue || "—")}</td>
            <td>${act ? escapeHtml(act.name) : "—"}</td>
            <td><span class="status-dot" style="background:${col}"></span>${escapeHtml(stt.label)}</td>
            <td>${escapeHtml(canc ? REASON_TYPES.find((x) => x[0] === canc.reasonType)?.[1] || canc.reasonType : stt.reason || "")}</td>
            <td class="no-print">${(() => { const att = s.attendance || {}; const keys = Object.keys(att); if (!keys.length) return ""; const p = keys.filter((k) => att[k] === "present").length; const ab = keys.filter((k) => att[k] === "absent").length; const l = keys.filter((k) => att[k] === "late").length; return `<span style="font-size:.7rem;font-weight:600;padding:.15rem .45rem;border-radius:10px;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;margin-right:.3rem" title="Appel">${p}P${l ? " "+l+"R" : ""}${ab ? " "+ab+"A" : ""}</span>`; })()}${pdfIcon}<span style="${summaryStyle};font-size:1rem;margin-right:.35rem">${summaryIcon}</span>${action}</td>
          </tr>`;
        })
        .join("");
      return rows || `<tr><td colspan="8">Aucune séance dans ce groupe.</td></tr>`;
    }

    function renderExemptionsBlock(classId) {
      const exs = exemptionsForClass(classId);
      const rows = exs
        .slice()
        .sort((a, b) => a.endDate.localeCompare(b.endDate))

          const active = isExemptionActive(ex);
          const badge = active
            ? '<span class="badge" style="background:var(--danger);color:#fff">En cours</span>'
            : '<span class="badge">Terminée</span>';
          const remaining = active
            ? Math.max(0, Math.round((parseISODate(ex.endDate).getTime() - todayStart().getTime()) / 86400000)) + 1
            : 0;
          const remainingLabel = active ? `<strong style="color:var(--danger)">${remaining} jour(s)</strong>` : "—";
          return `<tr>
            <td><strong>${escapeHtml(ex.studentName)}</strong></td>
            <td>${ex.certDate ? fmtDateFr(ex.certDate) : "—"}</td>
            <td>${ex.days} jour(s)</td>

            <td>${fmtDateFr(ex.endDate)}</td>

            <td>${badge}</td>
            <td class="no-print"><button type="button" class="btn btn-sm btn-danger btn-del-exemption" data-id="${ex.id}">Supprimer</button><button type="button" class="btn btn-sm btn-ghost btn-edit-exemption" data-id="${ex.id}" style="margin-top:.25rem">Modifier</button></td>
          </tr>`;
        })
        .join("");
      return `<div class="card" style="border-left:5px solid var(--danger)">
        <h3 style="margin-bottom:.5rem">Dispenses (${exs.length})</h3>
        ${exs.length
          ? `<div class="table-wrap"><table><thead><tr><th>Élève</th><th>Certificat</th><th>Durée</th><th>Début</th><th>Fin</th><th>Jours restants</th><th>Statut</th><th class="no-print">Action</th></tr></thead><tbody>${rows}</tbody></table></div>`
          : '<p class="kpi-sub">Aucune dispense en cours.</p>'}
        <button type="button" class="btn btn-sm btn-danger no-print" id="btn-add-exemption" data-classid="${classId}" style="font-weight:700;margin-top:.75rem">+ Ajouter une dispense</button>
      </div>`;
    }

    function forgottenGearForClass(classId) {
      return (appData.forgottenGear || []).filter((f) => f.classId === classId);
    }

    function renderForgottenGearBlock(classId, activePeriod) {
      let items = forgottenGearForClass(classId);
      if (activePeriod) {
        items = items.filter((f) => f.date >= activePeriod.startDate && f.date <= activePeriod.endDate);
      }
      const countByStudent = {};
      items.forEach((f) => {
        const key = f.studentName;
        if (!countByStudent[key]) countByStudent[key] = [];
        countByStudent[key].push(f);
      });
      const studentRows = Object.keys(countByStudent)
        .sort((a, b) => countByStudent[b].length - countByStudent[a].length)
        .map((name) => {
          const entries = countByStudent[name].sort((a, b) => a.date.localeCompare(b.date));
          const details = entries.map((f) => `${fmtDateFr(f.date)} (${escapeHtml(f.item || "—")})`).join(", ");
          const count = entries.length;
          const countStyle = count >= 3 ? "color:var(--danger);font-weight:700" : count >= 2 ? "color:#d97706;font-weight:600" : "";
          const rowStyle = count >= 3 ? "background:rgba(220,38,38,.12);color:var(--danger);font-weight:600" : "";
          return `<tr class="fg-student-row" data-student="${escapeHtml(name)}" style="${rowStyle}">
            <td><strong>${escapeHtml(name)}</strong></td>
            <td style="${countStyle}">${count}</td>
            <td class="kpi-sub">${details}</td>
            <td class="no-print">${entries.map((f) => `<button type="button" class="btn btn-sm btn-danger btn-del-forgotten" data-id="${f.id}" style="margin:.1rem">✕</button>`).join("")}</td>
          </tr>`;
        })
        .join("");

      return `<div class="card" style="border-left:5px solid #d97706">
        <h3 style="margin-bottom:.5rem">Oublis de matériel${activePeriod ? " — " + escapeHtml(activePeriod.name) : ""} (${items.length})</h3>
        ${studentRows
          ? `<div class="table-wrap"><table><thead><tr><th>Élève</th><th>Nb oublis</th><th>Dates & objets</th><th class="no-print">Suppr.</th></tr></thead><tbody>${studentRows}</tbody></table></div>`
          : '<p class="kpi-sub">Aucun oubli enregistré sur cette période.</p>'}
        <button type="button" class="btn btn-sm no-print" id="btn-add-forgotten" data-classid="${classId}" style="margin-top:.75rem;font-weight:700;background:#d97706;color:#fff">+ Ajouter un oubli</button>
      </div>`;
    }

    /**
     * Onglet classe : séances filtrées par période, avec sélecteur de période.
     */
    function viewClassPage(classId) {
      const cl = getClassById(classId);
      if (!cl) return renderTopbar("Classe", "") + `<div class="card"><p>Classe introuvable.</p></div>`;
      const backBtn = `<button type="button" class="btn btn-sm btn-ghost" id="btn-back-dashboard" style="gap:0.35rem">◀ Tableau de bord</button>`;
      const st = sessionStatsForClass(classId);
      const { next, lastDone } = nextAndLastSession(classId);

      const clPeriods = periodsForClass(classId);
      const todayStr = fmtISODate(new Date());
      const currentPeriod = clPeriods.find((p) => todayStr >= p.startDate && todayStr <= p.endDate);
      const selectedPeriodId = classSelectedPeriod[classId] || (currentPeriod ? currentPeriod.id : null);
      const activePeriod = clPeriods.find((p) => p.id === selectedPeriodId) || null;

      const periodSelector = clPeriods.length
        ? `<select id="class-period-select" style="border:none;padding:.55rem .85rem;border-radius:var(--radius);font-size:.92rem;font-weight:600;flex:1;min-width:200px;color:#fff;background:var(--accent);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22white%22><path d=%22M7 10l5 5 5-5z%22/></svg>');background-repeat:no-repeat;background-position:right .7rem center;padding-right:2rem;box-shadow:0 2px 8px rgba(0,0,0,.15)">
              ${clPeriods.map((p) => {
                const isCur = currentPeriod && p.id === currentPeriod.id;
                return `<option value="${p.id}" ${p.id === selectedPeriodId ? "selected" : ""}>${escapeHtml(p.name)} (${fmtDateFr(p.startDate)} → ${fmtDateFr(p.endDate)})${isCur ? " ● en cours" : ""}</option>`;
              }).join("")}
              <option value="__all__" ${!selectedPeriodId ? "selected" : ""}>Toutes les périodes</option>
            </select>`
        : "";

      const periodActs = activePeriod
        ? activitiesForClass(classId).filter((a) => a.startDate >= activePeriod.startDate && a.endDate <= activePeriod.endDate || (a.periodId && a.periodId === activePeriod.id))
        : activitiesForClass(classId);

      const pactStr = periodActs.length
        ? periodActs.map((a) => `${escapeHtml(a.name)} (${fmtDateFr(a.startDate)} – ${fmtDateFr(a.endDate)})`).join(" · ")
        : "—";

      const sections = [];
      periodActs.forEach((a) => {
        const subs = sessionsForClass(classId).filter((s) => s.activityId === a.id);
        if (!subs.length) return;
        const aSt = sessionStatsForSessions(subs);
        sections.push(`<div class="card" style="border-left:5px solid ${escapeHtml(a.color)}">
          <h3 style="margin-bottom:.35rem">${escapeHtml(a.name)} <span class="badge" style="font-size:0.78rem;vertical-align:middle">${aSt.remaining} restante(s)</span></h3>
          <p class="kpi-sub"><strong>Période</strong> ${fmtDateFr(a.startDate)} → ${fmtDateFr(a.endDate)} · <strong>Jours</strong> : ${escapeHtml(formatDayIndicesLabel(a))}</p>
          <div class="table-wrap"><table><thead><tr><th>Date</th><th>Jour</th><th>Horaire</th><th>Lieu</th><th>APSA</th><th>Statut</th><th>Motif / info</th><th class="no-print">Action</th></tr></thead><tbody>
          ${renderSessionRowsHtml(subs)}
          </tbody></table></div>
        </div>`);
      });
      {
        const shownActIds = new Set(periodActs.map((a) => a.id));
        const orphan = sessionsForClass(classId).filter((s) => s.extra && (!s.activityId || !shownActIds.has(s.activityId)));
        if (orphan.length) {
          sections.push(`<div class="card" style="border-left:5px solid #d97706">
            <h3 style="margin-bottom:.35rem">📌 Cours ajoutés — sans APSA</h3>
            <p class="kpi-sub">Ces cours ont été ajoutés manuellement et ne sont rattachés à aucune activité.</p>
            <div class="table-wrap"><table><thead><tr><th>Date</th><th>Jour</th><th>Horaire</th><th>Lieu</th><th>APSA</th><th>Statut</th><th>Motif / info</th><th class="no-print">Action</th></tr></thead><tbody>
            ${renderSessionRowsHtml(orphan)}
            </tbody></table></div>
          </div>`);
        }
      }
      const sectionsHtml =
        sections.length > 0
          ? sections.join("")
          : `<div class="card"><p class="kpi-sub">${activePeriod ? "Aucune séance sur cette période." : "Aucune séance générée — renseignez l'emploi du temps et les APSA dans Réglages, puis « Régénérer les séances »."}</p></div>`;

      return (
        renderTopbar(
          `${cl.name} — Séances`,
          `${backBtn}<button type="button" class="btn btn-sm btn-primary no-print" onclick="window.print()">Imprimer</button>`
        ) +
        `<div class="card">
          <h3 style="margin-bottom:.5rem"><span class="legend-dot" style="background:${cl.color}"></span> ${escapeHtml(cl.name)}</h3>
          <p class="kpi-sub">Effectif ${cl.enrollment} · ${cycleLabel(cl.cycleYears)} · <strong>${st.total}</strong> séances sur l'année (${st.done} effectuées, ${st.remaining} restantes, ${st.cancelled} annulées)</p>
          <p class="kpi-sub"><strong>Emploi du temps :</strong> ${escapeHtml(weekdaysForClass(classId) || "—")}</p>
          <p class="kpi-sub"><strong>APSA :</strong> ${pactStr}</p>
          <p class="kpi-sub"><strong>Prochaine séance :</strong> ${next ? `${fmtDateFr(next.date)} ${next.startTime}` : "—"} · <strong>Dernière effectuée :</strong> ${lastDone ? `${fmtDateFr(lastDone.date)} ${lastDone.startTime}` : "—"}</p>
          <div style="display:flex;gap:.5rem;margin-top:0.75rem;flex-wrap:wrap">
            <button type="button" class="btn btn-sm btn-primary no-print" id="btn-add-extra-session" data-classid="${classId}" style="font-weight:700">+ Ajouter un cours</button>
          </div>
        </div>
        ${renderExemptionsBlock(classId)}
        ${renderForgottenGearBlock(classId, activePeriod)}
        ${periodSelector ? `<div class="card no-print" style="border-left:5px solid var(--accent);padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
          <strong style="font-size:1rem">📅 Période</strong>${periodSelector}
        </div>` : ""}
        ${sectionsHtml}`
      );
    }

    /** Regroupe l'ancienne navigation « technique » derrière un seul point d'entrée. */
    function viewTools() {
      if (toolsPanel === "schedule") toolsPanel = "orgCreneaux";
      if (toolsPanel === "activities") toolsPanel = "orgApsa";
      if (toolsPanel === "venues") toolsPanel = "orgLieux";
      if (toolsPanel === "progEtab") toolsPanel = "orgProg";
      if (toolsPanel === "holidays" || toolsPanel === "calendar") toolsPanel = "calendriers";

      const TOOLS_CARDS = [
        { id: "classes",      icon: "📋", label: "Mes classes",      sub: appData.classes.length + " classe(s)" },
        { id: "orgEPS",       icon: "🏫", label: "Organisation de l'EPS dans l'établissement", sub: "EDT, APSA, lieux, programmation" },
        { id: "calendriers",  icon: "📆", label: "Calendriers",      sub: "Calendrier scolaire & visuel" },
        { id: "backup",       icon: "💾", label: "Sauvegarde",       sub: "Export, import, reset" },
      ];

      if (toolsPanel === "home" || !toolsPanel) {
        const cards = TOOLS_CARDS.map((c) =>
          `<div class="kpi no-print" style="animation-delay:0.1s;min-width:200px;flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1rem" data-tools="${c.id}">
            <span style="font-size:2rem;margin-bottom:.5rem">${c.icon}</span>
            <div class="kpi-label" style="text-align:center;font-size:.95rem">${c.label}</div>
            <div class="kpi-sub" style="margin-top:.3rem;text-align:center">${c.sub}</div>
          </div>`
        ).join("");
        return (
          renderTopbar("Réglages & données") +
          `<div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem">${cards}</div>
          <div style="text-align:center;margin-top:1.5rem">
            <button type="button" class="btn btn-sm" id="btn-reset-all" style="background:#dc2626;color:#fff;font-weight:700;padding:.5rem 1.2rem;border-radius:var(--radius)">🗑️ Réinitialiser toutes les données</button>
          </div>`
        );
      }

      let panel = "";
      let panelTitle = "";
      const extraBtns = [];
      switch (toolsPanel) {
        case "classes":
          panelTitle = "📋 Mes classes";
          extraBtns.push(`<button type="button" class="btn btn-sm btn-primary" id="btn-add-class">+ Classe</button>`);
          panel = viewClassesBody();
          break;
        case "orgEPS": {
          panelTitle = "🏫 Organisation de l'EPS dans l'établissement";
          const ORG_CARDS = [
            { id: "orgPeriodes",  icon: "📅", label: "Périodes",                          sub: "Définir les périodes de l'année" },
            { id: "orgCreneaux",  icon: "🕐", label: "Créneaux des classes",              sub: "Emploi du temps hebdomadaire" },
            { id: "orgApsa",      icon: "🏃", label: "APSA & séquences",                  sub: "Activités par classe et période" },
            { id: "orgLieux",     icon: "📍", label: "Lieux de pratique",                  sub: "Gymnase, stade, piscine…" },
            { id: "orgProg",      icon: "📋", label: "Programmation de l'établissement",   sub: "Document PDF de référence" },
          ];
          panel = `<div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:.5rem">${ORG_CARDS.map((c) =>
            `<div class="kpi no-print" style="animation-delay:0.1s;min-width:200px;flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1rem" data-tools="${c.id}">
              <span style="font-size:2rem;margin-bottom:.5rem">${c.icon}</span>
              <div class="kpi-label" style="text-align:center;font-size:.95rem">${c.label}</div>
              <div class="kpi-sub" style="margin-top:.3rem;text-align:center">${c.sub}</div>
            </div>`
          ).join("")}</div>`;
          break;
        }
        case "orgPeriodes":
          panelTitle = "📅 Périodes";
          panel = viewPeriodsBody();
          break;
        case "orgCreneaux":
          panelTitle = "🕐 Créneaux des classes";
          panel = viewScheduleBody();
          break;
        case "orgApsa":
          panelTitle = "🏃 APSA & séquences";
          panel = viewActivitiesBody();
          break;
        case "orgLieux":
          panelTitle = "📍 Lieux de pratique";
          panel = viewVenuesBody();
          break;
        case "orgProg":
          panelTitle = "📋 Programmation de l'établissement";
          panel = viewProgEtabBody();
          break;
        case "calendriers":
          panelTitle = "📆 Calendriers";
          extraBtns.push(`<button type="button" class="btn btn-sm btn-primary" id="btn-add-holiday">+ Événement</button>`);
          panel =
            `<h3 style="margin:1rem 0 .5rem">📅 Calendrier scolaire</h3>` + viewHolidaysBody() +
            `<h3 style="margin:1.5rem 0 .5rem">🗓️ Calendrier visuel</h3>` +
            `<div class="card no-print" style="margin-bottom:1rem;padding:.75rem">
            <div class="flex-row">
              <button type="button" class="btn btn-sm btn-ghost" id="cal-prev">◀</button>
              <button type="button" class="btn btn-sm btn-ghost" id="cal-today">Aujourd'hui</button>
              <button type="button" class="btn btn-sm btn-ghost" id="cal-next">▶</button>
              <select id="cal-mode" class="btn btn-sm" style="border:1px solid var(--border)">
                <option value="month" ${calendarMode === "month" ? "selected" : ""}>Mensuel</option>
                <option value="week" ${calendarMode === "week" ? "selected" : ""}>Hebdomadaire</option>
                <option value="year" ${calendarMode === "year" ? "selected" : ""}>Annuel</option>
              </select>
            </div></div>` +
            viewCalendarBody();
          break;
        case "backup":
          panelTitle = "💾 Sauvegarde";
          panel = viewBackupBody();
          break;
        default:
          toolsPanel = "home";
          return viewTools();
      }
      const isOrgSub = ["orgPeriodes", "orgCreneaux", "orgApsa", "orgLieux", "orgProg"].includes(toolsPanel);
      const backLabel = isOrgSub ? "◀ Organisation" : "◀ Réglages";
      const backTarget = isOrgSub ? "orgEPS" : "home";
      return (
        renderTopbar("Réglages — " + panelTitle, `<button type="button" class="btn btn-sm btn-ghost" data-tools="${backTarget}" style="gap:.25rem">${backLabel}</button>` + extraBtns.join("")) +
        panel
      );
    }

    function wireEvents(main) {
      main.querySelector("#btn-regen")?.addEventListener("click", () => {
        regenerateSessions();
        render();
      });
      main.querySelector("#dash-prev-day")?.addEventListener("click", () => {
        dashboardDate = addDays(dashboardDate, -1);
        render();
      });
      main.querySelector("#dash-next-day")?.addEventListener("click", () => {
        dashboardDate = addDays(dashboardDate, 1);
        render();
      });
      main.querySelector("#dash-today")?.addEventListener("click", () => {
        dashboardDate = new Date();
        render();
      });
      main.querySelector("#btn-todo-add")?.addEventListener("click", () => {
        const inp = main.querySelector("#todo-input");
        const text = inp ? inp.value.trim() : "";
        if (!text) return;
        appData.todoList.push({ text, done: false });
        saveData();
        render();
      });
      main.querySelector("#todo-input")?.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          main.querySelector("#btn-todo-add")?.click();
        }
      });
      main.querySelectorAll(".todo-check").forEach((cb) => {
        cb.addEventListener("change", () => {
          const idx = parseInt(cb.getAttribute("data-idx"), 10);
          if (appData.todoList[idx]) {
            appData.todoList[idx].done = cb.checked;
            saveData();
            render();
          }
        });
      });
      main.querySelectorAll(".todo-del").forEach((b) => {
        b.addEventListener("click", () => {
          const idx = parseInt(b.getAttribute("data-idx"), 10);
          appData.todoList.splice(idx, 1);
          saveData();
          render();
        });
      });
      main.querySelectorAll(".link-fg-student").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const cid = a.getAttribute("data-classid");
          const studentName = a.getAttribute("data-student");
          navigateTo(getClassViewId(cid));
          setTimeout(() => {
            const rows = document.querySelectorAll(".fg-student-row");
            for (const row of rows) {
              if (row.getAttribute("data-student") === studentName) {
                row.scrollIntoView({ behavior: "smooth", block: "center" });
                row.style.transition = "background .3s";
                row.style.background = "rgba(220,38,38,.18)";
                setTimeout(() => { row.style.background = ""; }, 2000);
                break;
              }
            }
          }, 100);
        });
      });
      main.querySelector("#btn-fg-threshold")?.addEventListener("click", () => {
        const opts = Array.from({length: 10}, (_, i) => i + 1).map((n) => `<option value="${n}" ${n === forgottenGearThreshold ? "selected" : ""}>${n}</option>`).join("");
        const body = el(`<div>
          <div class="form-group"><label>Afficher les élèves ayant au moins :</label>
            <select id="f-fg-thresh" style="font-size:1rem;padding:.4rem .6rem">${opts}</select> <span>oubli(s) sur la période</span>
          </div>
        </div>`);
        openModal("Seuil d'oublis de matériel", body, () => {
          forgottenGearThreshold = parseInt(body.querySelector("#f-fg-thresh").value, 10) || 3;
          lsSet("eps_fg_threshold", String(forgottenGearThreshold));
          render();
        });
      });
      main.querySelector("#btn-goto-tools")?.addEventListener("click", () => {
        toolsPanel = "home";
        navigateTo("tools");
      });
      main.querySelector("#btn-goto-classes")?.addEventListener("click", () => {
        toolsPanel = "classes";
        navigateTo("tools");
      });
      main.querySelector("#btn-back-dashboard")?.addEventListener("click", () => {
        goBack();
      });
      main.querySelector("#btn-history-back")?.addEventListener("click", () => {
        goBack();
      });
      main.querySelector("#class-period-select")?.addEventListener("change", (e) => {
        const val = e.target.value;
        const classId = currentView.startsWith("class:") ? currentView.slice(6) : null;
        if (classId) {
          classSelectedPeriod[classId] = val === "__all__" ? null : val;
          render();
        }
      });
      main.querySelector("#btn-add-exemption")?.addEventListener("click", () => {
        const cid = main.querySelector("#btn-add-exemption").getAttribute("data-classid");
        const todayISO = fmtISODate(new Date());
        const body = el(`<div>
          <div class="form-group"><label>Élève</label>${studentPickerHtml(cid, "f-ex-name")}</div>
          <div class="form-group"><label>Date du certificat médical</label><input type="date" id="f-ex-certdate" value="${todayISO}" max="${todayISO}" /></div>
          <div class="form-group"><label>Mode de saisie de la durée</label>
            <select id="f-ex-mode">
              <option value="days">Nombre de jours de dispense</option>
              <option value="date">Date de fin inscrite sur le certificat</option>
            </select>
          </div>
          <div id="ex-block-days" class="form-group"><label>Nombre de jours</label><input type="number" id="f-ex-days" min="1" value="7" />
            <p class="kpi-sub" style="margin-top:.3rem">La date de fin est calculée à partir de la date du certificat + nombre de jours.</p>
          </div>
          <div id="ex-block-date" class="form-group" style="display:none"><label>Date de fin (inscrite sur le certificat)</label><input type="date" id="f-ex-enddate" />
          </div>
        </div>`);
        const modeSelect = body.querySelector("#f-ex-mode");
        modeSelect.addEventListener("change", () => {
          const isDays = modeSelect.value === "days";
          body.querySelector("#ex-block-days").style.display = isDays ? "" : "none";
          body.querySelector("#ex-block-date").style.display = isDays ? "none" : "";
        });
        openModal("Nouvelle dispense", body, () => {
          const name = body.querySelector("#f-ex-name").value.trim();
          if (!name) return;
          const certDate = body.querySelector("#f-ex-certdate").value;
          if (!certDate) return;
          const startDate = certDate;
          let endDate, days;
          if (modeSelect.value === "days") {
            days = parseInt(body.querySelector("#f-ex-days").value, 10);
            if (!days || days < 1) return;
            endDate = fmtISODate(addDays(parseISODate(certDate), days - 1));
          } else {
            endDate = body.querySelector("#f-ex-enddate").value;
            if (!endDate || endDate < certDate) return;
            const diff = Math.round((parseISODate(endDate).getTime() - parseISODate(certDate).getTime()) / 86400000) + 1;
            days = Math.max(1, diff);
          }
          appData.exemptions.push({
            id: uid(),
            classId: cid,
            studentName: name,
            days: days,
            startDate: startDate,
            endDate: endDate,
            certDate: certDate,
          });
          saveData();
          render();
        });
      });
      main.querySelector("#btn-add-extra-session")?.addEventListener("click", () => {
        const cid = main.querySelector("#btn-add-extra-session").getAttribute("data-classid");
        const todayISO = fmtISODate(new Date());
        const acts = activitiesForClass(cid);
        const actOptions = acts.map((a) => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("");
        const scheds = schedulesForClass(cid);
        const body = el(`<div>
          <div class="form-group"><label>Date du cours</label><input type="date" id="f-extra-date" value="${todayISO}" /></div>
          <div class="form-row">
            <div class="form-group"><label>Heure début</label><input type="time" id="f-extra-start" value="${scheds.length ? scheds[0].startTime : "08:00"}" /></div>
            <div class="form-group"><label>Heure fin</label><input type="time" id="f-extra-end" value="${scheds.length ? scheds[0].endTime : "10:00"}" /></div>
          </div>
          <div class="form-group"><label>Installation</label><input id="f-extra-venue" placeholder="Gymnase, stade…" value="${scheds.length ? escapeHtml(scheds[0].venue || "") : ""}" /></div>
          <div class="form-group"><label>APSA</label><select id="f-extra-act"><option value="">— Aucune —</option>${actOptions}</select></div>
        </div>`);
        openModal("Ajouter un cours supplémentaire", body, () => {
          const date = body.querySelector("#f-extra-date").value;
          const startTime = body.querySelector("#f-extra-start").value;
          const endTime = body.querySelector("#f-extra-end").value;
          const venue = body.querySelector("#f-extra-venue").value.trim();
          const actId = body.querySelector("#f-extra-act").value || null;
          if (!date || !startTime || !endTime) return;
          appData.sessions.push({
            id: uid(),
            classId: cid,
            scheduleId: null,
            date: date,
            startTime: startTime,
            endTime: endTime,
            venue: venue,
            activityId: actId,
            extra: true,
          });
          saveData();
          render();
        });
      });
      main.querySelectorAll(".btn-del-exemption").forEach((b) => {
        b.addEventListener("click", () => {
          const eid = b.getAttribute("data-id");
          if (confirm("Supprimer cette dispense ?")) {
            appData.exemptions = appData.exemptions.filter((e) => e.id !== eid);
            saveData();
            render();
          }
        });
      });
      main.querySelectorAll(".btn-edit-exemption").forEach((b) => {
        b.addEventListener("click", () => {
          const eid = b.getAttribute("data-id");
          const ex = appData.exemptions.find((e) => e.id === eid);
          if (!ex) return;
          const body = el(`<div>

      main.querySelectorAll(".btn-del-activity").forEach((b) => {
        b.addEventListener("click", () => {
          const id = b.getAttribute("data-id");
          appData.activities = appData.activities.filter((a) => a.id !== id);
          regenerateSessions();
          saveData();
          render();
        });
      });
      main.querySelector("#btn-add-holiday")?.addEventListener("click", () => {
        const body = el(`<div>
          <div class="form-group"><label>Type</label><select id="f-t">
            <option value="vacances">Vacances</option><option value="ferie">Jour férié</option><option value="pont">Pont</option>
            <option value="banalise">Journée banalisée</option><option value="sortie">Sortie / voyage</option><option value="stage">Stage</option>
            <option value="examen">Examens</option><option value="formation">Formation</option>
          </select></div>
          <div class="form-group"><label>Nom</label><input id="f-n" /></div>
          <div class="form-row"><div class="form-group"><label>Début</label><input type="date" id="f-d1" /></div><div class="form-group"><label>Fin</label><input type="date" id="f-d2" /></div></div>
          <div class="form-group"><label>Couleur (#hex)</label><input id="f-c" value="#64748b" /></div>
          <div class="form-group"><label><input type="checkbox" id="f-b" checked /> Bloque les séances (recalcul)</label></div>
        </div>`);
        openModal("Événement calendrier", body, () => {
          appData.holidays.push({
            id: uid(),
            type: body.querySelector("#f-t").value,
            name: body.querySelector("#f-n").value || "Événement",
            startDate: body.querySelector("#f-d1").value,
            endDate: body.querySelector("#f-d2").value || body.querySelector("#f-d1").value,
            color: body.querySelector("#f-c").value,
            blocksSessions: body.querySelector("#f-b").checked,
          });
          regenerateSessions();
          saveData();
          render();
        });
      });
      main.querySelectorAll(".btn-del-holiday").forEach((b) => {
        b.addEventListener("click", () => {
          appData.holidays = appData.holidays.filter((h) => h.id !== b.getAttribute("data-id"));
          regenerateSessions();
          saveData();
          render();
        });
      });
      main.querySelector("#btn-apply-calendar")?.addEventListener("click", () => {
        const sel = main.querySelector("#sel-academy");
        if (!sel || !sel.value) { alert("Veuillez sélectionner une académie."); return; }
        const academy = sel.value;
        const zone = ACADEMIES_ZONES[academy];
        if (!zone || zone === "—") { alert("Le calendrier automatique n'est pas disponible pour cette académie."); return; }
        if (!confirm("Cela remplacera toutes les vacances et jours fériés actuels par le calendrier officiel 2025-2026 (zone " + zone + "). Continuer ?")) return;
        appData.settings.academy = academy;
        appData.settings.zone = zone;
        applyOfficialCalendar(zone);
        regenerateSessions();
        saveData();
        render();
      });
      main.querySelector("#btn-submit-canc")?.addEventListener("click", () => {
        const sid = main.querySelector("#canc-session").value;
        const s = appData.sessions.find((x) => x.id === sid);
        if (!s) return;
        appData.cancellations.push({
          id: uid(),
          sessionId: s.id,
          classId: s.classId,
          date: s.date,
          startTime: s.startTime,
          reasonType: main.querySelector("#canc-reason").value,
          comment: main.querySelector("#canc-comment").value,
        });
        saveData();
        render();
      });
      main.querySelectorAll(".btn-remove-canc").forEach((b) => {
        b.addEventListener("click", () => {
          appData.cancellations = appData.cancellations.filter((c) => c.id !== b.getAttribute("data-id"));
          saveData();
          render();
        });
      });
      main.querySelector("#cal-prev")?.addEventListener("click", () => {
        if (calendarMode === "month") calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() - 1, 1);
        else calendarCursor = addDays(calendarCursor, -7);
        render();
      });
      main.querySelector("#cal-next")?.addEventListener("click", () => {
        if (calendarMode === "month") calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + 1, 1);
        else calendarCursor = addDays(calendarCursor, 7);
        render();
      });
      main.querySelector("#cal-today")?.addEventListener("click", () => {
        calendarCursor = new Date();
        render();
      });
      main.querySelector("#cal-mode")?.addEventListener("change", (e) => {
        calendarMode = e.target.value;
        render();
      });
      main.querySelector("#btn-export")?.addEventListener("click", exportJSON);
      main.querySelector("#inp-import")?.addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (f) importJSONFile(f);
      });
      main.querySelector("#btn-reset")?.addEventListener("click", resetAll);
      main.querySelector("#btn-reset-all")?.addEventListener("click", resetAll);
      main.querySelector("#btn-pdf")?.addEventListener("click", () => window.print());
      main.querySelector("#btn-save-settings")?.addEventListener("click", () => {
        appData.settings.schoolYearStart = main.querySelector("#set-start").value;
        appData.settings.schoolYearEnd = main.querySelector("#set-end").value;
        regenerateSessions();
        saveData();
        render();
      });
      main.querySelectorAll(".btn-today-session").forEach((row) => {
        row.addEventListener("click", () => {
          const sid = row.getAttribute("data-session-id");
          const s = appData.sessions.find((x) => x.id === sid);
          if (!s) return;
          const cl = getClassById(s.classId);
          const act = activityById(s.activityId);
          let sessionNumLabel = "";
          if (act) {
            const actSessions = appData.sessions
              .filter((x) => x.classId === s.classId && x.activityId === act.id)
              .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
            const nonCancelled = actSessions.filter((x) => computeSessionStatus(x).code !== "cancelled");
            const idx = nonCancelled.findIndex((x) => x.id === s.id);
            if (idx >= 0) sessionNumLabel = `Séance n°${idx + 1} sur ${nonCancelled.length}`;
          }
          const activeEx = (appData.exemptions || []).filter((e) => s.date >= e.startDate && s.date <= e.endDate && e.classId === s.classId);
          const body = el(`<div>
            <p style="font-size:1rem;font-weight:700;margin-bottom:.25rem">${escapeHtml(cl ? cl.name : "—")} · ${s.startTime || ""}–${s.endTime || ""}${act ? " · " + escapeHtml(act.name) : ""}</p>
            ${sessionNumLabel ? `<p style="margin-bottom:.75rem;font-weight:600;color:var(--accent)">${escapeHtml(sessionNumLabel)}</p>` : ""}
            <div id="td-ex-info"></div>
            <div class="form-group"><label>Résumé de la séance</label><textarea id="f-td-summary" rows="5" style="width:100%;font-size:.9rem;line-height:1.5" placeholder="Contenu de la séance, observations, points à retenir…"></textarea></div>
            <hr style="border:none;border-top:1px solid var(--border);margin:1rem 0">
            <p style="font-weight:700;margin-bottom:.5rem">Signaler un oubli de matériel</p>
            <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end">
              <div class="form-group" style="flex:1;min-width:8rem"><label>Élève</label>${studentPickerHtml(s.classId, "f-td-fg-name")}</div>
              <div class="form-group" style="min-width:7rem"><label>Objet oublié</label>
                <select id="f-td-fg-item"><option value="Gourde">Gourde</option><option value="Tenue">Tenue</option><option value="Baskets">Baskets</option></select>
              </div>
              <button type="button" class="btn btn-sm" id="btn-td-add-fg" style="background:#d97706;color:#fff;font-weight:700;margin-bottom:.35rem">+ Ajouter</button>
            </div>
            <div id="td-fg-list" style="margin-top:.5rem"></div>
            <hr style="border:none;border-top:1px solid var(--border);margin:1rem 0">
            <p style="font-weight:700;margin-bottom:.5rem">Dispense élève</p>
            <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end">
              <div class="form-group" style="flex:1;min-width:8rem"><label>Élève</label>${studentPickerHtml(s.classId, "f-td-ex-name")}</div>
              <div class="form-group" style="min-width:8rem"><label>Date certificat</label><input type="date" id="f-td-ex-certdate" value="${fmtISODate(new Date())}" /></div>
            </div>
            <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end;margin-top:.25rem">
              <div class="form-group" style="min-width:7rem"><label>Mode</label>
                <select id="f-td-ex-mode"><option value="days">Nombre de jours</option><option value="date">Date de fin</option></select>
              </div>
              <div class="form-group" id="td-ex-block-days" style="min-width:6rem"><label>Jours</label><input type="number" id="f-td-ex-days" min="1" value="7" /></div>
              <div class="form-group" id="td-ex-block-date" style="min-width:8rem;display:none"><label>Date de fin</label><input type="date" id="f-td-ex-enddate" /></div>
              <button type="button" class="btn btn-sm btn-danger" id="btn-td-add-ex" style="font-weight:700;margin-bottom:.35rem">+ Dispense</button>
            </div>
            <div id="td-ex-list" style="margin-top:.5rem"></div>
          </div>`);
          body.querySelector("#f-td-summary").value = s.summary || "";
          if (activeEx.length) {
            const exDiv = body.querySelector("#td-ex-info");
            exDiv.innerHTML = `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:.6rem .8rem;margin-bottom:.75rem">
              <p style="font-weight:700;margin:0 0 .3rem;color:#dc2626;font-size:.88rem">🏥 Élèves dispensés (${activeEx.length})</p>
              ${activeEx.map((e) => '<div style="font-size:.85rem;padding:.15rem 0"><strong style="color:#dc2626">' + escapeHtml(e.studentName) + '</strong> <span style="color:#666">— jusqu\'au ' + fmtDateFr(e.endDate) + '</span></div>').join("")}
            </div>`;
          }
          const tdExMode = body.querySelector("#f-td-ex-mode");
          tdExMode.addEventListener("change", () => {
            body.querySelector("#td-ex-block-days").style.display = tdExMode.value === "days" ? "" : "none";
            body.querySelector("#td-ex-block-date").style.display = tdExMode.value === "days" ? "none" : "";
          });
          const exList = [];
          const renderExList = () => {
            const container = body.querySelector("#td-ex-list");
            container.innerHTML = exList.length
              ? exList.map((ex, i) => `<div style="display:flex;align-items:center;gap:.5rem;padding:.25rem 0"><span>✓ <strong style="color:var(--danger)">${escapeHtml(ex.name)}</strong> — ${ex.days}j (${fmtDateFr(ex.startDate)} → ${fmtDateFr(ex.endDate)})</span><button type="button" class="btn btn-sm btn-danger td-ex-del" data-idx="${i}" style="padding:.15rem .4rem;font-size:.7rem">✕</button></div>`).join("")
              : "";
            container.querySelectorAll(".td-ex-del").forEach((b) => {
              b.addEventListener("click", () => { exList.splice(parseInt(b.getAttribute("data-idx"), 10), 1); renderExList(); });
            });
          };
          body.querySelector("#btn-td-add-ex").addEventListener("click", () => {
            const name = body.querySelector("#f-td-ex-name").value.trim();
            const certDate = body.querySelector("#f-td-ex-certdate").value;
            if (!name || !certDate) return;
            let endDate, days;
            if (tdExMode.value === "days") {
              days = parseInt(body.querySelector("#f-td-ex-days").value, 10);
              if (!days || days < 1) return;
              endDate = fmtISODate(addDays(parseISODate(certDate), days - 1));
            } else {
              endDate = body.querySelector("#f-td-ex-enddate").value;
              if (!endDate || endDate < certDate) return;
              days = Math.max(1, Math.round((parseISODate(endDate).getTime() - parseISODate(certDate).getTime()) / 86400000) + 1);
            }
            exList.push({ name, certDate, startDate: certDate, days, endDate });
            body.querySelector("#f-td-ex-name").value = "";
            renderExList();
          });
          const fgList = [];
          const renderFgList = () => {
            const container = body.querySelector("#td-fg-list");
            container.innerHTML = fgList.length
              ? fgList.map((f, i) => `<div style="display:flex;align-items:center;gap:.5rem;padding:.25rem 0"><span>✓ <strong>${escapeHtml(f.name)}</strong> — ${escapeHtml(f.item)}</span><button type="button" class="btn btn-sm btn-danger td-fg-del" data-idx="${i}" style="padding:.15rem .4rem;font-size:.7rem">✕</button></div>`).join("")
              : "";
            container.querySelectorAll(".td-fg-del").forEach((b) => {
              b.addEventListener("click", () => { fgList.splice(parseInt(b.getAttribute("data-idx"), 10), 1); renderFgList(); });
            });
          };
          body.querySelector("#btn-td-add-fg").addEventListener("click", () => {
            const name = body.querySelector("#f-td-fg-name").value.trim();
            const item = body.querySelector("#f-td-fg-item").value;
            if (!name) return;
            fgList.push({ name, item });
            body.querySelector("#f-td-fg-name").value = "";
            renderFgList();
          });
          body.appendChild(buildAttendanceBlock(s));
          body.appendChild(buildSessionPdfBlock(s));
          openModal("Cours du jour — " + escapeHtml(cl ? cl.name : ""), body, () => {
            s.summary = body.querySelector("#f-td-summary").value;
            const todayISO = fmtISODate(new Date());
            fgList.forEach((f) => {
              appData.forgottenGear.push({ id: uid(), classId: s.classId, studentName: f.name, date: todayISO, item: f.item });
            });
            exList.forEach((ex) => {
              appData.exemptions.push({ id: uid(), classId: s.classId, studentName: ex.name, certDate: ex.certDate, startDate: ex.startDate, days: ex.days, endDate: ex.endDate });
            });
            saveData();
            render();
          });
        });
      });
      main.querySelectorAll(".btn-session-summary").forEach((row) => {
        row.addEventListener("click", (e) => {
          if (e.target.closest("button")) return;
          const sid = row.getAttribute("data-session-id");
          const s = appData.sessions.find((x) => x.id === sid);
          if (!s) return;
          const act = activityById(s.activityId);
          const body = el(`<div>
            <p class="kpi-sub" style="margin-bottom:.75rem"><strong>${fmtDateFr(s.date)}</strong> · ${s.startTime}–${s.endTime}${act ? " · " + escapeHtml(act.name) : ""}</p>
            <div class="form-group"><label>Résumé de la séance</label><textarea id="f-summary" rows="6" style="width:100%;font-size:.9rem;line-height:1.5" placeholder="Contenu de la séance, observations, points à retenir…"></textarea></div>
          </div>`);
          body.querySelector("#f-summary").value = s.summary || "";
          body.appendChild(buildAttendanceBlock(s));
          body.appendChild(buildSessionPdfBlock(s));
          openModal("Résumé de séance", body, () => {
            s.summary = body.querySelector("#f-summary").value;
            saveData();
            render();
          });
        });
      });
      main.querySelectorAll(".btn-cancel-session").forEach((b) => {
        b.addEventListener("click", () => {
          const sid = b.getAttribute("data-session-id");
          const s = appData.sessions.find((x) => x.id === sid);
          if (!s) return;
          const body = el(`<div>
            <p class="kpi-sub" style="margin-bottom:.75rem"><strong>${fmtDateFr(s.date)}</strong> · ${s.startTime}–${s.endTime}</p>
            <div class="form-group"><label>Motif</label><select id="m-reason">${REASON_TYPES.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></div>
            <div class="form-group"><label>Commentaire</label><textarea id="m-com" rows="2"></textarea></div>
          </div>`);
          openModal("Annuler cette séance", body, () => {
            if (appData.cancellations.some((c) => c.sessionId === sid)) return;
            appData.cancellations.push({
              id: uid(),
              sessionId: s.id,
              classId: s.classId,
              date: s.date,
              startTime: s.startTime,
              reasonType: body.querySelector("#m-reason").value,
              comment: body.querySelector("#m-com").value,
            });
            saveData();
            render();
          });
        });
      });
      main.querySelectorAll(".btn-del-extra-session").forEach((b) => {
        b.addEventListener("click", (e) => {
          e.stopPropagation();
          const sid = b.getAttribute("data-session-id");
          const s = appData.sessions.find((x) => x.id === sid);
          if (!s) return;
          if (!confirm(`Supprimer le cours ajouté du ${fmtDateFr(s.date)} (${s.startTime}–${s.endTime}) ?`)) return;
          appData.sessions = appData.sessions.filter((x) => x.id !== sid);
          appData.cancellations = appData.cancellations.filter((c) => c.sessionId !== sid);
          saveData();
          render();
        });
      });
      main.querySelectorAll(".btn-remove-canc-row").forEach((b) => {
        b.addEventListener("click", () => {
          const cid = b.getAttribute("data-canc-id");
          appData.cancellations = appData.cancellations.filter((c) => c.id !== cid);
          saveData();
          render();
        });
      });
    }

    function navigateTo(view) {
      if (currentView !== view) {
        viewHistory.push(currentView);
        if (viewHistory.length > 50) viewHistory.shift();
        currentView = view;
      }
      render();
    }

    function goBack() {
      if (viewHistory.length) {
        currentView = viewHistory.pop();
        render();
      }
    }

    function render() {
      renderNav();
      const main = document.getElementById("main");
      let body = "";
      if (currentView === "dashboard") {
        body = viewDashboard();
      } else if (currentView === "tools") {
        body = viewTools();
      } else if (currentView.startsWith("class:")) {
        const cid = currentView.slice(6);
        if (getClassById(cid)) body = viewClassPage(cid);
        else {
          currentView = "dashboard";
          body = viewDashboard();
        }
      } else {
        currentView = "dashboard";
        body = viewDashboard();
      }
      main.innerHTML = body;
      bindSearch();
      wireEvents(main);
      if (currentView === "dashboard") fetchWeather();
      const se = document.getElementById("global-search");
      if (se && searchQuery) {
        se.focus();
        const L = se.value.length;
        se.setSelectionRange(L, L);
      }
    }

    const WMO_WEATHER = {
      0: "Ciel dégagé ☀️", 1: "Peu nuageux 🌤️", 2: "Partiellement nuageux ⛅", 3: "Couvert ☁️",
      45: "Brouillard 🌫️", 48: "Brouillard givrant 🌫️",
      51: "Bruine légère 🌦️", 53: "Bruine 🌦️", 55: "Bruine forte 🌧️",
      61: "Pluie légère 🌦️", 63: "Pluie 🌧️", 65: "Pluie forte 🌧️",
      71: "Neige légère 🌨️", 73: "Neige 🌨️", 75: "Neige forte 🌨️",
      77: "Grains de neige 🌨️", 80: "Averses légères 🌦️", 81: "Averses 🌧️", 82: "Averses fortes 🌧️",
      85: "Averses de neige 🌨️", 86: "Averses de neige fortes 🌨️",
      95: "Orage ⛈️", 96: "Orage grêle ⛈️", 99: "Orage forte grêle ⛈️"
    };

    function fetchWeather() {
      const kpi = document.getElementById("weather-kpi");
      if (!kpi) return;
      const dISO = dashboardDateISO();
      const todayISO = fmtISODate(new Date());
      const diffDays = Math.round((parseISODate(dISO) - parseISODate(todayISO)) / 86400000);
      if (diffDays === 0) {
        kpi.style.display = "";
        fetch("https://api.open-meteo.com/v1/forecast?latitude=48.79&longitude=2.62&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto")
          .then((r) => r.json())
          .then((data) => updateWeatherUI(data.current, null))
          .catch(() => updateWeatherUI(null, null));
      } else if (diffDays > 0 && diffDays <= 16) {
        kpi.style.display = "";
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=48.79&longitude=2.62&daily=temperature_2m_max,temperature_2m_min,weather_code&start_date=${dISO}&end_date=${dISO}&timezone=auto`)
          .then((r) => r.json())
          .then((data) => {
            if (data.daily && data.daily.time && data.daily.time.length) {
              updateWeatherUI(null, { code: data.daily.weather_code[0], tMax: data.daily.temperature_2m_max[0], tMin: data.daily.temperature_2m_min[0] });
            } else { updateWeatherUI(null, null); }
          })
          .catch(() => updateWeatherUI(null, null));
      } else {
        kpi.style.display = "none";
      }
    }

    function updateWeatherUI(current, daily) {
      const elTemp = document.getElementById("weather-temp");
      const elDesc = document.getElementById("weather-desc");
      if (!elTemp || !elDesc) return;
      if (!current && !daily) {
        elTemp.textContent = "—";
        elDesc.textContent = "Indisponible";
        return;
      }
      if (current) {
        const label = WMO_WEATHER[current.weather_code] || "Inconnu";
        elTemp.textContent = Math.round(current.temperature_2m) + "°C";
        elDesc.innerHTML = escapeHtml(label) + `<br><span style="font-size:.72rem">Vent ${Math.round(current.wind_speed_10m)} km/h</span>`;
      } else {
        const label = WMO_WEATHER[daily.code] || "Inconnu";
        elTemp.textContent = Math.round(daily.tMin) + "° / " + Math.round(daily.tMax) + "°";
        elDesc.innerHTML = escapeHtml(label) + `<br><span style="font-size:.72rem">Prévision</span>`;
      }
    }

    function init() {
      if (!loadData()) seedDemo();
      else {
        if (!appData.settings) appData.settings = { schoolYearStart: "2025-09-01", schoolYearEnd: "2026-07-05", zone: "C" };
        regenerateSessions();
      }

      document.getElementById("btn-theme").onclick = () => {
        const t = document.documentElement.getAttribute("data-theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "dark" : "light");
        lsSet("eps_theme", document.documentElement.getAttribute("data-theme") || "dark");
      };
      if (lsGet("eps_theme") === "light") document.documentElement.setAttribute("data-theme", "light");

      document.getElementById("btn-menu").onclick = () => document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("btn-print").onclick = () => window.print();

      render();
    }

    try {
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        const swCode = `self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("activate",e=>{e.waitUntil(clients.claim())});self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});`;
        const swBlob = new Blob([swCode], { type: "application/javascript" });
        const swURL = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swURL).catch(() => {});
      }
    } catch(e) {}

    function boot() {
      try {
        init();
      } catch (e) {
        var m = document.getElementById("main");
        if (m) m.innerHTML = "<div style='padding:2rem;color:red;font-size:1.2rem'><h2>Erreur au chargement</h2><pre>" + e.message + "\n" + e.stack + "</pre></div>";
      }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EPS Dashboard" />
  <meta name="theme-color" content="#09090b" />
  <meta name="color-scheme" content="dark light" />
  <title>EPS Collège — Tableau de bord pédagogique</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236c8cff' width='100' height='100' rx='20'/><text x='50' y='68' text-anchor='middle' font-size='48' fill='white' font-family='sans-serif' font-weight='bold'>EPS</text></svg>" />
  <style>
    /* ========== VARIABLES & RESET ========== */
    :root {
      --bg: #0f1117;
      --bg-elevated: #161922;
      --surface: rgba(30, 34, 45, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8eaef;
      --text-muted: #9aa3b2;
      --accent: #6c8cff;
      --accent-soft: rgba(108, 140, 255, 0.18);
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --sidebar-w: 260px;
      --fg: var(--text);
      --card: var(--bg-elevated);
      --hover: rgba(108, 140, 255, 0.08);
    }
    [data-theme="light"] {
      --bg: #f4f6fb;
      --bg-elevated: #ffffff;
      --surface: rgba(255, 255, 255, 0.78);
      --border: rgba(15, 23, 42, 0.08);
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.12);
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 10% -10%, rgba(108, 140, 255, 0.15), transparent),
        radial-gradient(900px 500px at 100% 0%, rgba(52, 211, 153, 0.1), transparent), var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background 0.35s ease, color 0.25s ease;
    }
    a { color: var(--accent); text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    ul { list-style: none; }
    .hidden { display: none !important; }
    /* ========== LAYOUT ========== */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      padding: 1.25rem 1rem;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.3s ease;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.35rem 0.5rem;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: #fff;
      box-shadow: var(--shadow);
    }
    .brand h1 { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand span { font-size: 0.72rem; color: var(--text-muted); }
    .nav-section { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); padding: 0.5rem 0.75rem; }
    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .nav-btn:hover { background: var(--accent-soft); color: var(--text); }
    .nav-btn.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
    .nav-btn svg { width: 18px; height: 18px; opacity: 0.85; }
    .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .theme-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 0.85rem; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg-elevated);
      font-size: 0.8rem;
    }
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 1.25rem 1.5rem calc(5.5rem + env(safe-area-inset-bottom, 0));
      max-width: 1400px;
    }
    .dash-date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      text-align: center;
    }
    .dash-date-label {
      font-size: clamp(1.1rem, 4.5vw, 1.65rem);
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .dash-date-nav { margin-bottom: 0.35rem; }
    .dash-weather {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0 0 1rem;
      padding: 0 0.5rem;
      text-align: center;
    }
    .dash-weather-line {
      display: block;
      max-width: 100%;
      font-size: 0.88rem;
      line-height: 1.35;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dash-weather-line .weather-temp {
      color: #38bdf8;
      font-weight: 700;
    }
    [data-theme="light"] .dash-weather-line .weather-temp { color: #0284c7; }
    .dash-page-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.35rem;
      margin: -0.35rem 0 0.15rem;
      min-height: 2rem;
    }
    .btn-regen-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      line-height: 1;
      color: var(--text-muted);
      border: 1px solid var(--border);
      background: transparent;
      transition: color 0.2s, background 0.2s, transform 0.15s;
    }
    .btn-regen-icon:hover {
      color: var(--accent);
      background: var(--accent-soft);
      transform: rotate(-24deg);
    }
    .btn-regen-icon:active { transform: rotate(-24deg) scale(0.94); }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      background: var(--bg-elevated);
      backdrop-filter: blur(22px) saturate(1.2);
      -webkit-backdrop-filter: blur(22px) saturate(1.2);
      border-top: 2px solid var(--border);
      padding: 0.5rem 0.35rem calc(0.55rem + env(safe-area-inset-bottom, 0));
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.35), 0 -1px 0 rgba(108, 140, 255, 0.15);
    }
    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.5rem 0.35rem;
      min-height: 58px;
      max-width: 160px;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: color 0.2s, background 0.2s, transform 0.12s;
      border-radius: 12px;
      margin: 0 0.2rem;
    }
    .bottom-nav-item:hover { color: var(--text); background: var(--accent-soft); }
    .bottom-nav-item.active {
      color: var(--accent);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(108, 140, 255, 0.35);
    }
    .bottom-nav-icon { font-size: 1.45rem; line-height: 1; }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 1.25rem;
    }
    .topbar h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em; }
    .search-wrap {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.45rem 0.85rem; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      backdrop-filter: blur(12px); min-width: 220px;
    }
    .search-wrap input { border: none; background: transparent; flex: 1; outline: none; font-size: 0.85rem; }

    /* ========== CARDS & KPI ========== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .kpi-grid--dash {
      grid-template-columns: 1fr 1fr;
      grid-auto-flow: row;
      align-items: stretch;
      gap: 0.65rem;
    }
    @media (max-width: 480px) and (orientation: portrait) {
      .kpi-grid--dash {
        gap: 0.5rem;
      }
      .kpi-grid--dash .kpi {
        padding: 0.5rem 0.4rem;
      }
      .kpi-grid--dash .kpi-label {
        font-size: 0.58rem;
      }
    }
    .kpi-grid--dash .kpi {
      padding: 0.6rem 0.5rem;
      min-width: 0;
    }
    .kpi-grid--dash .kpi-label {
      font-size: 0.62rem;
      line-height: 1.25;
      hyphens: auto;
    }
    .kpi-grid--dash .kpi-value {
      font-size: 1.25rem;
      margin-top: 0.15rem;
    }
    .kpi-grid--dash .kpi-sub {
      font-size: 0.68rem;
      margin-top: 0.25rem;
      max-height: 5rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .kpi-grid--dash .kpi-prog-action {
      font-size: 0.82rem;
      margin-top: 0.15rem;
    }
    .kpi-grid--dash .kpi--warning .kpi-label {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      text-align: center;
    }
    .dash-priority {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 0.5rem;
    }
    .dash-block {
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.75rem 0.85rem;
      box-shadow: var(--shadow);
    }
    .dash-block__title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
      margin: 0 0 0.55rem;
    }
    .dash-block--courses { border-left: 4px solid #14b8a6; }
    .dash-block--schedule { border-left: 4px solid #818cf8; }
    .dash-block--courses .dash-session-row { margin-top: 0; }
    .dash-secondary { margin-top: 0.25rem; display: flex; flex-direction: column; gap: 0.65rem; }
    .dash-block--todo { border-left: 4px solid var(--accent); }
    .dash-block--sequences { border-left: 4px solid #14b8a6; }
    .dash-block--sequences .dashboard-classes { margin-top: 0; }
    .dash-weather--compact { margin: 0 0 0.5rem; }
    .dash-weather--compact .dash-weather-line { font-size: 0.78rem; }
    @media (max-width: 480px) and (orientation: portrait) {
      .main { padding: 0.75rem 0.65rem calc(5.75rem + env(safe-area-inset-bottom, 0)); }
      .dash-date-label { font-size: 1.05rem; }
      .kpi-grid--dash { margin-bottom: 0; }
      .kpi-grid--dash .kpi-sub { max-height: 3.25rem; }
      .dash-block { padding: 0.65rem 0.75rem; }
      /* Séquences en cours — iPhone portrait */
      .dash-block--sequences { padding: 0.65rem 0.75rem; }
      .dashboard-classes {
        grid-template-columns: 1fr;
        gap: 0.55rem;
        margin-top: 0;
      }
      .dash-class-card {
        padding: 0.75rem 0.8rem;
        border-left-width: 4px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      .dash-class-card:hover { transform: none; }
      .dash-class-card:active {
        transform: scale(0.985);
        opacity: 0.92;
      }
      .dash-class-card h3 {
        font-size: 1rem;
        margin-bottom: 0.25rem;
      }
      .dash-days {
        font-size: 0.78rem;
        margin: 0.35rem 0 0.5rem;
        line-height: 1.35;
      }
      .dash-days strong { font-weight: 600; }
      .dash-activity-block {
        padding: 0.55rem 0;
        margin-top: 0.15rem;
        border-top-color: rgba(255, 255, 255, 0.06);
      }
      [data-theme="light"] .dash-activity-block {
        border-top-color: rgba(15, 23, 42, 0.08);
      }
      .dash-activity-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
        margin-bottom: 0.35rem;
      }
      .dash-activity-name { font-size: 0.84rem; }
      .dash-activity-days { font-size: 0.68rem; }
      .dash-activity-last {
        margin-left: 0;
        font-size: 0.68rem;
        width: 100%;
        line-height: 1.3;
      }
      .dash-class-metrics {
        gap: 0.35rem;
        margin-top: 0.25rem;
      }
      .dash-class-metrics .num { font-size: 1.05rem; }
      .dash-class-metrics .lbl-long { display: none; }
      .dash-class-metrics .lbl-short { display: block; }
      .dash-class-metrics .lbl {
        font-size: 0.58rem;
        letter-spacing: 0.04em;
      }
      .progress--activity { margin-top: 0.35rem !important; height: 5px; }
      .dash-activity-foot {
        font-size: 0.65rem;
        margin-top: 0.25rem;
      }
      .dash-activity-foot .dash-activity-canc:empty { display: none; }
    }
    .kpi {
      padding: 1rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      animation: kpiIn 0.45s ease backwards;
    }
    @keyframes kpiIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .kpi-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .kpi-value { font-size: 1.55rem; font-weight: 800; margin-top: 0.25rem; letter-spacing: -0.03em; }
    .kpi-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }

    .card {
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      padding: 1.1rem 1.2rem;
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      margin-bottom: 0.85rem;
    }
    .card-header h3 { font-size: 1rem; font-weight: 700; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.25rem;
      font-size: 0.68rem; font-weight: 600; padding: 0.2rem 0.55rem;
      border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    }
    .badge.warn { background: rgba(251, 191, 36, 0.15); color: var(--warning); }
    .badge.danger { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
    .badge.ok { background: rgba(52, 211, 153, 0.15); color: var(--success); }

    /* ========== BUTTONS ========== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.5rem 1rem; border-radius: 10px; font-weight: 600; font-size: 0.82rem;
      border: 1px solid var(--border); background: var(--bg-elevated);
      transition: transform 0.12s, box-shadow 0.2s, background 0.2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #818cf8); color: #fff; border-color: transparent; }
    .btn-ghost { background: transparent; }
    .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.75rem; }
    .btn-danger { background: rgba(248, 113, 113, 0.15); color: var(--danger); border-color: rgba(248, 113, 113, 0.35); }

    .activity-card-head { margin-bottom: 0.35rem; }
    .activity-card-head h3 { margin: 0; }
    .activity-participation-wrap {
      display: flex; justify-content: center; align-items: center;
      width: 100%; margin: 0.55rem 0 0.7rem;
    }
    .btn-participation {
      width: 100%;
      padding: 0.7rem 1rem;
      text-align: center;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #2dd4bf 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.35;
      box-shadow: 0 3px 12px rgba(13, 148, 136, 0.4);
      cursor: pointer;
    }
    .btn-participation:hover {
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 50%, #14b8a6 100%);
      box-shadow: 0 5px 16px rgba(13, 148, 136, 0.5);
      transform: translateY(-1px);
    }
    .btn-participation:active { transform: translateY(0); }
    .btn-participation-icon {
      font-size: 1.15rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-participation-label { flex: 0 1 auto; text-align: center; }
    .participation-detail {
      margin-top: 0.35rem;
      font-size: 0.72rem;
      line-height: 1.45;
      color: var(--text-muted);
      font-weight: 500;
    }
    .participation-detail .part-dispensed { color: #f472b6; }
    .participation-detail .part-absent { color: var(--danger); }
    .session-exempt-notice {
      margin: 0 0 0.85rem;
      padding: 0.15rem 0 0.15rem 0.6rem;
      border-left: 3px solid rgba(244, 114, 182, 0.55);
    }
    .session-exempt-notice__title {
      margin: 0 0 0.35rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f472b6;
    }
    .session-exempt-notice__item {
      margin: 0;
      padding: 0.12rem 0;
      font-size: 0.86rem;
      line-height: 1.4;
      color: var(--text);
    }
    .session-exempt-notice__item strong {
      font-weight: 600;
      color: #f9a8d4;
    }
    .session-exempt-notice__item span {
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    [data-theme="light"] .session-exempt-notice__item strong { color: #db2777; }
    [data-theme="light"] .session-exempt-notice__title { color: #db2777; }

    /* ========== TABLES ========== */
    .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { padding: 0.65rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); background: var(--bg-elevated); }
    tr:hover td { background: rgba(108, 140, 255, 0.04); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.35rem; vertical-align: middle; }

    /* ========== CLASS CARDS GRID ========== */
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .class-card {
      border-radius: var(--radius);
      padding: 1rem;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .class-card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--cc, var(--accent));
    }
    .class-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .class-card h4 { font-size: 1.05rem; margin-bottom: 0.35rem; }
    .class-card .meta { font-size: 0.78rem; color: var(--text-muted); }

    /* ========== PROGRESS ========== */
    .progress {
      height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; margin-top: 0.5rem;
    }
    .progress > span {
      display: block; height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), #34d399);
      transition: width 0.5s ease;
    }

    /* ========== TIMELINE ========== */
    .timeline { position: relative; padding-left: 1.25rem; }
    .timeline::before {
      content: ""; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px;
      background: var(--border); border-radius: 2px;
    }
    .tl-item { position: relative; padding-bottom: 1rem; }
    .tl-item::before {
      content: ""; position: absolute; left: -1.25rem; top: 4px; width: 12px; height: 12px;
      border-radius: 50%; background: var(--tl, var(--accent)); border: 2px solid var(--bg-elevated);
    }

    /* ========== CALENDAR ========== */
    .cal-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      font-size: 0.72rem;
    }
    .cal-dow { text-align: center; color: var(--text-muted); padding: 0.35rem; font-weight: 600; }

      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">EPS</div>

      <nav id="main-nav"></nav>
      <div class="sidebar-footer">
        <div class="theme-toggle">
          <span>Thème</span>

        </div>

  </div>

  <script>
    window.onerror = function(msg, src, line, col, err) {
      var m = document.getElementById("main");
      if (m) m.innerHTML = "<div style='padding:2rem;color:red;font-size:1rem;word-break:break-all'><h2>Erreur JS</h2><p><b>" + msg + "</b></p><p>Ligne " + line + ", col " + col + "</p><pre style='white-space:pre-wrap'>" + (err && err.stack ? err.stack : "") + "</pre></div>";
    };
  </script>
  <script>
    /**
     * =============================================================================
     * EPS COLLÈGE — APPLICATION MONOLITHIQUE (HTML + CSS + JS, sans dépendance)
     * =============================================================================
     *
     * ARCHITECTURE (extensible) :
     * 1) DONNÉES — `appData` : classes, créneaux (schedules), APSA (activities),
     *    événements calendaires (holidays), annulations, séances générées (sessions).
     * 2) PERSISTANCE — localStorage (auto), export/import JSON, reset.
     * 3) MOTEUR — `regenerateSessions()` : parcourt l'année, applique chaque créneau (jour, alternance
     *    semaine A/B depuis la rentrée), exclut jours bloquants, rattache l'APSA par chevauchement de dates
     *    et par jours de pratique cochés sur l'APSA. `computeSessionStatus()` : annulation > férié > passé/futur.
     * 4) PRÉSENTATION — `render()` : vue « Tableau de bord », puis une vue par classe
     *    (`class:<id>` avec liste des séances et annulations), puis « Réglages & données »
     *    (sous-panneaux EDT / APSA / etc.). `wireEvents()` attache les interactions.
     *
     * Pour ajouter un module : étendre `appData`, créer les fonctions CRUD + une
     * fonction `viewMonModule()` puis une entrée dans `VIEWS` et le `switch` de render.
     * =============================================================================
     */

    /** @typedef {'dashboard'|'tools'|string} ViewId — les vues classe sont `class:<uuid>`. */

    const STORAGE_KEY = "eps_college_dashboard_v1";

    /**
     * Stockage compatible fichier local / AirDrop (iOS Safari) : `localStorage` peut être
     * indisponible ou lever SecurityError sur `file://`. On teste une fois puis repli mémoire.
     */
    const LS_MEMORY = {};
    let lsUsable = null;
    /** true si les données ne survivent pas au rechargement (mode fichier sans localStorage). */
    let appStorageIsMemory = false;
    function lsWorks() {
      if (lsUsable !== null) return lsUsable;
      try {
        if (typeof localStorage === "undefined" || !localStorage) {
          lsUsable = false;
          appStorageIsMemory = true;
          return false;
        }
        var t = "__eps_ls_probe__";
        localStorage.setItem(t, "1");
        localStorage.removeItem(t);
        lsUsable = true;
        appStorageIsMemory = false;
        return true;
      } catch (e) {
        lsUsable = false;
        appStorageIsMemory = true;
        return false;
      }
    }
    function lsGet(key) {
      if (lsWorks()) {
        try {
          return localStorage.getItem(key);
        } catch (e) {}
      }
      return Object.prototype.hasOwnProperty.call(LS_MEMORY, key) ? LS_MEMORY[key] : null;
    }
    function lsSet(key, val) {
      if (lsWorks()) {
        try {
          localStorage.setItem(key, val);
          return;
        } catch (e) {}
      }
      LS_MEMORY[key] = val;
    }
    function lsRemove(key) {
      if (lsWorks()) {
        try {
          localStorage.removeItem(key);
        } catch (e) {}
      }
      delete LS_MEMORY[key];
    }

    /**
     * État global de l'application (source de vérité en mémoire).
     * sessions : générées automatiquement à partir des créneaux, vacances, fériés, APSA.
     */
    const appData = {
      settings: {
        schoolYearStart: "2025-09-01",
        schoolYearEnd: "2026-07-05",
        zone: "C",
      },
      classes: [],
      schedules: [],
      activities: [],
      holidays: [],
      cancellations: [],
      sessions: [],
      exemptions: [],
      periods: [],
      venues: [],
      forgottenGear: [],
      todoList: [],
    };

    let currentView = "dashboard";
    const viewHistory = [];
    let calendarMode = "month";
    let calendarCursor = new Date();

    /* -------------------------------------------------------------------------- */
    /* UTILITAIRES                                                                */
    /* -------------------------------------------------------------------------- */

    function uid() {
      try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e) {}
      return "id-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    }

    function parseISODate(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function fmtISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function addDays(d, n) {
      const x = new Date(d);
      x.setDate(x.getDate() + n);
      return x;
    }

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function dayIndexMon0(d) {
      const i = d.getDay();
      return i === 0 ? 6 : i - 1;
    }

    /** Numéro de semaine (lundi → lundi) depuis le début d'année scolaire — pour alternance A/B. */
    function schoolWeekIndex(date) {
      const start = parseISODate(appData.settings.schoolYearStart);
      const monStart = addDays(start, -dayIndexMon0(start));
      const monD = addDays(new Date(date.getFullYear(), date.getMonth(), date.getDate()), -dayIndexMon0(date));
      const diff = Math.round((monD - monStart) / (7 * 86400000));
      return diff >= 0 ? diff : 0;
    }

    /** Créneau « semaine A » (pairs) ou « semaine B » (impairs) depuis la rentrée. */
    function matchesWeekParity(slot, date) {
      const p = slot.weekParity || "all";
      if (p === "all") return true;
      const idx = schoolWeekIndex(date);
      if (p === "A") return idx % 2 === 0;
      if (p === "B") return idx % 2 === 1;
      return true;
    }

    function weekParityLabel(slot) {
      const p = slot.weekParity || "all";
      if (p === "A") return "Semaine A";
      if (p === "B") return "Semaine B";
      return "Toutes";
    }

    function isDateInRange(date, startStr, endStr) {
      const t = fmtISODate(date);
      return t >= startStr && t <= endStr;
    }

    function todayStart() {
      const n = new Date();
      n.setHours(0, 0, 0, 0);
      return n;
    }

    /* -------------------------------------------------------------------------- */
    /* PERSISTANCE localStorage + import/export                                   */
    /* -------------------------------------------------------------------------- */

    function saveData() {
      try {
        lsSet(STORAGE_KEY, JSON.stringify(appData));
      } catch (e) {
        console.error(e);
        alert("Sauvegarde impossible (quota navigateur ?).");
      }
    }

    function loadData() {
      try {
        const raw = lsGet(STORAGE_KEY);
        if (!raw) return false;
        const o = JSON.parse(raw);
        Object.assign(appData, o);
        return true;
      } catch {
        return false;
      }
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `eps-backup-${fmtISODate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importJSONFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const o = JSON.parse(reader.result);
          Object.keys(appData).forEach((k) => {
            if (o[k] !== undefined) appData[k] = o[k];
          });
          regenerateSessions();
          saveData();
          render();
          alert("Import réussi.");
        } catch {
          alert("Fichier JSON invalide.");
        }
      };
      reader.readAsText(file);
    }

    function resetAll() {
      if (!confirm("Effacer toutes les données locales ? Cette action est irréversible.")) return;
      lsRemove(STORAGE_KEY);
      location.reload();
    }

    /* -------------------------------------------------------------------------- */
    /* MODÈLE : accesseurs                                                         */
    /* -------------------------------------------------------------------------- */

    function getClassById(id) {
      return appData.classes.find((c) => c.id === id);
    }

    function schedulesForClass(classId) {
      return appData.schedules.filter((s) => s.classId === classId);
    }

    function activitiesForClass(classId) {
      return appData.activities
        .filter((a) => a.classId === classId)
        .slice()
        .sort((a, b) => a.startDate.localeCompare(b.startDate));
    }

    function sessionsForClass(classId) {
      return appData.sessions.filter((s) => s.classId === classId);
    }

    /** APSA dont la période contient la date `dateStr` (ISO). */
    function activitiesOnDatePeriod(classId, dateStr) {
      return activitiesForClass(classId).filter((a) => dateStr >= a.startDate && dateStr <= a.endDate);
    }

    function activityIdsOnPeriodToday(classId) {
      const t = fmtISODate(new Date());
      return new Set(activitiesOnDatePeriod(classId, t).map((a) => a.id));
    }

    function sessionStatsForSessions(list) {
      let done = 0, cancelled = 0, remaining = 0;
      list.forEach((s) => {
        const st = computeSessionStatus(s);
        if (st.code === "cancelled") cancelled++;
        else if (st.code === "holiday") {
        } else if (st.code === "done") done++;
        else if (st.code === "today" || st.code === "planned") remaining++;
      });
      const total = list.length;
      const denom = Math.max(1, total - cancelled);
      const pct = Math.min(100, Math.round((done / denom) * 100));
      return { total, done, cancelled, remaining, realized: done, pct };
    }

    function sessionStatsForClass(classId) {
      return sessionStatsForSessions(sessionsForClass(classId));
    }

    /** Stats séances rattachées aux APSA « en cours » aujourd'hui (période calendaire). */
    function sessionStatsForCurrentPeriod(classId) {
      const ids = activityIdsOnPeriodToday(classId);
      if (!ids.size) return { total: 0, done: 0, cancelled: 0, remaining: 0, pct: 0, realized: 0 };
      const list = sessionsForClass(classId).filter((s) => s.activityId && ids.has(s.activityId));
      return sessionStatsForSessions(list);
    }

    /** Jours affichés au tableau de bord : jours cochés sur les APSA en cours, sinon créneaux EDT. */
    function weekdaysForDashboardClass(classId, refDateISO) {
      const acts = activitiesOnDatePeriod(classId, refDateISO || fmtISODate(new Date()));
      const daySet = new Set();
      acts.forEach((a) => {
        if (Array.isArray(a.dayIndices) && a.dayIndices.length) a.dayIndices.forEach((d) => daySet.add(d));
      });
      if (daySet.size) return [...daySet].sort((a, b) => a - b).map((i) => DOW[i]).join(" · ");
      return weekdaysForClass(classId);
    }

    function formatDayIndicesLabel(act) {
      if (!act.dayIndices || !act.dayIndices.length) return "Tous les jours de créneau (période)";
      return act.dayIndices
        .slice()
        .sort((a, b) => a - b)
        .map((i) => DOW[i])
        .join(", ");
    }

    /**
     * Détermine si une date tombe dans un événement « bloquant » (vacances, férié, etc.).
     */
    function isBlockedByHoliday(dateStr) {
      return appData.holidays.some((h) => dateStr >= h.startDate && dateStr <= h.endDate && h.blocksSessions);
    }

    function getHolidayOnDate(dateStr) {
      return appData.holidays.find((h) => dateStr >= h.startDate && dateStr <= h.endDate);
    }

    /**
     * APSA pour une séance : période [début, fin] + jours cochés (sinon tous les jours de la période).
     * En cas de chevauchement, priorité aux APSA avec jour explicite correspondant au créneau.
     */
    function pickActivityForSession(classId, dateStr, dayIndex) {
      const inRange = activitiesForClass(classId).filter((a) => dateStr >= a.startDate && dateStr <= a.endDate);
      if (!inRange.length) return null;
      const withDay = inRange.filter((a) => Array.isArray(a.dayIndices) && a.dayIndices.length && a.dayIndices.includes(dayIndex));
      const pool = withDay.length ? withDay : inRange.filter((a) => !a.dayIndices || !a.dayIndices.length);
      if (!pool.length) return null;
      pool.sort((a, b) => a.startDate.localeCompare(b.startDate));
      return pool[0];
    }

    function pickActivityForDate(classId, dateStr) {
      const d = parseISODate(dateStr);
      return pickActivityForSession(classId, dateStr, dayIndexMon0(d));
    }

    function cancellationForSession(session) {
      return appData.cancellations.find(
        (c) => c.sessionId === session.id || (c.classId === session.classId && c.date === session.date && c.startTime === session.startTime)
      );
    }

    /**
     * Statut final d'une séance : annulée > vacances/férié > effectuée / prévue.
     */
    function computeSessionStatus(session) {
      const canc = cancellationForSession(session);
      if (canc) return { code: "cancelled", label: "Annulée", reason: canc.reasonType };
      const hol = getHolidayOnDate(session.date);
      if (hol && hol.blocksSessions)
        return { code: "holiday", label: hol.type === "ferie" ? "Jour férié" : "Vacances / événement", reason: hol.name };
      const d = parseISODate(session.date);
      const now = todayStart();
      if (d < now) return { code: "done", label: "Effectuée", reason: "" };
      if (isSameDay(d, now)) return { code: "today", label: "Aujourd'hui", reason: "" };
      return { code: "planned", label: "Prévue", reason: "" };
    }

    /** Dernière séance avec la même APSA (`activityId`) et la même classe, strictement avant `session`. */
    function previousSameApsaSessionBefore(session) {
      if (!session.activityId) return null;
      const curKey = session.date + String(session.startTime || "");
      const candidates = appData.sessions
        .filter(
          (x) =>
            x.classId === session.classId &&
            x.activityId === session.activityId &&
            x.id !== session.id
        )
        .filter((x) => {
          const st = computeSessionStatus(x);
          return st.code !== "cancelled" && st.code !== "holiday";
        })
        .sort((a, b) => (a.date + String(a.startTime || "")).localeCompare(b.date + String(b.startTime || "")));
      for (let i = candidates.length - 1; i >= 0; i--) {
        const k = candidates[i].date + String(candidates[i].startTime || "");
        if (k.localeCompare(curKey) < 0) return candidates[i];
      }
      return null;
    }

    /** Première séance suivante (même classe, même APSA), après `sessionRef`, hors annulé / vacances-férié. */
    function nextSameApsaSessionAfter(sessionRef) {
      if (!sessionRef.activityId) return null;
      const refKey = sessionRef.date + String(sessionRef.startTime || "");
      const candidates = appData.sessions
        .filter(
          (x) =>
            x.classId === sessionRef.classId &&
            x.activityId === sessionRef.activityId &&
            x.id !== sessionRef.id
        )
        .filter((x) => {
          const st = computeSessionStatus(x);
          return st.code !== "cancelled" && st.code !== "holiday";
        })
        .sort((a, b) => (a.date + String(a.startTime || "")).localeCompare(b.date + String(b.startTime || "")));
      for (let i = 0; i < candidates.length; i++) {
        const k = candidates[i].date + String(candidates[i].startTime || "");
        if (k.localeCompare(refKey) > 0) return candidates[i];
      }
      return null;
    }

    /** Prénoms / noms marqués « absent » sur l’appel d’une séance. */
    function absentStudentNamesFromSessionAttendance(sess) {
      if (!sess || !sess.attendance) return [];
      const att = sess.attendance;
      return Object.keys(att).filter((name) => att[name] === "absent");
    }

    /** Liste discrète des dispensés actifs pour une séance (sans encadré blanc). */
    function injectSessionExemptionsInfo(container, classId, dateStr, sessionId) {
      if (!container) return;
      const activeEx = exemptionsForSession(classId, dateStr, sessionId);
      if (!activeEx.length) {
        container.innerHTML = "";
        return;
      }
      activeEx.sort((a, b) => a.studentName.localeCompare(b.studentName, "fr"));
      container.innerHTML = `<div class="session-exempt-notice" role="note">
        <p class="session-exempt-notice__title">🏥 Élèves dispensés · ${activeEx.length}</p>
        ${activeEx.map((e) => `<p class="session-exempt-notice__item"><strong>${escapeHtml(e.studentName)}</strong> <span>${escapeHtml(formatExemptionDetailLabel(e))}</span></p>`).join("")}
      </div>`;
    }

    /** Texte discret (jaune, sans encadré) : absents du dernier cours de la même APSA. */
    function injectPreviousAbsentReminder(container, session) {
      if (!container) return;
      if (!session.activityId) {
        container.innerHTML = "";
        return;
      }
      const prevSess = previousSameApsaSessionBefore(session);
      const absentPrev = absentStudentNamesFromSessionAttendance(prevSess);
      if (!absentPrev.length || !prevSess) {
        container.innerHTML = "";
        return;
      }
      const immediateNext = nextSameApsaSessionAfter(prevSess);
      if (!immediateNext || immediateNext.id !== session.id) {
        container.innerHTML = "";
        return;
      }
      container.innerHTML = absentPrev
        .map(
          (name) =>
            `<p style="margin:.15rem 0;font-size:.8rem;color:#ca8a04;font-weight:500;line-height:1.4;opacity:.95">${escapeHtml(name)} était absent lors du cours précédent.</p>`
        )
        .join("");
    }

    function migrateDataModel() {
      appData.schedules.forEach((s) => {
        if (s.weekParity !== "A" && s.weekParity !== "B" && s.weekParity !== "all") s.weekParity = "all";
      });
      appData.activities.forEach((a) => {
        if (!Array.isArray(a.dayIndices)) a.dayIndices = [];
      });
      if (!Array.isArray(appData.exemptions)) appData.exemptions = [];
      appData.exemptions.forEach((ex) => {
        if (ex.sansCertificat === undefined) ex.sansCertificat = false;
        if (ex.sessionId === undefined) ex.sessionId = null;
      });
      if (!Array.isArray(appData.periods)) appData.periods = [];
      if (!Array.isArray(appData.venues)) appData.venues = [];
      if (appData.progEtabPdf === undefined) appData.progEtabPdf = null;
      if (!Array.isArray(appData.forgottenGear)) appData.forgottenGear = [];
      appData.classes.forEach((cl) => { if (!Array.isArray(cl.students)) cl.students = []; });
      appData.sessions.forEach((s) => { if (!s.attendance) s.attendance = {}; });
      if (!Array.isArray(appData.todoList)) appData.todoList = [];
      if (!appData.settings.academy) appData.settings.academy = "";
    }

    function exemptionsForClass(classId) {
      return appData.exemptions.filter((e) => e.classId === classId);
    }

    function exemptionAppliesToSession(ex, session) {
      if (!ex || !session || ex.classId !== session.classId) return false;
      if (ex.sansCertificat && ex.sessionId) return ex.sessionId === session.id;
      if (ex.sansCertificat) return session.date === ex.startDate;
      return session.date >= ex.startDate && session.date <= ex.endDate;
    }

    function exemptionAppliesOnDate(ex, classId, dateStr, sessionId) {
      if (!ex || ex.classId !== classId) return false;
      if (ex.sansCertificat && ex.sessionId) return sessionId ? ex.sessionId === sessionId : false;
      if (ex.sansCertificat) return dateStr === ex.startDate;
      return dateStr >= ex.startDate && dateStr <= ex.endDate;
    }

    function exemptionsForSession(classId, dateStr, sessionId) {
      return (appData.exemptions || []).filter((e) => exemptionAppliesOnDate(e, classId, dateStr, sessionId));
    }

    function formatExemptionDetailLabel(ex) {
      if (ex.sansCertificat && ex.sessionId) {
        const sess = appData.sessions.find((s) => s.id === ex.sessionId);
        return "sans certificat · cours du " + fmtDateFr(sess ? sess.date : ex.startDate);
      }
      if (ex.sansCertificat) return "sans certificat · " + fmtDateFr(ex.startDate);
      return "jusqu'au " + fmtDateFr(ex.endDate);
    }

    function formatExemptionDurationCell(ex) {
      if (ex.sansCertificat && ex.sessionId) return "Sans certificat · ce cours";
      if (ex.sansCertificat) return "Sans certificat · 1 jour";
      return ex.days + " jour(s)";
    }

    function attachExemptionSansCertificatToggle(body, opts) {
      const cb = body.querySelector(opts.checkboxSelector);
      const blocks = body.querySelector(opts.durationBlocksSelector);
      const certWrap = opts.certDateWrapSelector ? body.querySelector(opts.certDateWrapSelector) : null;
      const certInput = opts.certDateInputSelector ? body.querySelector(opts.certDateInputSelector) : null;
      if (!cb) return;
      if (opts.defaultChecked) cb.checked = true;
      const sync = () => {
        const on = cb.checked;
        if (blocks) blocks.style.display = on ? "none" : "";
        if (certWrap) certWrap.style.display = on && opts.hideCertWhenSansCert ? "none" : "";
        if (certInput && opts.sessionDate && on) certInput.value = opts.sessionDate;
      };
      cb.addEventListener("change", sync);
      sync();
    }

    /** Dispense active pour un élève à la date de la séance. */
    function isStudentDispensedOnSession(classId, studentName, dateStr, sessionId) {
      return (appData.exemptions || []).some(
        (ex) => ex.studentName === studentName && exemptionAppliesOnDate(ex, classId, dateStr, sessionId)
      );
    }

    /** Séances effectuées d'une APSA (hors annulées, vacances, fériés). */
    function sessionsHeldForActivity(classId, activityId) {
      return sessionsForClass(classId)
        .filter((s) => s.activityId === activityId)
        .filter((s) => computeSessionStatus(s).code === "done");
    }

    /** Participation : pas absent à l'appel et pas dispensé ce jour-là. */
    function studentParticipatedOnSession(session, studentName) {
      if (isStudentDispensedOnSession(session.classId, studentName, session.date, session.id)) return false;
      const att = session.attendance || {};
      if (att[studentName] === "absent") return false;
      return true;
    }

    function formatParticipationGaps(row) {
      if (row.participated >= row.total) return "";
      const fmtDatesLe = (dates) => dates.map((d) => fmtDateFr(d)).join(", le ");
      const parts = [];
      if (row.dispensedDates.length) {
        parts.push(`<span class="part-dispensed">Dispensé le ${escapeHtml(fmtDatesLe(row.dispensedDates))}</span>`);
      }
      if (row.absentDates.length) {
        parts.push(`<span class="part-absent">Absent le ${escapeHtml(fmtDatesLe(row.absentDates))}</span>`);
      }
      return parts.join("<br>");
    }

    /** Stats de participation par élève pour une APSA. */
    function activityParticipationStats(classId, activityId) {
      const cl = getClassById(classId);
      const students = cl && Array.isArray(cl.students) ? [...cl.students].sort((a, b) => a.localeCompare(b, "fr")) : [];
      const held = sessionsHeldForActivity(classId, activityId);
      const total = held.length;
      const rows = students.map((name) => {
        let participated = 0;
        const dispensedDates = [];
        const absentDates = [];
        held.forEach((s) => {
          if (studentParticipatedOnSession(s, name)) {
            participated++;
          } else if (isStudentDispensedOnSession(classId, name, s.date, s.id)) {
            dispensedDates.push(s.date);
          } else if ((s.attendance || {})[name] === "absent") {
            absentDates.push(s.date);
          }
        });
        dispensedDates.sort();
        absentDates.sort();
        return { name, participated, total, dispensedDates, absentDates };
      });
      return { rows, totalSessions: total, activity: activityById(activityId) };
    }

    function openActivityParticipationModal(classId, activityId) {
      const cl = getClassById(classId);
      const act = activityById(activityId);
      if (!cl || !act) return;
      const stats = activityParticipationStats(classId, activityId);
      let bodyHtml;
      if (!stats.rows.length) {
        bodyHtml = `<p class="kpi-sub">Aucun élève dans la liste de la classe. Ajoutez-les via Réglages → Mes classes → ⚙️ sur la carte de la classe.</p>`;
      } else if (!stats.totalSessions) {
        bodyHtml = `<p class="kpi-sub">Aucune séance effectuée pour cette activité pour le moment (seules les séances passées, non annulées, sont comptées).</p>`;
      } else {
        const tableRows = stats.rows
          .map((r) => {
            const pct = stats.totalSessions ? Math.round((r.participated / stats.totalSessions) * 100) : 0;
            const gaps = formatParticipationGaps(r);
            return `<tr>
              <td><strong>${escapeHtml(r.name)}</strong>${gaps ? `<div class="participation-detail">${gaps}</div>` : ""}</td>
              <td style="text-align:center;font-weight:600">${r.participated} / ${stats.totalSessions}</td>
              <td style="text-align:center;color:var(--text-muted);font-size:.85rem">${pct}%</td>
            </tr>`;
          })
          .join("");
        bodyHtml = `<p class="kpi-sub" style="margin-bottom:.75rem">${stats.totalSessions} séance(s) effectuée(s) pour <strong>${escapeHtml(act.name)}</strong>. Comptées : présence ou retard à l'appel ; exclus : absent et dispensé (dates précisées sous le nom de l'élève).</p>
          <div class="table-wrap"><table><thead><tr><th>Élève</th><th style="text-align:center">Participation</th><th style="text-align:center">Taux</th></tr></thead><tbody>${tableRows}</tbody></table></div>`;
      }
      const body = el(`<div>${bodyHtml}</div>`);
      openModal("Participation des élèves — " + escapeHtml(act.name), body, () => {});
    }

    function isExemptionActive(ex) {
      const today = fmtISODate(new Date());
      if (ex.sansCertificat && ex.sessionId) {
        const sess = appData.sessions.find((s) => s.id === ex.sessionId);
        return sess ? today === sess.date : false;
      }
      if (ex.sansCertificat) return today === ex.startDate;
      return today >= ex.startDate && today <= ex.endDate;
    }

    function exemptionRemainingLabel(ex) {
      if (!isExemptionActive(ex)) return "—";
      if (ex.sansCertificat && ex.sessionId) return '<span style="color:var(--text-muted);font-size:.85rem">Ce cours</span>';
      if (ex.sansCertificat) return '<strong style="color:var(--danger)">1 jour</strong>';
      const remaining = Math.max(0, Math.round((parseISODate(ex.endDate).getTime() - todayStart().getTime()) / 86400000) + 1);
      return `<strong style="color:var(--danger)">${remaining} jour(s)</strong>`;
    }

    /* -------------------------------------------------------------------------- */
    /* GÉNÉRATION AUTOMATIQUE DES SÉANCES                                         */
    /* -------------------------------------------------------------------------- */

    function regenerateSessions() {
      migrateDataModel();
      const start = parseISODate(appData.settings.schoolYearStart);
      const end = parseISODate(appData.settings.schoolYearEnd);
      const oldCanc = appData.cancellations.slice();
      /** Ancienne séance par créneau (pour conserver appel, résumé, PDF après régénération). */
      const oldSessionByKey = new Map();
      appData.sessions.forEach((s) => {
        if (!s.extra) oldSessionByKey.set(`${s.classId}|${s.date}|${s.startTime}`, s);
      });

      const extraSessions = appData.sessions.filter((s) => s.extra);
      const nextSessions = [];

      appData.classes.forEach((cl) => {
        const slots = schedulesForClass(cl.id);
        slots.forEach((slot) => {
          let cursor = new Date(start);
          while (cursor <= end) {
            if (dayIndexMon0(cursor) === slot.dayIndex) {
              const dateStr = fmtISODate(cursor);
              const di = dayIndexMon0(cursor);
              if (!isBlockedByHoliday(dateStr) && matchesWeekParity(slot, cursor)) {
                const act = pickActivityForSession(cl.id, dateStr, di);
                const key = `${cl.id}|${dateStr}|${slot.startTime}`;
                const prevS = oldSessionByKey.get(key);
                const sid = prevS ? prevS.id : uid();
                const sess = {
                  id: sid,
                  classId: cl.id,
                  scheduleId: slot.id,
                  activityId: act ? act.id : null,
                  date: dateStr,
                  startTime: slot.startTime,
                  endTime: slot.endTime,
                  venue: slot.venue,
                  comment: (prevS && prevS.comment) || "",
                };
                if (prevS) {
                  sess.attendance = prevS.attendance && typeof prevS.attendance === "object" ? { ...prevS.attendance } : {};
                  if (prevS.summary) sess.summary = prevS.summary;
                  if (prevS.sessionPdf) sess.sessionPdf = prevS.sessionPdf;
                } else {
                  sess.attendance = {};
                }
                nextSessions.push(sess);
              }
            }
            cursor = addDays(cursor, 1);
          }
        });
      });

      nextSessions.push(...extraSessions);
      nextSessions.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      appData.sessions = nextSessions;

      /** Réassocie les annulations aux nouveaux ids de séance après régénération. */
      oldCanc.forEach((c) => {
        const match = appData.sessions.find(
          (s) =>
            s.id === c.sessionId ||
            (s.classId === c.classId && s.date === c.date && s.startTime === c.startTime)
        );
        if (match) {
          c.sessionId = match.id;
          c.date = match.date;
          c.startTime = match.startTime;
        }
      });
      appData.cancellations = oldCanc.filter((c) => appData.sessions.some((s) => s.id === c.sessionId));
      saveData();
    }

    function dashboardKPIs(refDate) {
      const ref = refDate || new Date();
      const todayStr = fmtISODate(ref);
      const refStart = new Date(ref); refStart.setHours(0,0,0,0);
      const startWeek = addDays(refStart, -dayIndexMon0(refStart));
      const endWeek = addDays(startWeek, 6);
      let classesToday = 0;
      const next3Weeks = [0, 1, 2].map((offset) => {
        const ws = addDays(startWeek, offset * 7);
        const we = addDays(ws, 6);
        return { start: ws, end: we, cancelled: [], extras: [] };
      });
      appData.classes.forEach((cl) => {
        const hasToday = sessionsForClass(cl.id).some((s) => s.date === todayStr);
        if (hasToday) classesToday++;
        sessionsForClass(cl.id).forEach((s) => {
          const d = parseISODate(s.date);
          const st = computeSessionStatus(s);
          const fmtDD = (date) => String(date.getDate()).padStart(2,"0") + "/" + String(date.getMonth()+1).padStart(2,"0");
          for (const w of next3Weeks) {
            if (d >= w.start && d <= w.end) {
              const timeLabel = s.startTime ? " " + s.startTime + (s.endTime ? "–" + s.endTime : "") : "";
              if (st.code === "cancelled") {
                w.cancelled.push(cl.name + " – " + fmtDD(d) + timeLabel);
              }
              if (s.extra) {
                w.extras.push(cl.name + " – " + fmtDD(d) + timeLabel);
              }
              break;
            }
          }
        });
      });
      const cycleAlerts = appData.classes.filter((cl) => {
        const ids = new Set(activitiesOnDatePeriod(cl.id, todayStr).map((a) => a.id));
        if (!ids.size) return false;
        const acts = activitiesForClass(cl.id).filter((a) => ids.has(a.id));
        for (const cur of acts) {
          const list = sessionsForClass(cl.id).filter((s) => s.activityId === cur.id);
          const doneInAct = list.filter((s) => computeSessionStatus(s).code === "done").length;
          const totalInAct = list.length;
          if (totalInAct > 0 && doneInAct / totalInAct > 0.85) return true;
        }
        return false;
      });
      return { classesToday, next3Weeks, cycleAlerts, classCount: appData.classes.length };
    }

    function recentCancellations(limit = 6) {
      return appData.cancellations
        .map((c) => {
          const s = appData.sessions.find((x) => x.id === c.sessionId) || { classId: c.classId, date: c.date };
          const cl = getClassById(s.classId);
          return { ...c, className: cl ? cl.name : "?" };
        })
        .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
        .slice(0, limit);
    }

    /**
     * Prochaine séance = première à venir (aujourd'hui inclus) non annulée.
     * Dernière effectuée = dernière date passée marquée effectuée.
     */
    function nextAndLastSession(classId) {
      const sorted = sessionsForClass(classId).slice().sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      const today = todayStart();
      let next = null;
      let lastDone = null;
      sorted.forEach((s) => {
        const st = computeSessionStatus(s);
        const d = parseISODate(s.date);
        d.setHours(0, 0, 0, 0);
        if (st.code === "done") lastDone = s;
        if (!next && (st.code === "planned" || st.code === "today")) {
          if (st.code === "today") next = s;
          else if (d.getTime() >= today.getTime()) next = s;
        }
      });
      return { next, lastDone };
    }

    function statsPerActivity(classId, actId) {
      const list = sessionsForClass(classId).filter((s) => s.activityId === actId);
      let done = 0, cancelled = 0, remaining = 0;
      list.forEach((s) => {
        const st = computeSessionStatus(s);
        if (st.code === "cancelled") cancelled++;
        else if (st.code === "done") done++;
        else if (st.code === "planned" || st.code === "today") remaining++;
      });
      const total = list.length;
      const pct = total - cancelled > 0 ? Math.round((done / (total - cancelled)) * 100) : 0;
      return { total, done, cancelled, remaining, pct };
    }

    /** Date ISO de la dernière séance (toutes, pas seulement effectuées) d'une APSA. */
    function lastSessionDateForActivity(classId, actId) {
      const list = sessionsForClass(classId)
        .filter((s) => s.activityId === actId)
        .map((s) => s.date)
        .sort();
      return list.length ? list[list.length - 1] : null;
    }

    function globalSessionCounts(refDate) {
      let todayN = 0, planned = 0, done = 0, cancelled = 0;
      const todayDetails = [];
      const tStr = fmtISODate(refDate || new Date());
      appData.sessions.forEach((s) => {
        const st = computeSessionStatus(s);
        if (s.date === tStr && st.code !== "cancelled") {
          todayN++;
          const cl = getClassById(s.classId);
          const act = activityById(s.activityId);
          todayDetails.push({
            className: cl ? cl.name : "—",
            startTime: s.startTime || "—",
            endTime: s.endTime || "",
            activityName: act ? act.name : "",
          });
        }
        if (st.code === "cancelled") cancelled++;
        else if (st.code === "done") done++;
        else if (st.code === "planned" || st.code === "today") planned++;
      });
      todayDetails.sort((a, b) => a.startTime.localeCompare(b.startTime));
      return { todayN, todayDetails, planned, done, cancelled, total: appData.sessions.length };
    }

      const bOk = el(`<button type="button" class="btn btn-primary">Valider</button>`);
      foot.append(bCancel, bOk);

        root.innerHTML = "";
      };
      bOk.onclick = () => {
        onConfirm();

      root.appendChild(wrap);

          root.classList.remove("open");

    }

    function buildAttendanceBlock(session) {
      const cl = getClassById(session.classId);
      const students = (cl && cl.students) || [];
      if (!session.attendance) session.attendance = {};
      const wrap = document.createElement("div");
      wrap.style.cssText = "margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem";

      const renderUI = () => {
        const att = session.attendance;
        const list = students.length ? students : Object.keys(att);
        const presentCount = list.filter((n) => att[n] === "present").length;
        const absentCount = list.filter((n) => att[n] === "absent").length;
        const lateCount = list.filter((n) => att[n] === "late").length;
        const notMarked = list.length - presentCount - absentCount - lateCount;

        const btnStyle = (name, val) => {
          const active = att[name] === val;
          const colors = { present: "#16a34a", absent: "#dc2626", late: "#d97706" };
          return active
            ? `background:${colors[val]};color:#fff;font-weight:700;border:none`
            : `background:transparent;color:var(--fg);border:1px solid var(--border)`;
        };

        let rows = "";
        if (students.length) {
          rows = list.map((name) =>
            `<div style="display:flex;align-items:center;gap:.4rem;padding:.35rem 0;border-bottom:1px solid var(--border)" data-student="${escapeHtml(name)}">
              <span style="flex:1;font-size:.88rem;font-weight:500">${escapeHtml(name)}</span>
              <button type="button" class="btn btn-sm att-btn" data-name="${escapeHtml(name)}" data-val="present" style="padding:.2rem .55rem;font-size:.75rem;border-radius:20px;${btnStyle(name, "present")}">Présent</button>
              <button type="button" class="btn btn-sm att-btn" data-name="${escapeHtml(name)}" data-val="late" style="padding:.2rem .55rem;font-size:.75rem;border-radius:20px;${btnStyle(name, "late")}">Retard</button>
              <button type="button" class="btn btn-sm att-btn" data-name="${escapeHtml(name)}" data-val="absent" style="padding:.2rem .55rem;font-size:.75rem;border-radius:20px;${btnStyle(name, "absent")}">Absent</button>
            </div>`
          ).join("");
        } else {
          rows = `<p class="kpi-sub">Aucun élève importé pour cette classe. Ajoutez-les via Réglages > Mes classes > ⚙️.</p>`;
        }

        const allPresentBtn = students.length
          ? `<button type="button" class="btn btn-sm" id="att-all-present" style="background:#16a34a;color:#fff;font-weight:700;font-size:.78rem;padding:.3rem .7rem;border-radius:20px">✓ Tous présents</button>`
          : "";

        wrap.innerHTML =
          `<div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;flex-wrap:wrap">
            <p style="font-weight:700;margin:0">📋 Appel</p>
            ${allPresentBtn}
            <span class="kpi-sub" style="margin-left:auto">${presentCount > 0 ? `<span style="color:#16a34a;font-weight:600">${presentCount} P</span>` : ""}${lateCount > 0 ? ` <span style="color:#d97706;font-weight:600">${lateCount} R</span>` : ""}${absentCount > 0 ? ` <span style="color:#dc2626;font-weight:600">${absentCount} A</span>` : ""}${notMarked > 0 ? ` <span>${notMarked} non pointé(s)</span>` : ""}</span>
          </div>
          <div style="max-height:280px;overflow-y:auto">${rows}</div>`;

        wrap.querySelectorAll(".att-btn").forEach((b) => {
          b.addEventListener("click", () => {
            const name = b.getAttribute("data-name");
            const val = b.getAttribute("data-val");
            session.attendance[name] = session.attendance[name] === val ? undefined : val;
            if (session.attendance[name] === undefined) delete session.attendance[name];
            saveData();
            renderUI();
          });
        });
        const allBtn = wrap.querySelector("#att-all-present");
        if (allBtn) {
          allBtn.addEventListener("click", () => {
            students.forEach((n) => { session.attendance[n] = "present"; });
            saveData();
            renderUI();
          });
        }
      };

      renderUI();
      return wrap;
    }

    function dashTodayCoursesHtml(isToday, dayISO) {
      const todaySessions = appData.sessions.filter((s) => s.date === dayISO)
        .slice().sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""));
      const label = isToday ? "Cours du jour" : "Cours de la journée";
      if (!todaySessions.length) {
        return `<div class="dash-block dash-block--courses"><h3 class="dash-block__title">🏃 ${label}</h3><p class="kpi-sub" style="margin:0">Aucun cours prévu ce jour.</p></div>`;
      }
      const lines = todaySessions.map((s) => {
        const cl = getClassById(s.classId);
        const act = activityById(s.activityId);
        const stt = computeSessionStatus(s);
        const col = stt.code === "cancelled" ? "var(--danger)" : stt.code === "done" ? "var(--success)" : "var(--accent)";
        const canc = cancellationForSession(s);
        const motif = canc ? (REASON_TYPES.find((x) => x[0] === canc.reasonType)?.[1] || canc.reasonType) : stt.reason || "";
        const pillClass = stt.code === "cancelled" ? "status-pill--cancelled" : stt.code === "done" ? "status-pill--done" : stt.code === "holiday" ? "status-pill--holiday" : "status-pill--planned";
        const statusHtml = `<span class="status-pill ${pillClass}"><span class="status-dot" style="background:${col}"></span>${escapeHtml(stt.label)}</span>`;
        let sessionNumBadge = "";
        if (act) {
          const actSess = appData.sessions
            .filter((x) => x.classId === s.classId && x.activityId === act.id)
            .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
          const valid = actSess.filter((x) => { const c = computeSessionStatus(x).code; return c !== "cancelled" && c !== "holiday"; });
          const idx = valid.findIndex((x) => x.id === s.id);
          if (idx >= 0) sessionNumBadge = ` <span class="session-num-badge">n°${idx + 1}/${valid.length}</span>`;
        }
        const hasSummary = s.summary && s.summary.trim();
        const classColor = cl ? cl.color : "#888";
        return `<div class="btn-today-session dash-session-row" data-session-id="${s.id}" style="--session-c:${classColor}">
          <span class="dash-session-time">${s.startTime || ""}–${s.endTime || ""}</span>
          <span class="dash-session-class">${escapeHtml(cl ? cl.name : "—")}</span>
          <span style="font-size:.82rem;color:var(--text-muted)">${escapeHtml(s.venue || "")}</span>
          <span style="font-size:.82rem">${act ? escapeHtml(act.name) : "—"}${sessionNumBadge}</span>
          ${statusHtml}
          ${motif ? `<span style="font-size:.78rem;color:var(--text-muted)">(${escapeHtml(motif)})</span>` : ""}
          ${hasSummary ? '<span style="font-size:.85rem" title="Résumé rédigé">📝</span>' : ""}
          ${s.sessionPdf ? '<span style="font-size:.85rem" title="PDF joint">📄</span>' : ""}
          ${(() => { const att = s.attendance || {}; const keys = Object.keys(att); if (!keys.length) return ""; const p = keys.filter((k) => att[k] === "present").length; const a = keys.filter((k) => att[k] === "absent").length; const l = keys.filter((k) => att[k] === "late").length; return `<span class="att-badge" title="Appel effectué">${p}P${l ? " " + l + "R" : ""}${a ? " " + a + "A" : ""}</span>`; })()}
        </div>`;
      }).join("");
      return `<div class="dash-block dash-block--courses"><h3 class="dash-block__title">🏃 ${label} · ${todaySessions.length} séance${todaySessions.length > 1 ? "s" : ""}</h3><div style="display:flex;flex-direction:column;gap:0">${lines}</div></div>`;
    }

    function dashScheduleHtml(dash) {
      const weeks = dash.next3Weeks.map((w, i) => {
        const label = i === 0 ? "Cette semaine" : i === 1 ? "Semaine prochaine" : "Dans 2 semaines";
        const dd = (d) => String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
        const range = dd(w.start) + " – " + dd(w.end);
        const cancPart = w.cancelled.length
          ? `<span style="color:var(--danger);font-weight:600;font-size:.82rem">❌ ${w.cancelled.length} cours annulé(s) : ${w.cancelled.map((d) => escapeHtml(d)).join(" · ")}</span>`
          : "";
        const extraPart = w.extras.length
          ? `<span style="color:#16a34a;font-weight:600;font-size:.82rem">➕ ${w.extras.length} cours ajouté(s) : ${w.extras.map((d) => escapeHtml(d)).join(" · ")}</span>`
          : "";
        const details = [cancPart, extraPart].filter(Boolean).join("<br>");
        return `<div class="dash-week-row${i === 0 ? " dash-week-row--current" : ""}"><strong>${label}</strong> <span style="font-size:.72rem;color:var(--text-muted)">(${range})</span>${details ? "<br>" + details : " — <span class=\"kpi-sub\">Aucune modification</span>"}</div>`;
      }).join("");
      return `<div class="dash-block dash-block--schedule no-print"><h3 class="dash-block__title">📅 Modifications EDT à venir</h3><div style="display:flex;flex-direction:column;gap:.5rem">${weeks}</div></div>`;
    }

    function dashForgottenGearKpiHtml(animationDelay) {
      const threshold = forgottenGearThreshold;
      const todayStr = dashboardDateISO();
      const alerts = [];
      appData.classes.forEach((cl) => {
        const clPeriods = periodsForClass(cl.id);
        const curPeriod = clPeriods.find((p) => todayStr >= p.startDate && todayStr <= p.endDate);
        if (!curPeriod) return;
        const items = (appData.forgottenGear || []).filter((f) => f.classId === cl.id && f.date >= curPeriod.startDate && f.date <= curPeriod.endDate);
        const byStudent = {};
        items.forEach((f) => { byStudent[f.studentName] = (byStudent[f.studentName] || 0) + 1; });
        Object.entries(byStudent).forEach(([name, count]) => {
          if (count >= threshold) alerts.push({ name, className: cl.name, classId: cl.id, count });
        });
      });
      alerts.sort((a, b) => b.count - a.count);
      const total = alerts.length;
      const detail = alerts.map((a) => `<a href="#" class="link-fg-student" data-classid="${a.classId}" data-student="${escapeHtml(a.name)}" style="color:var(--danger);font-weight:700;text-decoration:underline;cursor:pointer">${escapeHtml(a.name)}</a> (${escapeHtml(a.className)}) — ${a.count} oubli(s)`).join("<br>");
      return `<div class="kpi kpi--tint kpi--warning${total ? " has-alert" : ""}" style="animation-delay:${animationDelay}"><div class="kpi-label">⚠️ Oublis de matériel répétés <button type="button" id="btn-fg-threshold" title="Régler le seuil d'oublis" style="background:none;border:none;cursor:pointer;font-size:.95rem;padding:0;line-height:1;flex-shrink:0">⚙️</button></div>${total ? `<div class="kpi-value" style="color:var(--danger)">${total}</div><div class="kpi-sub" style="text-align:left;line-height:1.5">${detail}</div>` : '<div class="kpi-sub">Aucun élève concerné</div>'}</div>`;
    }

    function sessionsOnDate(dStr) {
      return appData.sessions.filter((s) => s.date === dStr);

    function viewCalendarBody() {
      const y = calendarCursor.getFullYear();
      const m = calendarCursor.getMonth();
      const first = new Date(y, m, 1);
      const startPad = (first.getDay() + 6) % 7;
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let cells = "";
      for (let i = 0; i < startPad; i++) cells += `<div class="cal-cell muted"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = fmtISODate(new Date(y, m, d));
        const today = fmtISODate(new Date());
        const sess = sessionsOnDate(dateStr).filter((s) => {
          const cl = getClassById(s.classId);
          return matchesSearch(cl?.name || "") || matchesSearch(activityById(s.activityId || "")?.name || "");
        });
        const hol = appData.holidays.find((h) => dateStr >= h.startDate && dateStr <= h.endDate);
        cells += `<div class="cal-cell ${dateStr === today ? "today" : ""}">
          <div class="num">${d}</div>
          ${hol ? `<div class="cal-chip" style="background:${hol.color}33">${escapeHtml(hol.name)}</div>` : ""}
          ${sess
            .map((s) => {
              const cl = getClassById(s.classId);
              const act = activityById(s.activityId);
              return `<div class="cal-chip" style="background:${cl?.color}44">${escapeHtml(cl?.name)} ${s.startTime}${act ? " · " + escapeHtml(act.name) : ""}</div>`;
            })
            .join("")}
        </div>`;
      }
      const weekHtml = (() => {
        const mon = addDays(calendarCursor, -dayIndexMon0(calendarCursor));
        let rows = "";
        for (let i = 0; i < 7; i++) {
          const day = addDays(mon, i);
          const ds = fmtISODate(day);
          const list = sessionsOnDate(ds);
          rows += `<div class="card" style="padding:.6rem"><strong>${DOW[i]} ${ds}</strong>
            ${list
              .map((s) => {
                const cl = getClassById(s.classId);
                return `<div class="cal-chip" style="background:${cl?.color}44">${s.startTime}-${s.endTime} ${escapeHtml(cl?.name)}</div>`;
              })
              .join("") || '<p class="kpi-sub">Aucune séance</p>'}
          </div>`;
        }
        return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.5rem">${rows}</div>`;
      })();

      return (
        (calendarMode === "month"
          ? `<div class="card"><div class="cal-toolbar"><strong>${new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" }).format(new Date(y, m))}</strong></div>
          <div class="cal-grid">${["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"].map((d) => `<div class="cal-dow">${d}</div>`).join("")}${cells}</div></div>`
          : "") +
        (calendarMode === "week" ? `<div class="card">${weekHtml}</div>` : "")
      );
    }

      return (
        renderTopbar("Calendrier visuel", `<div class="flex-row">
          <button type="button" class="btn btn-sm btn-ghost" id="cal-prev">◀</button>
          <button type="button" class="btn btn-sm btn-ghost" id="cal-today">Aujourd'hui</button>
          <button type="button" class="btn btn-sm btn-ghost" id="cal-next">▶</button>
          <select id="cal-mode" class="btn btn-sm" style="border:1px solid var(--border)">
            <option value="month" ${calendarMode === "month" ? "selected" : ""}>Mensuel</option>
            <option value="week" ${calendarMode === "week" ? "selected" : ""}>Hebdomadaire</option>
          </select>
        </div>`) +
        viewCalendarBody()
      );
    }

    function viewStatsBody() {
      const fields = fieldDistribution();
      const maxF = fields[0] ? fields[0][1] : 1;
      return (
        `<div class="card"><h3>Taux de réalisation par classe</h3><div class="bar-chart" style="margin-top:.75rem">
        ${appData.classes
          .filter((c) => matchesSearch(c.name))
          .map((cl) => {
            const st = sessionStatsForClass(cl.id);
            const w = st.pct;
            return `<div class="bar-row"><span>${escapeHtml(cl.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${cl.color}"></div></div><span>${w}%</span></div>`;
          })
          .join("")}
        </div></div>
        <div class="card"><h3>Répartition des champs d'apprentissage (APSA)</h3><div class="bar-chart" style="margin-top:.75rem">
        ${fields
          .map(([name, n]) => {
            const w = Math.round((n / maxF) * 100);
            return `<div class="bar-row"><span>${escapeHtml(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:var(--accent)"></div></div><span>${n}</span></div>`;
          })
          .join("")}
        </div></div>
        <div class="card"><h3>Séances moyennes par classe (sur l'année)</h3>
        <p class="kpi-sub">Total séances générées / nombre de classes : <strong>${appData.classes.length ? Math.round(appData.sessions.length / appData.classes.length) : 0}</strong></p></div>`
      );
    }

    function viewStats() {
      return renderTopbar("Statistiques avancées", "") + viewStatsBody();
    }

    function viewBackupBody() {
      const origin = escapeHtml(location.href);
      return (
        `<div class="card" style="border-left:4px solid var(--accent)">
          <h3>Où sont mes données ?</h3>
          <p class="kpi-sub" style="line-height:1.55;margin-top:.35rem">
            Elles ne sont <strong>pas</strong> écrites dans le fichier <code>eps-college-dashboard.html</code> sur votre disque. Elles sont enregistrées dans le <strong>navigateur</strong> (ou l’aperçu web) pour l’<strong>adresse exacte</strong> utilisée au moment où vous travaillez.

            L’aperçu intégré à <strong>Cursor</strong>, un onglet <strong>Safari</strong> ou <strong>Chrome</strong>, ou une adresse <code>http://127.0.0.1:…</code> sont des emplacements différents : vous ne retrouverez pas automatiquement les mêmes réglages. Pour les transférer : <strong>Export JSON</strong> depuis l’endroit où vous avez saisi les données, puis <strong>Import JSON</strong> dans le nouvel onglet ou le nouveau navigateur.

            <div class="form-group"><label>Fin</label><input type="date" id="set-end" value="${appData.settings.schoolYearEnd}" /></div>
          </div>
          <button type="button" class="btn btn-primary" id="btn-save-settings">Enregistrer période & régénérer</button>
        </div>
        <div class="card">
          <p class="kpi-sub" style="line-height:1.5">Sauvegarde automatique dans ce navigateur pour cette origine (voir encadré ci-dessus). Pensez à exporter un fichier JSON avant de changer d’ordinateur, de navigateur ou de mode d’ouverture du fichier.</p>
          <div class="flex-row" style="margin-top:.75rem">
            <button type="button" class="btn btn-primary" id="btn-export">Export JSON</button>
            <label class="btn btn-ghost" style="border:1px solid var(--border);cursor:pointer">Import JSON<input type="file" id="inp-import" accept="application/json" class="hidden" /></label>

            <button type="button" class="btn btn-ghost" id="btn-pdf">PDF (via impression)</button>
          </div>

      );

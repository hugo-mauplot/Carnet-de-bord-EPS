    function getClassById(id) {
      return appData.classes.find((c) => c.id === id);
    }

    function schedulesForClass(classId) {
      return appData.schedules.filter((s) => s.classId === classId);
    }

    function activitiesForClass(classId) {
      return appData.activities
        .filter((a) => a.classId === classId)
        .slice()
        .sort((a, b) => a.startDate.localeCompare(b.startDate));
    }

    function sessionsForClass(classId) {
      return appData.sessions.filter((s) => s.classId === classId);
    }

    function periodDateOverrides(period) {
      if (!period || !period.classDateOverrides || typeof period.classDateOverrides !== "object") return {};
      return period.classDateOverrides;
    }

    /** Dates effectives d'une période pour une classe (fin prolongée éventuelle). */
    function periodDatesForClass(period, classId) {
      if (!period) return { start: "", end: "" };
      const baseEnd = period.endDate || "";
      const o = classId ? periodDateOverrides(period)[classId] : null;
      const end = o && o.endDate && o.endDate > baseEnd ? o.endDate : baseEnd;
      return { start: period.startDate || "", end };
    }

    function classesForPeriod(period) {
      if (!period) return [];
      return appData.classes
        .filter((cl) => periodLevels(period).includes(classLevel(cl)))
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name, "fr"));
    }

    function activityEffectiveDates(activity) {
      if (!activity) return { start: "", end: "" };
      if (activity.periodId) {
        const period = (appData.periods || []).find((p) => p.id === activity.periodId);
        if (period) return periodDatesForClass(period, activity.classId);
      }
      return { start: activity.startDate || "", end: activity.endDate || "" };
    }

    function syncActivitiesDatesFromPeriod(period) {
      if (!period || !period.id) return;
      (appData.activities || []).forEach((a) => {
        if (a.periodId !== period.id) return;
        const { start, end } = periodDatesForClass(period, a.classId);
        a.startDate = start;
        a.endDate = end;
      });
    }

    /** APSA dont la période contient la date `dateStr` (ISO). */
    function activitiesOnDatePeriod(classId, dateStr) {
      return activitiesForClass(classId).filter((a) => {
        const { start, end } = activityEffectiveDates(a);
        return start && end && dateStr >= start && dateStr <= end;
      });
    }

    /** Séances listées dans le tableau APSA de l'onglet classe (même activityId). */
    function sessionsForActivityTable(classId, actId) {
      return sessionsForClass(classId).filter((s) => s.activityId === actId);
    }

    function activityIdsOnPeriodToday(classId) {
      const t = fmtISODate(new Date());
      return new Set(activitiesOnDatePeriod(classId, t).map((a) => a.id));
    }

    function sessionStatsForSessions(list) {
      let done = 0, cancelled = 0, remaining = 0;
      list.forEach((s) => {
        const st = computeSessionStatus(s);
        if (st.code === "cancelled") cancelled++;
        else if (st.code === "holiday") {
        } else if (st.code === "done") done++;
        else if (st.code === "today" || st.code === "planned") remaining++;
      });
      const total = list.length;
      const denom = Math.max(1, total - cancelled);
      const pct = Math.min(100, Math.round((done / denom) * 100));
      return { total, done, cancelled, remaining, realized: done, pct };
    }

    function sessionStatsForClass(classId) {
      return sessionStatsForSessions(sessionsForClass(classId));
    }

    /** Stats séances rattachées aux APSA « en cours » aujourd'hui (période calendaire). */
    function sessionStatsForCurrentPeriod(classId) {
      const ids = activityIdsOnPeriodToday(classId);
      if (!ids.size) return { total: 0, done: 0, cancelled: 0, remaining: 0, pct: 0, realized: 0 };
      const list = sessionsForClass(classId).filter((s) => s.activityId && ids.has(s.activityId));
      return sessionStatsForSessions(list);
    }

    /** Jours affichés au tableau de bord : jours cochés sur les APSA en cours, sinon créneaux EDT. */
    function weekdaysForDashboardClass(classId, refDateISO) {
      const acts = activitiesOnDatePeriod(classId, refDateISO || fmtISODate(new Date()));
      const daySet = new Set();
      acts.forEach((a) => {
        if (Array.isArray(a.dayIndices) && a.dayIndices.length) a.dayIndices.forEach((d) => daySet.add(d));
      });
      if (daySet.size) return [...daySet].sort((a, b) => a - b).map((i) => DOW[i]).join(" · ");
      return weekdaysForClass(classId);
    }

    function formatDayIndicesLabel(act) {
      if (!act.dayIndices || !act.dayIndices.length) return "Tous les jours de créneau (période)";
      return act.dayIndices
        .slice()
        .sort((a, b) => a - b)
        .map((i) => DOW[i])
        .join(", ");
    }

    /**
     * Détermine si une date tombe dans un événement « bloquant » (vacances, férié, etc.).
     */
    function hasTimeWindow(event) {
      return !!(event && event.startTime && event.endTime);
    }

    function timeRangesOverlap(startA, endA, startB, endB) {
      if (!startA || !endA || !startB || !endB) return false;
      return startA < endB && startB < endA;
    }

    /** Heure « HH:MM » pour comparaisons fiables (ex. 9:05 → 09:05). */
    function normalizeTimeHHMM(t) {
      const raw = String(t || "").trim();
      if (!raw) return "";
      const m = raw.match(/^(\d{1,2}):(\d{2})/);
      if (!m) return raw;
      return `${String(m[1]).padStart(2, "0")}:${m[2]}`;
    }


    function ensureTeamCoordination() {
      if (!appData.teamCoordination || typeof appData.teamCoordination !== "object") {
        appData.teamCoordination = { teachers: [], timeSlots: [], cells: {} };
      }
      const tc = appData.teamCoordination;
      if (!Array.isArray(tc.teachers)) tc.teachers = [];
      if (!Array.isArray(tc.timeSlots)) tc.timeSlots = [];
      if (!tc.cells || typeof tc.cells !== "object") tc.cells = {};

      // Migration ancienne structure (slots par jour) → timeSlots + cells jour/semaine
      if (Array.isArray(tc.slots) && tc.slots.length) {
        const byTime = new Map();
        tc.slots.forEach((s) => {
          if (!s) return;
          const st = normalizeTimeHHMM(s.startTime || "");
          const en = normalizeTimeHHMM(s.endTime || "");
          if (!st || !en) return;
          const tk = st + "|" + en;
          if (!byTime.has(tk)) {
            const id = uid();
            byTime.set(tk, id);
            tc.timeSlots.push({ id, startTime: st, endTime: en });
          }
          const timeId = byTime.get(tk);
          const dayIndex = Number.isInteger(s.dayIndex) ? s.dayIndex : parseInt(s.dayIndex, 10);
          if (!Number.isInteger(dayIndex)) return;
          // Anciennes cellules teacher|oldSlotId → teacher|day|time|A et B
          tc.teachers.forEach((t) => {
            const oldKey = String(t.id) + "|" + String(s.id);
            const oldCell = tc.cells[oldKey];
            if (!oldCell) return;
            ["A", "B"].forEach((w) => {
              const nk = teamCellKey(t.id, dayIndex, timeId, w);
              if (!tc.cells[nk]) tc.cells[nk] = { ...oldCell };
            });
            delete tc.cells[oldKey];
          });
        });
        delete tc.slots;
      }

      tc.teachers.forEach((t) => {
        if (t && !t.id) t.id = uid();
        if (t) {
          t.name = String(t.name || "").trim();
          if (!t.color) t.color = TEAM_COORD_TEACHER_COLORS[tc.teachers.indexOf(t) % TEAM_COORD_TEACHER_COLORS.length];
        }
      });
      tc.timeSlots.forEach((s) => {
        if (s && !s.id) s.id = uid();
        if (s) {
          s.startTime = normalizeTimeHHMM(s.startTime || "");
          s.endTime = normalizeTimeHHMM(s.endTime || "");
        }
      });
      tc.timeSlots.sort((a, b) => String(a.startTime).localeCompare(String(b.startTime)));
      if (teamCoordWeekParity !== "A" && teamCoordWeekParity !== "B") teamCoordWeekParity = weekParityForDate(new Date());
      return tc;
    }

    function weekParityForDate(dateOrIso) {
      const d = typeof dateOrIso === "string" ? parseISODate(dateOrIso) : dateOrIso;
      if (!d || Number.isNaN(d.getTime())) return "A";
      return schoolWeekIndex(d) % 2 === 0 ? "A" : "B";
    }

    function teamTeacherColor(teacherId) {
      const teacher = ensureTeamCoordination().teachers.find((t) => t.id === teacherId);
      return teacher && teacher.color ? String(teacher.color) : TEAM_COORD_TEACHER_COLORS[0];
    }

    function alphaColor(hex, alpha) {
      const raw = String(hex || "").trim();
      const m = raw.match(/^#([0-9a-f]{6})$/i);
      if (!m) return `rgba(37,99,235,${alpha})`;
      const int = parseInt(m[1], 16);
      const r = (int >> 16) & 255;
      const g = (int >> 8) & 255;
      const b = int & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function teamSharedVenueColor(venueKey) {
      const palette = ["#eab308", "#22c55e", "#06b6d4", "#a855f7", "#f97316", "#ef4444", "#14b8a6"];
      const key = String(venueKey || "");
      let hash = 0;
      for (let i = 0; i < key.length; i += 1) hash = ((hash * 31) + key.charCodeAt(i)) >>> 0;
      return palette[hash % palette.length];
    }

    function mondayIsoForDate(dateOrIso) {
      const d = typeof dateOrIso === "string" ? parseISODate(dateOrIso) : dateOrIso;
      if (!d || Number.isNaN(d.getTime())) return "";
      return fmtISODate(addDays(d, -dayIndexMon0(d)));
    }

    function ensureTeamCoordWeekStartISO() {
      const start = coerceISODateString(teamCoordWeekStartISO);
      if (start) return mondayIsoForDate(start);
      const today = fmtISODate(new Date());
      teamCoordWeekStartISO = mondayIsoForDate(today);
      return teamCoordWeekStartISO;
    }

    function teamCoordDateForDayIndex(dayIndex) {
      const monday = parseISODate(ensureTeamCoordWeekStartISO());
      if (!monday || Number.isNaN(monday.getTime())) return "";
      return fmtISODate(addDays(monday, dayIndex));
    }

    function teamCoordWeekOptions() {
      const start = parseISODate(appData.settings?.schoolYearStart || "");
      const end = parseISODate(appData.settings?.schoolYearEnd || "");
      const currentMonday = ensureTeamCoordWeekStartISO();
      const list = [];
      const seen = new Set();
      if (start && end && !Number.isNaN(start.getTime()) && !Number.isNaN(end.getTime())) {
        let cursor = addDays(start, -dayIndexMon0(start));
        const endMonday = addDays(end, -dayIndexMon0(end));
        while (cursor <= endMonday) {
          const iso = fmtISODate(cursor);
          seen.add(iso);
          list.push(iso);
          cursor = addDays(cursor, 7);
        }
      }
      if (currentMonday && !seen.has(currentMonday)) list.push(currentMonday);
      return list.sort((a, b) => a.localeCompare(b));
    }

    function teamCellKey(teacherId, dayIndex, timeSlotId, weekParity) {
      return [teacherId || "", dayIndex, timeSlotId || "", weekParity || "A"].join("|");
    }

    function teamPeriodsSorted() {
      return (appData.periods || [])
        .slice()
        .sort((a, b) => String(a.startDate || "").localeCompare(String(b.startDate || "")));
    }

    function resolveTeamCoordPeriodId(selection) {
      const periods = teamPeriodsSorted();
      if (!periods.length) return "";
      const selected = selection == null ? teamCoordPeriodId : selection;
      if (!selected || selected === TEAM_COORD_CURRENT_PERIOD) {
        const iso = fmtISODate(new Date());
        const hit = periods.find((p) => iso >= String(p.startDate || "") && iso <= String(p.endDate || ""));
        return hit ? hit.id : periods[0].id;
      }
      return periods.some((p) => p.id === selected) ? selected : periods[0].id;
    }

    function ensureTeamCoordPeriodId() {
      const periods = teamPeriodsSorted();
      if (!periods.length) {
        teamCoordPeriodId = TEAM_COORD_CURRENT_PERIOD;
        return "";
      }
      if (!teamCoordPeriodId) teamCoordPeriodId = TEAM_COORD_CURRENT_PERIOD;
      if (teamCoordPeriodId !== TEAM_COORD_CURRENT_PERIOD && !periods.some((p) => p.id === teamCoordPeriodId)) {
        teamCoordPeriodId = TEAM_COORD_CURRENT_PERIOD;
      }
      return resolveTeamCoordPeriodId(teamCoordPeriodId);
    }

    function teamSlotStoredOccupants(dayIndex, timeSlotId, weekParity) {
      const tc = ensureTeamCoordination();
      const week = weekParity === "B" ? "B" : "A";
      const list = [];
      tc.teachers.forEach((t) => {
        const cell = getTeamCell(t.id, dayIndex, timeSlotId, week);
        if (!teamCellHasAnyData(cell)) return;
        list.push({
          teacherId: t.id,
          teacherName: t.name || "—",
          className: cell.className || "",
          level: teamCellLevel(cell) || cell.level || "",
          byPeriod: Object.assign({}, cell.byPeriod || {}),
          weekScope: week,
        });
      });
      return list;
    }

    function teamSlotOccupants(dayIndex, timeSlotId, weekParity, periodId, dateStr) {
      const tc = ensureTeamCoordination();
      const list = [];
      tc.teachers.forEach((t) => {
        const cell = getTeamCell(t.id, dayIndex, timeSlotId, weekParity);
        const level = teamCellLevel(cell);
        const pid = dateStr
          ? periodIdForDateAndLevel(dateStr, level)
          : (periodId || periodIdForDateAndLevel(fmtISODate(new Date()), level) || ensureTeamCoordPeriodId());
        if (!pid) return;
        const view = teamCellPeriodView(cell, pid);
        if (view.applies === false || !teamCellIsFilled(cell, pid)) return;
        list.push({
          teacherId: t.id,
          teacherName: t.name || "—",
          className: view.className || "",
          level: view.level || level,
          apsa: view.apsa || "",
          venue: view.venue || "",
        });
      });
      return list;
    }

    function formatTeamOccupantLine(o) {
      return [o.teacherName || "—", o.className || "—", o.apsa || "—", o.venue || "—"].join(" — ");
    }

    function periodsCoveringDate(dateStr) {
      const iso = coerceISODateString(dateStr) || String(dateStr || "");
      if (!iso) return [];
      return teamPeriodsSorted().filter((p) => iso >= String(p.startDate || "") && iso <= String(p.endDate || ""));
    }

    function periodIdForDateAndLevel(dateStr, level) {
      const covering = periodsCoveringDate(dateStr);
      if (!covering.length) return "";
      const lvl = String(level || "").trim();
      if (lvl) {
        const hit = covering.find((p) => periodAppliesToLevel(p, lvl));
        if (hit) return hit.id;
      }
      return covering[0].id;
    }

    function periodIdForDate(dateStr) {
      return periodIdForDateAndLevel(dateStr, "") || ensureTeamCoordPeriodId();
    }

    function periodsForLevel(level) {
      const lvl = String(level || "").trim();
      if (!lvl) return [];
      return teamPeriodsSorted().filter((p) => periodLevels(p).includes(lvl));
    }

    function periodAppliesToLevel(period, level) {
      const lvl = String(level || "").trim();
      if (!lvl || !period) return !lvl;
      return periodLevels(period).includes(lvl);
    }

    function teamCellLevel(cell) {
      const c = cell && typeof cell === "object" ? cell : {};
      const lvl = String(c.level || "").trim();
      if (lvl && CLASS_LEVELS.includes(lvl)) return lvl;
      const inferred = inferClassLevel(c.className || "");
      return CLASS_LEVELS.includes(inferred) ? inferred : "";
    }

    function teamCellsContentEqual(a, b) {
      const na = normalizeTeamCell(a);
      const nb = normalizeTeamCell(b);
      return JSON.stringify(na) === JSON.stringify(nb);
    }

    function normalizeTeamCell(raw) {
      const periods = teamPeriodsSorted();
      const cell = { className: "", level: "", byPeriod: {} };
      if (!raw || typeof raw !== "object") {
        periods.forEach((p) => { cell.byPeriod[p.id] = { apsa: "", venue: "" }; });
        return cell;
      }
      cell.className = String(raw.className || "").trim();
      let level = String(raw.level || "").trim();
      if (!CLASS_LEVELS.includes(level)) level = inferClassLevel(cell.className) || "";
      if (!CLASS_LEVELS.includes(level)) level = "";
      cell.level = level;
      cell.byPeriod = {};
      const legacyApsa = String(raw.apsa || "").trim();
      const legacyVenue = String(raw.venue || "").trim();
      const src = raw.byPeriod && typeof raw.byPeriod === "object" ? raw.byPeriod : null;
      periods.forEach((p) => {
        const from = src && src[p.id] ? src[p.id] : null;
        cell.byPeriod[p.id] = {
          apsa: String((from && from.apsa) || legacyApsa || "").trim(),
          venue: String((from && from.venue) || legacyVenue || "").trim(),
        };
      });
      if (src) {
        Object.keys(src).forEach((pid) => {
          if (cell.byPeriod[pid]) return;
          cell.byPeriod[pid] = {
            apsa: String((src[pid] && src[pid].apsa) || "").trim(),
            venue: String((src[pid] && src[pid].venue) || "").trim(),
          };
        });
      }
      return cell;
    }

    function getTeamCell(teacherId, dayIndex, timeSlotId, weekParity) {
      const tc = ensureTeamCoordination();
      const raw = tc.cells[teamCellKey(teacherId, dayIndex, timeSlotId, weekParity || teamCoordWeekParity)];
      return normalizeTeamCell(raw);
    }

    function teamCellPeriodView(cell, periodId) {
      const c = normalizeTeamCell(cell);
      const pid = periodId || ensureTeamCoordPeriodId();
      const level = teamCellLevel(c);
      const period = teamPeriodsSorted().find((p) => p.id === pid);
      const applies = !period || !level || periodAppliesToLevel(period, level);
      const part = applies && c.byPeriod && c.byPeriod[pid] ? c.byPeriod[pid] : { apsa: "", venue: "" };
      return {
        className: c.className || "",
        level: level,
        apsa: applies ? (part.apsa || "") : "",
        venue: applies ? (part.venue || "") : "",
        periodId: pid,
        applies,
      };
    }

    function setTeamCell(teacherId, dayIndex, timeSlotId, weekParity, data) {
      const tc = ensureTeamCoordination();
      const key = teamCellKey(teacherId, dayIndex, timeSlotId, weekParity);
      const className = String((data && data.className) || "").trim();
      let level = String((data && data.level) || "").trim();
      if (!CLASS_LEVELS.includes(level)) level = inferClassLevel(className) || "";
      if (!CLASS_LEVELS.includes(level)) level = "";
      const byPeriod = {};
      const src = data && data.byPeriod && typeof data.byPeriod === "object" ? data.byPeriod : {};
      const relevant = level ? periodsForLevel(level) : teamPeriodsSorted();
      relevant.forEach((p) => {
        const part = src[p.id] || {};
        byPeriod[p.id] = {
          apsa: String(part.apsa || "").trim(),
          venue: String(part.venue || "").trim(),
        };
      });
      Object.keys(src).forEach((pid) => {
        if (byPeriod[pid]) return;
        byPeriod[pid] = {
          apsa: String((src[pid] && src[pid].apsa) || "").trim(),
          venue: String((src[pid] && src[pid].venue) || "").trim(),
        };
      });
      const hasPeriodData = Object.values(byPeriod).some((p) => p.apsa || p.venue);
      if (!className && !level && !hasPeriodData) {
        delete tc.cells[key];
        return;
      }
      tc.cells[key] = { className, level, byPeriod };
    }

    function normalizeVenueName(v) {
      return String(v || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ");
    }

    function teamTimeLabel(slot) {
      if (!slot) return "—";
      return normalizeTimeHHMM(slot.startTime || "") + "–" + normalizeTimeHHMM(slot.endTime || "");
    }

    function teamCellIsFilled(cell, periodId) {
      const view = teamCellPeriodView(cell, periodId);
      if (periodId && view.applies === false) return false;
      return !!(view.className || view.level || view.venue || view.apsa);
    }

    function teamCellHasAnyData(cell) {
      const c = normalizeTeamCell(cell);
      if (c.className || c.level) return true;
      return Object.values(c.byPeriod || {}).some((p) => p && (p.apsa || p.venue));
    }

    function teamVenueConflictsAt(dayIndex, timeSlotId, weekParity, periodId, dateStr) {
      const tc = ensureTeamCoordination();
      const byVenue = new Map();
      tc.teachers.forEach((t) => {
        const cell = getTeamCell(t.id, dayIndex, timeSlotId, weekParity);
        const level = teamCellLevel(cell);
        const pid = dateStr
          ? periodIdForDateAndLevel(dateStr, level)
          : (periodId || periodIdForDateAndLevel(fmtISODate(new Date()), level) || ensureTeamCoordPeriodId());
        if (!pid) return;
        const view = teamCellPeriodView(cell, pid);
        if (view.applies === false) return;
        const vKey = normalizeVenueName(view.venue);
        if (!vKey || !teamCellIsFilled(cell, pid)) return;
        if (!byVenue.has(vKey)) byVenue.set(vKey, []);
        byVenue.get(vKey).push({ teacher: t, cell, view });
      });
      const conflicts = [];
      byVenue.forEach((list) => {
        if (list.length < 2) return;
        conflicts.push({
          venue: list[0].view.venue,
          venueKey: normalizeVenueName(list[0].view.venue),
          entries: list,
        });
      });
      return conflicts;
    }

    function teamCellHasConflict(teacherId, dayIndex, timeSlotId, weekParity, periodId, dateStr) {
      const cell = getTeamCell(teacherId, dayIndex, timeSlotId, weekParity);
      const level = teamCellLevel(cell);
      const pid = dateStr
        ? periodIdForDateAndLevel(dateStr, level)
        : (periodId || periodIdForDateAndLevel(fmtISODate(new Date()), level) || ensureTeamCoordPeriodId());
      const view = teamCellPeriodView(cell, pid);
      const vKey = normalizeVenueName(view.venue);
      if (!vKey) return false;
      return teamVenueConflictsAt(dayIndex, timeSlotId, weekParity, pid, dateStr).some((c) => c.venueKey === vKey);
    }

    function teamConflictTeacherMarkers(dayIndex, timeSlotId, weekParity, periodId, dateStr) {
      const out = new Map();
      teamVenueConflictsAt(dayIndex, timeSlotId, weekParity, periodId, dateStr).forEach((c) => {
        const color = teamSharedVenueColor(c.venueKey);
        c.entries.forEach((entry) => {
          if (entry && entry.teacher && entry.teacher.id) out.set(entry.teacher.id, color);
        });
      });
      return out;
    }

    function listTeamCoordinationConflicts(weekParity, periodId) {
      const tc = ensureTeamCoordination();
      const w = weekParity || teamCoordWeekParity;
      const pid = periodId || ensureTeamCoordPeriodId();
      const period = teamPeriodsSorted().find((p) => p.id === pid);
      const periodLabel = period ? period.name : "période";
      const lines = [];
      for (let dayIndex = 0; dayIndex < 5; dayIndex++) {
        tc.timeSlots.forEach((ts) => {
          teamVenueConflictsAt(dayIndex, ts.id, w, pid).forEach((c) => {
            const who = c.entries
              .map((e) => (e.teacher.name || "—") + (e.view.className ? " (" + e.view.className + ")" : ""))
              .join(" · ");
            lines.push(
              periodLabel + " · Sem. " + w + " · " + (DOW[dayIndex] || "") + " " + teamTimeLabel(ts) + " — " + c.venue + " : " + who
            );
          });
        });
      }
      return lines;
    }

    function sharedInstallationsForSession(session) {
      if (!session || !session.date) return [];
      const act = session.activityId ? activityById(session.activityId) : null;
      const venueRaw = session.venue || (act && act.venue) || "";
      const venueKey = normalizeVenueName(venueRaw);
      if (!venueKey) return [];
      const dayIndex = dayIndexMon0(parseISODate(session.date));
      if (!Number.isInteger(dayIndex) || dayIndex > 4) return [];
      const st = normalizeTimeHHMM(session.startTime || "");
      const en = normalizeTimeHHMM(session.endTime || "");
      if (!st || !en) return [];
      const weekParity = weekParityForDate(session.date);
      const tc = ensureTeamCoordination();
      const myTeacherId = String((appData.settings && appData.settings.myCoordinationTeacherId) || "");
      const myClass = (() => {
        const cl = getClassById(session.classId);
        return cl ? String(cl.name || "").trim().toLowerCase() : "";
      })();
      const partners = [];
      const seen = new Set();
      tc.timeSlots.forEach((ts) => {
        const sst = normalizeTimeHHMM(ts.startTime || "");
        const sen = normalizeTimeHHMM(ts.endTime || "");
        if (!timeRangesOverlap(st, en, sst, sen)) return;
        tc.teachers.forEach((t) => {
          const cell = getTeamCell(t.id, dayIndex, ts.id, weekParity);
          const pid = periodIdForDateAndLevel(session.date, teamCellLevel(cell));
          if (!pid) return;
          const view = teamCellPeriodView(cell, pid);
          if (view.applies === false) return;
          if (normalizeVenueName(view.venue) !== venueKey) return;
          if (!teamCellIsFilled(cell, pid)) return;
          if (myTeacherId && t.id === myTeacherId) return;
          const cellClass = String(view.className || "").trim().toLowerCase();
          if (myClass && cellClass && cellClass === myClass) return;
          const key = t.id + "|" + cellClass + "|" + venueKey;
          if (seen.has(key)) return;
          seen.add(key);
          partners.push({
            teacherName: t.name || "—",
            className: view.className || "",
            apsa: view.apsa || "",
            venue: view.venue || venueRaw || "",
          });
        });
      });
      return partners;
    }

    function sharedInstallationBadgeHtml(session) {
      const partners = sharedInstallationsForSession(session);
      if (!partners.length) return "";
      const venue = partners.find((p) => p.venue)?.venue || "";
      const whoHtml = partners
        .map((p) => {
          const parts = [];
          parts.push(p.teacherName || "—");
          parts.push(p.apsa ? p.apsa : "APSA non renseignée");
          parts.push(p.className ? p.className : "classe non renseignée");
          return `<span class="dash-share-badge__who">avec ${escapeHtml(parts[0])} · ${escapeHtml(parts[1])} · ${escapeHtml(parts[2])}</span>`;
        })
        .join("");
      const title = partners
        .map(
          (p) =>
            (p.teacherName || "—") +
            " · " +
            (p.apsa || "APSA ?") +
            " · " +
            (p.className || "classe ?") +
            (p.venue ? " @ " + p.venue : "")
        )
        .join(" ; ");
      const head = venue
        ? `🤝 Installation partagée · ${escapeHtml(venue)}`
        : `🤝 Installation partagée`;
      return `<span class="dash-share-badge" title="${escapeHtml(title)}"><span class="dash-share-badge__head">${head}</span>${whoHtml}</span>`;
    }

    function holidayAppliesToSession(holiday, session) {
      if (!holiday || !session) return false;
      if (!(session.date >= holiday.startDate && session.date <= holiday.endDate)) return false;
      if (!holiday.blocksSessions) return false;
      if (!hasTimeWindow(holiday)) return true;
      return timeRangesOverlap(session.startTime || "", session.endTime || "", holiday.startTime, holiday.endTime);
    }

    function schoolEventHasTimeWindow(event) {
      if (!event) return false;
      return !!(normalizeTimeHHMM(event.startTime) && normalizeTimeHHMM(event.endTime));
    }

    function schoolEventIsFullDay(event) {
      if (!event) return true;
      const start = normalizeTimeHHMM(event.startTime || event.time || "");
      const end = normalizeTimeHHMM(event.endTime || "");
      return !start && !end;
    }

    function schoolEventHoursLabel(event) {
      if (!event || schoolEventIsFullDay(event)) return "Journée";
      if (schoolEventHasTimeWindow(event)) {
        return `${normalizeTimeHHMM(event.startTime)}–${normalizeTimeHHMM(event.endTime)}`;
      }
      const start = normalizeTimeHHMM(event.startTime || event.time || "");
      return start || "Journée";
    }

    function schoolEventAppliesToSession(event, session) {
      if (!event || !session || !event.blocksSessions) return false;
      if (session.date !== event.date) return false;
      if (schoolEventIsFullDay(event)) return true;
      const evStart = normalizeTimeHHMM(event.startTime || event.time || "");
      const evEnd = normalizeTimeHHMM(event.endTime || "");
      if (schoolEventHasTimeWindow(event)) {
        return timeRangesOverlap(
          session.startTime || "",
          session.endTime || "",
          evStart,
          evEnd
        );
      }
      if (evStart && !evEnd) {
        const st = normalizeTimeHHMM(session.startTime || "00:00");
        const en = normalizeTimeHHMM(session.endTime || "23:59");
        return evStart >= st && evStart < en;
      }
      return false;
    }

    function blockingSchoolEventForSession(session) {
      return (appData.schoolCalendarEvents || []).find((e) => schoolEventAppliesToSession(e, session));
    }

    function isBlockedBySchoolEvent(dateStr) {
      return (appData.schoolCalendarEvents || []).some(
        (e) => e && e.date === dateStr && e.blocksSessions && schoolEventIsFullDay(e)
      );
    }

    function isBlockedByHoliday(dateStr) {
      // Pendant la génération, seuls les vacances/fériés « journée entière » empêchent la création.
      // Les événements établissement (journée ou créneau) génèrent des séances puis computeSessionStatus → annulée.
      return appData.holidays.some((h) =>
        dateStr >= h.startDate &&
        dateStr <= h.endDate &&
        h.blocksSessions &&
        !hasTimeWindow(h)
      );
    }

    function getHolidayOnDate(dateStr) {
      return appData.holidays.find((h) => dateStr >= h.startDate && dateStr <= h.endDate);
    }

    function blockingHolidayForSession(session) {
      return (appData.holidays || []).find((h) => holidayAppliesToSession(h, session));
    }

    /**
     * APSA pour une séance : période [début, fin] + jours cochés (sinon tous les jours de la période).
     * En cas de chevauchement, priorité aux APSA avec jour explicite correspondant au créneau.
     */
    function pickActivityForSession(classId, dateStr, dayIndex) {
      const inRange = activitiesForClass(classId).filter((a) => {
        const { start, end } = activityEffectiveDates(a);
        return dateStr >= start && dateStr <= end;
      });
      if (!inRange.length) return null;
      const withDay = inRange.filter((a) => Array.isArray(a.dayIndices) && a.dayIndices.length && a.dayIndices.includes(dayIndex));
      const pool = withDay.length ? withDay : inRange.filter((a) => !a.dayIndices || !a.dayIndices.length);
      if (!pool.length) return null;
      pool.sort((a, b) => a.startDate.localeCompare(b.startDate));
      return pool[0];
    }

    function pickActivityForDate(classId, dateStr) {
      const d = parseISODate(dateStr);
      return pickActivityForSession(classId, dateStr, dayIndexMon0(d));
    }

    function cancellationForSession(session) {
      return appData.cancellations.find(
        (c) => c.sessionId === session.id || (c.classId === session.classId && c.date === session.date && c.startTime === session.startTime)
      );
    }

    /**
     * Statut final d'une séance : annulée > vacances/férié > effectuée / prévue.
     */
    function computeSessionStatus(session) {
      const canc = cancellationForSession(session);
      if (canc) return { code: "cancelled", label: "Annulée", reason: canc.reasonType };
      const hol = blockingHolidayForSession(session);
      if (hol) {
        const timed = hasTimeWindow(hol);
        if (timed) {
          return { code: "cancelled", label: "Annulée", reason: hol.name || "Événement calendrier" };
        }
        return { code: "holiday", label: hol.type === "ferie" ? "Jour férié" : "Vacances / événement", reason: hol.name };
      }
      const schoolEv = blockingSchoolEventForSession(session);
      if (schoolEv) {
        return {
          code: "cancelled",
          label: "Annulée",
          reason: schoolEventReminderText(schoolEv),
        };
      }
      const d = parseISODate(session.date);
      const now = todayStart();
      if (d < now) return { code: "done", label: "Effectuée", reason: "" };
      if (isSameDay(d, now)) return { code: "today", label: "Aujourd'hui", reason: "" };
      return { code: "planned", label: "Prévue", reason: "" };
    }

    /** Position d'une séance dans le cycle APSA (hors annulations manuelles). */
    function sessionCyclePosition(session) {
      if (!session || !session.activityId) return null;
      const list = appData.sessions
        .filter((x) => x.classId === session.classId && x.activityId === session.activityId)
        .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      const programmed = list.filter((x) => computeSessionStatus(x).code !== "cancelled");
      const index = programmed.findIndex((x) => x.id === session.id);
      if (index < 0) return null;
      return { index: index + 1, total: programmed.length };
    }

    function sessionCycleLabel(session) {
      const pos = sessionCyclePosition(session);
      if (!pos) return "";
      return `Séance n°${pos.index} sur ${pos.total}`;
    }

    /** Dernière séance avec la même APSA (`activityId`) et la même classe, strictement avant `session`. */
    function previousSameApsaSessionBefore(session) {
      if (!session.activityId) return null;
      const curKey = session.date + String(session.startTime || "");
      const candidates = appData.sessions
        .filter(
          (x) =>
            x.classId === session.classId &&
            x.activityId === session.activityId &&
            x.id !== session.id
        )
        .filter((x) => {
          const st = computeSessionStatus(x);
          return st.code !== "cancelled" && st.code !== "holiday";
        })
        .sort((a, b) => (a.date + String(a.startTime || "")).localeCompare(b.date + String(b.startTime || "")));
      for (let i = candidates.length - 1; i >= 0; i--) {
        const k = candidates[i].date + String(candidates[i].startTime || "");
        if (k.localeCompare(curKey) < 0) return candidates[i];
      }
      return null;
    }

    /** Première séance suivante (même classe, même APSA), après `sessionRef`, hors annulé / vacances-férié. */
    function nextSameApsaSessionAfter(sessionRef) {
      if (!sessionRef.activityId) return null;
      const refKey = sessionRef.date + String(sessionRef.startTime || "");
      const candidates = appData.sessions
        .filter(
          (x) =>
            x.classId === sessionRef.classId &&
            x.activityId === sessionRef.activityId &&
            x.id !== sessionRef.id
        )
        .filter((x) => {
          const st = computeSessionStatus(x);
          return st.code !== "cancelled" && st.code !== "holiday";
        })
        .sort((a, b) => (a.date + String(a.startTime || "")).localeCompare(b.date + String(b.startTime || "")));
      for (let i = 0; i < candidates.length; i++) {
        const k = candidates[i].date + String(candidates[i].startTime || "");
        if (k.localeCompare(refKey) > 0) return candidates[i];
      }
      return null;
    }

    /** Prénoms / noms marqués « absent » sur l’appel d’une séance. */
    function absentStudentNamesFromSessionAttendance(sess) {
      if (!sess || !sess.attendance) return [];
      const att = sess.attendance;
      return Object.keys(att).filter((name) => att[name] === "absent");
    }

    /** Liste discrète des dispensés actifs pour une séance (sans encadré blanc). */
    function injectSessionExemptionsInfo(container, classId, dateStr, sessionId) {
      if (!container) return;
      const activeEx = exemptionsForSession(classId, dateStr, sessionId);
      if (!activeEx.length) {
        container.innerHTML = "";
        return;
      }
      activeEx.sort((a, b) => a.studentName.localeCompare(b.studentName, "fr"));
      container.innerHTML = `<div class="session-exempt-notice" role="note">
        <p class="session-exempt-notice__title">🏥 Élèves dispensés · ${activeEx.length}</p>
        ${activeEx.map((e) => `<p class="session-exempt-notice__item"><strong>${escapeHtml(e.studentName)}</strong> <span>${escapeHtml(formatExemptionDetailLabel(e))}</span></p>`).join("")}
      </div>`;
    }

    /** Texte discret (jaune, sans encadré) : absents du dernier cours de la même APSA. */
    function injectPreviousAbsentReminder(container, session) {
      if (!container) return;
      if (!session.activityId) {
        container.innerHTML = "";
        return;
      }
      const prevSess = previousSameApsaSessionBefore(session);
      const absentPrev = absentStudentNamesFromSessionAttendance(prevSess);
      if (!absentPrev.length || !prevSess) {
        container.innerHTML = "";
        return;
      }
      const immediateNext = nextSameApsaSessionAfter(prevSess);
      if (!immediateNext || immediateNext.id !== session.id) {
        container.innerHTML = "";
        return;
      }
      container.innerHTML = `<div class="sm-alert">${absentPrev
        .map(
          (name) =>
            `<p>${escapeHtml(name)} était absent lors du cours précédent.</p>`
        )
        .join("")}</div>`;
    }

    function openSessionSummaryModal(session) {
      if (!session) return;
      const act = activityById(session.activityId);
      const body = el(`<div>
        <p class="kpi-sub" style="margin-bottom:.75rem"><strong>${fmtDateFr(session.date)}</strong> · ${session.startTime}–${session.endTime}${act ? " · " + escapeHtml(act.name) : ""}</p>
        <div id="cp-prev-absent-reminder"></div>
        <div class="form-group"><label>Résumé de la séance</label><textarea id="f-summary" rows="6" style="width:100%;font-size:.9rem;line-height:1.5" placeholder="Contenu de la séance, observations, points à retenir…"></textarea></div>
      </div>`);
      body.querySelector("#f-summary").value = session.summary || "";
      injectPreviousAbsentReminder(body.querySelector("#cp-prev-absent-reminder"), session);
      body.appendChild(buildAttendanceBlock(session));
      body.appendChild(buildSessionPdfBlock(session));
      openModal("Résumé de séance", body, () => {
        session.summary = body.querySelector("#f-summary").value;
        saveData();
        render();
      });
    }

    function migrateDataModel() {
      appData.schedules.forEach((s) => {
        if (s.weekParity !== "A" && s.weekParity !== "B" && s.weekParity !== "all") s.weekParity = "all";
      });
      appData.activities.forEach((a) => {
        if (!Array.isArray(a.dayIndices)) a.dayIndices = [];
      });
      if (!appData.levelApsaNames || typeof appData.levelApsaNames !== "object") appData.levelApsaNames = {};
      CLASS_LEVELS.forEach((level) => {
        if (!Array.isArray(appData.levelApsaNames[level])) appData.levelApsaNames[level] = [];
      });
      if (!appData.levelApsaByCA || typeof appData.levelApsaByCA !== "object") appData.levelApsaByCA = {};
      CLASS_LEVELS.forEach((level) => {
        if (!appData.levelApsaByCA[level] || typeof appData.levelApsaByCA[level] !== "object") appData.levelApsaByCA[level] = {};
        ["CA1", "CA2", "CA3", "CA4"].forEach((ca) => {
          if (!Array.isArray(appData.levelApsaByCA[level][ca])) appData.levelApsaByCA[level][ca] = [];
        });
      });
      if (!Array.isArray(appData.exemptions)) appData.exemptions = [];
      appData.exemptions.forEach((ex) => {
        if (ex.sansCertificat === undefined) ex.sansCertificat = false;
        if (ex.sessionId === undefined) ex.sessionId = null;
      });
      if (!Array.isArray(appData.periods)) appData.periods = [];
      appData.periods.forEach((p) => {
        if (!p.classDateOverrides || typeof p.classDateOverrides !== "object") p.classDateOverrides = {};
      });
      (appData.periods || []).forEach((p) => syncActivitiesDatesFromPeriod(p));
      if (!Array.isArray(appData.venues)) appData.venues = [];
      if (appData.progEtabPdf === undefined) appData.progEtabPdf = null;
      ensureTeamCoordination();
      if (!appData.settings.myCoordinationTeacherId) appData.settings.myCoordinationTeacherId = "";
      if (!Array.isArray(appData.forgottenGear)) appData.forgottenGear = [];
      appData.classes.forEach((cl) => {
        if (!Array.isArray(cl.students)) cl.students = [];
        if (!cl.level) cl.level = inferClassLevel(cl.name) || (Number(cl.cycleYears) === 3 ? "6e" : "5e");
        cl.apsaPerPeriod = Number(cl.apsaPerPeriod) === 1 ? 1 : 2;
        cl.enrollment = cl.students.length ? cl.students.length : Math.max(0, Number(cl.enrollment) || 0);
      });
      appData.sessions.forEach((s) => { if (!s.attendance) s.attendance = {}; });
      if (!Array.isArray(appData.todoList)) appData.todoList = [];
      if (!Array.isArray(appData.reminders)) appData.reminders = [];
      if (!Array.isArray(appData.schoolCalendarEvents)) appData.schoolCalendarEvents = [];
      appData.reminders.forEach((r) => {
        if (r && !r.id) r.id = uid();
        if (r && r.text) r.text = String(r.text).trim();
        if (r && r.date) {
          const iso = coerceISODateString(r.date);
          if (iso) r.date = iso;
        }
        if (r && !Number.isInteger(r.daysBefore)) r.daysBefore = 7;
        if (r && r.daysBefore < 0) r.daysBefore = 0;
        if (r && r.schoolTermId == null) r.schoolTermId = "";
      });
      appData.reminders = (appData.reminders || []).filter((r) => r && !r.dismissedFromHome);
      appData.schoolCalendarEvents = appData.schoolCalendarEvents
        .map((e) => {
          if (!e || typeof e !== "object") return null;
          const date = String(e.date || "").trim();
          const title = String(e.title || "").trim();
          if (!date || !title) return null;
          const startTime = normalizeTimeHHMM(e.startTime || e.time || "");
          const endTime = normalizeTimeHHMM(e.endTime || "");
          return {
            id: e.id || uid(),
            date,
            startTime,
            endTime,
            title,
            kind: String(e.kind || "").trim(),
            blocksSessions: !!e.blocksSessions,
          };
        })
        .filter(Boolean);
      if (!appData.schoolTermSchedule || typeof appData.schoolTermSchedule !== "object") {
        appData.schoolTermSchedule = { mode: "trimestre", terms: [] };
      }
      normalizeSchoolTermSchedule();
      if (!appData.settings.academy) appData.settings.academy = "";
      if (!appData.settings.calendarSchoolYear) {
        appData.settings.calendarSchoolYear = schoolYearLabelFromSettings() || "2025-2026";
      }
      if (!appData.association || typeof appData.association !== "object") appData.association = {};
      if (!Array.isArray(appData.association.activities)) appData.association.activities = [];
      if (!Array.isArray(appData.association.cancellations)) appData.association.cancellations = [];
      if (!appData.association.attendanceRecords || typeof appData.association.attendanceRecords !== "object") {
        appData.association.attendanceRecords = {};
      }
      appData.association.activities.forEach((a) => {
        if (!Array.isArray(a.trainings)) a.trainings = [];
        if (!Array.isArray(a.students)) a.students = [];
        if (!Array.isArray(a.competitions)) a.competitions = [];
        if (typeof a.seasonStart !== "string") a.seasonStart = a.seasonStart ? String(a.seasonStart) : "";
        if (typeof a.seasonEnd !== "string") a.seasonEnd = a.seasonEnd ? String(a.seasonEnd) : "";
        a.students = a.students.map(normalizeAssociationStudent);
        if (!Array.isArray(a.adminColumns)) a.adminColumns = [];
        if (!a.adminChecks || typeof a.adminChecks !== "object") a.adminChecks = {};
        if (!a.adminBySlot || typeof a.adminBySlot !== "object") a.adminBySlot = {};
        migrateAssociationAdminToSlots(a);
        a.trainings.forEach((t) => {
          if (t && !t.id) t.id = uid();
        });
        a.competitions.forEach((c) => {
          if (c && !c.id) c.id = uid();
          if (c) normalizeAssociationCompetition(c);
        });
      });
    }

    function associationCompetitionCategoryAgeFromBase(base) {
      const b = String(base || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      if (b.includes("benjamin")) return "benjamins";
      if (b.includes("minime")) return "minimes";
      return b || "";
    }

    function normalizeAssociationCompetition(c) {
      if (!c || typeof c !== "object") return c;
      const catStr = String(c.category || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      let categoryAge = String(c.categoryAge || "")
        .trim()
        .toLowerCase();
      let sex = String(c.sex || "")
        .trim()
        .toLowerCase();
      if (!categoryAge) categoryAge = associationCompetitionCategoryAgeFromBase(catStr);
      if (!sex) {
        if (/\bfilles?\b|\bfeminines?\b/.test(catStr)) sex = "filles";
        else if (/\bgarcons?\b|\bgarçons?\b|\bmasculins?\b/.test(catStr)) sex = "garçons";
        else if (/\btous\b|\bmixte\b/.test(catStr)) sex = "tous";
      }
      if (categoryAge) c.categoryAge = categoryAge;
      if (sex) c.sex = sex;
      return c;
    }

    function associationSlotKey(dayIndex, startTime, endTime) {
      return `${dayIndex}|${startTime || ""}|${endTime || ""}`;
    }

    function associationListDistinctSlots(activity) {
      const map = new Map();
      (activity.trainings || []).forEach((t) => {
        if (!t || !Number.isInteger(t.dayIndex)) return;
        const key = associationSlotKey(t.dayIndex, t.startTime, t.endTime);
        if (!map.has(key)) {
          map.set(key, {
            key,
            dayIndex: t.dayIndex,
            startTime: t.startTime || "",
            endTime: t.endTime || "",
          });
        }
      });
      return [...map.values()].sort(
        (a, b) => a.dayIndex - b.dayIndex || String(a.startTime).localeCompare(String(b.startTime))
      );
    }

    function associationSlotScheduleLabel(slot) {
      const day = DOW[slot.dayIndex] ? DOW[slot.dayIndex].slice(0, 3) + "." : "";
      const time = formatAssociationRecapSlotTime(slot.startTime, slot.endTime);
      return [day, time].filter(Boolean).join(" · ") || "Créneau";
    }

    function associationSlotCategoriesFullLabel(activity, slot) {
      if (!activity || !slot || !Number.isInteger(slot.dayIndex)) return "Tous";
      const configured = associationSlotConfiguredGroups(
        activity,
        slot.dayIndex,
        slot.startTime,
        slot.endTime
      );
      if (!configured) return "Tous";
      return associationFormatGroupLabels(configured);
    }

    function associationSlotCategoriesLabel(activity, slot) {
      if (!activity || !slot || !Number.isInteger(slot.dayIndex)) return "Tous";
      const configured = associationSlotConfiguredGroups(
        activity,
        slot.dayIndex,
        slot.startTime,
        slot.endTime
      );
      if (!configured) return "Tous";
      return associationFormatGroupLabelsAbbrev(configured);
    }

    function associationSlotTabLabel(slot, activity) {
      const schedule = associationSlotScheduleLabel(slot);
      if (!activity) return schedule;
      const cats = associationSlotCategoriesLabel(activity, slot);
      if (!cats || cats === "Tous") return schedule;
      return `${schedule} — ${cats}`;
    }

    function renderAssociationSlotTabHtml(activity, activityId, slot, active) {
      const schedule = associationSlotScheduleLabel(slot);
      const cats = associationSlotCategoriesLabel(activity, slot);
      const catsFull = associationSlotCategoriesFullLabel(activity, slot);
      const catsHtml =
        cats && cats !== "Tous"
          ? `<span class="as-slot-tab__cats"${catsFull !== cats ? ` title="${escapeHtml(catsFull)}"` : ""}>${escapeHtml(cats)}</span>`
          : `<span class="as-slot-tab__cats as-slot-tab__cats--all">Toutes catégories</span>`;
      const title = cats !== "Tous" ? `${schedule} — ${catsFull}` : schedule;
      return `<button type="button" class="as-activity-tab btn-dash-as-slot-tab${active ? " as-activity-tab--active" : ""}" data-activity-id="${escapeHtml(activityId)}" data-slot-key="${escapeHtml(slot.key)}" title="${escapeHtml(title)}">
        <span class="as-slot-tab__when">${escapeHtml(schedule)}</span>
        ${catsHtml}
      </button>`;
    }

    function associationSlotCategoriesHintHtml(activity, slot) {
      if (!activity || !slot) return "";
      const cats = associationSlotCategoriesLabel(activity, slot);
      const schedule = associationSlotScheduleLabel(slot);
      const catsFull = associationSlotCategoriesFullLabel(activity, slot);
      const catsTitle = catsFull !== cats ? ` title="${escapeHtml(catsFull)}"` : "";
      return `<p class="kpi-sub as-slot-categories-hint"><strong>Créneau ${escapeHtml(schedule)}</strong> — Catégories : <span${catsTitle}>${escapeHtml(cats)}</span></p>`;
    }

    function ensureAssociationAdminSlotStore(activity, slotKey) {
      if (!activity.adminBySlot || typeof activity.adminBySlot !== "object") activity.adminBySlot = {};
      if (!activity.adminBySlot[slotKey]) {
        activity.adminBySlot[slotKey] = { columns: [], checks: {} };
      }
      const store = activity.adminBySlot[slotKey];
      if (!Array.isArray(store.columns)) store.columns = [];
      if (!store.checks || typeof store.checks !== "object") store.checks = {};
      return store;
    }

    function migrateAssociationAdminToSlots(activity) {
      if (activity._adminSlotsMigrated) return;
      const slots = associationListDistinctSlots(activity);
      if (slots.length <= 1) {
        activity._adminSlotsMigrated = true;
        return;
      }
      const legacyCols = Array.isArray(activity.adminColumns) ? activity.adminColumns : [];
      const legacyChecks =
        activity.adminChecks && typeof activity.adminChecks === "object" ? activity.adminChecks : {};
      const hasLegacy = legacyCols.length > 0 || Object.keys(legacyChecks).length > 0;
      slots.forEach((slot, i) => {
        const store = ensureAssociationAdminSlotStore(activity, slot.key);
        if (hasLegacy && i === 0 && !store.columns.length) {
          store.columns = legacyCols.map((c) => ({ id: c.id || uid(), label: c.label }));
          store.checks = JSON.parse(JSON.stringify(legacyChecks));
        }
      });
      activity._adminSlotsMigrated = true;
    }

    function getAssociationAdminStore(activity, slotKey) {
      const slots = associationListDistinctSlots(activity);
      if (slots.length <= 1) {
        if (!Array.isArray(activity.adminColumns)) activity.adminColumns = [];
        if (!activity.adminChecks || typeof activity.adminChecks !== "object") activity.adminChecks = {};
        return { columns: activity.adminColumns, checks: activity.adminChecks, slotKey: slots[0]?.key || "" };
      }
      migrateAssociationAdminToSlots(activity);
      const key = slotKey && slots.some((s) => s.key === slotKey) ? slotKey : slots[0].key;
      const store = ensureAssociationAdminSlotStore(activity, key);
      return { columns: store.columns, checks: store.checks, slotKey: key };
    }

    function getAssociationAdminCellValue(activity, colId, studentIdx, slotKey) {
      const store = getAssociationAdminStore(activity, slotKey);
      const col = store.checks[colId];
      const raw = col && col[String(studentIdx)];
      if (raw === true) return { checked: true, text: "" };
      if (typeof raw === "string" && raw.length) return { checked: false, text: raw };
      return { checked: false, text: "" };
    }

    function setAssociationAdminCell(activity, colId, studentIdx, { checked, text }, slotKey) {
      const store = getAssociationAdminStore(activity, slotKey);
      if (!store.checks[colId]) store.checks[colId] = {};
      const key = String(studentIdx);
      const t = (text || "").trim();
      if (t) {
        store.checks[colId][key] = t;
      } else if (checked) {
        store.checks[colId][key] = true;
      } else {
        delete store.checks[colId][key];
      }
    }

    function associationAdminCellContext(el) {
      const cell = el && el.closest(".as-admin-cell");
      if (!cell) return null;
      const activityId = cell.getAttribute("data-activity-id");
      const colId = cell.getAttribute("data-col-id");
      const studentIdx = Number(cell.getAttribute("data-student-idx"));
      const slotKey = cell.getAttribute("data-slot-key") || "";
      const activity = (appData.association.activities || []).find((x) => x.id === activityId);
      if (!activity || !colId || !Number.isInteger(studentIdx)) return null;
      return { cell, activity, colId, studentIdx, slotKey };
    }

    function openAssociationAdminCellEdit(cell) {
      const display = cell.querySelector(".as-admin-cell-display");
      const input = cell.querySelector(".as-admin-cell-input");
      if (!display || !input) return;
      display.style.display = "none";
      input.style.display = "block";
      requestAnimationFrame(() => {
        input.focus({ preventScroll: true });
        try {
          input.select();
        } catch (err) {}
      });
    }

    function refreshAssociationAdminCellViews(activityId, colId, studentIdx, slotKey) {
      const activity = (appData.association?.activities || []).find((x) => x.id === activityId);
      if (!activity) return;
      const val = getAssociationAdminCellValue(activity, colId, studentIdx, slotKey || "");
      const escAttr = (v) => String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      const slotPart = slotKey ? `[data-slot-key="${escAttr(slotKey)}"]` : "";
      const sel = `.as-admin-cell[data-activity-id="${escAttr(activityId)}"][data-col-id="${escAttr(colId)}"][data-student-idx="${studentIdx}"]${slotPart}`;
      document.querySelectorAll(sel).forEach((cell) => {
        const cb = cell.querySelector(".as-admin-check");
        const display = cell.querySelector(".as-admin-cell-display");
        const input = cell.querySelector(".as-admin-cell-input");
        const textSpan = cell.querySelector(".as-admin-cell-text");
        if (cb) cb.checked = val.checked;
        if (input) input.value = val.text || "";
        if (textSpan) {
          textSpan.innerHTML = val.text
            ? escapeHtml(val.text)
            : '<span class="kpi-sub" style="opacity:.35">—</span>';
        }
        if (display && input) {
          display.style.display = "";
          input.style.display = "none";
        }
      });
    }

    function refreshAssociationAdminAfterEdit(activityId, colId, studentIdx, slotKey) {
      saveData();
      if (activityId && colId != null && studentIdx != null) {
        refreshAssociationAdminCellViews(activityId, colId, studentIdx, slotKey);
      }
      const modalOpen = document.getElementById("modal-root")?.classList.contains("open");
      if (currentView === "dashboard:association" && !modalOpen) {
        refreshAssociationDashPlanning();
      }
    }

    function saveAssociationAdminCellEdit(cell) {
      const ctx = associationAdminCellContext(cell);
      if (!ctx) return;
      const input = cell.querySelector(".as-admin-cell-input");
      const cb = cell.querySelector(".as-admin-check");
      if (!input) return;
      const text = input.value.trim();
      setAssociationAdminCell(
        ctx.activity,
        ctx.colId,
        ctx.studentIdx,
        {
          checked: text ? false : !!(cb && cb.checked),
          text,
        },
        ctx.slotKey
      );
      refreshAssociationAdminAfterEdit(ctx.activity.id, ctx.colId, ctx.studentIdx, ctx.slotKey);
    }

    function wireAssociationAdminCellEvents(planningRoot) {
      if (!planningRoot) return;
      if (planningRoot.dataset.asAdminCellsWired) return;
      planningRoot.dataset.asAdminCellsWired = "1";
      let adminLongPressTimer = null;
      let adminLongPressCell = null;
      let adminSuppressClickUntil = 0;

      const tryOpenAdminTextEdit = (cell, e) => {
        if (!cell || e.target.closest(".as-admin-check") || e.target.closest(".as-admin-cell-input")) return false;
        if (e && e.preventDefault) e.preventDefault();
        if (e && e.stopPropagation) e.stopPropagation();
        adminSuppressClickUntil = Date.now() + 450;
        openAssociationAdminCellEdit(cell);
        return true;
      };

      planningRoot.addEventListener("dblclick", (e) => {
        const cell = e.target.closest(".as-admin-cell");
        if (cell) tryOpenAdminTextEdit(cell, e);
      });

      planningRoot.addEventListener("click", (e) => {
        if (e.target.closest(".as-admin-check")) {
          e.stopPropagation();
          return;
        }
        if (Date.now() < adminSuppressClickUntil) return;
        const textEl = e.target.closest(".as-admin-cell-text");
        const cell = textEl && textEl.closest(".as-admin-cell");
        if (cell && window.matchMedia("(pointer: coarse)").matches) {
          const wrap = cell.closest(".as-admin-table-wrap");
          if (
            wrap &&
            !cell.closest(".table-landscape-view") &&
            !cell.closest(".table-fullscreen-view") &&
            window.matchMedia("(max-width: 480px)").matches
          ) {
            e.preventDefault();
            e.stopPropagation();
            openFullscreenAdminTable(wrap);
            return;
          }
          tryOpenAdminTextEdit(cell, e);
        }
      });

      planningRoot.addEventListener(
        "touchstart",
        (e) => {
          const cell = e.target.closest(".as-admin-cell");
          if (!cell || e.target.closest(".as-admin-check")) return;
          adminLongPressCell = cell;
          clearTimeout(adminLongPressTimer);
          adminLongPressTimer = setTimeout(() => {
            adminLongPressTimer = null;
            if (adminLongPressCell === cell) tryOpenAdminTextEdit(cell, e);
          }, 480);
        },
        { passive: true }
      );
      const cancelAdminLongPress = () => {
        clearTimeout(adminLongPressTimer);
        adminLongPressTimer = null;
        adminLongPressCell = null;
      };
      planningRoot.addEventListener("touchend", cancelAdminLongPress, { passive: true });
      planningRoot.addEventListener("touchmove", cancelAdminLongPress, { passive: true });
      planningRoot.addEventListener("touchcancel", cancelAdminLongPress, { passive: true });

      planningRoot.addEventListener("change", (e) => {
        const cb = e.target.closest(".as-admin-check");
        if (!cb) return;
        e.stopPropagation();
        const ctx = associationAdminCellContext(cb);
        if (!ctx) return;
        setAssociationAdminCell(ctx.activity, ctx.colId, ctx.studentIdx, { checked: cb.checked, text: "" }, ctx.slotKey);
        refreshAssociationAdminAfterEdit(ctx.activity.id, ctx.colId, ctx.studentIdx, ctx.slotKey);
      });

      planningRoot.addEventListener(
        "keydown",
        (e) => {
          const textEl = e.target.closest(".as-admin-cell-text");
          if (textEl && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            const cell = textEl.closest(".as-admin-cell");
            if (cell) openAssociationAdminCellEdit(cell);
          }
          if (e.key === "Enter" && e.target.classList.contains("as-admin-cell-input")) {
            e.preventDefault();
            saveAssociationAdminCellEdit(e.target.closest(".as-admin-cell"));
          }
          if (e.key === "Escape" && e.target.classList.contains("as-admin-cell-input")) {
            const cell = e.target.closest(".as-admin-cell");
            const ctx = cell && associationAdminCellContext(cell);
            if (ctx) refreshAssociationAdminAfterEdit(ctx.activity.id, ctx.colId, ctx.studentIdx, ctx.slotKey);
            else refreshAssociationDashPlanning();
          }
        },
        true
      );

      planningRoot.addEventListener(
        "blur",
        (e) => {
          if (e.target.classList.contains("as-admin-cell-input")) {
            saveAssociationAdminCellEdit(e.target.closest(".as-admin-cell"));
          }
        },
        true
      );
    }

    function renderAssociationAdminCell(activity, col, studentIdx, slotKey) {
      const { checked, text } = getAssociationAdminCellValue(activity, col.id, studentIdx, slotKey || "");
      return `<td class="as-admin-cell" data-label="${escapeHtml(col.label)}" data-activity-id="${escapeHtml(activity.id)}" data-col-id="${escapeHtml(col.id)}" data-student-idx="${studentIdx}" data-slot-key="${escapeHtml(slotKey || "")}" title="Case : cocher · Texte : double-clic (ordinateur) ou appui long (iPhone)">
        <div class="as-admin-cell-display">
          <input type="checkbox" class="as-admin-check" ${checked ? "checked" : ""} aria-label="${escapeHtml(col.label)}" />
          <span class="as-admin-cell-text" role="button" tabindex="0" aria-label="Saisir du texte">${text ? escapeHtml(text) : '<span class="kpi-sub" style="opacity:.35">—</span>'}</span>
        </div>
        <input type="text" class="as-admin-cell-input" style="display:none" value="${escapeHtml(text)}" placeholder="Saisie…" inputmode="text" />
      </td>`;
    }

    function viewAssociationAdminBody(activity, slotKey) {
      const store = getAssociationAdminStore(activity, slotKey || "");
      const adminSlotKey = store.slotKey || slotKey || "";
      const students = (activity.students || []).map(normalizeAssociationStudent);
      const columns = store.columns;
      const slotObj = associationListDistinctSlots(activity).find((s) => s.key === adminSlotKey);
      const multiSlot = associationListDistinctSlots(activity).length > 1;
      const slotLabel = slotObj && multiSlot ? associationSlotTabLabel(slotObj, activity) : "";
      const slotCatsHint =
        slotObj && (multiSlot || associationSlotCategoriesLabel(activity, slotObj) !== "Tous")
          ? associationSlotCategoriesHintHtml(activity, slotObj)
          : "";
      const colHeaders = columns.map((col) =>
        `<th class="as-admin-col-head no-print">${escapeHtml(col.label)}
          <button type="button" class="btn btn-sm btn-danger btn-as-admin-del-col" data-col-id="${escapeHtml(col.id)}" data-activity-id="${escapeHtml(activity.id)}" data-slot-key="${escapeHtml(adminSlotKey)}" style="display:block;margin:.25rem auto 0;padding:.1rem .35rem;font-size:.65rem" title="Supprimer la colonne">✕</button>
        </th>`
      ).join("");
      const rows = students.length
        ? students.map((st, idx) => {
            const { firstName, lastName } = splitAssociationStudentName(st.name);
            const catAbbrev = formatAssociationCategoryAbbrev(st.category);
            const catTitle = st.category ? ` title="${escapeHtml(st.category)}"` : "";
            const checks = columns.map((col) => renderAssociationAdminCell(activity, col, idx, adminSlotKey)).join("");
            return `<tr>
              <td data-label="Prénom" class="as-admin-name-cell"><button type="button" class="btn-as-admin-del-student no-print" data-activity-id="${escapeHtml(activity.id)}" data-student-idx="${idx}" aria-label="Supprimer ${escapeHtml(firstName || st.name)}">✕</button>${escapeHtml(firstName) || "—"}</td>
              <td data-label="Nom">${escapeHtml(lastName) || "—"}</td>
              <td data-label="Classe">${escapeHtml(st.className) || "—"}</td>
              <td data-label="Cat."${catTitle}><strong>${escapeHtml(catAbbrev)}</strong></td>
              ${checks}
            </tr>`;
          }).join("")
              : `<tr><td colspan="${columns.length + 4}" class="kpi-sub" style="text-align:center">Aucun élève inscrit. Ajoutez-les dans Réglages → Association sportive.</td></tr>`;
      const tableTitle = slotLabel
        ? `Gestion administrative — ${activity.name} — ${slotLabel}`
        : `Gestion administrative — ${activity.name}`;
      return `<div>
        ${slotCatsHint}
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem">
          <button type="button" class="btn btn-sm btn-primary btn-as-admin-add-col" data-id="${escapeHtml(activity.id)}" data-slot-key="${escapeHtml(adminSlotKey)}">+ Ajouter une colonne</button>
        </div>
        <div class="table-wrap as-admin-table-wrap as-admin-table-wrap--tap-fullscreen" data-table-title="${escapeHtml(tableTitle)}">
          <table class="as-admin-table">
          <thead><tr><th>Prénom</th><th>Nom</th><th>Classe</th><th title="Catégorie (abréviation)">Cat.</th>${colHeaders || ""}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
      </div>`;
    }

    function normalizeAssociationStudent(raw) {
      if (raw && typeof raw === "object" && raw.name) {
        return {
          name: String(raw.name).trim(),
          className: String(raw.className || raw.class || "").trim(),
          category: String(raw.category || "").trim(),
        };
      }
      if (typeof raw === "string") {
        return { name: raw.trim(), className: "", category: "" };
      }
      return { name: "", className: "", category: "" };
    }

    function splitAssociationStudentName(fullName) {
      const parts = String(fullName || "")
        .trim()
        .split(/\s+/)
        .filter(Boolean);
      if (!parts.length) return { firstName: "", lastName: "" };
      if (parts.length === 1) return { firstName: parts[0], lastName: "" };
      return { firstName: parts[0], lastName: parts.slice(1).join(" ") };
    }

    function normalizeAssociationCategoryToken(s) {
      return String(s || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    /** Abréviation catégorie : 1re lettre âge + 1re lettre sexe (ex. benjamins filles → BF). */
    function associationCategoryAbbrevFromPart(part) {
      const s = normalizeAssociationCategoryToken(part);
      if (!s) return "";
      let catLetter = "";
      if (/\bbenjamin/.test(s)) catLetter = "B";
      else if (/\bminime/.test(s)) catLetter = "M";
      else if (/\bcadet/.test(s)) catLetter = "C";
      let sexLetter = "";
      if (/\bfill/.test(s) || /\bfemin/.test(s)) sexLetter = "F";
      else if (/\bgarcon/.test(s) || /\bmasculin/.test(s)) sexLetter = "G";
      if (catLetter && sexLetter) return catLetter + sexLetter;
      if (catLetter) return catLetter;
      const words = s.split(/\s+/).filter(Boolean);
      if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
      return "";
    }

    function formatAssociationCategoryAbbrev(category) {
      if (!category || !String(category).trim()) return "—";
      const parts = String(category)
        .split(/[·,;|/]+/)
        .map((p) => p.trim())
        .filter(Boolean);
      const abbrevs = parts.map(associationCategoryAbbrevFromPart).filter(Boolean);
      if (abbrevs.length) return abbrevs.join(" ");
      const single = associationCategoryAbbrevFromPart(category);
      return single || String(category).trim();
    }

    /** Abrège un libellé détail (ex. « benjamins filles · minimes garçons » → « BF MG »). */
    function formatAssociationDetailAbbrev(detail) {
      const raw = String(detail || "").trim();
      if (!raw || /^tous$/i.test(raw)) return "Tous";
      const parts = raw.split(/[·,;|/]+/).map((p) => p.trim()).filter(Boolean);
      if (!parts.length) {
        const a = formatAssociationCategoryAbbrev(raw);
        return a !== "—" ? a : raw;
      }
      const abbrevs = parts.map((p) => formatAssociationCategoryAbbrev(p)).filter((a) => a && a !== "—");
      return abbrevs.length ? abbrevs.join(" ") : raw;
    }

    function associationFormatGroupLabelsAbbrev(groupSet) {
      if (!groupSet || !groupSet.size) return "Tous";
      const abbrevs = [...groupSet]
        .map((g) => formatAssociationCategoryAbbrev(g))
        .filter((a) => a && a !== "—");
      return abbrevs.length ? abbrevs.join(" ") : "Tous";
    }

    function formatAssociationStudentLabel(st) {
      const parts = [st.name];
      if (st.className) parts.push(st.className);
      if (st.category) parts.push(st.category);
      return parts.filter(Boolean).join(" · ");
    }

    function buildAssociationCategoryLabel(body) {
      const cats = [...body.querySelectorAll(".f-as-stu-cat:checked")].map((x) => x.value);
      const sexes = [...body.querySelectorAll(".f-as-stu-sex:checked")].map((x) => x.value);
      const combined = [];
      if (cats.length && sexes.length) {
        cats.forEach((c) => sexes.forEach((s) => combined.push(`${c} ${s}`)));
      } else if (cats.length) {
        cats.forEach((c) => combined.push(c));
      } else if (sexes.length) {
        sexes.forEach((s) => combined.push(s));
      }
      const manual = (body.querySelector("#f-as-stu-category-manual").value || "").trim();
      if (manual) combined.push(manual);
      return [...new Set(combined)].join(" · ");
    }

    function associationStudentFormHtml() {
      return `<div class="form-row">
          <div class="form-group" style="flex:1;min-width:6rem"><label>Prénom</label><input id="f-as-student-first" placeholder="Marie" /></div>
          <div class="form-group" style="flex:1;min-width:6rem"><label>Nom</label><input id="f-as-student-last" placeholder="Dupont" /></div>
        </div>
        <div class="form-group"><label>Classe</label><input id="f-as-student-class" placeholder="ex : 5e3" /></div>
        <div class="form-group"><label>Catégorie et sexe</label>
          <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.35rem">
            <label style="display:inline-flex;gap:.25rem;align-items:center"><input type="checkbox" class="f-as-stu-cat" value="benjamins" /> Benjamins</label>
            <label style="display:inline-flex;gap:.25rem;align-items:center"><input type="checkbox" class="f-as-stu-cat" value="minimes" /> Minimes</label>
          </div>
          <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.35rem">
            <label style="display:inline-flex;gap:.25rem;align-items:center"><input type="checkbox" class="f-as-stu-sex" value="filles" /> Filles</label>
            <label style="display:inline-flex;gap:.25rem;align-items:center"><input type="checkbox" class="f-as-stu-sex" value="garçons" /> Garçons</label>
          </div>
          <input id="f-as-stu-category-manual" placeholder="ex : minimes filles, benjamines filles" />
        </div>`;
    }

    function applyAssociationCategoryToForm(body, category) {
      body.querySelectorAll(".f-as-stu-cat, .f-as-stu-sex").forEach((cb) => {
        cb.checked = false;
      });
      const manual = body.querySelector("#f-as-stu-category-manual");
      if (manual) manual.value = "";
      if (!category || !String(category).trim()) return;
      const parts = String(category)
        .split(/[·,;|/]+/)
        .map((p) => p.trim())
        .filter(Boolean);
      const unparsed = [];
      parts.forEach((part) => {
        const s = normalizeAssociationCategoryToken(part);
        let matched = false;
        if (/\bbenjamin/.test(s)) {
          const el = body.querySelector('.f-as-stu-cat[value="benjamins"]');
          if (el) {
            el.checked = true;
            matched = true;
          }
        }
        if (/\bminime/.test(s)) {
          const el = body.querySelector('.f-as-stu-cat[value="minimes"]');
          if (el) {
            el.checked = true;
            matched = true;
          }
        }
        if (/\bfill/.test(s) || /\bfemin/.test(s)) {
          const el = body.querySelector('.f-as-stu-sex[value="filles"]');
          if (el) {
            el.checked = true;
            matched = true;
          }
        }
        if (/\bgarcon/.test(s) || /\bmasculin/.test(s)) {
          const el = body.querySelector('.f-as-stu-sex[value="garçons"]');
          if (el) {
            el.checked = true;
            matched = true;
          }
        }
        if (!matched) unparsed.push(part);
      });
      if (unparsed.length && manual) manual.value = unparsed.join(" · ");
    }

    function fillAssociationStudentForm(body, st) {
      const norm = normalizeAssociationStudent(st);
      const { firstName, lastName } = splitAssociationStudentName(norm.name);
      const first = body.querySelector("#f-as-student-first");
      const last = body.querySelector("#f-as-student-last");
      const cls = body.querySelector("#f-as-student-class");
      if (first) first.value = firstName;
      if (last) last.value = lastName;
      if (cls) cls.value = norm.className;
      applyAssociationCategoryToForm(body, norm.category);
    }

    function clearAssociationStudentForm(body) {
      fillAssociationStudentForm(body, { name: "", className: "", category: "" });
    }

    function readAssociationStudentFromForm(body) {
      const firstName = (body.querySelector("#f-as-student-first")?.value || "").trim();
      const lastName = (body.querySelector("#f-as-student-last")?.value || "").trim();
      const name = [firstName, lastName].filter(Boolean).join(" ");
      if (!name) return null;
      const className = (body.querySelector("#f-as-student-class")?.value || "").trim();
      const category = buildAssociationCategoryLabel(body);
      return normalizeAssociationStudent({ name, className, category });
    }

    function reindexAssociationAdminChecksAfterRemove(activity, removedIdx) {
      const reindexChecks = (checks) => {
        if (!checks || typeof checks !== "object") return;
        Object.keys(checks).forEach((colId) => {
          const col = checks[colId];
          if (!col || typeof col !== "object") return;
          const next = {};
          Object.keys(col).forEach((key) => {
            const oldIdx = Number(key);
            if (!Number.isInteger(oldIdx)) return;
            if (oldIdx < removedIdx) next[String(oldIdx)] = col[key];
            else if (oldIdx > removedIdx) next[String(oldIdx - 1)] = col[key];
          });
          checks[colId] = next;
        });
      };
      reindexChecks(activity.adminChecks);
      if (activity.adminBySlot && typeof activity.adminBySlot === "object") {
        Object.values(activity.adminBySlot).forEach((store) => reindexChecks(store.checks));
      }
    }

    function requestAssociationStudentPermanentDelete(activity, index, onDeleted) {
      if (!Array.isArray(activity.students) || index < 0 || index >= activity.students.length) return;
      const st = normalizeAssociationStudent(activity.students[index]);
      const label = escapeHtml(st.name || "cet élève");
      const body = el(`<div>
        <p style="margin:0 0 .65rem;font-weight:700">Suppression définitive de ${label}</p>
        <p class="kpi-sub" style="margin:0 0 .45rem">Cet élève sera retiré <strong>définitivement</strong> de cette activité :</p>
        <ul class="kpi-sub" style="margin:0 0 .65rem;padding-left:1.15rem;line-height:1.45">
          <li>Liste des élèves (Réglages)</li>
          <li>Tableau de gestion administrative</li>
          <li>Suivi administratif (cases cochées)</li>
        </ul>
        <p class="kpi-sub" style="margin:0;color:var(--danger);font-weight:700">Cette action est irréversible.</p>
      </div>`);
      openModal(
        "Confirmer la suppression",
        body,
        () => {
          activity.students.splice(index, 1);
          reindexAssociationAdminChecksAfterRemove(activity, index);
          saveData();
          if (onDeleted) onDeleted();
          return true;
        },
        { confirmLabel: "Supprimer définitivement", confirmDanger: true }
      );
    }

    function wireAssociationAdminDeleteStudentButtons(root) {
      if (!root) return;
      root.querySelectorAll(".btn-as-admin-del-student").forEach((btn) => {
        if (btn.dataset.asDelWired) return;
        btn.dataset.asDelWired = "1";
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          handleAssociationAdminDeleteStudent(btn);
        });
      });
    }

    function handleAssociationAdminDeleteStudent(btn) {
      const activityId = btn.getAttribute("data-activity-id") || "";
      const idx = Number(btn.getAttribute("data-student-idx"));
      const activity = (appData.association?.activities || []).find((x) => x.id === activityId);
      if (!activity || !Number.isInteger(idx) || idx < 0) return;
      requestAssociationStudentPermanentDelete(activity, idx, () => {
        closeModal();
        if (currentView === "dashboard:association") refreshAssociationDashPlanning();
        else render();
      });
    }

    function commitAssociationStudentEditIfOpen(modalBody, activity) {
      const panel = modalBody && modalBody.querySelector(".as-student-edit-panel");
      if (!panel) return true;
      const idx = Number(panel.getAttribute("data-student-idx"));
      if (!Number.isInteger(idx) || idx < 0 || !activity.students[idx]) return true;
      const updated = readAssociationStudentFromForm(panel);
      if (!updated) {
        alert("Renseignez au moins le prénom ou le nom.");
        return false;
      }
      activity.students[idx] = updated;
      return true;
    }

    function openAssociationStudentEditPanel(activity, index, listRoot, onDone) {
      const panel = el(`<div class="as-student-edit-panel" data-student-idx="${index}">
        <button type="button" class="btn btn-sm btn-ghost btn-as-student-edit-cancel" style="margin-bottom:.5rem">← Retour à la liste</button>
        ${associationStudentFormHtml()}
        <p class="kpi-sub" style="margin:.55rem 0 0">Cliquez sur <strong>Valider</strong> pour enregistrer les modifications.</p>
      </div>`);

      listRoot.appendChild(panel);

      });

    function wireAssociationStudentsListActions(listRoot, activity, onChange) {
      if (!listRoot) return;
      listRoot.querySelectorAll(".btn-as-student-edit").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-idx"));
          if (!Number.isInteger(idx) || idx < 0 || !activity.students[idx]) return;
          openAssociationStudentEditPanel(activity, idx, listRoot, onChange);
        });

        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-idx"));

    function openAssociationStudentsListModal(activity) {
      if (!Array.isArray(activity.students)) activity.students = [];
      activity.students = activity.students.map(normalizeAssociationStudent);
      const body = el(`<div>
        <p class="kpi-sub" style="margin:0 0 .5rem">Modifiez ou supprimez un élève. Les cases de gestion administrative suivent l'ordre de la liste.</p>
        <div id="f-as-students-list-manage" style="max-height:min(55vh,420px);overflow-y:auto"></div>

    function associationActivityDateInSeason(activity, dateStr) {
      if (!activity || !dateStr) return true;
      const start = String(activity.seasonStart || "").trim();
      const end = String(activity.seasonEnd || "").trim();
      if (start && dateStr < start) return false;
      if (end && dateStr > end) return false;
      return true;
    }

    function associationCompetitionConcernedGroups(competition) {
      if (!competition) return new Set();
      normalizeAssociationCompetition(competition);
      const groups = new Set();
      const age = String(competition.categoryAge || "").trim().toLowerCase();
      const sex = String(competition.sex || "").trim().toLowerCase();
      const cat = String(competition.category || "").trim().toLowerCase();
      if (age && sex && sex !== "tous") {
        groups.add(`${age} ${sex}`);
      } else if (age) {
        groups.add(age);
        groups.add(`${age} filles`);
        groups.add(`${age} garçons`);
      }
      if (cat) groups.add(cat);
      return groups;
    }

    function associationGroupMatchesAny(groupKey, groupSet) {
      const g = String(groupKey || "").toLowerCase().trim();
      if (!g || !groupSet || !groupSet.size) return false;
      for (const raw of groupSet) {
        const c = String(raw || "").toLowerCase().trim();
        if (!c) continue;
        if (g === c || g.includes(c) || c.includes(g)) return true;
        const parts = c.split(/\s+/).filter(Boolean);
        if (parts.length && parts.every((p) => g.includes(p))) return true;
      }
      return false;
    }

    function associationConfiguredGroupsOnDate(activity, dateIso) {
      const d = parseISODate(dateIso);
      if (!d) return new Set();
      const dayIndex = dayIndexMon0(d);
      const all = new Set();
      (activity.trainings || []).forEach((t) => {
        if (!t || t.dayIndex !== dayIndex) return;
        associationExpandTrainingGroups(t).forEach((g) => {
          if (g !== "__all__") all.add(g);
        });
      });
      return all;
    }

    function parseAssociationGroupToCancelTarget(groupLabel) {
      const raw = String(groupLabel || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      let category = "";
      let sex = "";
      if (raw.includes("benjamin")) category = "benjamins";
      else if (raw.includes("minime")) category = "minimes";
      if (/\bfilles?\b|\bfeminines?\b/.test(raw)) sex = "filles";
      else if (/\bgarcons?\b|\bmasculins?\b/.test(raw)) sex = "garçons";
      return { category, sex };
    }

    function cancelAssociationTrainingsForGroupsOnDate(activity, dateIso, groupsToCancel) {
      if (!activity || !dateIso || !groupsToCancel || !groupsToCancel.length) return;
      if (!appData.association || typeof appData.association !== "object") appData.association = {};
      if (!Array.isArray(appData.association.cancellations)) appData.association.cancellations = [];
      const d = parseISODate(dateIso);
      if (!d) return;
      const dayIndex = dayIndexMon0(d);
      (activity.trainings || []).forEach((t) => {
        if (!t || t.dayIndex !== dayIndex) return;
        groupsToCancel.forEach((label) => {
          const { category, sex } = parseAssociationGroupToCancelTarget(label);
          if (!category && !sex) return;
          const already = appData.association.cancellations.some(
            (c) =>
              c &&
              c.activityId === activity.id &&
              c.eventType === "training" &&
              c.date === dateIso &&
              c.eventId === t.id &&
              (c.mode || "all") === "targeted" &&
              (c.category || "") === category &&
              (c.sex || "") === sex
          );
          if (already) return;
          appData.association.cancellations.push({
            id: uid(),
            activityId: activity.id,
            eventType: "training",
            eventId: t.id,
            date: dateIso,
            mode: "targeted",
            category,
            sex,
          });
        });
      });
    }

    function buildAssociationTimelineByActivity(weeksAhead) {
      const horizonWeeks = Math.max(1, Number(weeksAhead) || 12);
      const start = todayStart();
      const end = addDays(start, horizonWeeks * 7);
      const activities = (appData.association && appData.association.activities) || [];
      return activities.map((a) => {
        const events = [];
        (a.trainings || []).forEach((t) => {
          if (!Number.isInteger(t.dayIndex)) return;
          for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
            if (dayIndexMon0(d) !== t.dayIndex) continue;
            const date = fmtISODate(d);
            if (!associationActivityDateInSeason(a, date)) continue;
            events.push({
              activityId: a.id,
              activityName: a.name || "—",
              eventType: "training",
              eventId: t.id,
              date,
              startTime: t.startTime || "",
              endTime: t.endTime || "",
              detail: (t.groups || []).join(" · ") || "Tous",
            });
          }
        });
        (a.competitions || []).forEach((c) => {
          if (!c || !c.date || c.date < fmtISODate(start)) return;
          if (!associationActivityDateInSeason(a, c.date)) return;
          events.push({
            activityId: a.id,
            activityName: a.name || "—",
            eventType: "competition",
            eventId: c.id,
            date: c.date,
            startTime: "",
            endTime: "",
            detail: c.category || "",
            place: c.place || "",
            coach: c.coach || "",
          });
        });
        events.sort((x, y) =>
          String(x.date).localeCompare(String(y.date)) ||
          String(x.startTime || "").localeCompare(String(y.startTime || ""))
        );
        return { activityId: a.id, activityName: a.name || "—", events };
      });
    }

    function associationCancellationsForEvent(event) {
      return ((appData.association && appData.association.cancellations) || []).filter((c) =>
        c &&
        c.activityId === event.activityId &&
        c.eventType === event.eventType &&
        c.date === event.date &&
        (!c.eventId || c.eventId === event.eventId)
      );
    }

    function formatAssociationCancelTargetLabel(c) {
      if ((c.mode || "all") === "all") return "tous";
      const bits = [];
      if (c.category) bits.push(c.category.charAt(0).toUpperCase() + c.category.slice(1));
      if (c.sex) bits.push(c.sex);
      return bits.length ? bits.join(" ") : "groupe ciblé";
    }

    function removeAssociationCancellationsForEvent(event) {
      if (!appData.association || !Array.isArray(appData.association.cancellations)) return;
      appData.association.cancellations = appData.association.cancellations.filter((c) =>
        !(
          c.activityId === event.activityId &&
          c.eventType === event.eventType &&
          c.date === event.date &&
          (!c.eventId || c.eventId === event.eventId)
        )
      );
    }

    function purgeAssociationEventRecords(activityId, eventType, eventId) {
      if (!appData.association) return;
      if (Array.isArray(appData.association.cancellations)) {
        appData.association.cancellations = appData.association.cancellations.filter((c) =>
          !(c && c.activityId === activityId && c.eventType === eventType && c.eventId === eventId)
        );
      }
      if (appData.association.attendanceRecords && typeof appData.association.attendanceRecords === "object") {
        const prefix = `${activityId}|${eventType}|`;
        const suffix = `|${eventId}`;
        Object.keys(appData.association.attendanceRecords).forEach((key) => {
          if (key.startsWith(prefix) && key.endsWith(suffix)) {
            delete appData.association.attendanceRecords[key];
          }
        });
      }
    }

    function removeAssociationTrainingSlot(activityId, trainingId) {
      const activities = appData.association && appData.association.activities;
      if (!activities || !trainingId) return false;
      const a = activities.find((x) => x.id === activityId);
      if (!a || !Array.isArray(a.trainings)) return false;
      const before = a.trainings.length;
      a.trainings = a.trainings.filter((t) => t.id !== trainingId);
      if (a.trainings.length === before) return false;
      purgeAssociationEventRecords(activityId, "training", trainingId);
      return true;
    }

    function removeAssociationCompetition(activityId, competitionId) {
      const activities = appData.association && appData.association.activities;
      if (!activities || !competitionId) return false;
      const a = activities.find((x) => x.id === activityId);
      if (!a || !Array.isArray(a.competitions)) return false;
      const before = a.competitions.length;
      a.competitions = a.competitions.filter((c) => c.id !== competitionId);
      if (a.competitions.length === before) return false;
      purgeAssociationEventRecords(activityId, "competition", competitionId);
      return true;
    }

    function associationCancellationSummary(event) {
      const list = associationCancellationsForEvent(event);
      if (!list.length) return { state: "none", cancelledFor: [] };
      if (list.some((c) => (c.mode || "all") === "all")) {
        return { state: "all", cancelledFor: ["tous"] };
      }
      const cancelledFor = [...new Set(
        list
          .filter((c) => (c.mode || "all") === "targeted")
          .map(formatAssociationCancelTargetLabel)
      )];
      return { state: "partial", cancelledFor };
    }

    function associationTrainingsForSlot(activity, dayIndex, startTime, endTime) {
      return (activity.trainings || []).filter(
        (t) =>
          t &&
          Number.isInteger(t.dayIndex) &&
          t.dayIndex === dayIndex &&
          (t.startTime || "") === (startTime || "") &&
          (t.endTime || "") === (endTime || "")
      );
    }

    function associationExpandTrainingGroups(training) {
      const set = new Set();
      const raw = training && training.groups;
      if (!Array.isArray(raw) || !raw.length) return new Set(["__all__"]);
      raw.forEach((g) => {
        const s = String(g).trim();
        if (!s || /^tous$/i.test(s)) {
          set.add("__all__");
          return;
        }
        s.split("·")
          .map((x) => x.trim())
          .filter(Boolean)
          .forEach((x) => set.add(x.toLowerCase()));
      });
      if (set.has("__all__")) return new Set(["__all__"]);
      return set;
    }

    function associationSlotConfiguredGroups(activity, dayIndex, startTime, endTime) {
      const trainings = associationTrainingsForSlot(activity, dayIndex, startTime, endTime);
      const all = new Set();
      trainings.forEach((t) => {
        associationExpandTrainingGroups(t).forEach((g) => all.add(g));
      });
      if (all.has("__all__") || !all.size) return null;
      return all;
    }

    function associationGroupMatchesCancelTarget(groupKey, cancelledFor) {
      const label = String(groupKey || "").toLowerCase();
      return (cancelledFor || []).some((target) => {
        const parts = String(target || "")
          .toLowerCase()
          .split(/\s+/)
          .filter(Boolean);
        return parts.length > 0 && parts.every((p) => label.includes(p));
      });
    }

    function associationActiveGroupsOnSlot(activity, dateIso, dayIndex, startTime, endTime) {
      const active = new Set();
      associationTrainingsForSlot(activity, dayIndex, startTime, endTime).forEach((t) => {
        const event = {
          activityId: activity.id,
          eventType: "training",
          eventId: t.id,
          date: dateIso,
        };
        const cancel = associationCancellationSummary(event);
        const groups = associationExpandTrainingGroups(t);
        if (cancel.state === "all") return;
        if (cancel.state === "partial") {
          groups.forEach((g) => {
            if (g === "__all__") return;
            if (!associationGroupMatchesCancelTarget(g, cancel.cancelledFor)) active.add(g);
          });
          return;
        }
        groups.forEach((g) => {
          if (g !== "__all__") active.add(g);
        });
      });
      if (active.has("__all__")) return null;
      return active;
    }

    function associationFormatGroupLabels(groupSet) {
      return [...groupSet]
        .map((g) =>
          g
            .split(/\s+/)
            .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
            .join(" ")
        )
        .join(" · ");
    }

    function associationTrainingDetailForRecap(activity, dateIso, dayIndex, startTime, endTime) {
      const configured = associationSlotConfiguredGroups(activity, dayIndex, startTime, endTime);
      const active = associationActiveGroupsOnSlot(activity, dateIso, dayIndex, startTime, endTime);
      if (!configured) return "Tous";
      if (!active || !active.size) return "Tous";
      const coversAll =
        configured.size === active.size && [...configured].every((g) => active.has(g));
      if (coversAll && configured.size > 1) return "Tous";
      if (coversAll && configured.size === 1) return associationFormatGroupLabelsAbbrev(configured);
      return associationFormatGroupLabelsAbbrev(active);
    }

    function associationSlotCancellationSummary(activity, dateIso, dayIndex, startTime, endTime) {
      const trainings = associationTrainingsForSlot(activity, dayIndex, startTime, endTime);
      if (!trainings.length) return { state: "none", cancelledFor: [] };
      const summaries = trainings.map((t) =>
        associationCancellationSummary({
          activityId: activity.id,
          eventType: "training",
          eventId: t.id,
          date: dateIso,
        })
      );
      if (summaries.every((s) => s.state === "all")) {
        return { state: "all", cancelledFor: ["tous"] };
      }
      if (summaries.every((s) => s.state === "none")) {
        return { state: "none", cancelledFor: [] };
      }
      const cancelledFor = [
        ...new Set(summaries.flatMap((s) => (s.state === "partial" ? s.cancelledFor : []))),
      ];
      if (summaries.some((s) => s.state === "all") && cancelledFor.length) {
        return { state: "partial", cancelledFor };
      }
      if (cancelledFor.length) return { state: "partial", cancelledFor };
      if (summaries.some((s) => s.state === "all")) {
        return { state: "partial", cancelledFor: ["partiel"] };
      }
      return { state: "none", cancelledFor: [] };
    }

    /** Abréviations catégorie pour le bandeau accueil (ex. benjamins filles → BF). */
    function associationDetailToAbbrevList(detail) {
      const raw = String(detail || "").trim();
      if (!raw || /^tous$/i.test(raw)) return ["Tous"];
      const parts = raw
        .split(/[·,;|/]+/)
        .map((p) => p.trim())
        .filter(Boolean);
      const source = parts.length ? parts : [raw];
      const abbrevs = source
        .map((p) => {
          const a = formatAssociationCategoryAbbrev(p);
          return a !== "—" ? a : p;
        })
        .filter(Boolean);
      return abbrevs.length ? [...new Set(abbrevs)] : ["—"];
    }

    function formatAssociationStripRecapParts(event, cancelOverride, opts) {
      opts = opts || {};
      const competitionGroups = opts.competitionGroups || null;
      const configuredGroups = opts.configuredGroups || null;
      const cancel = cancelOverride || associationCancellationSummary(event);
      const detail = String(event.detail || "").trim();

      if (event.eventType === "competition") {
        const place = (event.place || "").trim();
        const label = place ? `compétition (${place})` : "compétition";
        return associationDetailToAbbrevList(detail).map((abbrev) => ({
          abbrev,
          label: cancel.state === "all" ? `${label} annulée` : label,
          cancelled: cancel.state === "all" || cancel.state === "partial",
          kind: "competition",
        }));
      }

      const makeAbbrev = (label) => {
        const a = formatAssociationCategoryAbbrev(label);
        return a !== "—" ? a : label;
      };

      if (configuredGroups && configuredGroups.size) {
        const parts = [];
        configuredGroups.forEach((g) => {
          if (associationGroupMatchesAny(g, competitionGroups)) return;
          const isCancelled =
            cancel.state === "all" ||
            (cancel.state === "partial" && associationGroupMatchesCancelTarget(g, cancel.cancelledFor));
          parts.push({
            abbrev: makeAbbrev(g),
            label: isCancelled ? "entraînement annulé" : "entraînement",
            cancelled: isCancelled,
            kind: "training",
          });
        });
        if (parts.length) return parts;
      }

      if (cancel.state === "all") {
        return associationDetailToAbbrevList(detail).map((abbrev) => ({
          abbrev,
          label: "entraînement annulé",
          cancelled: true,
          kind: "training",
        }));
      }
      if (cancel.state === "partial") {
        const cancelledParts = cancel.cancelledFor.map((target) => ({
          abbrev: makeAbbrev(target),
          label: "entraînement annulé",
          cancelled: true,
          kind: "training",
        }));
        if (detail && !/^tous$/i.test(detail)) {
          associationDetailToAbbrevList(detail).forEach((abbrev) => {
            const already = cancelledParts.some((p) => p.abbrev === abbrev);
            if (already) return;
            if (associationGroupMatchesAny(detail, competitionGroups)) return;
            cancelledParts.push({
              abbrev,
              label: "entraînement",
              cancelled: false,
              kind: "training",
            });
          });
        }
        return cancelledParts;
      }
      if (associationGroupMatchesAny(detail, competitionGroups) && /^tous$/i.test(detail) === false) {
        return [];
      }
      return associationDetailToAbbrevList(detail).map((abbrev) => ({
        abbrev,
        label: "entraînement",
        cancelled: false,
        kind: "training",
      }));
    }

    function formatAssociationRecapSlotTime(startTime, endTime) {
      if (startTime && endTime) return `${startTime}–${endTime}`;
      if (startTime || endTime) return startTime || endTime;
      return "";
    }

    function associationWeekRecapSlotLabel(activity, dayIndex, startTime, endTime) {
      if (!activity || associationDistinctTrainingSlots(activity) <= 1) return "";
      const slot = { dayIndex, startTime: startTime || "", endTime: endTime || "" };
      const schedule = associationSlotScheduleLabel(slot);
      const cats = associationSlotCategoriesLabel(activity, slot);
      if (cats && cats !== "Tous") return `${schedule} (${cats})`;
      return schedule;
    }

    /** Nombre de créneaux distincts (jour + horaire) configurés pour l'activité. */
    function associationDistinctTrainingSlots(activity) {
      const slots = new Set();
      (activity.trainings || []).forEach((t) => {
        if (!t || !Number.isInteger(t.dayIndex)) return;
        slots.add(`${t.dayIndex}|${t.startTime || ""}|${t.endTime || ""}`);
      });
      return slots.size;
    }

    function associationWeekRecapCompetitionSlot(activity, dateIso) {
      const slots = new Map();
      const d = parseISODate(dateIso);
      (activity.trainings || []).forEach((t) => {
        if (!Number.isInteger(t.dayIndex) || dayIndexMon0(d) !== t.dayIndex) return;
        const k = `${t.startTime || ""}|${t.endTime || ""}`;
        slots.set(k, { startTime: t.startTime || "", endTime: t.endTime || "" });
      });
      if (slots.size === 1) return [...slots.values()][0];
      return { startTime: "", endTime: "" };
    }

    function associationWeekRecapSlotGroupKey(meta) {
      return [
        meta.activityId || "",
        meta.dayIndex ?? "",
        meta.startTime || "",
        meta.endTime || "",
      ].join("|");
    }

    function associationWeekRecapAddParts(groups, parts, meta) {
      const groupKey = associationWeekRecapSlotGroupKey(meta);
      const multiSlot =
        meta.activity && associationDistinctTrainingSlots(meta.activity) > 1;
      const slotLabel = multiSlot
        ? associationWeekRecapSlotLabel(
            meta.activity,
            meta.dayIndex,
            meta.startTime,
            meta.endTime
          )
        : "";
      if (!groups.has(groupKey)) {
        groups.set(groupKey, {
          activityId: meta.activityId || "",
          activityName: meta.activityName || "—",
          slotLabel,
          parts: [],
          partKeys: new Set(),
          sortName: meta.sortName || "",
          sortDayIndex: Number.isInteger(meta.dayIndex) ? meta.dayIndex : 99,
          sortTime: meta.startTime || "99:99",
        });
      }
      const group = groups.get(groupKey);
      parts.forEach((part) => {
        const abbrev = part.abbrev || "—";
        const kind = part.kind === "competition" ? "competition" : "training";
        const partKey = `${abbrev}|${part.label}|${part.cancelled ? "1" : "0"}|${kind}`;
        if (group.partKeys.has(partKey)) return;
        group.partKeys.add(partKey);
        group.parts.push({
          abbrev,
          label: part.label,
          cancelled: !!part.cancelled,
          kind,
        });
      });
    }

    function associationWeekRecapEntries(rangeStart, rangeEnd) {
      const activities = (appData.association && appData.association.activities) || [];
      const groups = new Map();
      activities.forEach((a) => {
        const sortName = a.name || "";
        const slotDaysDone = new Set();
        (a.trainings || []).forEach((t) => {
          if (!Number.isInteger(t.dayIndex)) return;
          const slotDayKey = `${a.id}|${t.dayIndex}|${t.startTime || ""}|${t.endTime || ""}`;
          if (slotDaysDone.has(slotDayKey)) return;
          slotDaysDone.add(slotDayKey);
          for (let d = parseISODate(rangeStart); fmtISODate(d) <= rangeEnd; d = addDays(d, 1)) {
            if (dayIndexMon0(d) !== t.dayIndex) continue;
            const date = fmtISODate(d);
            if (!associationActivityDateInSeason(a, date)) continue;
            const competitionGroups = new Set();
            (a.competitions || []).forEach((c) => {
              if (!c || c.date !== date) return;
              associationCompetitionConcernedGroups(c).forEach((g) => competitionGroups.add(g));
            });
            const configured = associationSlotConfiguredGroups(
              a,
              t.dayIndex,
              t.startTime,
              t.endTime
            );
            const detail = associationTrainingDetailForRecap(
              a,
              date,
              t.dayIndex,
              t.startTime,
              t.endTime
            );
            const cancel = associationSlotCancellationSummary(
              a,
              date,
              t.dayIndex,
              t.startTime,
              t.endTime
            );
            const event = {
              activityId: a.id,
              activityName: a.name || "—",
              eventType: "training",
              eventId: t.id,
              date,
              detail,
            };
            associationWeekRecapAddParts(
              groups,
              formatAssociationStripRecapParts(event, cancel, {
                competitionGroups,
                configuredGroups: configured,
              }),
              {
                activityId: a.id,
                activityName: a.name || "—",
                activity: a,
                dayIndex: t.dayIndex,
                startTime: t.startTime || "",
                endTime: t.endTime || "",
                sortName,
              }
            );
          }
        });
        (a.competitions || []).forEach((c) => {
          if (!c || !c.date || c.date < rangeStart || c.date > rangeEnd) return;
          if (!associationActivityDateInSeason(a, c.date)) return;
          const compDate = parseISODate(c.date);
          const compDayIndex = dayIndexMon0(compDate);
          const slot = associationWeekRecapCompetitionSlot(a, c.date);
          const event = {
            activityId: a.id,
            activityName: a.name || "—",
            eventType: "competition",
            eventId: c.id,
            date: c.date,
            detail: c.category || "",
            place: c.place || "",
          };
          associationWeekRecapAddParts(groups, formatAssociationStripRecapParts(event), {
            activityId: a.id,
            activityName: a.name || "—",
            activity: a,
            dayIndex: compDayIndex,
            startTime: slot.startTime,
            endTime: slot.endTime,
            sortName,
          });
        });
      });
      return [...groups.values()]
        .map((g) => {
          g.parts.sort((a, b) => String(a.abbrev).localeCompare(String(b.abbrev), "fr"));
          g.cancelled = g.parts.some((p) => p.cancelled);
          return g;
        })
        .sort(
          (x, y) =>
            x.sortName.localeCompare(y.sortName, "fr") ||
            x.sortDayIndex - y.sortDayIndex ||
            String(x.sortTime).localeCompare(String(y.sortTime))
        );
    }

    function associationEventKeyFromBtn(btn) {
      return {
        activityId: btn.getAttribute("data-activity-id") || "",
        eventType: btn.getAttribute("data-event-type") || "",
        eventId: btn.getAttribute("data-event-id") || null,
        date: btn.getAttribute("data-date") || "",
      };
    }

    function associationEventFromRow(row) {
      return {
        activityId: row.getAttribute("data-activity-id") || "",
        eventType: row.getAttribute("data-event-type") || "",
        eventId: row.getAttribute("data-event-id") || null,
        date: row.getAttribute("data-date") || "",
        detail: row.getAttribute("data-detail") || "",
        activityName: row.getAttribute("data-activity-name") || "",
      };
    }

    function associationAttendanceStorageKey(event) {
      return [event.activityId, event.eventType, event.date, event.eventId || ""].join("|");
    }

    function getAssociationAttendance(event) {
      if (!appData.association.attendanceRecords || typeof appData.association.attendanceRecords !== "object") {
        appData.association.attendanceRecords = {};
      }
      const key = associationAttendanceStorageKey(event);
      if (!appData.association.attendanceRecords[key]) appData.association.attendanceRecords[key] = {};
      return appData.association.attendanceRecords[key];
    }

    function associationAttendancePresentCount(event) {
      const att = getAssociationAttendance(event);
      return Object.values(att).filter((v) => v === "present").length;
    }

    function captureDashAsExpandedFromDom(includeTabs) {
      const main = document.getElementById("main");
      if (!main) return;
      main.querySelectorAll(".dash-as-activity-toggle").forEach((btn) => {
        const id = btn.getAttribute("data-activity-id");
        if (!id) return;
        if (btn.getAttribute("aria-expanded") === "true") dashAsExpandedActivityIds.add(id);
        else dashAsExpandedActivityIds.delete(id);
      });
      if (includeTabs !== false) {
        main.querySelectorAll(".dash-as-activity-panel").forEach((panel) => {
          const id = panel.getAttribute("data-activity-id");
          if (!id) return;
          const active = panel.querySelector(".btn-dash-as-subtab.as-activity-tab--active");
          const tab = active && active.getAttribute("data-tab");
          if (tab === "planning" || tab === "admin") dashAsActivityPanelTab[id] = tab;
        });
        main.querySelectorAll(".btn-dash-as-slot-tab.as-activity-tab--active").forEach((btn) => {
          const id = btn.getAttribute("data-activity-id");
          const sk = btn.getAttribute("data-slot-key");
          if (id && sk) dashAsActivitySlotTab[id] = sk;
        });
      }
    }

    function associationEventMatchesSlot(e, slot, activity) {
      if (!slot || !e) return true;
      if (e.eventType === "competition") {
        const d = parseISODate(e.date);
        return dayIndexMon0(d) === slot.dayIndex;
      }
      if (e.eventType === "training") {
        const training = (activity.trainings || []).find((t) => t.id === e.eventId);
        if (training) {
          return (
            training.dayIndex === slot.dayIndex &&
            (training.startTime || "") === slot.startTime &&
            (training.endTime || "") === slot.endTime
          );
        }
        return (e.startTime || "") === slot.startTime && (e.endTime || "") === slot.endTime;
      }
      return true;
    }

    function renderAssociationEventRow(e) {
      const kind = e.eventType === "training" ? "Entraînement" : "Compétition";
      const typeClass = e.eventType === "training" ? "dash-as-type--training" : "dash-as-type--competition";
      const hour = e.eventType === "training" ? `${e.startTime || "—"}${e.endTime ? "–" + e.endTime : ""}` : "—";
      const extra = e.eventType === "competition" ? [e.place, e.coach].filter(Boolean).join(" · ") : "";
      const cancel = associationCancellationSummary(e);
      const detailAbbrev = formatAssociationDetailAbbrev(e.detail);
      const detailLine = [detailAbbrev, extra].filter(Boolean).join(" · ");

    function wireAssociationTrainingSlotsContainer(body) {

    function collectTrainingSlotsFromForm(body) {
      const rows = [...body.querySelectorAll(".as-slot-row")];
      const nextSlots = [];
      for (const row of rows) {
        const dayIndex = Number(row.querySelector(".f-as-day").value);
        const startTime = row.querySelector(".f-as-start").value;
        const endTime = row.querySelector(".f-as-end").value;
        if (!startTime || !endTime || startTime >= endTime) continue;
        const cats = [...row.querySelectorAll(".f-as-cat:checked")].map((x) => x.value);
        const sexes = [...row.querySelectorAll(".f-as-sex:checked")].map((x) => x.value);
        const combinedGroups = [];
        if (cats.length && sexes.length) {
          cats.forEach((c) => sexes.forEach((s) => combinedGroups.push(`${c} ${s}`)));
        } else if (cats.length) {
          cats.forEach((c) => combinedGroups.push(c));
        } else if (sexes.length) {
          sexes.forEach((s) => combinedGroups.push(s));
        }
        const manual = (row.querySelector(".f-as-group-manual").value || "")
          .split(",")
          .map((x) => x.trim())
          .filter(Boolean);
        const groups = [...new Set([...combinedGroups, ...manual])];
        nextSlots.push({ id: uid(), dayIndex, startTime, endTime, groups });
      }
      return nextSlots;
    }

    function fitDashAssociationStripText() {
      const strip = document.getElementById("dash-association-toggle");
      if (!strip) return;
      if (!isDashAssociationStripCompact()) {
        strip.querySelectorAll(".dash-association-strip__head, .dash-association-strip__line").forEach((el) => {
          el.style.fontSize = "";
        });
        return;
      }
      const shrink = (el, minPx) => {
        if (!el) return;
        el.style.fontSize = "";
        let size = parseFloat(getComputedStyle(el).fontSize) || 11;
        const floor = minPx || 7.5;
        el.style.whiteSpace = "nowrap";
        let guard = 0;
        while (el.scrollWidth > el.clientWidth + 1 && size > floor && guard++ < 40) {
          size -= 0.5;
          el.style.fontSize = size + "px";
        }
      };
      shrink(strip.querySelector(".dash-association-strip__head"), 8);
      strip.querySelectorAll(".dash-association-strip__line").forEach((line) => shrink(line, 7.5));
    }

    function dashForgottenGearKpiHtml(animationDelay) {
      const threshold = forgottenGearThreshold;
      const todayStr = dashboardDateISO();
      const alerts = [];
      appData.classes.forEach((cl) => {
        const range = forgottenGearFilterRangeForClass(cl.id, todayStr);
        if (!range) return;
        const items = (appData.forgottenGear || []).filter(
          (f) => f.classId === cl.id && f.date >= range.startDate && f.date <= range.endDate
        );
        const byStudent = {};
        items.forEach((f) => {
          byStudent[f.studentName] = (byStudent[f.studentName] || 0) + 1;
        });
        Object.entries(byStudent).forEach(([name, count]) => {
          if (count >= threshold) alerts.push({ name, className: cl.name, classId: cl.id, count });
        });
      });
      alerts.sort((a, b) => b.count - a.count);
      const total = alerts.length;
      const detail = alerts
        .map(
          (a) =>
            `<a href="#" class="link-fg-student" data-classid="${a.classId}" data-student="${escapeHtml(a.name)}" style="color:var(--danger);font-weight:700;text-decoration:underline;cursor:pointer">${escapeHtml(a.name)}</a> (${escapeHtml(a.className)}) — ${a.count} oubli(s)`

          </div>`;
        })
        .join("");

    function wirePeriodExtensionForm(body) {
      const baseEndInput = body.querySelector("#f-per-end");
      const syncMin = () => {
        const baseEnd = baseEndInput?.value || "";
        body.querySelectorAll(".period-ext-end").forEach((inp) => {
          inp.min = baseEnd;
          if (inp.disabled) inp.value = baseEnd;
          else if (inp.value && baseEnd && inp.value < baseEnd) inp.value = baseEnd;
        });
      };
      baseEndInput?.addEventListener("change", syncMin);
      body.querySelectorAll(".period-ext-cb").forEach((cb) => {
        cb.addEventListener("change", () => {
          const cid = cb.getAttribute("data-classid");
          const inp = body.querySelector(`.period-ext-end[data-classid="${cid}"]`);
          if (!inp) return;
          inp.disabled = !cb.checked;
          if (cb.checked) {
            const baseEnd = baseEndInput?.value || "";
            if (!inp.value || (baseEnd && inp.value < baseEnd)) inp.value = baseEnd;
          } else {
            inp.value = baseEndInput?.value || "";
          }
        });
      });
      syncMin();
    }

    function readPeriodClassExtensions(body, baseEndDate) {
      const overrides = {};
      body.querySelectorAll(".period-ext-cb:checked").forEach((cb) => {
        const cid = cb.getAttribute("data-classid");
        const inp = body.querySelector(`.period-ext-end[data-classid="${cid}"]`);
        const extEnd = inp?.value || "";
        if (extEnd && baseEndDate && extEnd > baseEndDate) overrides[cid] = { endDate: extEnd };
      });
      return overrides;
    }

    function periodsForClass(classId) {
      const cl = getClassById(classId);
      const level = classLevel(cl);
      return (appData.periods || []).filter((p) =>
        (Array.isArray(p.levels) && p.levels.length && p.levels.includes(level)) ||
        (p.classIds || []).includes(classId)
      )
        .slice().sort((a, b) => a.startDate.localeCompare(b.startDate));
    }

    /** Période calendaire en cours pour une classe (même règle que l'onglet classe). */
    function currentPeriodForClass(classId, refDateStr) {
      const ref = refDateStr || fmtISODate(new Date());
      return (
        periodsForClass(classId).find((p) => {
          const { start, end } = periodDatesForClass(p, classId);
          return ref >= start && ref <= end;
        }) || null
      );
    }

    /** APSA de la période en cours (même filtre que viewClassPage → periodActs). */
    function activitiesForClassActivePeriod(classId, refDateStr) {
      const period = currentPeriodForClass(classId, refDateStr);
      if (!period) return activitiesOnDatePeriod(classId, refDateStr);
      const { start, end } = periodDatesForClass(period, classId);
      return activitiesForClass(classId).filter(
        (a) =>
          (a.periodId && a.periodId === period.id) ||
          (a.startDate >= start && a.endDate <= end)
      );
    }

    function periodLevels(period) {
      if (Array.isArray(period.levels) && period.levels.length) {
        return CLASS_LEVELS.filter((level) => period.levels.includes(level));
      }
      const levels = new Set((period.classIds || [])
        .map((id) => getClassById(id))
        .filter(Boolean)
        .map((cl) => classLevel(cl)));
      return CLASS_LEVELS.filter((level) => levels.has(level));
    }

    function levelActivityNames(level) {
      const byCA = appData.levelApsaByCA && appData.levelApsaByCA[level]
        ? Object.values(appData.levelApsaByCA[level]).flat()
        : [];
      return [...new Set(byCA)]
        .sort((a, b) => a.localeCompare(b, "fr"));
    }

    function caForLevelApsa(level, apsaName) {
      const table = appData.levelApsaByCA && appData.levelApsaByCA[level];
      if (!table) return "";
      for (const ca of ["CA1", "CA2", "CA3", "CA4"]) {
        if ((table[ca] || []).includes(apsaName)) return ca;
      }
      return "";
    }

    function viewLevelProgrammingBody() {
      const colors = ["#6366f1", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316"];
      const classes = appData.classes.slice().sort((a, b) => {
        const levelDiff = CLASS_LEVELS.indexOf(classLevel(a)) - CLASS_LEVELS.indexOf(classLevel(b));
        return levelDiff || a.name.localeCompare(b.name, "fr");
      });
      if (!classes.length) return '<div class="card"><p class="kpi-sub">Ajoutez d’abord des classes pour créer la programmation.</p></div>';

      const levelBlocks = CLASS_LEVELS.map((level) => {
        const levelClasses = classes.filter((cl) => classLevel(cl) === level);
        if (!levelClasses.length) return "";
        const levelPeriods = periodsForLevel(level);
        if (!levelPeriods.length) {
          return `<div class="level-program-level-block" style="--level-c:${levelColor(level)}">
            <h4 class="level-program-level-title">Niveau ${escapeHtml(level)}</h4>
            <p class="kpi-sub" style="margin:0">Aucune période associée à ce niveau.</p>
          </div>`;
        }
        const headers = levelPeriods
          .map(
            (p) =>
              `<th>${escapeHtml(p.name)}<br><span class="kpi-sub">${fmtDateFr(p.startDate)} → ${fmtDateFr(p.endDate)}</span></th>`
          )
          .join("");
        const apsaNames = levelActivityNames(level);
        const venueOptions = [`<option value="">— Installation —</option>`]
          .concat((appData.venues || []).map((venue) => `<option value="${escapeHtml(venue.name)}">${escapeHtml(venue.name)}</option>`))
          .join("");
        const rows = levelClasses
          .map((cl) => {
            const slots = schedulesForClass(cl.id)
              .slice()
              .sort((a, b) => a.dayIndex - b.dayIndex || a.startTime.localeCompare(b.startTime));
            const cells = levelPeriods
              .map((period) => {
                const dayChoices = slots.length
                  ? slots
                      .map((s, slotIdx) => {
                        const current = appData.activities.find(
                          (a) =>
                            a.classId === cl.id &&
                            a.periodId === period.id &&
                            Array.isArray(a.dayIndices) &&
                            a.dayIndices.includes(s.dayIndex)
                        );
                        const apsaOptions = [`<option value="">— APSA —</option>`]
                          .concat(
                            apsaNames.map(
                              (name) =>
                                `<option value="${escapeHtml(name)}" ${current && current.name === name ? "selected" : ""}>${escapeHtml(name)}</option>`
                            )
                          )
                          .join("");
                        const currentVenue = current ? current.venue || "" : "";
                        const currentVenueOptions = venueOptions.replace(
                          `value="${escapeHtml(currentVenue)}"`,
                          `value="${escapeHtml(currentVenue)}" selected`
                        );
                        const apsaLabel = current ? current.name : "APSA à choisir";
                        const venueLabel = currentVenue || "Installation à choisir";
                        return `<div class="level-program-slot">
                          <button type="button" class="level-program-slot-open">
                            <span class="level-program-slot-name">${DOW[s.dayIndex]} · ${s.startTime}</span>
                            <span class="level-program-slot-summary"><strong>${escapeHtml(apsaLabel)}</strong><br>${escapeHtml(venueLabel)}</span>
                          </button>
                          <select class="level-program-apsa level-program-hidden-select" data-day="${s.dayIndex}" data-color="${colors[slotIdx % colors.length]}">${apsaOptions}</select>
                          <select class="level-program-venue level-program-hidden-select">${currentVenueOptions}</select>
                        </div>`;
                      })
                      .join("")
                  : '<span class="kpi-sub">Aucun créneau</span>';
                return `<td data-label="${escapeHtml(period.name)}">
                  <div class="level-program-cell" data-classid="${cl.id}" data-periodid="${period.id}">
                    <div class="level-program-days">${dayChoices}</div>
                  </div>
                </td>`;
              })
              .join("");
            return `<tr style="--level-c:${levelColor(level)}"><td class="level-program-class-cell" data-label="Classe"><strong>${escapeHtml(cl.name)}</strong></td>${cells}</tr>`;
          })
          .join("");
        return `<div class="level-program-level-block" style="--level-c:${levelColor(level)}">
          <h4 class="level-program-level-title">Niveau ${escapeHtml(level)}</h4>
          <div class="level-program-table-wrap">
            <table class="level-program-table"><thead><tr><th>Classe</th>${headers}</tr></thead><tbody>${rows}</tbody></table>
          </div>
        </div>`;
      }).filter(Boolean);

      if (!levelBlocks.length) {
        return `<div class="card level-program-card" style="--level-c:var(--accent)">
          <div class="level-program-head"><div><h3>Programmation de mes classes</h3></div></div>
        </div>`;
      }

      const anyPeriod = CLASS_LEVELS.some((level) => periodsForLevel(level).length);
      if (!anyPeriod) {
        return `<div class="card level-program-card" style="--level-c:var(--accent)">
          <div class="level-program-head"><div><h3>Programmation de mes classes</h3></div></div>
          <p class="kpi-sub" style="margin:0">Créez d'abord les périodes associées aux niveaux.</p>
        </div>`;
      }

      return `<div class="card level-program-card" style="--level-c:var(--accent)">
        <div class="level-program-head"><div><h3>Programmation de mes classes</h3></div></div>
        ${levelBlocks.join("")}
      </div>`;
    }

        ? [selectedAdvancedClass].map((cl) => {

            <div style="margin-bottom:.5rem"><strong>Sans période</strong> <span class="kpi-sub">(APSA non rattachées à une période)</span></div>
            <div class="timeline">${orphanActs.map((a) => {
              const cnt = statsPerActivity(cl.id, a.id);
              return `<div class="tl-item" style="--tl:${a.color}">

                <p class="kpi-sub">${a.startDate} → ${a.endDate} · ${escapeHtml(a.venue)}</p>

          const noPeriods = !clPeriods.length ? '<p class="kpi-sub" style="margin:.5rem 0">Aucune période associée à cette classe — créez des périodes dans l\'onglet « Périodes ».</p>' : "";

      ${viewLevelProgrammingBody()}

    function viewActivities() {
      return renderTopbar("APSA & programmation", "") + viewActivitiesBody();

    function applyLevelProgramming(card) {
      if (!card) return;
      const colors = ["#6366f1", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316"];
      const tableClassIds = new Set([...card.querySelectorAll(".level-program-cell")].map((cell) => cell.getAttribute("data-classid")).filter(Boolean));
      appData.activities = appData.activities.filter((activity) => !(activity.quickProgram && tableClassIds.has(activity.classId)));
      const planned = new Map();
      card.querySelectorAll(".level-program-cell").forEach((cell) => {
        const classId = cell.getAttribute("data-classid");
        const periodId = cell.getAttribute("data-periodid");
        const period = (appData.periods || []).find((p) => p.id === periodId);
        const cl = getClassById(classId);
        const level = classLevel(cl);
        if (!period || !cl) return;
        cell.querySelectorAll(".level-program-slot").forEach((slotRow) => {
          const select = slotRow.querySelector(".level-program-apsa");
          const venueSelect = slotRow.querySelector(".level-program-venue");
          const dayIndex = Number(select ? select.getAttribute("data-day") : "");
          const apsaName = select ? select.value : "";
          const venueName = venueSelect ? venueSelect.value : "";
          if (!apsaName || !Number.isInteger(dayIndex)) return;
          const key = `${classId}|${periodId}|${apsaName}`;
          if (!planned.has(key)) {
            const { start, end } = periodDatesForClass(period, classId);
            planned.set(key, {
              classId,
              periodId,
              name: apsaName,
              field: caForLevelApsa(level, apsaName),
              color: select.getAttribute("data-color") || colors[planned.size % colors.length],
              startDate: start,
              endDate: end,
              venue: venueName,
              objectives: "",
              competencies: "",
              plannedSessions: 0,
              dayIndices: [],
              quickProgram: true,
              level,
            });
          }
          const item = planned.get(key);
          if (!item.dayIndices.includes(dayIndex)) item.dayIndices.push(dayIndex);
          if (!item.venue && venueName) item.venue = venueName;
        });
      });
      planned.forEach((payload) => {
        payload.dayIndices.sort((a, b) => a - b);
        const existing = appData.activities.find((activity) =>
          activity.classId === payload.classId &&
          activity.periodId === payload.periodId &&
          activity.name === payload.name
        );
        if (existing) Object.assign(existing, payload);
        else appData.activities.push({ id: uid(), ...payload });
      });
      regenerateSessions();
      // Aligne le tableau d'occupation (ma ligne) si « Je suis » est défini
      syncMyClassesToTeamCoordination({ silent: true });
      saveData();
      render();
    }

    /**
     * Remplit la ligne « Je suis » du tableau d'occupation à partir de
     * Programmation de mes classes (activités + EDT), en croisant jour/horaire.
     * Remplace les cases de ce professeur (les autres lignes ne sont pas touchées).
     */
    function syncMyClassesToTeamCoordination(opts) {
      opts = opts || {};
      const silent = !!opts.silent;
      const myId = String((appData.settings && appData.settings.myCoordinationTeacherId) || "");
      const tc = ensureTeamCoordination();
      if (!myId) {
        if (!silent) alert("Choisissez d'abord « Je suis » (votre nom dans le tableau d'occupation).");
        return { ok: false, reason: "no-teacher", filled: 0, unmatched: 0 };
      }
      if (!tc.teachers.some((t) => t.id === myId)) {
        if (!silent) alert("Votre profil enseignant est introuvable dans le tableau.");
        return { ok: false, reason: "teacher-missing", filled: 0, unmatched: 0 };
      }
      if (!tc.timeSlots.length) {
        if (!silent) alert("Ajoutez d'abord les créneaux horaires du tableau d'occupation.");
        return { ok: false, reason: "no-slots", filled: 0, unmatched: 0 };
      }

      // Effacer uniquement ma ligne pour coller à la programmation actuelle
      Object.keys(tc.cells).forEach((key) => {
        if (key.split("|")[0] === myId) delete tc.cells[key];
      });

      // Accumulators: key teacher|day|slot|week -> { className, level, byPeriod }
      const bucket = new Map();
      let unmatched = 0;

      (appData.classes || []).forEach((cl) => {
        const level = classLevel(cl);
        const className = String(cl.name || "").trim();
        schedulesForClass(cl.id).forEach((sched) => {
          const dayIndex = Number(sched.dayIndex);
          if (!Number.isInteger(dayIndex) || dayIndex < 0 || dayIndex > 4) return;
          const st = normalizeTimeHHMM(sched.startTime || "");
          const en = normalizeTimeHHMM(sched.endTime || "");
          if (!st || !en) return;
          const weeks =
            sched.weekParity === "A" ? ["A"] : sched.weekParity === "B" ? ["B"] : ["A", "B"];
          const matchingTs = tc.timeSlots.filter((ts) =>
            timeRangesOverlap(
              st,
              en,
              normalizeTimeHHMM(ts.startTime || ""),
              normalizeTimeHHMM(ts.endTime || "")
            )
          );
          if (!matchingTs.length) {
            unmatched += 1;
            return;
          }
          const acts = (appData.activities || []).filter(
            (a) =>
              a.classId === cl.id &&
              Array.isArray(a.dayIndices) &&
              a.dayIndices.includes(dayIndex) &&
              a.periodId
          );
          if (!acts.length) return;

          const byPeriod = {};
          acts.forEach((a) => {
            byPeriod[a.periodId] = {
              apsa: String(a.name || "").trim(),
              venue: String(a.venue || "").trim(),
            };
          });
          if (!Object.values(byPeriod).some((p) => p.apsa || p.venue)) return;

          weeks.forEach((week) => {
            matchingTs.forEach((ts) => {
              const key = teamCellKey(myId, dayIndex, ts.id, week);
              const prev = bucket.get(key) || { className: "", level: "", byPeriod: {} };
              prev.className = className || prev.className;
              prev.level = level || prev.level;
              prev.byPeriod = Object.assign({}, prev.byPeriod, byPeriod);
              bucket.set(key, prev);
            });
          });
        });
      });

      bucket.forEach((payload, key) => {
        const parts = key.split("|");
        setTeamCell(parts[0], Number(parts[1]), parts[2], parts[3], payload);
      });

      const filled = bucket.size;
      if (!silent) {
        let msg =
          filled > 0
            ? "Synchronisation terminée : " + filled + " case(s) remplie(s) sur votre ligne."
            : "Aucune case à remplir. Vérifiez la programmation de vos classes (APSA + créneaux EDT).";
        if (unmatched > 0) {
          msg +=
            "\n\n" +
            unmatched +
            " créneau(x) EDT sans correspondance dans les horaires du tableau d'occupation (ajustez les créneaux horaires).";
        }
        alert(msg);
      }
      return { ok: true, filled, unmatched };
    }

    function clearTeamCellPeriod(teacherId, dayIndex, timeSlotId, weekParity, periodId) {
      const cell = getTeamCell(teacherId, dayIndex, timeSlotId, weekParity);
      const byPeriod = Object.assign({}, cell.byPeriod || {});
      byPeriod[periodId] = { apsa: "", venue: "" };
      const still = Object.entries(byPeriod).some(([pid, p]) => pid !== periodId && p && (p.apsa || p.venue));
      if (!still) {
        setTeamCell(teacherId, dayIndex, timeSlotId, weekParity, { className: "", level: "", byPeriod: {} });
      } else {
        setTeamCell(teacherId, dayIndex, timeSlotId, weekParity, {
          className: cell.className || "",
          level: cell.level || "",
          byPeriod,
        });
      }
    }

                      data-timeslot-id="${escapeHtml(ts.id)}"
                      data-week="${week}"
                      data-date-iso="${escapeHtml(dayISO)}">${lines}</button>
                  </td>
                </tr>`;
              })
              .join("");
            const dayHead = `${escapeHtml(DOW[dayIndex])}${filterTeacher ? ` · ${escapeHtml(filterTeacher.name || "")}` : ""}`;
            return `<section class="team-coord-day-v2">
              <table class="team-coord-day-v2-table">
                <thead>
                  <tr><th colspan="2" class="team-coord-day-v2__title">${dayHead}</th></tr>
                  <tr><th class="team-coord-col-slot">Créneau</th><th>${col2Title}</th></tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </section>`;
          })
          .join("")}</div>`;
      }

      return `<div class="card team-coord-card" style="border-left:4px solid #f59e0b">
        <div class="card-header"><h3>Planning professeurs</h3></div>
        <div class="team-coord-me">
          <label class="kpi-sub" for="sel-my-coord-teacher" style="margin:0">Je suis</label>
          <select id="sel-my-coord-teacher" aria-label="Mon profil enseignant">
            <option value="">— Choisir mon nom —</option>
            ${teacherOpts}
          </select>
        </div>
        <div class="team-coord-toolbar">
          <div class="team-coord-toolbar-row">
            <button type="button" class="btn btn-sm btn-primary" id="btn-team-add-teachers-bulk">+ Ajouter professeurs</button>
            <button type="button" class="btn btn-sm btn-primary" id="btn-team-add-timeslot">+ Créneaux horaires</button>
          </div>
          <button type="button" class="btn btn-sm btn-ghost" id="btn-team-sync-from-classes" title="Remplit votre ligne à partir de Programmation de mes classes">↩ Importer ma programmation</button>
        </div>
        <p class="kpi-sub" style="margin:0 0 .55rem">Évitez la double saisie : après avoir rempli <strong>Programmation de mes classes</strong>, utilisez « Importer ma programmation » (ou laissez la synchro auto si « Je suis » est choisi). Les autres professeurs restent à saisir manuellement / à partager.</p>
        ${teacherFilter}
        ${weekSelect}
        ${daysHtml}
      </div>`;
    }

    function openTeamSlotOccupantsModal(dayIndex, timeSlotId, weekParity, dateIso) {
      const tc = ensureTeamCoordination();
      const ts = tc.timeSlots.find((s) => s.id === timeSlotId);
      const day = Number(dayIndex);
      const weekFromUi = weekParity === "B" ? "B" : "A";
      const contextDateIso = coerceISODateString(dateIso) || teamCoordDateForDayIndex(day) || fmtISODate(new Date());
      if (!ts || !Number.isInteger(day)) return;
      if (!teamPeriodsSorted().length) {
        alert("Créez d'abord des périodes dans Organisation EPS → Périodes.");
        return;
      }
      if (!tc.teachers.length) {
        alert("Ajoutez d'abord des professeurs.");
        return;
      }

      const occupantsA = teamSlotStoredOccupants(day, ts.id, "A");
      const occupantsB = teamSlotStoredOccupants(day, ts.id, "B");
      const byTeacherA = new Map();
      const byTeacherB = new Map();
      occupantsA.forEach((o) => {
        byTeacherA.set(o.teacherId, o);
      });
      occupantsB.forEach((o) => {
        byTeacherB.set(o.teacherId, o);
      });
      const teacherIds = new Set([...byTeacherA.keys(), ...byTeacherB.keys()]);
      const sameTeacherPayload = (a, b) =>
        !!a &&
        !!b &&
        a.className === b.className &&
        (a.level || "") === (b.level || "") &&
        JSON.stringify(a.byPeriod || {}) === JSON.stringify(b.byPeriod || {});
      let initial = [];
      teacherIds.forEach((teacherId) => {
        const a = byTeacherA.get(teacherId) || null;
        const b = byTeacherB.get(teacherId) || null;
        if (a && b && sameTeacherPayload(a, b)) {
          initial.push({ ...a, weekScope: "both" });
          return;
        }
        if (a) initial.push(a);
        if (b) initial.push(b);
      });
      const filterId = teamCoordFilterTeacherId || "";
      if (filterId) {
        initial = initial.filter((o) => o.teacherId === filterId);
        if (!initial.length) {
          initial = [{ teacherId: filterId, className: "", level: "", apsa: "", venue: "", byPeriod: {}, weekScope: "both" }];
        }
      }

      const teacherSelectOpts = (selectedId) =>
        tc.teachers
          .map(
            (t) =>
              `<option value="${escapeHtml(t.id)}" ${t.id === selectedId ? "selected" : ""}>${escapeHtml(t.name || "—")}</option>`
          )
          .join("");

      const venueOpts = (name) => {
        const known = (appData.venues || []).some((v) => v.name === name);
        return (
          `<option value="">— Lieu —</option>` +
          (appData.venues || [])
            .map((v) => `<option value="${escapeHtml(v.name)}" ${v.name === name ? "selected" : ""}>${escapeHtml(v.name)}</option>`)
            .join("") +
          `<option value="__other__" ${name && !known ? "selected" : ""}>Autre (saisie)</option>`
        );
      };

      const classDatalist = (appData.classes || [])
        .map((c) => c.name)
        .filter(Boolean)
        .map((n) => `<option value="${escapeHtml(n)}"></option>`)
        .join("");

      function apsaOptions(level, selected) {
        const allNames = level
          ? levelActivityNames(level)
          : [...new Set(CLASS_LEVELS.flatMap((l) => levelActivityNames(l)))].sort((a, b) => a.localeCompare(b, "fr"));
        let html = `<option value="">— APSA —</option>`;
        allNames.forEach((n) => {
          html += `<option value="${escapeHtml(n)}" ${n === selected ? "selected" : ""}>${escapeHtml(n)}</option>`;
        });
        if (selected && !allNames.includes(selected)) {
          html += `<option value="${escapeHtml(selected)}" selected>${escapeHtml(selected)}</option>`;
        }
        return html;
      }

      function periodFieldsHtml(level, byPeriod) {
        const relevant = level ? periodsForLevel(level) : [];
        if (!relevant.length) {
          return `<div class="team-coord-periods-host">
            <p class="kpi-sub" style="margin:0">Choisissez un niveau pour afficher les périodes concernées.</p>
          </div>`;
        }
        return `<div class="team-coord-periods-host">${relevant
          .map((p) => {
            const part = byPeriod && byPeriod[p.id] ? byPeriod[p.id] : {};
            const venue = String(part.venue || "");
            const known = (appData.venues || []).some((v) => v.name === venue);
            return `<div class="team-coord-period-block" data-period-id="${escapeHtml(p.id)}">
              <h4>${escapeHtml(p.name || "Période")} · ${escapeHtml(fmtDateFr(p.startDate))} → ${escapeHtml(fmtDateFr(p.endDate))}</h4>
              <div class="form-group" style="margin-bottom:.35rem">
                <label>APSA</label>
                <select class="f-occ-period-apsa">${apsaOptions(level, String(part.apsa || ""))}</select>
              </div>
              <div class="form-group" style="margin:0">
                <label>Lieu</label>
                <select class="f-occ-period-venue">${venueOpts(venue)}</select>
                <input class="f-occ-period-venue-other" placeholder="Nom du lieu" value="${escapeHtml(venue && !known ? venue : "")}" style="margin-top:.35rem;${venue && !known ? "" : "display:none"}" />
              </div>
            </div>`;
          })
          .join("")}</div>`;
      }

      let occRowSeq = 0;
      function occupantRowHtmlFixed(o) {
        occRowSeq += 1;
        const uidRadio = "occweek" + occRowSeq;
        const level = o.level || inferClassLevel(o.className) || "";
        const scope = o.weekScope === "A" || o.weekScope === "B" ? o.weekScope : "both";
        const teacherId = o.teacherId || tc.teachers[0].id;
        const teacherColor = teamTeacherColor(teacherId);
        return `<div class="team-coord-occ-row team-coord-occ-row--tinted" data-week-scope="${escapeHtml(scope)}" style="--teacher-color:${escapeHtml(teacherColor)};--teacher-soft:${escapeHtml(alphaColor(teacherColor, 0.16))}">
          <div class="form-group" style="margin-bottom:.35rem">
            <label>Professeur</label>
            <select class="f-occ-teacher">${teacherSelectOpts(teacherId)}</select>
          </div>
          <div class="form-group" style="margin-bottom:.35rem">
            <label>Semaines</label>
            <div class="team-coord-week-scope" role="radiogroup">
              <label><input type="radio" class="f-occ-week" name="${uidRadio}" value="both" ${scope === "both" ? "checked" : ""} /> Toutes les semaines</label>
              <label><input type="radio" class="f-occ-week" name="${uidRadio}" value="A" ${scope === "A" ? "checked" : ""} /> Semaine A</label>
              <label><input type="radio" class="f-occ-week" name="${uidRadio}" value="B" ${scope === "B" ? "checked" : ""} /> Semaine B</label>
            </div>
          </div>
          <div class="form-row" style="margin-bottom:.35rem">
            <div class="form-group" style="margin:0;flex:1">
              <label>Niveau</label>
              <select class="f-occ-level"><option value="">—</option>${levelOptionsHtml(level)}</select>
            </div>
            <div class="form-group" style="margin:0;flex:1">
              <label>Classe</label>
              <input class="f-occ-class" list="f-occ-class-list" value="${escapeHtml(o.className || "")}" placeholder="ex. 6eA" autocomplete="off" />
            </div>
          </div>
          ${periodFieldsHtml(level, o.byPeriod || (o.apsa || o.venue ? { [periodIdForDateAndLevel(contextDateIso, level)]: { apsa: o.apsa || "", venue: o.venue || "" } } : {}))}
          <button type="button" class="btn btn-sm btn-danger btn-occ-remove">Retirer</button>
        </div>`;
      }

      const body = el(`<div>
        <p class="kpi-sub" style="margin:0 0 .55rem"><strong>${escapeHtml(DOW[day] || "")}</strong> · ${escapeHtml(fmtDateFr(contextDateIso))} · ${escapeHtml(teamTimeLabel(ts))} · APSA et lieu selon les périodes de chaque niveau. Cours différent en A et B : deux lignes du même professeur (Semaine A + Semaine B).</p>
        <datalist id="f-occ-class-list">${classDatalist}</datalist>
        <div id="f-occ-list">${(initial.length ? initial : [{ teacherId: filterId || tc.teachers[0].id, className: "", level: "", byPeriod: {}, weekScope: "both" }]).map(occupantRowHtmlFixed).join("")}</div>
        <button type="button" class="btn btn-sm btn-ghost" id="btn-occ-add" style="margin-top:.25rem">+ Ajouter un professeur (ou l'autre semaine A/B)</button>
      </div>`);

      const listRoot = body.querySelector("#f-occ-list");

      function wireRow(row) {
        const teacherSel = row.querySelector(".f-occ-teacher");
        const levelSel = row.querySelector(".f-occ-level");
        const classInp = row.querySelector(".f-occ-class");
        const applyTeacherTint = () => {
          const color = teamTeacherColor(teacherSel?.value || "");
          row.style.setProperty("--teacher-color", color);
          row.style.setProperty("--teacher-soft", alphaColor(color, 0.16));
        };
        const collectPeriodValues = () => {
          const byPeriod = {};
          row.querySelectorAll(".team-coord-period-block").forEach((block) => {
            const pid = block.getAttribute("data-period-id") || "";
            if (!pid) return;
            const apsa = (block.querySelector(".f-occ-period-apsa")?.value || "").trim();
            let venue = (block.querySelector(".f-occ-period-venue")?.value || "").trim();
            if (venue === "__other__") venue = (block.querySelector(".f-occ-period-venue-other")?.value || "").trim();
            byPeriod[pid] = { apsa, venue };
          });
          return byPeriod;
        };
        const wirePeriodVenueFields = () => {
          row.querySelectorAll(".f-occ-period-venue").forEach((venueSel) => {
            venueSel.addEventListener("change", () => {
              const other = venueSel.closest(".form-group")?.querySelector(".f-occ-period-venue-other");
              if (other) other.style.display = venueSel.value === "__other__" ? "block" : "none";
            });
          });
        };
        const refreshPeriods = () => {
          const level = levelSel.value || inferClassLevel(classInp.value) || "";
          const host = row.querySelector(".team-coord-periods-host");
          if (host) host.outerHTML = periodFieldsHtml(level, collectPeriodValues());
          wirePeriodVenueFields();
        };
        teacherSel?.addEventListener("change", applyTeacherTint);
        applyTeacherTint();
        wirePeriodVenueFields();
        levelSel.addEventListener("change", refreshPeriods);
        classInp.addEventListener("change", () => {
          if (!levelSel.value) {
            const inferred = inferClassLevel(classInp.value);
            if (inferred) levelSel.value = inferred;
          }
          refreshPeriods();
        });
        row.querySelectorAll(".f-occ-week").forEach((radio) => {
          radio.addEventListener("change", () => {
            if (!radio.checked) return;
            const prev = row.getAttribute("data-week-scope") || "both";
            const next = radio.value || "both";
            row.setAttribute("data-week-scope", next);
            if (next !== "A" && next !== "B") return;
            const teacherId = teacherSel?.value || "";
            const keepWeeks = prev === "both" ? ["A", "B"].filter((w) => w !== next) : prev === "A" || prev === "B" ? [prev] : [];
            keepWeeks.forEach((w) => {
              if (w === next) return;
              const exists = [...listRoot.querySelectorAll(".team-coord-occ-row")].some((r) => {
                if (r === row) return false;
                if ((r.querySelector(".f-occ-teacher")?.value || "") !== teacherId) return false;
                const s = (r.querySelector(".f-occ-week:checked") || {}).value || "both";
                return s === "both" || s === w;
              });
              if (exists) return;
              listRoot.insertAdjacentHTML(
                "beforeend",
                occupantRowHtmlFixed({
                  teacherId,
                  className: classInp.value || "",
                  level: levelSel.value || "",
                  byPeriod: collectPeriodValues(),
                  weekScope: w,
                })
              );
              wireRow(listRoot.lastElementChild);
            });
          });
        });
        row.querySelector(".btn-occ-remove")?.addEventListener("click", () => {
          if (listRoot.querySelectorAll(".team-coord-occ-row").length <= 1) {
            classInp.value = "";
            levelSel.value = "";
            refreshPeriods();
            return;
          }
          row.remove();
        });
      }

      listRoot.querySelectorAll(".team-coord-occ-row").forEach(wireRow);
      body.querySelector("#btn-occ-add")?.addEventListener("click", () => {
        const lastTeacher = listRoot.querySelector(".team-coord-occ-row:last-child .f-occ-teacher")?.value
          || filterId
          || tc.teachers[0].id;
        const usedWeeks = new Set();
        listRoot.querySelectorAll(".team-coord-occ-row").forEach((row) => {
          if ((row.querySelector(".f-occ-teacher")?.value || "") !== lastTeacher) return;
          const scope = (row.querySelector(".f-occ-week:checked") || {}).value || "both";
          if (scope === "both") {
            usedWeeks.add("A");
            usedWeeks.add("B");
          } else {
            usedWeeks.add(scope === "B" ? "B" : "A");
          }
        });
        let weekScope = weekFromUi;
        if (usedWeeks.has("A") && !usedWeeks.has("B")) weekScope = "B";
        else if (usedWeeks.has("B") && !usedWeeks.has("A")) weekScope = "A";
        else if (usedWeeks.has("A") && usedWeeks.has("B")) weekScope = weekFromUi;
        listRoot.insertAdjacentHTML(
          "beforeend",
          occupantRowHtmlFixed({
            teacherId: lastTeacher,
            className: "",
            level: "",
            byPeriod: {},
            weekScope,
          })
        );
        wireRow(listRoot.lastElementChild);
      });

      openModal("Professeurs sur ce créneau", body, () => {
        const rows = [...listRoot.querySelectorAll(".team-coord-occ-row")];
        const entries = [];
        const seenScopes = new Set();
        for (const row of rows) {
          const teacherId = row.querySelector(".f-occ-teacher")?.value || "";
          if (!teacherId) continue;
          const weekScope = (row.querySelector(".f-occ-week:checked") || {}).value || "both";
          const className = (row.querySelector(".f-occ-class")?.value || "").trim();
          let level = (row.querySelector(".f-occ-level")?.value || "").trim();
          if (!CLASS_LEVELS.includes(level)) level = inferClassLevel(className) || "";
          const relevantPeriods = level ? periodsForLevel(level) : [];
          const byPeriod = {};
          relevantPeriods.forEach((p) => {
            const block = [...row.querySelectorAll(".team-coord-period-block")].find((el) => (el.getAttribute("data-period-id") || "") === p.id);
            if (!block) return;
            const apsa = (block.querySelector(".f-occ-period-apsa")?.value || "").trim();
            let venue = (block.querySelector(".f-occ-period-venue")?.value || "").trim();
            if (venue === "__other__") venue = (block.querySelector(".f-occ-period-venue-other")?.value || "").trim();
            byPeriod[p.id] = { apsa, venue };
          });
          const hasPeriodData = Object.values(byPeriod).some((p) => p && (p.apsa || p.venue));
          if (!className && !hasPeriodData) continue;
          const weeks = weekScope === "both" ? ["A", "B"] : weekScope === "B" ? ["B"] : ["A"];
          const overlapsExisting = weeks.some((w) => seenScopes.has(teacherId + "|" + w));
          if (overlapsExisting) {
            alert("Un même professeur ne peut pas être saisi deux fois sur la même semaine de ce créneau. Pour A et B différents, ajoutez deux lignes (Semaine A + Semaine B).");
            return false;
          }
          weeks.forEach((w) => seenScopes.add(teacherId + "|" + w));
          entries.push({ teacherId, className, level, byPeriod, weeks });
        }

        const coveredWeeks = new Map();
        entries.forEach((e) => {
          if (!coveredWeeks.has(e.teacherId)) coveredWeeks.set(e.teacherId, new Set());
          e.weeks.forEach((w) => coveredWeeks.get(e.teacherId).add(w));
        });

        const previously = new Set([
          ...occupantsA.map((o) => o.teacherId),
          ...occupantsB.map((o) => o.teacherId),
        ]);
        previously.forEach((tid) => {
          if (coveredWeeks.has(tid)) return;
          setTeamCell(tid, day, ts.id, "A", { className: "", level: "", byPeriod: {} });
          setTeamCell(tid, day, ts.id, "B", { className: "", level: "", byPeriod: {} });
        });

        coveredWeeks.forEach((weeks, tid) => {
          ["A", "B"].forEach((w) => {
            if (!weeks.has(w)) setTeamCell(tid, day, ts.id, w, { className: "", level: "", byPeriod: {} });
          });
        });
        entries.forEach((e) => {
          e.weeks.forEach((w) => {
            setTeamCell(e.teacherId, day, ts.id, w, {
              className: e.className,
              level: e.level,
              byPeriod: e.byPeriod,
            });
          });
        });

        saveData();
        render();
        return true;
      });
    }

      <div class="card">

        .sort((x, y) => String(x.date || "").localeCompare(String(y.date || "")));

            ${competitions

                <td>${escapeHtml(c.coach || "—")}</td>
                <td class="no-print"><button type="button" class="btn btn-sm btn-danger btn-as-del-competition" data-activity-id="${escapeHtml(openActivity.id)}" data-id="${escapeHtml(c.id)}" title="Supprimer cette compétition">Supprimer</button></td>

      let panelHtml = "";
      if (tab === "students") {
        panelHtml = `<div class="as-settings-panel">
          <div class="card-header" style="margin-bottom:.5rem;padding:0;border:none">
            <h4 style="margin:0">Élèves inscrits</h4>
            <button type="button" class="btn btn-sm btn-primary btn-as-edit-students" data-id="${escapeHtml(openActivity.id)}">+ Ajouter un élève</button>
          </div>
          <p class="kpi-sub" style="margin:0 0 .5rem">Import CSV possible dans la fenêtre d'ajout. Modifier ou supprimer depuis la liste.</p>
          <div id="f-as-students-list-settings" class="as-students-settings-list">${studentsListHtml}</div>
        </div>`;
      } else if (tab === "competitions") {
        panelHtml = `<div class="as-settings-panel">
          <div class="card-header" style="margin-bottom:.5rem;padding:0;border:none">
            <h4 style="margin:0">Compétitions</h4>
            <button type="button" class="btn btn-sm btn-primary btn-as-add-competition" data-id="${escapeHtml(openActivity.id)}">+ Compétition</button>
          </div>
          ${competitionsHtml}
        </div>`;

    function capitalizeFrLabel(s) {
      const t = String(s || "").trim();
      return t ? t.charAt(0).toUpperCase() + t.slice(1) : "";
    }

    function calendarNavPeriodLabel() {
      if (calendarMode === "month") {
        const y = calendarCursor.getFullYear();
        const m = calendarCursor.getMonth();
        return capitalizeFrLabel(
          new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" }).format(new Date(y, m))
        );
      }
      const mon = addDays(calendarCursor, -dayIndexMon0(calendarCursor));
      const sun = addDays(mon, 6);
      const dayMonth = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });
      const monthYear = new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" });
      const yearOnly = new Intl.DateTimeFormat("fr-FR", { year: "numeric" });
      if (mon.getFullYear() === sun.getFullYear() && mon.getMonth() === sun.getMonth()) {
        return capitalizeFrLabel(`${mon.getDate()} – ${sun.getDate()} ${monthYear.format(mon)}`);
      }
      if (mon.getFullYear() === sun.getFullYear()) {
        return capitalizeFrLabel(`${dayMonth.format(mon)} – ${dayMonth.format(sun)} ${yearOnly.format(mon)}`);
      }
      return capitalizeFrLabel(`${dayMonth.format(mon)} ${yearOnly.format(mon)} – ${dayMonth.format(sun)} ${yearOnly.format(sun)}`);
    }

    function openCalendarPeriodPicker() {
      const restoreFullscreen = typeof calendarViewRefresh === "function";
      if (restoreFullscreen) calendarViewRefresh = null;
      const body = el("<div></div>");
      if (calendarMode === "month") {
        const y = calendarCursor.getFullYear();
        const m = String(calendarCursor.getMonth() + 1).padStart(2, "0");
        body.innerHTML = `<div class="form-group"><label>Mois à afficher</label><input type="month" id="cal-pick-period" value="${y}-${m}" /></div>`;
        openModal("Choisir un mois", body, () => {
          const v = body.querySelector("#cal-pick-period")?.value || "";
          if (!v) return false;
          const [yy, mm] = v.split("-").map(Number);
          if (!yy || !mm) return false;
          calendarCursor = new Date(yy, mm - 1, 1);
          if (restoreFullscreen) openFullscreenCalendar();
          else render();
        });
        return;
      }
      const mon = addDays(calendarCursor, -dayIndexMon0(calendarCursor));
      body.innerHTML = `<div class="form-group"><label>Semaine à afficher</label><input type="date" id="cal-pick-period" value="${escapeHtml(fmtISODate(mon))}" /></div>

        else render();
      });

      const dateVal = coerceISODateString(defaultDate) || dashboardDateISO();
      const kindOpts = SCHOOL_EVENT_KINDS.map(
        (k) => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`

      const body = el(`<div>

      </div>`);
      openModal("Événement établissement", body, () => {
        const date = body.querySelector("#f-school-event-date")?.value || "";
        const startTime = normalizeTimeHHMM(body.querySelector("#f-school-event-start")?.value || "");
        const endTime = normalizeTimeHHMM(body.querySelector("#f-school-event-end")?.value || "");
        const kind = body.querySelector("#f-school-event-kind")?.value || "Autre";
        const title = (body.querySelector("#f-school-event-title")?.value || "").trim();
        const blocksSessions = !!body.querySelector("#f-school-event-blocks")?.checked;
        if (!date) {
          alert("Veuillez renseigner la date.");
          return false;
        }
        if (!title) {
          alert("Veuillez renseigner l'intitulé de l'événement.");
          return false;
        }
        if ((startTime && !endTime) || (!startTime && endTime)) {
          alert("Indiquez une heure de début et de fin, ou laissez les deux vides pour la journée entière.");
          return false;
        }
        if (startTime && endTime && startTime >= endTime) {
          alert("L'heure de fin doit être après l'heure de début.");
          return false;
        }
        if (!Array.isArray(appData.schoolCalendarEvents)) appData.schoolCalendarEvents = [];
        appData.schoolCalendarEvents.push({ id: uid(), date, startTime, endTime, kind, title, blocksSessions });
        if (blocksSessions) {
          regenerateSessions();
          saveData();

        finishCalendarAfterEdit(restoreFullscreen);
        if (blocksSessions && !restoreFullscreen) render();

      const weekHtml = (() => {

      const calHint = `<p class="cal-scroll-hint no-print">Touchez une case pour ajouter un événement ou un rappel · un événement pour le détail · pincez pour zoomer</p>`;

      return `<div class="${scrollClass}" id="cal-scroll-area">${inner}</div>`;
    }

    /**
     * Lignes de tableau pour une liste de séances (même colonnes que l'ancienne vue annuelle).

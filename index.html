    function activityHasScheduledSlotOnDate(activity, dateStr) {
      if (!activity || dateStr < activity.startDate || dateStr > activity.endDate) return false;
      const d = parseISODate(dateStr);
      const dayIndex = dayIndexMon0(d);
      const picked = pickActivityForSession(activity.classId, dateStr, dayIndex);
      if (!picked || picked.id !== activity.id) return false;
      return schedulesForClass(activity.classId).some(
        (slot) => slot.dayIndex === dayIndex && matchesWeekParity(slot, d)
      );
    }

    function holidayTouchesActivityBetween(holiday, activity, previousDate, nextDate) {
      const firstDate = [holiday.startDate, fmtISODate(addDays(parseISODate(previousDate), 1))].sort().pop();
      const lastDate = [holiday.endDate, fmtISODate(addDays(parseISODate(nextDate), -1))].sort()[0];
      if (firstDate > lastDate) return false;
      const end = parseISODate(lastDate);
      for (let cursor = parseISODate(firstDate); cursor <= end; cursor = addDays(cursor, 1)) {
        const iso = fmtISODate(cursor);
        if (iso >= holiday.startDate && iso <= holiday.endDate && activityHasScheduledSlotOnDate(activity, iso)) {
          return true;
        }
      }
      return false;
    }

    function interruptionsBetweenSessions(prevSession, nextSession) {
      if (!prevSession || !nextSession || prevSession.activityId !== nextSession.activityId) return [];
      const activity = activityById(prevSession.activityId);
      if (!activity) return [];
      return (appData.holidays || [])
        .filter((h) => h.blocksSessions && (h.type === "vacances" || h.type === "ferie"))
        .filter((h) => h.endDate > prevSession.date && h.startDate < nextSession.date)
        .filter((h) => holidayTouchesActivityBetween(h, activity, prevSession.date, nextSession.date))
        .sort((a, b) => a.startDate.localeCompare(b.startDate));
    }

    function renderSessionInterruptionRow(holiday) {
      const isFerie = holiday.type === "ferie";
      const label = isFerie
        ? `Pas de séance car férié le ${fmtDateFr(holiday.startDate)}${holiday.name ? " · " + holiday.name : ""}`
        : `Vacances du ${fmtDateFr(holiday.startDate)} au ${fmtDateFr(holiday.endDate)}${holiday.name ? " · " + holiday.name : ""}`;
      const klass = isFerie ? "session-interrupt--ferie" : "session-interrupt--vacances";
      const icon = isFerie ? "🟧" : "🟥";
      return `<tr class="session-interrupt-row"><td colspan="8"><span class="session-interrupt ${klass}">${icon} ${escapeHtml(label)}</span></td></tr>`;
    }

    function renderSessionRowsHtml(sessions) {
      const sorted = sessions.slice().sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      const filtered = sorted.filter((s) => matchesSearch(s.date) || matchesSearch(activityById(s.activityId)?.name || ""));
      const rowParts = [];
      filtered.forEach((s, index) => {
          if (index > 0) {
            interruptionsBetweenSessions(filtered[index - 1], s).forEach((h) => {
              rowParts.push(renderSessionInterruptionRow(h));
            });
          }
          const stt = computeSessionStatus(s);
          const act = activityById(s.activityId);
          const d = parseISODate(s.date);
          const jour = new Intl.DateTimeFormat("fr-FR", { weekday: "long" }).format(d);
          const canc = cancellationForSession(s);
          let action = "";
          if (canc) {
            action = `<button type="button" class="btn btn-sm btn-ghost btn-remove-canc-row" data-canc-id="${canc.id}">Lever l'annulation</button>`;
          } else if (stt.code === "planned" || stt.code === "today") {
            action = `<button type="button" class="btn btn-sm btn-danger btn-cancel-session" data-session-id="${s.id}">Annuler</button>`;
          }
          if (s.extra) {
            action += `<button type="button" class="btn btn-sm btn-danger btn-del-extra-session" data-session-id="${s.id}" style="margin-left:.3rem" title="Supprimer ce cours ajouté">Supprimer</button>`;
          }
          const col = stt.code === "cancelled" ? "var(--danger)" : stt.code === "done" ? "var(--success)" : "var(--accent)";
          const isToday = stt.code === "today";
          const hasSummary = s.summary && s.summary.trim();
          const hasPdf = !!s.sessionPdf;
          const summaryIcon = hasSummary ? '<span style="color:var(--accent);font-weight:700;font-size:1rem;margin-right:.35rem" title="Résumé rédigé">📝</span>' : "";
          const pdfIcon = hasPdf ? '<span style="color:var(--danger);font-size:1rem;margin-right:.2rem" title="PDF joint">📄</span>' : "";
          const cyclePos = sessionCyclePosition(s);
          const pillClass =
            stt.code === "cancelled"
              ? "status-pill--cancelled"
              : stt.code === "done"
                ? "status-pill--done"
                : stt.code === "holiday"
                  ? "status-pill--holiday"
                  : "status-pill--planned";
          const actCell = act
            ? `${escapeHtml(act.name)}${cyclePos ? `<span class="session-cycle-num">Séance n°${cyclePos.index} / ${cyclePos.total}</span>` : ""}`
            : "—";
          rowParts.push(`<tr style="${isToday ? "background:#16a34a22;font-weight:600" : ""}${stt.code === "cancelled" ? ";opacity:.92" : ""};cursor:pointer" class="btn-session-summary" data-session-id="${s.id}" title="${hasSummary ? "Voir / modifier le résumé" : "Ajouter un résumé"}">
            <td>${fmtDateFr(s.date)}</td>
            <td>${escapeHtml(jour)}</td>
            <td>${s.startTime}–${s.endTime}</td>
            <td>${escapeHtml(s.venue || "—")}</td>
            <td>${actCell}</td>
            <td><span class="status-pill ${pillClass}"><span class="status-dot" style="background:${col}"></span>${escapeHtml(stt.label)}</span></td>
            <td>${escapeHtml(canc ? REASON_TYPES.find((x) => x[0] === canc.reasonType)?.[1] || canc.reasonType : stt.reason || "")}</td>
            <td class="no-print">${(() => { const att = s.attendance || {}; const keys = Object.keys(att); if (!keys.length) return ""; const p = keys.filter((k) => att[k] === "present").length; const ab = keys.filter((k) => att[k] === "absent").length; const l = keys.filter((k) => att[k] === "late").length; return `<span style="font-size:.7rem;font-weight:600;padding:.15rem .45rem;border-radius:10px;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;margin-right:.3rem" title="Appel">${p}P${l ? " "+l+"R" : ""}${ab ? " "+ab+"A" : ""}</span>`; })()}${pdfIcon}${summaryIcon}${action}</td>
          </tr>`);
        });
      const rows = rowParts.join("");
      return rows || `<tr><td colspan="8">Aucune séance dans ce groupe.</td></tr>`;
    }

    function renderExemptionsBlock(classId) {
      const exs = exemptionsForClass(classId);
      const rows = exs
        .slice()
        .sort((a, b) => a.endDate.localeCompare(b.endDate))
        .map((ex) => {
          const active = isExemptionActive(ex);
          const badge = active
            ? '<span class="badge" style="background:var(--danger);color:#fff">En cours</span>'
            : '<span class="badge">Terminée</span>';
          const remainingLabel = exemptionRemainingLabel(ex);
          return `<tr>
            <td><strong>${escapeHtml(ex.studentName)}</strong></td>
            <td>${ex.sansCertificat ? "—" : (ex.certDate ? fmtDateFr(ex.certDate) : "—")}</td>
            <td>${formatExemptionDurationCell(ex)}</td>
            <td>${fmtDateFr(ex.startDate)}</td>
            <td>${fmtDateFr(ex.endDate)}</td>
            <td>${remainingLabel}</td>
            <td>${badge}</td>
            <td class="no-print"><button type="button" class="btn btn-sm btn-danger btn-del-exemption" data-id="${ex.id}">Supprimer</button><button type="button" class="btn btn-sm btn-ghost btn-edit-exemption" data-id="${ex.id}" style="margin-top:.25rem">Modifier</button></td>
          </tr>`;
        })
        .join("");
      return `<div class="card" style="border-left:5px solid var(--danger)">
        <h3 style="margin-bottom:.5rem">Dispenses (${exs.length})</h3>
        ${exs.length
          ? `<div class="table-wrap"><table><thead><tr><th>Élève</th><th>Certificat</th><th>Durée</th><th>Début</th><th>Fin</th><th>Jours restants</th><th>Statut</th><th class="no-print">Action</th></tr></thead><tbody>${rows}</tbody></table></div>`
          : '<p class="kpi-sub">Aucune dispense en cours.</p>'}
        <button type="button" class="btn btn-sm btn-danger no-print" id="btn-add-exemption" data-classid="${classId}" style="font-weight:700;margin-top:.75rem">+ Ajouter une dispense</button>
      </div>`;
    }

    function forgottenGearForClass(classId) {
      return (appData.forgottenGear || []).filter((f) => f.classId === classId);
    }

    function renderForgottenGearBlock(classId, activePeriod) {
      let items = forgottenGearForClass(classId);
      if (activePeriod) {
        const { start, end } = periodDatesForClass(activePeriod, classId);
        items = items.filter((f) => f.date >= start && f.date <= end);
      }
      const countByStudent = {};
      items.forEach((f) => {
        const key = f.studentName;
        if (!countByStudent[key]) countByStudent[key] = [];
        countByStudent[key].push(f);
      });
      const studentRows = Object.keys(countByStudent)
        .sort((a, b) => countByStudent[b].length - countByStudent[a].length)
        .map((name) => {
          const entries = countByStudent[name].sort((a, b) => a.date.localeCompare(b.date));
          const details = entries.map((f) => `${fmtDateFr(f.date)} (${escapeHtml(f.item || "—")})`).join(", ");
          const count = entries.length;
          const countStyle = count >= 3 ? "color:var(--danger);font-weight:700" : count >= 2 ? "color:#d97706;font-weight:600" : "";
          const rowStyle = count >= 3 ? "background:rgba(220,38,38,.12);color:var(--danger);font-weight:600" : "";
          return `<tr class="fg-student-row" data-student="${escapeHtml(name)}" style="${rowStyle}">
            <td><strong>${escapeHtml(name)}</strong></td>
            <td style="${countStyle}">${count}</td>
            <td class="kpi-sub">${details}</td>
            <td class="no-print">${entries.map((f) => `<button type="button" class="btn btn-sm btn-danger btn-del-forgotten" data-id="${f.id}" style="margin:.1rem">✕</button>`).join("")}</td>
          </tr>`;
        })
        .join("");

      return `<div class="card" style="border-left:5px solid #d97706">
        <h3 style="margin-bottom:.5rem">Oublis de matériel${activePeriod ? " — " + escapeHtml(activePeriod.name) : ""} (${items.length})</h3>
        ${studentRows
          ? `<div class="table-wrap"><table><thead><tr><th>Élève</th><th>Nb oublis</th><th>Dates & objets</th><th class="no-print">Suppr.</th></tr></thead><tbody>${studentRows}</tbody></table></div>`
          : '<p class="kpi-sub">Aucun oubli enregistré sur cette période.</p>'}
        <button type="button" class="btn btn-sm no-print" id="btn-add-forgotten" data-classid="${classId}" style="margin-top:.75rem;font-weight:700;background:#d97706;color:#fff">+ Ajouter un oubli</button>
      </div>`;
    }

    /**
     * Onglet classe : séances filtrées par période, avec sélecteur de période.
     */
    function viewClassPage(classId) {
      const cl = getClassById(classId);
      if (!cl) return renderTopbar("Classe", "") + `<div class="card"><p>Classe introuvable.</p></div>`;
      const st = sessionStatsForClass(classId);
      const { next, lastDone } = nextAndLastSession(classId);

      const clPeriods = periodsForClass(classId);
      const todayStr = fmtISODate(new Date());
      const currentPeriod = clPeriods.find((p) => {
        const { start, end } = periodDatesForClass(p, classId);
        return todayStr >= start && todayStr <= end;
      });
      const hasManualPeriodChoice = Object.prototype.hasOwnProperty.call(classSelectedPeriod, classId);
      const selectedPeriodId = hasManualPeriodChoice
        ? classSelectedPeriod[classId]
        : (currentPeriod ? currentPeriod.id : null);
      const activePeriod = clPeriods.find((p) => p.id === selectedPeriodId) || null;
      const periodPalette = ["#8ba4ff", "#2dd4bf", "#fcd34d", "#fb7185", "#a5b4fc", "#38bdf8", "#4ade80"];
      const activePeriodIndex = activePeriod ? clPeriods.findIndex((p) => p.id === activePeriod.id) : -1;
      const selectorColor = activePeriodIndex >= 0 ? periodPalette[activePeriodIndex % periodPalette.length] : "#94a3b8";

      const periodSelector = clPeriods.length
        ? `<select id="class-period-select" aria-label="Sélectionner une période">
              ${clPeriods.map((p) => {
                const isCur = currentPeriod && p.id === currentPeriod.id;
                const pRange = periodDatesForClass(p, classId);
                const extMark = periodDateOverrides(p)[classId]?.endDate > p.endDate ? " ⏱" : "";
                return `<option value="${p.id}" ${p.id === selectedPeriodId ? "selected" : ""}>${escapeHtml(p.name)} (${fmtDateFr(pRange.start)} → ${fmtDateFr(pRange.end)}${extMark})${isCur ? " ● en cours" : ""}</option>`;
              }).join("")}
              <option value="__all__" ${selectedPeriodId === null ? "selected" : ""}>Toutes les périodes</option>
            </select>`
        : "";
      const periodSelectorCard = periodSelector
        ? `<div class="card class-period-selector-card no-print" style="--period-c:${selectorColor}">
          <div class="class-period-selector-head">
            <span class="class-period-selector-icon" aria-hidden="true">📅</span>
            <div>
              <div class="class-period-selector-title">Sélectionner une période</div>
              <span class="class-period-selector-sub">Filtre les tableaux APSA affichés ci-dessous.</span>
            </div>
          </div>
          ${periodSelector}
        </div>`
        : "";

      const activePeriodRange = activePeriod ? periodDatesForClass(activePeriod, classId) : null;
      const periodActs = activePeriod
        ? activitiesForClass(classId).filter(
            (a) =>
              (a.periodId && a.periodId === activePeriod.id) ||
              (activePeriodRange &&
                a.startDate >= activePeriodRange.start &&
                a.endDate <= activePeriodRange.end)
          )
        : activitiesForClass(classId);

      const activityBelongsToPeriod = (activity, period) => {
        if (activity.periodId === period.id) return true;
        const { start, end } = periodDatesForClass(period, activity.classId);
        return activity.startDate >= start && activity.endDate <= end;
      };
      const allClassActs = activitiesForClass(classId);
      const activePeriodActIds = new Set(activePeriod ? periodActs.map((a) => a.id) : []);
      const programmedCountForActivity = (activityId) => {
        const subs = sessionsForClass(classId).filter((s) => s.activityId === activityId);
        return subs.filter((s) => computeSessionStatus(s).code !== "cancelled").length;
      };
      const periodProgramming = clPeriods.map((p, idx) => {
        const periodColor = periodPalette[idx % periodPalette.length];
        const acts = allClassActs.filter((a) => activityBelongsToPeriod(a, p));
        const isSelected = activePeriod && p.id === activePeriod.id;
        const actHtml = acts.length
          ? acts.map((a) => {
              const programmed = programmedCountForActivity(a.id);
              const cycleInfo = programmed ? `${programmed} séance${programmed > 1 ? "s" : ""} programmée${programmed > 1 ? "s" : ""}` : "Aucune séance programmée";
              const activeClass = activePeriodActIds.has(a.id) ? " is-active" : "";
              return `<span class="class-apSA-item${activeClass}">
                <span class="class-apSA-name">${escapeHtml(a.name)}</span>
                <span class="class-apSA-meta">${fmtDateFr(a.startDate)} → ${fmtDateFr(a.endDate)} · ${cycleInfo}</span>
              </span>`;
            }).join("")
          : '<p class="kpi-sub" style="margin:0">Aucune APSA sur cette période.</p>';
        return `<div class="class-apSA-period${isSelected ? " is-selected" : ""}" style="--period-c:${periodColor}">
          <div class="class-apSA-period-head">
            <span class="class-apSA-period-title">${escapeHtml(p.name)}</span>
            ${isSelected ? '<span class="class-apSA-period-badge">Période sélectionnée</span>' : ""}
            <span class="class-apSA-period-dates">${(() => {
              const r = periodDatesForClass(p, classId);
              const ext = periodDateOverrides(p)[classId]?.endDate > p.endDate;
              return `${fmtDateFr(r.start)} → ${fmtDateFr(r.end)}${ext ? " (prolongée)" : ""}`;
            })()}</span>
          </div>
          ${actHtml}
        </div>`;
      }).join("");
      const orphanActs = allClassActs.filter((a) => !a.periodId || !clPeriods.some((p) => activityBelongsToPeriod(a, p)));
      const orphanProgramming = orphanActs.length
        ? `<div class="class-apSA-period" style="--period-c:#94a3b8">
          <div class="class-apSA-period-head"><span class="class-apSA-period-title">Sans période</span></div>
          ${orphanActs.map((a) => {
            const programmed = programmedCountForActivity(a.id);
            const cycleInfo = programmed ? `${programmed} séance${programmed > 1 ? "s" : ""} programmée${programmed > 1 ? "s" : ""}` : "Aucune séance programmée";
            return `<span class="class-apSA-item">
              <span class="class-apSA-name">${escapeHtml(a.name)}</span>
              <span class="class-apSA-meta">${fmtDateFr(a.startDate)} → ${fmtDateFr(a.endDate)} · ${cycleInfo}</span>
            </span>`;
          }).join("")}
        </div>`
        : "";
      const pactStr = periodProgramming || orphanProgramming
        ? periodProgramming + orphanProgramming
        : "—";

      const sections = [];
      periodActs.forEach((a) => {
        const subs = sessionsForClass(classId).filter((s) => s.activityId === a.id);
        if (!subs.length) return;
        const aSt = sessionStatsForSessions(subs);
        sections.push(`<div class="card" style="border-left:5px solid ${escapeHtml(a.color)}">
          <div class="activity-card-head">
            <h3>${escapeHtml(a.name)} <span class="badge" style="font-size:0.78rem;vertical-align:middle">${aSt.remaining} restante(s)</span></h3>
          </div>
          <div class="activity-participation-wrap no-print">
            <button type="button" class="btn btn-participation btn-activity-participation" data-classid="${classId}" data-activityid="${a.id}">
              <span class="btn-participation-icon" aria-hidden="true">👥</span>
              <span class="btn-participation-label">Participation des élèves aux séances</span>
            </button>
          </div>
          <p class="kpi-sub"><strong>Période</strong> ${fmtDateFr(a.startDate)} → ${fmtDateFr(a.endDate)} · <strong>Jours</strong> : ${escapeHtml(formatDayIndicesLabel(a))}</p>
          <div class="table-wrap session-table-wrap" data-table-title="${escapeHtml(a.name)} — ${escapeHtml(cl.name)}"><table><thead><tr><th>Date</th><th>Jour</th><th>Horaire</th><th>Lieu</th><th>APSA</th><th>Statut</th><th>Motif / info</th><th class="no-print">Action</th></tr></thead><tbody>
          ${renderSessionRowsHtml(subs)}
          </tbody></table></div>
        </div>`);
      });
      {
        const shownActIds = new Set(periodActs.map((a) => a.id));
        const orphan = sessionsForClass(classId).filter((s) => s.extra && (!s.activityId || !shownActIds.has(s.activityId)));
        if (orphan.length) {
          sections.push(`<div class="card" style="border-left:5px solid #d97706">
            <h3 style="margin-bottom:.35rem">📌 Cours ajoutés — sans APSA</h3>
            <p class="kpi-sub">Ces cours ont été ajoutés manuellement et ne sont rattachés à aucune activité.</p>
            <div class="table-wrap session-table-wrap" data-table-title="Cours ajoutés — ${escapeHtml(cl.name)}"><table><thead><tr><th>Date</th><th>Jour</th><th>Horaire</th><th>Lieu</th><th>APSA</th><th>Statut</th><th>Motif / info</th><th class="no-print">Action</th></tr></thead><tbody>
            ${renderSessionRowsHtml(orphan)}
            </tbody></table></div>
          </div>`);
        }
      }
      const sectionsHtml =
        sections.length > 0
          ? sections.join("")
          : `<div class="card"><p class="kpi-sub">${activePeriod ? "Aucune séance sur cette période." : "Aucune séance générée — renseignez l'emploi du temps et les APSA dans Réglages (les séances se créent automatiquement à l'enregistrement)."}</p></div>`;

      return (
        renderTopbar(`${cl.name} — Séances`, "") +
        `<div class="card class-overview-card">
          <h3 style="margin-bottom:.5rem"><span class="legend-dot" style="background:${cl.color}"></span> ${escapeHtml(cl.name)}</h3>
          <p class="kpi-sub">Effectif ${classEnrollment(cl)} · Niveau ${escapeHtml(classLevel(cl))} · <strong>${st.total}</strong> séances sur l'année (${st.done} effectuées, ${st.remaining} restantes, ${st.cancelled} annulées)</p>
          <p class="kpi-sub"><strong>Emploi du temps :</strong> ${escapeHtml(weekdaysForClass(classId) || "—")}</p>
          <div class="kpi-sub"><strong>Programmation des APSA :</strong><div class="class-apSA-list">${pactStr}</div></div>
          <p class="kpi-sub"><strong>Prochaine séance :</strong> ${next ? `${fmtDateFr(next.date)} ${next.startTime}` : "—"} · <strong>Dernière effectuée :</strong> ${lastDone ? `${fmtDateFr(lastDone.date)} ${lastDone.startTime}` : "—"}</p>
          <div style="display:flex;gap:.5rem;margin-top:0.75rem;flex-wrap:wrap">
            <button type="button" class="btn btn-sm btn-primary no-print" id="btn-add-extra-session" data-classid="${classId}" style="font-weight:700">+ Ajouter un cours</button>
          </div>
        </div>
        ${periodSelectorCard}
        ${renderExemptionsBlock(classId)}
        ${renderForgottenGearBlock(classId, activePeriod)}
        ${sectionsHtml}`
      );
    }

    function viewTools() {
      if (toolsPanel === "schedule" || toolsPanel === "orgCreneaux") toolsPanel = "classes";
      if (toolsPanel === "activities") toolsPanel = "orgApsa";
      if (toolsPanel === "venues") toolsPanel = "orgLieux";
      if (toolsPanel === "progEtab") toolsPanel = "orgProg";
      if (toolsPanel === "holidays" || toolsPanel === "calendar") toolsPanel = "calendriers";

          panelTitle = "📋 Mes classes";
          extraBtns.push(`<button type="button" class="btn btn-sm btn-primary" id="btn-add-class">Ajouter une classe</button>`);
          panel = viewClassesBody();
          break;
        case "orgEPS": {
          panelTitle = "🏫 Organisation de l'EPS dans l'établissement";
          const ORG_CARDS = [
            { id: "orgPeriodes",  icon: "📅", label: "Périodes",                          sub: "Définir les périodes de l'année" },
            { id: "orgApsa",      icon: "🏃", label: "APSA & séquences",                  sub: "Activités par classe et période" },
            { id: "orgLieux",     icon: "📍", label: "Lieux de pratique",                  sub: "Gymnase, stade, piscine…" },
            { id: "orgProg",      icon: "📋", label: "Programmation de l'établissement",   sub: "Occupation installations & PDF" },
          ];
          panel = `<div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:.5rem">${ORG_CARDS.map((c) =>
            `<div class="kpi no-print" style="animation-delay:0.1s;min-width:200px;flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1rem" data-tools="${c.id}">
              <span style="font-size:2rem;margin-bottom:.5rem">${c.icon}</span>
              <div class="kpi-label" style="text-align:center;font-size:.95rem">${c.label}</div>
              <div class="kpi-sub" style="margin-top:.3rem;text-align:center">${c.sub}</div>
            </div>`
          ).join("")}</div>`;
          break;
        }
        case "orgPeriodes":
          panelTitle = "📅 Périodes";
          panel = viewPeriodsBody();
          break;
        case "orgApsa":
          panelTitle = "🏃 APSA & séquences";
          panel = viewActivitiesBody();
          break;
        case "orgLieux":
          panelTitle = "📍 Lieux de pratique";
          panel = viewVenuesBody();
          break;
        case "orgProg":
          panelTitle = "📋 Programmation de l'établissement";
          panel = viewProgEtabBody();
          break;
        case "association":
          panelTitle = "🏅 Association sportive";
          panel = viewAssociationBody();
          break;
        case "calendriers":
          panelTitle = "📆 Calendriers";
          panel =
            viewHolidaysBody() +
            `<section class="cal-panel cal-panel--visual no-print">
              <h3 class="cal-panel__title">🗓️ Calendrier visuel</h3>
              ${renderCalendarScrollBlock()}
            </section>`;
          break;
        case "calendarFull":
          panelTitle = "🗓️ Calendrier visuel";
          panel = renderCalendarScrollBlock();
          break;
        case "backup":
          panelTitle = "💾 Sauvegarde";
          panel = viewBackupBody();
          break;
        case "tutorial":
          panelTitle = "Guide d'utilisation";
          panel = viewTutorialBody();
          break;
        default:
          toolsPanel = "home";
          return viewTools();
      }
      return (
        renderTopbar("Réglages — " + panelTitle, extraBtns.join("")) +
        panel
      );
    }

    function wireAssociationDashEvents(main) {
      if (!main) return;
      if (!main.dataset.asAddActivityWired) {
        main.dataset.asAddActivityWired = "1";
        main.addEventListener("click", (e) => {
          if (!e.target.closest("#btn-add-association-activity")) return;
          e.preventDefault();
          openAddAssociationActivityModal();
        });
      }
      if (!main.dataset.asSettingsWired) {
        main.dataset.asSettingsWired = "1";
        main.addEventListener("click", (e) => {
          const btn = e.target.closest(".btn-dash-as-activity-settings");
          if (!btn) return;
          e.preventDefault();
          e.stopPropagation();
          openAssociationActivitySettings(btn.getAttribute("data-activity-id") || "");
        });
      }
      const planningRoot = main.querySelector("#dash-as-planning-root");
      if (planningRoot && !planningRoot.dataset.asDashDelegated) {
        planningRoot.dataset.asDashDelegated = "1";
        planningRoot.addEventListener("click", (e) => {
          const slotBtn = e.target.closest(".btn-dash-as-slot-tab");
          if (slotBtn) {
            e.preventDefault();
            e.stopPropagation();
            const id = slotBtn.getAttribute("data-activity-id");
            const sk = slotBtn.getAttribute("data-slot-key");
            if (!id || !sk) return;
            dashAsActivitySlotTab[id] = sk;
            dashAsExpandedActivityIds.add(id);
            refreshAssociationDashPlanning();
            return;
          }
          const sub = e.target.closest(".btn-dash-as-subtab");
          if (sub) {
            e.preventDefault();
            e.stopPropagation();
            const id = sub.getAttribute("data-activity-id");
            const tab = sub.getAttribute("data-tab");
            if (!id || (tab !== "planning" && tab !== "admin")) return;
            dashAsActivityPanelTab[id] = tab;
            dashAsExpandedActivityIds.add(id);
            refreshAssociationDashPlanning();
            return;
          }
        });
        wireAssociationAdminCellEvents(planningRoot);
        wireAssociationAdminDeleteStudentButtons(planningRoot);
        wireAssociationPlanningTableInteractions(planningRoot);
      }
      main.querySelectorAll(".dash-as-activity-toggle").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const block = btn.closest(".dash-as-activity-block");
          const panel = block && block.querySelector(".dash-as-activity-panel");
          if (!panel) return;
          const id = btn.getAttribute("data-activity-id");
          const open = panel.hidden;
          panel.hidden = !open;
          btn.setAttribute("aria-expanded", open ? "true" : "false");
          if (id) {
            if (open) {
              dashAsExpandedActivityIds.add(id);
              if (!dashAsActivityPanelTab[id]) dashAsActivityPanelTab[id] = "planning";
            } else {
              dashAsExpandedActivityIds.delete(id);
            }
          }
        });
      });
      main.querySelectorAll(".btn-as-admin-add-col").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-id");
          const slotKey = btn.getAttribute("data-slot-key") || "";
          const a = (appData.association.activities || []).find((x) => x.id === id);
          if (!a) return;
          const body = el(`<div class="form-group"><label>Nom de la colonne</label><input id="f-as-admin-col-label" placeholder="Document d'inscription rendu" /></div>`);
          openModal("Ajouter une colonne", body, () => {
            const label = body.querySelector("#f-as-admin-col-label").value.trim();
            if (!label) return;
            const store = getAssociationAdminStore(a, slotKey);
            store.columns.push({ id: uid(), label });
            saveData();
            dashAsActivityPanelTab[id] = "admin";
            if (slotKey) dashAsActivitySlotTab[id] = slotKey;
            dashAsExpandedActivityIds.add(id);
            refreshAssociationDashPlanning();
          });
        });
      });
      main.querySelectorAll(".btn-as-admin-del-col").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const activityId = btn.getAttribute("data-activity-id");
          const colId = btn.getAttribute("data-col-id");
          const slotKey = btn.getAttribute("data-slot-key") || "";
          const a = (appData.association.activities || []).find((x) => x.id === activityId);
          if (!a || !colId) return;
          if (!confirm("Supprimer cette colonne et toutes les cases cochées ?")) return;
          const store = getAssociationAdminStore(a, slotKey);
          store.columns = store.columns.filter((c) => c.id !== colId);
          if (store.checks[colId]) delete store.checks[colId];
          saveData();
          refreshAssociationDashPlanning();
        });
      });
    }

    function wireEvents(main) {
      const wireDocFullscreenTableWrap = (wrap) => {
        if (wrap.dataset.fullscreenTableWired) return;
        wrap.dataset.fullscreenTableWired = "1";
        wrap.addEventListener(
          "click",
          (e) => {
            if (!prefersMobileTableFullscreen()) return;
            if (wrap.classList.contains("as-admin-table-wrap")) {
              if (e.target.closest(".btn-as-admin-del-student")) return;
              if (e.target.closest(".btn-as-admin-del-col")) return;
              if (e.target.closest(".as-admin-check")) return;
              if (e.target.closest(".as-admin-cell-text")) return;
              if (e.target.closest(".as-admin-cell-input")) return;
              e.preventDefault();
              e.stopPropagation();
              openFullscreenAdminTable(wrap);
              return;
            }
            if (wrap.classList.contains("as-planning-table-wrap")) {
              if (e.target.closest(".btn-as-dash-cancel, .btn-as-dash-uncancel")) return;
              if (e.target.closest(".dash-as-session-row")) return;
              e.preventDefault();
              e.stopPropagation();
              openFullscreenAssociationPlanningTable(wrap);
              return;
            }
            if (wrap.classList.contains("session-table-wrap")) {
              if (e.target.closest(".btn-cancel-session, .btn-del-extra-session, .btn-remove-canc-row")) return;
              if (e.target.closest(".btn-session-summary")) return;
              if (e.target.closest("thead") || !e.target.closest("tbody tr")) {
                e.preventDefault();
                e.stopPropagation();
                openLandscapeTable(wrap);
              }
              return;
            }
            if (e.target.closest("button, a, input, select, textarea, label")) return;
            e.preventDefault();
            e.stopPropagation();
            openFullscreenGenericTable(wrap);
          },
          true
        );
      };
      main
        .querySelectorAll(
          ".table-wrap--tap-fullscreen, .session-table-wrap, .as-admin-table-wrap, .as-planning-table-wrap"
        )
        .forEach(wireDocFullscreenTableWrap);
      main.querySelectorAll("[data-tuto-goto]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const t = btn.getAttribute("data-tuto-goto");
          if (t === "dashboard") navigateTo("dashboard");
          else if (t === "classes") navigateTo("classes");
          else if (t && t.startsWith("tools:")) openToolsPanel(t.slice(6));
        });
      });
      main.querySelector("#btn-dash-calendar-card")?.addEventListener("click", () => {
        navigateTo("calendar:visual");
      });
      main.querySelector("#btn-dash-calendar-card")?.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          navigateTo("calendar:visual");
        }
      });
      main.querySelector("#btn-dash-reminder")?.addEventListener("click", openDashboardReminderModal);
      if (!main.dataset.reminderDismissWired) {
        main.dataset.reminderDismissWired = "1";
        main.addEventListener("click", (e) => {
          const dismissBtn = e.target.closest(".btn-reminder-dismiss-home");
          if (!dismissBtn || !main.contains(dismissBtn)) return;
          e.preventDefault();
          e.stopPropagation();
          const id = dismissBtn.getAttribute("data-id");
          if (id && removeReminderById(id)) {
            saveData({ skipAutoRegen: true });
            render();
          }
        });
      }
      main.querySelector("#dash-prev-day")?.addEventListener("click", () => {
        dashboardDate = addDays(dashboardDate, -1);
        render();
      });
      main.querySelector("#dash-next-day")?.addEventListener("click", () => {
        dashboardDate = addDays(dashboardDate, 1);
        render();
      });
      main.querySelector("#dash-today")?.addEventListener("click", () => {
        dashboardDate = new Date();
        render();
      });
      const openDashboardDatePicker = () => {
        const body = el(`<div>
          <div class="form-group">
            <label>Choisir une date</label>
            <input type="date" id="f-dash-date" value="${dashboardDateISO()}" />
          </div>
        </div>`);
        openModal("Aller à une date", body, () => {
          const value = body.querySelector("#f-dash-date").value;
          if (!value) return;
          dashboardDate = parseISODate(value);
          render();
        });
      };
      main.querySelector("#dash-date-pick")?.addEventListener("click", openDashboardDatePicker);
      main.querySelector("#dash-date-pick")?.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openDashboardDatePicker();
        }
      });
      main.querySelector("#dash-association-toggle")?.addEventListener("click", () => {
        navigateTo("dashboard:association");
      });
      if (currentView === "dashboard") {
        requestAnimationFrame(() => fitDashAssociationStripText());
      }
      wireAssociationDashEvents(main);
      wireAssociationCompetitionFilters(main);
      if (associationDashSetupActivityId && currentView === "dashboard:association") {
        const setupRoot = main.querySelector(".as-dash-setup");
        if (setupRoot) {
          wireAssociationTrainingSlotsContainer(setupRoot);
          setupRoot.querySelector("#btn-as-setup-finish")?.addEventListener("click", () => {
            const id = associationDashSetupActivityId;
            const a =
              appData.association && Array.isArray(appData.association.activities)
                ? appData.association.activities.find((x) => x.id === id)
                : null;
            if (!a) {
              associationDashSetupActivityId = "";
              render();
              return;
            }
            const nextSlots = collectTrainingSlotsFromForm(setupRoot);
            if (!nextSlots.length) {
              alert("Ajoutez au moins un créneau valide (jour, heure de début et de fin).");
              return;
            }
            if (!Array.isArray(a.trainings)) a.trainings = [];
            a.trainings.push(...nextSlots);
            associationDashSetupActivityId = "";
            dashAsExpandedActivityIds.add(id);
            saveData();
            render();
          });
          setupRoot.querySelector("#btn-as-setup-cancel")?.addEventListener("click", () => {
            cancelAssociationDashSetup();
            render();
          });
        }
      }
      main.querySelectorAll(".btn-association-activity").forEach((btn) => {
        btn.addEventListener("click", () => {
          openAssociationActivitySettings(btn.getAttribute("data-id") || "", "trainings");
        });
      });
      main.querySelector(".btn-association-back")?.addEventListener("click", () => {
        closeAssociationActivitySettings();
      });
      main.querySelectorAll(".btn-as-settings-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          const tab = btn.getAttribute("data-tab");
          if (!tab || tab === associationSettingsTab) return;
          associationSettingsTab = tab;
          render();
        });
      });
      const studentsSettingsRoot = main.querySelector("#f-as-students-list-settings");
      if (studentsSettingsRoot && associationOpenActivityId) {
        const actStudents = findAssociationActivity(associationOpenActivityId);
        if (actStudents) {
          if (!Array.isArray(actStudents.students)) actStudents.students = [];
          actStudents.students = actStudents.students.map(normalizeAssociationStudent);
          const refreshStudentsList = () => {
            studentsSettingsRoot.innerHTML = renderAssociationStudentsListHtml(actStudents.students);
            wireAssociationStudentsListActions(studentsSettingsRoot, actStudents, refreshStudentsList);
          };
          refreshStudentsList();
        }
      }
      main.querySelectorAll(".btn-as-add-training").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          const a = appData.association && Array.isArray(appData.association.activities)
            ? appData.association.activities.find((x) => x.id === id)
            : null;
          if (!a) return;
          openAssociationTrainingSlotsModal(a, () => render());
        });
      });
      main.querySelectorAll(".btn-as-edit-students").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          const a = appData.association && Array.isArray(appData.association.activities)
            ? appData.association.activities.find((x) => x.id === id)
            : null;
          if (!a) return;
          if (!Array.isArray(a.students)) a.students = [];
          a.students = a.students.map(normalizeAssociationStudent);
          const body = el(`<div>
            <p class="kpi-sub" style="margin-bottom:.5rem">Nouvel élève — validez la fenêtre pour l'enregistrer avec la liste.</p>
            ${associationStudentFormHtml()}
            <div class="form-group" style="margin-top:.75rem"><label>Importer un fichier CSV</label>
              <p class="kpi-sub" style="margin:.15rem 0 .35rem">Colonnes : nom ; classe ; catégorie (séparateur ; ou ,)</p>
              <input type="file" id="f-as-csv" accept=".csv,text/csv,text/comma-separated-values,application/csv,application/vnd.ms-excel" />
            </div>
            <h4 style="margin:1rem 0 .35rem;font-size:.9rem">Élèves inscrits</h4>
            <div id="f-as-students-list" style="max-height:220px;overflow-y:auto"></div>
          </div>`);
          const renderStudents = () => {
            const list = body.querySelector("#f-as-students-list");
            list.innerHTML = renderAssociationStudentsListHtml(a.students);
            wireAssociationStudentsListActions(list, a, renderStudents);
          };
          renderStudents();
          body.querySelector("#f-as-csv").addEventListener("change", (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              const text = String(reader.result || "").replace(/^\uFEFF/, "");
              const parsed = text.split(/\r?\n/)
                .map((line) => {
                  const cols = line.split(/[;,\t]/).map((c) => c.replace(/^["']|["']$/g, "").trim());
                  if (!cols[0]) return null;
                  return normalizeAssociationStudent({
                    name: cols[0],
                    className: cols[1] || "",
                    category: cols[2] || "",
                  });
                })
                .filter(Boolean);
              if (!parsed.length) return;
              a.students = parsed;
              renderStudents();
            };
            reader.readAsText(file);
          });
          openModal("Ajouter des élèves", body, () => {
            if (!commitAssociationStudentEditIfOpen(body, a)) return false;
            if (!body.querySelector(".as-student-edit-panel")) {
              const st = readAssociationStudentFromForm(body);
              if (st) a.students.push(st);
            }
            a.students = a.students.map(normalizeAssociationStudent);
            saveData();
            render();
          });
        });
      });
      main.querySelectorAll(".btn-as-show-students").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          const a = appData.association && Array.isArray(appData.association.activities)
            ? appData.association.activities.find((x) => x.id === id)
            : null;

          openAssociationStudentsListModal(a);

      });

        btn.addEventListener("click", () => {
          const activityId = btn.getAttribute("data-activity-id");
          const trainingId = btn.getAttribute("data-id");
          if (!confirm("Supprimer ce créneau d'entraînement ? Les annulations et appels liés seront également effacés.")) return;
          if (!removeAssociationTrainingSlot(activityId, trainingId)) return;
          saveData();
          render();
        });
      });
      main.querySelectorAll(".btn-as-del-competition").forEach((btn) => {
        btn.addEventListener("click", () => {
          const activityId = btn.getAttribute("data-activity-id");
          const competitionId = btn.getAttribute("data-id");
          if (!confirm("Supprimer cette compétition ? Les annulations et appels liés seront également effacés.")) return;
          if (!removeAssociationCompetition(activityId, competitionId)) return;
          saveData();
          render();
        });
      });
      main.querySelectorAll(".btn-as-add-competition").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          const a = appData.association && Array.isArray(appData.association.activities)
            ? appData.association.activities.find((x) => x.id === id)
            : null;
          if (!a) return;
          openAddAssociationCompetitionModal(a);
        });
      });
      main.querySelector("#btn-as-upcoming-add-competition")?.addEventListener("click", () => {
        openAddAssociationCompetitionModal(null);
      });
      const saveAssociationSeasonDates = () => {
        const startEl = main.querySelector("#as-season-start");
        const endEl = main.querySelector("#as-season-end");
        const activityId = (startEl || endEl)?.getAttribute("data-activity-id");
        if (!activityId) return;
        const a = appData.association && Array.isArray(appData.association.activities)
          ? appData.association.activities.find((x) => x.id === activityId)
          : null;
        if (!a) return;
        a.seasonStart = startEl ? startEl.value || "" : a.seasonStart || "";
        a.seasonEnd = endEl ? endEl.value || "" : a.seasonEnd || "";
        if (a.seasonStart && a.seasonEnd && a.seasonStart > a.seasonEnd) {
          alert("La date de début doit être antérieure à la date de fin.");
          return;
        }
        saveData();
      };
      main.querySelector("#as-season-start")?.addEventListener("change", saveAssociationSeasonDates);
      main.querySelector("#as-season-end")?.addEventListener("change", saveAssociationSeasonDates);
      main.querySelector("#btn-todo-add")?.addEventListener("click", () => {
        const inp = main.querySelector("#todo-input");
        const text = inp ? inp.value.trim() : "";
        if (!text) return;
        appData.todoList.push({ text, done: false });
        saveData();
        render();
      });
      main.querySelector("#todo-input")?.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          main.querySelector("#btn-todo-add")?.click();
        }
      });
      main.querySelectorAll(".todo-check").forEach((cb) => {
        cb.addEventListener("change", () => {
          const idx = parseInt(cb.getAttribute("data-idx"), 10);
          if (appData.todoList[idx]) {
            appData.todoList[idx].done = cb.checked;
            saveData();
            render();
          }
        });
      });
      main.querySelectorAll(".todo-del").forEach((b) => {
        b.addEventListener("click", () => {
          const idx = parseInt(b.getAttribute("data-idx"), 10);
          appData.todoList.splice(idx, 1);
          saveData();
          render();
        });
      });
      main.querySelectorAll(".link-fg-student").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const cid = a.getAttribute("data-classid");
          const studentName = a.getAttribute("data-student");
          navigateTo(getClassViewId(cid));
          setTimeout(() => {
            const rows = document.querySelectorAll(".fg-student-row");
            for (const row of rows) {

    function navigateTo(view, panelId) {
      const nextPanel = view === "tools" ? (panelId || toolsPanel || "home") : toolsPanel;
      const cur = getNavSnapshot();
      if (cur.view === "dashboard:association" && view !== "dashboard:association" && associationDashSetupActivityId) {
        cancelAssociationDashSetup();
      }
      const changed =
        cur.view !== view ||
        (view === "tools" &&
          (cur.toolsPanel !== nextPanel ||
            (cur.associationOpenActivityId && nextPanel !== "association")));
      if (!changed) {
        scrollPageToStart();
        return;
      }
      if (changed) pushNavHistory();
      currentView = view;
      if (view === "tools") {
        if (nextPanel !== "association") {
          associationOpenActivityId = "";
          associationSettingsTab = "trainings";
        } else if (cur.toolsPanel !== "association") {
          associationOpenActivityId = "";
          associationSettingsTab = "trainings";
        }
        toolsPanel = nextPanel;
      }
      if (view !== "calendar:visual") {
        calendarFullscreenDismissed = false;
      }
      render();
      scrollPageToStart();
    }

    function goBack() {
      if (associationDashSetupActivityId && currentView === "dashboard:association") {
        cancelAssociationDashSetup();
        render();
        scrollPageToStart();
        return;
      }
      if (!navHistory.length) {
        stepBackToolsHierarchy();
        return;
      }
      const prev = navHistory.pop();
      applyNavSnapshot(prev);
      render();
      scrollPageToStart();
    }

    function viewClassName(view) {
      if (view === "dashboard") return "main main--dashboard";
      if (view === "dashboard:association") return "main main--dashboard";
      if (view === "calendar:visual") return "main main--dashboard main--calendar";
      if (view === "classes") return "main main--classes";
      if (view === "tools") return "main main--tools";
      if (view.startsWith("class:")) return "main main--class";
      return "main";
    }

    function prepareDocFullscreenTables(root) {
      root.querySelectorAll(".table-wrap").forEach((wrap) => {
        if (wrap.closest(".table-fullscreen-view") || wrap.closest(".table-landscape-view")) return;
        if (wrap.classList.contains("school-terms-table-wrap")) return;
        if (!wrap.querySelector("table")) return;
        const isSession = wrap.classList.contains("session-table-wrap");
        const isAdmin = wrap.classList.contains("as-admin-table-wrap");
        const isPlanning = wrap.classList.contains("as-planning-table-wrap");
        if (!isSession && !isAdmin && !isPlanning) return;
        if (!wrap.dataset.tableTitle) {
          const card = wrap.closest(".card, .cal-panel, section, details");
          const heading = card?.querySelector("h3, h4, .cal-panel__title, summary");
          if (heading) {
            wrap.dataset.tableTitle = String(heading.textContent || "")
              .replace(/^[\s🏫📅🗓⚽📚🔔]+/u, "")
              .trim();
          }
        }
      });
    }

    function enhanceMobileTables(root) {
      prepareDocFullscreenTables(root);
      root.querySelectorAll(".table-wrap table").forEach((table) => {
        if (
          table.closest(".session-table-wrap") ||
          table.closest(".as-admin-table-wrap") ||
          table.closest(".as-planning-table-wrap") ||
          table.closest(".school-terms-table-wrap")
        )
          return;
        const headers = [...table.querySelectorAll("thead th")].map((th) => th.textContent.trim());
        if (!headers.length) return;
        table.querySelectorAll("tbody tr").forEach((row) => {
          [...row.children].forEach((cell, index) => {
            if (headers[index]) cell.setAttribute("data-label", headers[index]);
          });
        });
      });
    }

    function scrollPageToStart() {
      const scrollAll = () => {
        window.scrollTo({ top: 0, left: 0, behavior: "auto" });
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        const main = document.getElementById("main");
        if (main) main.scrollTop = 0;
      };
      scrollAll();
      requestAnimationFrame(() => {
        scrollAll();
        requestAnimationFrame(scrollAll);
      });
    }

    function render() {
      if (currentView === "dashboard:association") captureDashAsExpandedFromDom();
      renderNav();
      renderBottomNav();
      const main = document.getElementById("main");
      let body = "";
      if (currentView === "dashboard") {
        body = viewDashboard();
      } else if (currentView === "calendar:visual") {
        body = viewCalendarFullPage();
      } else if (currentView === "dashboard:association") {
        body = viewAssociationUpcomingPage();
      } else if (currentView === "classes") {
        body = viewClasses();
      } else if (currentView === "tools") {
        body = viewTools();
      } else if (currentView.startsWith("class:")) {
        const cid = currentView.slice(6);
        if (getClassById(cid)) body = viewClassPage(cid);
        else {
          currentView = "dashboard";
          body = viewDashboard();
        }
      } else {
        currentView = "dashboard";
        body = viewDashboard();
      }
      main.className = viewClassName(currentView);
      main.innerHTML = body;
      enhanceMobileTables(main);
      wireEvents(main);
      if (currentView === "dashboard") fetchWeather();
      if (
        currentView === "calendar:visual" &&
        prefersMobileDocFullscreen() &&
        !calendarFullscreenDismissed &&
        !document.getElementById("modal-root")?.classList.contains("open")
      ) {
        requestAnimationFrame(() => {
          if (
            currentView === "calendar:visual" &&
            !calendarFullscreenDismissed &&
            !document.getElementById("modal-root")?.classList.contains("open")
          ) {
            openFullscreenCalendar();
          }
        });
      }
    }

    const WMO_WEATHER = {
      0: "Ciel dégagé ☀️", 1: "Peu nuageux 🌤️", 2: "Partiellement nuageux ⛅", 3: "Couvert ☁️",
      45: "Brouillard 🌫️", 48: "Brouillard givrant 🌫️",
      51: "Bruine légère 🌦️", 53: "Bruine 🌦️", 55: "Bruine forte 🌧️",
      61: "Pluie légère 🌦️", 63: "Pluie 🌧️", 65: "Pluie forte 🌧️",
      71: "Neige légère 🌨️", 73: "Neige 🌨️", 75: "Neige forte 🌨️",
      77: "Grains de neige 🌨️", 80: "Averses légères 🌦️", 81: "Averses 🌧️", 82: "Averses fortes 🌧️",
      85: "Averses de neige 🌨️", 86: "Averses de neige fortes 🌨️",
      95: "Orage ⛈️", 96: "Orage grêle ⛈️", 99: "Orage forte grêle ⛈️"
    };

    function fetchWeather() {
      const kpi = document.getElementById("weather-kpi");
      if (!kpi) return;
      const dISO = dashboardDateISO();
      const todayISO = fmtISODate(new Date());
      const diffDays = Math.round((parseISODate(dISO) - parseISODate(todayISO)) / 86400000);
      if (diffDays === 0) {
        kpi.style.display = "";
        fetch("https://api.open-meteo.com/v1/forecast?latitude=48.79&longitude=2.62&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto")
          .then((r) => r.json())
          .then((data) => updateWeatherUI(data.current, null))
          .catch(() => updateWeatherUI(null, null));
      } else if (diffDays > 0 && diffDays <= 16) {
        kpi.style.display = "";
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=48.79&longitude=2.62&daily=temperature_2m_max,temperature_2m_min,weather_code&start_date=${dISO}&end_date=${dISO}&timezone=auto`)
          .then((r) => r.json())
          .then((data) => {
            if (data.daily && data.daily.time && data.daily.time.length) {
              updateWeatherUI(null, { code: data.daily.weather_code[0], tMax: data.daily.temperature_2m_max[0], tMin: data.daily.temperature_2m_min[0] });
            } else { updateWeatherUI(null, null); }
          })
          .catch(() => updateWeatherUI(null, null));
      } else {
        kpi.style.display = "none";
      }
    }

    function updateWeatherUI(current, daily) {
      const elLine = document.getElementById("weather-line");
      if (!elLine) return;
      const place = "Roissy-en-Brie";
      if (!current && !daily) {
        elLine.textContent = `🌤️ ${place} · — · Indisponible`;
        return;
      }
      if (current) {
        const label = WMO_WEATHER[current.weather_code] || "Inconnu";
        const temp = Math.round(current.temperature_2m) + "°C";
        const wind = Math.round(current.wind_speed_10m);
        elLine.innerHTML = `🌤️ ${escapeHtml(place)} · <span class="weather-temp">${escapeHtml(temp)}</span> · ${escapeHtml(label)} · Vent ${wind} km/h`;
      } else {
        const label = WMO_WEATHER[daily.code] || "Inconnu";
        const temps = Math.round(daily.tMin) + "° / " + Math.round(daily.tMax) + "°C";
        elLine.innerHTML = `🌤️ ${escapeHtml(place)} · <span class="weather-temp">${escapeHtml(temps)}</span> · ${escapeHtml(label)} · Prévision`;
      }
    }

    function init() {
      if (!loadData()) {
        migrateDataModel();
        saveData();
      } else {
        if (!appData.settings) appData.settings = { schoolYearStart: "2025-09-01", schoolYearEnd: "2026-07-05", zone: "C" };
        migrateDataModel();
        regenerateSessions();
      }

      if (lsGet("eps_theme") === "dark") applyAppTheme("dark");
      else applyAppTheme("light");
      document.getElementById("btn-theme")?.addEventListener("click", toggleAppTheme);

      render();
    }

    try {
      // Pas de service worker : sur GitHub Pages / Safari, un SW peut garder une vieille version de la page.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        }).catch(() => {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
      }
    } catch(e) {}

    function boot() {
      try {
        init();
      } catch (e) {
        var m = document.getElementById("main");
        if (m) m.innerHTML = "<div style='padding:2rem;color:red;font-size:1.2rem'><h2>Erreur au chargement</h2><pre>" + e.message + "\n" + e.stack + "</pre></div>";
      }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
</body>
</html>

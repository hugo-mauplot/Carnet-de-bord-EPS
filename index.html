    function exemptionsForClass(classId) {
      return appData.exemptions.filter((e) => e.classId === classId);
    }

    function exemptionAppliesToSession(ex, session) {
      if (!ex || !session || ex.classId !== session.classId) return false;
      if (ex.sansCertificat && ex.sessionId) return ex.sessionId === session.id;
      if (ex.sansCertificat) return session.date === ex.startDate;
      return session.date >= ex.startDate && session.date <= ex.endDate;
    }

    function exemptionAppliesOnDate(ex, classId, dateStr, sessionId) {
      if (!ex || ex.classId !== classId) return false;
      if (ex.sansCertificat && ex.sessionId) return sessionId ? ex.sessionId === sessionId : false;
      if (ex.sansCertificat) return dateStr === ex.startDate;
      return dateStr >= ex.startDate && dateStr <= ex.endDate;
    }

    function exemptionsForSession(classId, dateStr, sessionId) {
      return (appData.exemptions || []).filter((e) => exemptionAppliesOnDate(e, classId, dateStr, sessionId));
    }

    function formatExemptionDetailLabel(ex) {
      if (ex.sansCertificat && ex.sessionId) {
        const sess = appData.sessions.find((s) => s.id === ex.sessionId);
        return "sans certificat · cours du " + fmtDateFr(sess ? sess.date : ex.startDate);
      }
      if (ex.sansCertificat) return "sans certificat · " + fmtDateFr(ex.startDate);
      return "jusqu'au " + fmtDateFr(ex.endDate);
    }

    function formatExemptionDurationCell(ex) {
      if (ex.sansCertificat && ex.sessionId) return "Sans certificat · ce cours";
      if (ex.sansCertificat) return "Sans certificat · 1 jour";
      return ex.days + " jour(s)";
    }

    function attachExemptionSansCertificatToggle(body, opts) {
      const cb = body.querySelector(opts.checkboxSelector);
      const blocks = body.querySelector(opts.durationBlocksSelector);
      const certWrap = opts.certDateWrapSelector ? body.querySelector(opts.certDateWrapSelector) : null;
      const certInput = opts.certDateInputSelector ? body.querySelector(opts.certDateInputSelector) : null;
      if (!cb) return;
      if (opts.defaultChecked) cb.checked = true;
      const sync = () => {
        const on = cb.checked;
        if (blocks) blocks.style.display = on ? "none" : "";
        if (certWrap) certWrap.style.display = on && opts.hideCertWhenSansCert ? "none" : "";
        if (certInput && opts.sessionDate && on) certInput.value = opts.sessionDate;
      };
      cb.addEventListener("change", sync);
      sync();
    }

    /** Dispense active pour un élève à la date de la séance. */
    function isStudentDispensedOnSession(classId, studentName, dateStr, sessionId) {
      return (appData.exemptions || []).some(
        (ex) => ex.studentName === studentName && exemptionAppliesOnDate(ex, classId, dateStr, sessionId)
      );
    }

    /** Séances effectuées d'une APSA (hors annulées, vacances, fériés). */
    function sessionsHeldForActivity(classId, activityId) {
      return sessionsForClass(classId)
        .filter((s) => s.activityId === activityId)
        .filter((s) => computeSessionStatus(s).code === "done");
    }

    /** Participation : pas absent à l'appel et pas dispensé ce jour-là. */
    function studentParticipatedOnSession(session, studentName) {
      if (isStudentDispensedOnSession(session.classId, studentName, session.date, session.id)) return false;
      const att = session.attendance || {};
      if (att[studentName] === "absent") return false;
      return true;
    }

    function participationRateTier(pct) {
      if (pct <= 50) return "low";
      if (pct <= 70) return "mid";
      return "high";
    }

    function participationRateBarHtml(pct) {
      const w = Math.min(100, Math.max(0, Math.round(pct)));
      const tier = participationRateTier(w);
      return `<div class="participation-rate-bar participation-rate-bar--${tier}">
        <div class="progress" role="progressbar" aria-valuenow="${w}" aria-valuemin="0" aria-valuemax="100" aria-label="Taux de participation ${w} pour cent">
          <span style="width:${w}%"></span>
        </div>
        <span class="participation-rate-pct">${w}%</span>
      </div>`;
    }

    function formatParticipationGaps(row) {
      if (row.participated >= row.total) return "";
      const fmtDatesLe = (dates) => dates.map((d) => fmtDateFr(d)).join(", le ");
      const parts = [];
      if (row.dispensedDates.length) {
        parts.push(`<span class="part-dispensed">Dispensé le ${escapeHtml(fmtDatesLe(row.dispensedDates))}</span>`);
      }
      if (row.absentDates.length) {
        parts.push(`<span class="part-absent">Absent le ${escapeHtml(fmtDatesLe(row.absentDates))}</span>`);
      }
      return parts.join("<br>");
    }

    /** Stats de participation par élève pour une APSA. */
    function activityParticipationStats(classId, activityId) {
      const cl = getClassById(classId);
      const students = cl && Array.isArray(cl.students) ? [...cl.students].sort((a, b) => a.localeCompare(b, "fr")) : [];
      const held = sessionsHeldForActivity(classId, activityId);
      const total = held.length;
      const rows = students.map((name) => {
        let participated = 0;
        const dispensedDates = [];
        const absentDates = [];
        held.forEach((s) => {
          if (studentParticipatedOnSession(s, name)) {
            participated++;
          } else if (isStudentDispensedOnSession(classId, name, s.date, s.id)) {
            dispensedDates.push(s.date);
          } else if ((s.attendance || {})[name] === "absent") {
            absentDates.push(s.date);
          }
        });
        dispensedDates.sort();
        absentDates.sort();
        return { name, participated, total, dispensedDates, absentDates };
      });
      return { rows, totalSessions: total, activity: activityById(activityId) };
    }

    function openActivityParticipationModal(classId, activityId) {
      const cl = getClassById(classId);
      const act = activityById(activityId);
      if (!cl || !act) return;
      const stats = activityParticipationStats(classId, activityId);
      let bodyHtml;
      if (!stats.rows.length) {
        bodyHtml = `<p class="kpi-sub">Aucun élève dans la liste de la classe. Ajoutez-les via Réglages → Mes classes → ⚙️ sur la carte de la classe.</p>`;
      } else if (!stats.totalSessions) {
        bodyHtml = `<p class="kpi-sub">Aucune séance effectuée pour cette activité pour le moment (seules les séances passées, non annulées, sont comptées).</p>`;
      } else {
        const tableRows = stats.rows
          .map((r) => {
            const pct = stats.totalSessions ? Math.round((r.participated / stats.totalSessions) * 100) : 0;
            const gaps = formatParticipationGaps(r);
            return `<tr>
              <td colspan="3" class="participation-stats-cell">
                <div class="participation-stats-line">
                  <span class="participation-stats-name"><strong>${escapeHtml(r.name)}</strong></span>
                  <span class="participation-stats-count">${r.participated} / ${stats.totalSessions}</span>
                  ${participationRateBarHtml(pct)}
                </div>
                ${gaps ? `<div class="participation-detail">${gaps}</div>` : ""}
              </td>
            </tr>`;
          })
          .join("");
        bodyHtml = `<p class="kpi-sub" style="margin-bottom:.75rem">${stats.totalSessions} séance(s) effectuée(s) pour <strong>${escapeHtml(act.name)}</strong>. Comptées : présence ou retard à l'appel ; exclus : absent et dispensé (dates précisées sous le nom de l'élève).</p>
          <div class="table-wrap participation-stats-wrap"><table class="participation-stats-table"><tbody>${tableRows}</tbody></table></div>`;
      }
      const body = el(`<div>${bodyHtml}</div>`);
      openModal("Participation des élèves — " + escapeHtml(act.name), body, () => {});
    }

    function isExemptionActive(ex) {
      const today = fmtISODate(new Date());
      if (ex.sansCertificat && ex.sessionId) {
        const sess = appData.sessions.find((s) => s.id === ex.sessionId);
        return sess ? today === sess.date : false;
      }
      if (ex.sansCertificat) return today === ex.startDate;
      return today >= ex.startDate && today <= ex.endDate;
    }

    function exemptionRemainingLabel(ex) {
      if (!isExemptionActive(ex)) return "—";
      if (ex.sansCertificat && ex.sessionId) return '<span style="color:var(--text-muted);font-size:.85rem">Ce cours</span>';
      if (ex.sansCertificat) return '<strong style="color:var(--danger)">1 jour</strong>';
      const remaining = Math.max(0, Math.round((parseISODate(ex.endDate).getTime() - todayStart().getTime()) / 86400000) + 1);
      return `<strong style="color:var(--danger)">${remaining} jour(s)</strong>`;
    }

    /* -------------------------------------------------------------------------- */
    /* GÉNÉRATION AUTOMATIQUE DES SÉANCES                                         */
    /* -------------------------------------------------------------------------- */

    function regenerateSessions(opts) {
      opts = opts || {};
      migrateDataModel();
      const start = parseISODate(appData.settings.schoolYearStart);
      const end = parseISODate(appData.settings.schoolYearEnd);
      const oldCanc = appData.cancellations.slice();
      /** Ancienne séance par créneau (pour conserver appel, résumé, PDF après régénération). */
      const oldSessionByKey = new Map();
      appData.sessions.forEach((s) => {
        if (!s.extra) oldSessionByKey.set(`${s.classId}|${s.date}|${s.startTime}`, s);
      });

      const extraSessions = appData.sessions.filter((s) => s.extra);
      const nextSessions = [];

      appData.classes.forEach((cl) => {
        const slots = schedulesForClass(cl.id);
        slots.forEach((slot) => {
          let cursor = new Date(start);
          while (cursor <= end) {
            if (dayIndexMon0(cursor) === slot.dayIndex) {
              const dateStr = fmtISODate(cursor);
              const di = dayIndexMon0(cursor);
              if (!isBlockedByHoliday(dateStr) && matchesWeekParity(slot, cursor)) {
                const act = pickActivityForSession(cl.id, dateStr, di);
                const key = `${cl.id}|${dateStr}|${slot.startTime}`;
                const prevS = oldSessionByKey.get(key);
                const sid = prevS ? prevS.id : uid();
                const sess = {
                  id: sid,
                  classId: cl.id,
                  scheduleId: slot.id,
                  activityId: act ? act.id : null,
                  date: dateStr,
                  startTime: slot.startTime,
                  endTime: slot.endTime,
                  venue: act ? act.venue || "" : "",
                  comment: (prevS && prevS.comment) || "",
                };
                if (prevS) {
                  sess.attendance = prevS.attendance && typeof prevS.attendance === "object" ? { ...prevS.attendance } : {};
                  if (prevS.summary) sess.summary = prevS.summary;
                  if (prevS.sessionPdf) sess.sessionPdf = prevS.sessionPdf;
                } else {
                  sess.attendance = {};
                }
                nextSessions.push(sess);
              }
            }
            cursor = addDays(cursor, 1);
          }
        });
      });

      nextSessions.push(...extraSessions);
      nextSessions.sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      appData.sessions = nextSessions;

      /** Réassocie les annulations aux nouveaux ids de séance après régénération. */
      oldCanc.forEach((c) => {
        const match = appData.sessions.find(
          (s) =>
            s.id === c.sessionId ||
            (s.classId === c.classId && s.date === c.date && s.startTime === c.startTime)
        );
        if (match) {
          c.sessionId = match.id;

    function dashboardKPIs(refDate) {
      const ref = refDate || new Date();
      const todayStr = fmtISODate(ref);
      const refStart = new Date(ref); refStart.setHours(0,0,0,0);
      const startWeek = addDays(refStart, -dayIndexMon0(refStart));
      const endWeek = addDays(startWeek, 6);
      let classesToday = 0;
      const next3Weeks = [0, 1, 2].map((offset) => {
        const ws = addDays(startWeek, offset * 7);
        const we = addDays(ws, 6);
        return { start: ws, end: we, cancelled: [], extras: [] };
      });
      appData.classes.forEach((cl) => {
        const hasToday = sessionsForClass(cl.id).some((s) => s.date === todayStr);
        if (hasToday) classesToday++;
        sessionsForClass(cl.id).forEach((s) => {
          const d = parseISODate(s.date);
          const st = computeSessionStatus(s);
          const item = {
            className: cl.name,
            date: s.date,
            dayName: DOW[dayIndexMon0(d)],
            time: s.startTime ? s.startTime + (s.endTime ? "–" + s.endTime : "") : "",
            reason: st.reason || "",
          };
          for (const w of next3Weeks) {
            if (d >= w.start && d <= w.end) {
              if (st.code === "cancelled" && d >= refStart) {
                const canc = cancellationForSession(s);
                if (canc && !item.reason) {
                  item.reason =
                    REASON_TYPES.find((x) => x[0] === canc.reasonType)?.[1] || canc.reasonType || "";
                }
                w.cancelled.push(item);
              }
              if (s.extra && d >= refStart) {
                w.extras.push(item);
              }
              break;
            }
          }
        });
      });
      const cycleAlerts = appData.classes.filter((cl) => {
        const ids = new Set(activitiesOnDatePeriod(cl.id, todayStr).map((a) => a.id));
        if (!ids.size) return false;
        const acts = activitiesForClass(cl.id).filter((a) => ids.has(a.id));
        for (const cur of acts) {
          const list = sessionsForClass(cl.id).filter((s) => s.activityId === cur.id);
          const doneInAct = list.filter((s) => computeSessionStatus(s).code === "done").length;
          const totalInAct = list.length;
          if (totalInAct > 0 && doneInAct / totalInAct > 0.85) return true;
        }
        return false;
      });
      return { classesToday, next3Weeks, cycleAlerts, classCount: appData.classes.length };
    }

    function recentCancellations(limit = 6) {
      return appData.cancellations
        .map((c) => {
          const s = appData.sessions.find((x) => x.id === c.sessionId) || { classId: c.classId, date: c.date };
          const cl = getClassById(s.classId);
          return { ...c, className: cl ? cl.name : "?" };
        })
        .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
        .slice(0, limit);
    }

    /** Parent hiérarchique d'un panneau Réglages (sous-menus Organisation EPS, etc.). */
    function getToolsParentPanel(panel) {
      if (panel === "orgPeriodes" || panel === "orgApsa" || panel === "orgLieux" || panel === "orgProg") {
        return "orgEPS";

      if (panel === "calendarFull") return "calendriers";

    function pushNavHistory() {
      navHistory.push(getNavSnapshot());

    function isToolsSubpanel() {
      return currentView === "tools" && toolsPanel && toolsPanel !== "home";

      if (associationDashSetupActivityId && currentView === "dashboard:association") return true;
      if (currentView === "tools" && toolsPanel === "association" && associationOpenActivityId) return true;
      return navHistory.length > 0 || isToolsSubpanel();

    /**
     * Remonte à l'accueil des Réglages en retirant les sous-panels tools de l'historique,
     * pour que le bouton retour ne rouvre pas le sous-menu qu'on vient de quitter.
     */
    function goToToolsHome() {
      if (currentView === "tools" && (!toolsPanel || toolsPanel === "home") && !associationOpenActivityId) {
        scrollPageToStart();
        return;
      }
      if (currentView === "tools") {
        while (navHistory.length) {
          const top = navHistory[navHistory.length - 1];
          if (top.view !== "tools") break;
          navHistory.pop();
          if (!top.toolsPanel || top.toolsPanel === "home") break;
        }
        associationOpenActivityId = "";
        associationSettingsTab = "trainings";
        toolsPanel = "home";
        render();
        scrollPageToStart();
        return;
      }
      navigateTo("tools", "home");
    }

    function stepBackToolsHierarchy() {
      if (currentView === "tools" && toolsPanel === "association" && associationOpenActivityId) {
        associationOpenActivityId = "";
        associationSettingsTab = "trainings";
        render();
        scrollPageToStart();
        return true;
      }
      if (!isToolsSubpanel()) return false;
      const parent = getToolsParentPanel(toolsPanel) || "home";
      associationOpenActivityId = "";
      associationSettingsTab = "trainings";
      toolsPanel = parent;
      render();
      scrollPageToStart();

      const end = appData && appData.settings && appData.settings.schoolYearEnd ? String(appData.settings.schoolYearEnd) : "";

      const y2 = end.slice(0, 4);
      if (/^\d{4}$/.test(y1) && /^\d{4}$/.test(y2) && y1 !== y2) return `${y1}-${y2}`;
      if (/^\d{4}$/.test(y1)) return `${y1}-${Number(y1) + 1}`;

    async function fetchOfficialSchoolYears() {
      try {
        const res = await fetch(eduGovApiUrlSchoolYears(), { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const group = ((json && json.facet_groups) || []).find((g) => g.name === "annee_scolaire");
        const facets = (group && group.facets) || [];
        const rich = facets
          .filter((f) => /^\d{4}-\d{4}$/.test(String(f.name || "")) && Number(f.count || 0) >= 50)
          .map((f) => String(f.name).trim())
          .sort()
          .reverse();
        if (rich.length) {
          officialSchoolYearsCache = rich;
          return rich;
        }
        const years = facets
          .map((f) => String(f.name || "").trim())
          .filter((y) => /^\d{4}-\d{4}$/.test(y))
          .sort()
          .reverse();
        if (years.length) {
          officialSchoolYearsCache = years;
          return years;
        }
      } catch (e) {
        console.warn("Impossible de charger la liste des années scolaires officielles:", e);
      }
      return officialSchoolYearsCache.slice();

    function normalizeIsoDate(value) {
      if (!value) return "";
      const s = String(value).trim();
      // Les dates API sont souvent en UTC (ex. 2025-10-17T22:00:00+00:00 = 18/10 à Paris).
      if (s.includes("T")) {
        const d = new Date(s);
        if (!Number.isNaN(d.getTime())) {
          try {
            const parts = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Europe/Paris",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            }).formatToParts(d);
            const y = parts.find((p) => p.type === "year")?.value;
            const m = parts.find((p) => p.type === "month")?.value;
            const day = parts.find((p) => p.type === "day")?.value;
            if (y && m && day) return `${y}-${m}-${day}`;
          } catch (_) { /* fallback below */ }
        }
      }
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
      return s;
    }

    function isCalendarBlockingEvent(desc) {
      const d = String(desc || "").toLowerCase();
      return d.includes("vacances") || d.includes("pont") || d.includes("vaquer");
    }

    function easterSundayISO(year) {
      // Algorithme de Meeus/Jones/Butcher (calendrier grégorien)
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function addDaysISO(iso, days) {
      const d = parseISODate(iso);
      if (!d) return "";
      return fmtISODate(addDays(d, days));
    }

    function frenchPublicHolidaysForSchoolYear(annee) {
      const parts = parseSchoolYearParts(annee);
      if (!parts) return [];
      const list = [];
      const push = (name, date) => {
        if (!date) return;
        list.push({ name, startDate: date, endDate: date });
      };
      // Année civile de début (sept–déc) + année de fin (jan–juil)
      push("Toussaint", `${parts.y1}-11-01`);
      push("Armistice 1918", `${parts.y1}-11-11`);
      push("Noël", `${parts.y1}-12-25`);
      push("Jour de l'An", `${parts.y2}-01-01`);
      const easter = easterSundayISO(parts.y2);
      push("Lundi de Pâques", addDaysISO(easter, 1));
      push("Fête du Travail", `${parts.y2}-05-01`);
      push("Victoire 1945", `${parts.y2}-05-08`);
      push("Ascension", addDaysISO(easter, 39));
      push("Lundi de Pentecôte", addDaysISO(easter, 50));
      push("Fête nationale", `${parts.y2}-07-14`);
      return list;
    }

    function officialHolidayRecordPriority(fields) {
      const pop = String((fields && fields.population) || "").trim();
      const desc = String((fields && fields.description) || "").toLowerCase();
      // Pour l'été, préférer la borne « Élèves » (fin août) à « Enseignants ».
      if (desc.includes("été") || desc.includes("ete")) {
        if (pop === "Élèves" || pop === "Eleves") return 3;
        if (pop === "-" || pop === "") return 2;
        return 1;
      }
      if (pop === "-" || pop === "") return 2;
      if (pop === "Élèves" || pop === "Eleves") return 1;
      return 0;
    }

    async function applyOfficialCalendarFromEducationGouv(academy, zone, anneeScolaire) {
      const annee = anneeScolaire || schoolYearLabel();
      // Filtre zone plus stable ; on ne filtre plus par « population=Élèves »
      // (sinon seules les vacances d'été sont renvoyées).
      const url = zone ? eduGovApiUrlForZone(zone, annee) : eduGovApiUrlForAcademy(academy, annee);
      let json;
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        json = await res.json();
      } catch (e) {
        console.error(e);
        throw new Error("Impossible de récupérer le calendrier officiel sur data.education.gouv.fr (réseau ou accès bloqué).");
      }

      let records = (json && json.records) || [];
      // Si filtre zone trop large, restreindre à l'académie choisie quand possible.
      if (academy && records.length) {
        const byAc = records.filter((r) => String((r.fields || {}).location || "") === academy);
        if (byAc.length >= 5) records = byAc;
      }
      if (!records.length) {
        throw new Error(`Aucune donnée trouvée pour l'académie "${academy}" (année ${annee}).`);
      }

      appData.holidays = [];
      frenchPublicHolidaysForSchoolYear(annee).forEach((f) => {
        appData.holidays.push({
          id: uid(),
          type: "ferie",
          name: f.name,
          startDate: f.startDate,
          endDate: f.endDate,
          color: "#94a3b8",
          blocksSessions: true,
        });
      });

      const bestByDesc = new Map();
      records.forEach((r) => {
        const f = r.fields || {};
        const desc = f.description || f.description_fr || f.description_en || "";
        if (!isCalendarBlockingEvent(desc)) return;
        const startDate = normalizeIsoDate(f.start_date);
        const endDate = normalizeIsoDate(f.end_date);
        if (!startDate || !endDate) return;
        const key = String(desc).toLowerCase().replace(/\s+/g, " ").trim();
        const prio = officialHolidayRecordPriority(f);
        const prev = bestByDesc.get(key);
        if (!prev || prio > prev.prio) {
          bestByDesc.set(key, { desc, startDate, endDate, prio });
        }
      });

      let insertedBlocking = 0;
      bestByDesc.forEach((item) => {
        const isPont = String(item.desc).toLowerCase().includes("pont");
        appData.holidays.push({
          id: uid(),
          type: isPont ? "pont" : "vacances",
          name: String(item.desc).replace(/^Vacances\s+(de|d'|de la)\s+/i, "Vacances ").trim(),
          startDate: item.startDate,
          endDate: item.endDate,
          color: isPont ? "#f59e0b" : "#64748b",
          blocksSessions: true,
        });
        insertedBlocking += 1;
      });

      if (insertedBlocking < 5) {
        throw new Error(`Réponse officielle incomplète pour ${annee} (seulement ${insertedBlocking} période(s)).`);
      }

      appData.holidays.sort((a, b) => a.startDate.localeCompare(b.startDate));
      syncSchoolYearDatesFromLabel(annee);
    }

    function loadForgottenGearFilter() {
      try {
        const o = JSON.parse(lsGet("eps_fg_filter") || "{}");
        if (o.scope && ["period", "term", "year"].includes(o.scope)) {
          return {
            scope: o.scope,
            useCurrent: !!o.useCurrent,
            periodId: String(o.periodId || ""),
            termIndex: Number.isInteger(o.termIndex) && o.termIndex >= 0 ? o.termIndex : 0,
          };
        }
        const legacy = o.type || "period-current";
        if (legacy === "year") return { scope: "year", useCurrent: false, periodId: "", termIndex: 0 };
        if (legacy === "period-fixed") {
          return { scope: "period", useCurrent: false, periodId: String(o.periodId || ""), termIndex: 0 };
        }
        if (legacy === "term-fixed") {
          return {
            scope: "term",
            useCurrent: false,
            periodId: "",
            termIndex: Number.isInteger(o.termIndex) && o.termIndex >= 0 ? o.termIndex : 0,
          };
        }
        if (legacy === "term-current") return { scope: "term", useCurrent: true, periodId: "", termIndex: 0 };
        return { scope: "period", useCurrent: true, periodId: "", termIndex: 0 };
      } catch {
        return { scope: "period", useCurrent: true, periodId: "", termIndex: 0 };
      }
    }

    function forgottenGearFilterRangeForClass(classId, refDateStr) {
      const f = forgottenGearFilter;
      const ref = refDateStr || dashboardDateISO();
      if (f.scope === "year") {
        const start = coerceISODateString(appData.settings?.schoolYearStart);
        const end = coerceISODateString(appData.settings?.schoolYearEnd);
        if (!start || !end) return null;
        return { startDate: start, endDate: end };
      }
      if (f.scope === "period") {
        if (f.useCurrent) {
          const cur = periodsForClass(classId).find((p) => {
            const { start, end } = periodDatesForClass(p, classId);
            return ref >= start && ref <= end;
          });
          return cur ? { startDate: cur.startDate, endDate: cur.endDate } : null;
        }
        const p = (appData.periods || []).find((x) => x.id === f.periodId);
        if (!p) return null;
        const applies = periodsForClass(classId).some((x) => x.id === p.id);
        if (!applies) return null;
        return { startDate: p.startDate, endDate: p.endDate };
      }
      if (f.scope === "term") {
        const sched = getSchoolTermSchedule();
        let term = null;
        if (f.useCurrent) {
          const idx = sched.terms.findIndex(
            (t) => t.startDate && t.endDate && ref >= t.startDate && ref <= t.endDate
          );
          if (idx >= 0) term = sched.terms[idx];
        } else {
          term = sched.terms[f.termIndex] || null;
        }
        if (!term || !term.startDate || !term.endDate) return null;
        return { startDate: term.startDate, endDate: term.endDate };
      }
      return null;
    }

      return idxs.map((i) => DOW[i]).join(" · ");

    function fmtDateFr(iso) {
      const p = String(iso).split("-");
      if (p.length !== 3) return iso;
      return `${p[2]}/${p[1]}/${p[0]}`;
    }

    const CLASS_LEVELS = ["6e", "5e", "4e", "3e"];

      "3e": "#fb7185",
    };

    function levelColor(level) {
      return LEVEL_COLORS[level] || "#8ba4ff";

    function inferClassLevel(name) {
      const s = String(name || "").toLowerCase().replace(/\s/g, "");
      if (/^6(e|ème|eme)?/.test(s)) return "6e";
      if (/^5(e|ème|eme)?/.test(s)) return "5e";
      if (/^4(e|ème|eme)?/.test(s)) return "4e";
      if (/^3(e|ème|eme)?/.test(s)) return "3e";
      return "";
    }

    function classLevel(cl) {
      return cl && (cl.level || inferClassLevel(cl.name) || (Number(cl.cycleYears) === 3 ? "6e" : "5e"));
    }

    function classEnrollment(cl) {
      const students = Array.isArray(cl && cl.students) ? cl.students : [];
      return students.length ? students.length : Math.max(0, Number(cl && cl.enrollment) || 0);

      return String(s ?? "")

    function matchesSearch(text) {
      if (!searchQuery.trim()) return true;
      return String(text).toLowerCase().includes(searchQuery.trim().toLowerCase());
    }

    /**
     * Prochaine séance = première à venir (aujourd'hui inclus) non annulée.
     * Dernière effectuée = dernière date passée marquée effectuée.
     */
    function nextAndLastSession(classId) {
      const sorted = sessionsForClass(classId).slice().sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      const today = todayStart();
      let next = null;
      let lastDone = null;
      sorted.forEach((s) => {
        const st = computeSessionStatus(s);
        const d = parseISODate(s.date);
        d.setHours(0, 0, 0, 0);
        if (st.code === "done") lastDone = s;
        if (!next && (st.code === "planned" || st.code === "today")) {
          if (st.code === "today") next = s;
          else if (d.getTime() >= today.getTime()) next = s;
        }
      });
      return { next, lastDone };
    }

    function statsPerActivity(classId, actId) {
      const list = sessionsForActivityTable(classId, actId);
      let done = 0, cancelled = 0, remaining = 0;
      list.forEach((s) => {
        const st = computeSessionStatus(s);
        if (st.code === "cancelled") cancelled++;
        else if (st.code === "done") done++;
        else if (st.code === "planned" || st.code === "today") remaining++;
      });
      const total = list.length;
      const pct = total - cancelled > 0 ? Math.round((done / (total - cancelled)) * 100) : 0;
      return { total, done, cancelled, remaining, pct };
    }

    /**
     * Accueil « Séquences en cours » : date de la dernière séance programmée
     * (identique à la dernière ligne du tableau de l'onglet classe pour cette APSA).
     */
    function lastSessionDateForActivity(classId, actId) {
      const subs = sessionsForActivityTable(classId, actId)
        .filter((s) => computeSessionStatus(s).code !== "cancelled")
        .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
      return subs.length ? subs[subs.length - 1].date : null;
    }

    function globalSessionCounts(refDate) {
      let todayN = 0, planned = 0, done = 0, cancelled = 0;
      const todayDetails = [];
      const tStr = fmtISODate(refDate || new Date());
      appData.sessions.forEach((s) => {
        const st = computeSessionStatus(s);
        if (s.date === tStr && st.code !== "cancelled") {
          todayN++;
          const cl = getClassById(s.classId);
          const act = activityById(s.activityId);
          todayDetails.push({
            className: cl ? cl.name : "—",
            startTime: s.startTime || "—",
            endTime: s.endTime || "",
            activityName: act ? act.name : "",
          });
        }
        if (st.code === "cancelled") cancelled++;
        else if (st.code === "done") done++;
        else if (st.code === "planned" || st.code === "today") planned++;
      });
      todayDetails.sort((a, b) => a.startTime.localeCompare(b.startTime));
      return { todayN, todayDetails, planned, done, cancelled, total: appData.sessions.length };
    }

    function avgCycleProgress() {
      if (!appData.classes.length) return 0;
      let sum = 0;
      appData.classes.forEach((cl) => {
        sum += sessionStatsForClass(cl.id).pct;
      });
      return Math.round(sum / appData.classes.length);
    }

      const map = {};
      appData.activities.forEach((a) => {
        const k = a.field || "—";

      return Object.entries(map).sort((a, b) => b[1] - a[1]);

    let fullscreenInsetListener = null;

    function measureSafeAreaInset(edge) {
      const prop =
        edge === "bottom" ? "paddingBottom" : edge === "left" ? "paddingLeft" : edge === "right" ? "paddingRight" : "paddingTop";
      const envName =
        edge === "bottom"
          ? "safe-area-inset-bottom"
          : edge === "left"
            ? "safe-area-inset-left"
            : edge === "right"
              ? "safe-area-inset-right"
              : "safe-area-inset-top";
      const probe = document.createElement("div");
      probe.style.cssText = "position:fixed;visibility:hidden;pointer-events:none;padding:0;";
      probe.style[prop] = `env(${envName}, 0px)`;
      document.body.appendChild(probe);
      const px = parseFloat(getComputedStyle(probe)[prop]) || 0;
      probe.remove();
      return px;
    }

    function syncFullscreenSafeInsets() {
      const html = document.documentElement;
      const touch = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
      const portrait = window.matchMedia("(orientation: portrait)").matches;
      const measuredTop = measureSafeAreaInset("top");
      const measuredBottom = measureSafeAreaInset("bottom");
      const measuredLeft = measureSafeAreaInset("left");
      const measuredRight = measureSafeAreaInset("right");
      const vv = window.visualViewport;
      const vvTop = vv && Number.isFinite(vv.offsetTop) ? Math.max(0, vv.offsetTop) : 0;
      const minTop = touch ? (portrait ? 68 : 56) : 0;
      const topPx = Math.ceil(Math.max(minTop, measuredTop + 6, vvTop + (touch ? 48 : 0)));
      html.style.setProperty("--app-safe-top", topPx + "px");
      html.style.setProperty("--app-safe-bottom", Math.max(touch ? 12 : 0, measuredBottom) + "px");
      html.style.setProperty("--app-safe-left", Math.max(0, measuredLeft) + "px");
      html.style.setProperty("--app-safe-right", Math.max(0, measuredRight) + "px");
    }

    function bindFullscreenInsetSync() {
      unbindFullscreenInsetSync();
      syncFullscreenSafeInsets();
      fullscreenInsetListener = () => syncFullscreenSafeInsets();
      window.visualViewport?.addEventListener("resize", fullscreenInsetListener);
      window.visualViewport?.addEventListener("scroll", fullscreenInsetListener);
      window.addEventListener("resize", fullscreenInsetListener);
      window.addEventListener("orientationchange", fullscreenInsetListener);
    }

    function unbindFullscreenInsetSync() {
      if (!fullscreenInsetListener) return;
      window.visualViewport?.removeEventListener("resize", fullscreenInsetListener);
      window.visualViewport?.removeEventListener("scroll", fullscreenInsetListener);
      window.removeEventListener("resize", fullscreenInsetListener);
      window.removeEventListener("orientationchange", fullscreenInsetListener);
      fullscreenInsetListener = null;
    }

    function openFullscreenBackdrop() {
      const root = document.getElementById("modal-root");
      if (!root) return null;
      bindFullscreenInsetSync();
      root.classList.add("open", "modal-backdrop--calendar-fullscreen");

    function closeModal() {
      const root = document.getElementById("modal-root");
      if (!root) return;

    function openModal(title, bodyNode, onConfirm, options) {
      options = options || {};

      const modalClass = "modal" + (options.wide ? " modal--wide" : "");

      wrap.querySelector(".modal-title").textContent = title;
      wrap.querySelector(".modal-body").appendChild(bodyNode);
      const foot = wrap.querySelector(".modal-footer");
      if (options.infoOnly) {
        const bClose = el(`<button type="button" class="btn btn-primary">Fermer</button>`);
        foot.append(bClose);
        bClose.onclick = closeModal;
      } else {
        const bCancel = el(`<button type="button" class="btn btn-ghost">Annuler</button>`);
        const bOk = el(
          `<button type="button" class="btn ${options.confirmDanger ? "btn-danger" : "btn-primary"}"></button>`
        );
        bOk.textContent = options.confirmLabel || "Valider";
        foot.append(bCancel, bOk);
        bCancel.onclick = closeModal;
        bOk.onclick = () => {
          const keepOpen = onConfirm && onConfirm() === false;
          if (!keepOpen) closeModal();
        };
      }
      wrap.querySelector(".modal-close").onclick = closeModal;
      root.appendChild(wrap);
      root.onclick = (e) => {
        if (e.target === root) closeModal();
      };
    }

    function wireCalendarEvents(root, onChange) {
      if (!root) return;
      const refresh = typeof onChange === "function" ? onChange : refreshCalendarView;
      root.querySelector("#cal-prev")?.addEventListener("click", () => {
        if (calendarMode === "month") calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() - 1, 1);
        else calendarCursor = addDays(calendarCursor, -7);
        refresh();
      });
      root.querySelector("#cal-next")?.addEventListener("click", () => {
        if (calendarMode === "month") calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + 1, 1);
        else calendarCursor = addDays(calendarCursor, 7);
        refresh();
      });
      root.querySelector("#cal-mode")?.addEventListener("change", (e) => {
        calendarMode = e.target.value === "year" ? "month" : e.target.value;
        refresh();
      });
      root.querySelector("#cal-period-label")?.addEventListener("click", openCalendarPeriodPicker);
      root.querySelector("#cal-show-courses")?.addEventListener("change", (e) => {
        calendarEventFilter = e.target.checked ? "all" : "no-courses";
        refresh();
      });

        btn.addEventListener("click", (e) => {

          openCalendarEventDetailModal(

            btn.getAttribute("data-date")

    function hasProgEtabPdf() {
      return !!(appData.progEtabPdf && appData.progEtabPdf.length > 100);
    }

    /** iOS (et iPadOS) n'affiche qu'une page PDF dans iframe/embed, sans zoom fiable. */
    function isIOSDevice() {
      if (typeof navigator === "undefined") return false;
      const ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/i.test(ua)) return true;
      return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    }

    function prefersNativePdfViewer() {
      return isIOSDevice();
    }

    /** iPhone / mobile : tableaux et calendriers en plein écran type document. */
    function prefersMobileDocFullscreen() {
      if (isIOSDevice()) return true;
      return window.matchMedia("(max-width: 768px)").matches;
    }

    function prefersMobileTableFullscreen() {
      return prefersMobileDocFullscreen();
    }

    let calendarFullscreenDismissed = false;

    function dataUrlToBlobUrl(dataUrl) {
      const comma = dataUrl.indexOf(",");
      if (comma < 0) return dataUrl;
      const header = dataUrl.slice(0, comma);
      const mimeMatch = header.match(/data:([^;]+)/i);
      const mime = mimeMatch ? mimeMatch[1] : "application/pdf";
      const binary = atob(dataUrl.slice(comma + 1));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return URL.createObjectURL(new Blob([bytes], { type: mime }));
    }

    const pdfBlobUrlCache = new Map();

    function getPdfBlobUrl(dataUrl) {
      if (!dataUrl || !dataUrl.startsWith("data:")) return dataUrl;
      if (pdfBlobUrlCache.has(dataUrl)) return pdfBlobUrlCache.get(dataUrl);
      const blobUrl = dataUrlToBlobUrl(dataUrl);
      pdfBlobUrlCache.set(dataUrl, blobUrl);
      return blobUrl;
    }

    function openPdfNative(dataUrl, title) {
      if (!dataUrl) return;
      const blobUrl = getPdfBlobUrl(dataUrl);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      if (title) a.setAttribute("aria-label", title);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function closeProgEtabFullscreen() {
      const fs = document.getElementById("prog-pdf-fullscreen");
      if (fs) fs.classList.remove("open");
    }

    function ensurePdfFullscreenShell() {
      let fs = document.getElementById("prog-pdf-fullscreen");
      if (fs) return fs;
      fs = document.createElement("div");
      fs.id = "prog-pdf-fullscreen";
      fs.className = "prog-pdf-fullscreen";
      fs.innerHTML =
        '<button type="button" class="btn-close-pdf-fs" aria-label="Fermer">✕</button>' +
        '<iframe hidden></iframe>' +
        '<div class="prog-pdf-fullscreen__panel" hidden>' +
        '  <div class="prog-pdf-fullscreen__panel-icon" aria-hidden="true">📄</div>' +
        '  <h3 class="prog-pdf-fullscreen__title"></h3>' +
        '  <p>Sur iPhone, le document s\'ouvre dans le lecteur PDF intégré : toutes les pages, défilement et zoom au doigt.</p>' +
        '  <button type="button" class="btn btn-primary btn-open-pdf-native-fs">Ouvrir le PDF</button>' +
        "</div>";
      document.body.appendChild(fs);
      fs.querySelector(".btn-close-pdf-fs").addEventListener("click", closeProgEtabFullscreen);
      fs.addEventListener("click", (e) => {
        if (e.target === fs) closeProgEtabFullscreen();
      });
      fs.querySelector(".btn-open-pdf-native-fs").addEventListener("click", () => {
        const url = fs.dataset.pdfUrl;
        const title = fs.dataset.pdfTitle || "Document PDF";
        if (url) openPdfNative(url, title);
      });
      return fs;
    }

    function openPdfFullscreen(dataUrl, title) {
      if (!dataUrl) return;
      const docTitle = title || "Document PDF";
      if (prefersNativePdfViewer()) {
        openPdfNative(dataUrl, docTitle);
        return;
      }
      const fs = ensurePdfFullscreenShell();
      const ifr = fs.querySelector("iframe");
      const panel = fs.querySelector(".prog-pdf-fullscreen__panel");
      if (ifr) {
        ifr.hidden = false;
        ifr.title = docTitle;
        ifr.src = dataUrl;
      }
      if (panel) panel.hidden = true;
      fs.classList.add("open");
    }

    function openProgEtabFullscreen() {
      if (!hasProgEtabPdf()) return;
      openPdfFullscreen(appData.progEtabPdf, "Programmation EPS");
    }

    function pdfPreviewHtml(dataUrl, opts) {
      opts = opts || {};
      const title = opts.title || "Document PDF";
      const containerId = opts.containerId || "";
      const btnId = opts.buttonId || "";
      const idAttr = containerId ? ` id="${containerId}"` : "";
      const btnAttr = btnId ? ` id="${btnId}"` : "";
      if (prefersNativePdfViewer()) {
        return `<div class="pdf-native-card"${idAttr} role="button" tabindex="0" title="Ouvrir le PDF">
          <div class="pdf-native-card__icon" aria-hidden="true">📄</div>
          <p style="margin:0 0 .35rem;font-weight:700">${escapeHtml(title)}</p>

          <button type="button" class="btn btn-sm btn-primary btn-open-pdf-native"${btnAttr}>Ouvrir le PDF</button>
        </div>`;
      }
      return `<div style="border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer"${idAttr} title="Ouvrir le document">
        <iframe src="${dataUrl}" style="width:100%;height:${opts.height || "70vh"};border:none;pointer-events:none" title="${escapeHtml(title)}"></iframe>
      </div>`;
    }

    function wirePdfNativeOpen(root, dataUrl, title) {
      if (!root || !dataUrl) return;
      const open = () => openPdfNative(dataUrl, title);
      root.querySelector(".btn-open-pdf-native")?.addEventListener("click", (e) => {

      });

          open();
        });
        root.addEventListener("keydown", (e) => {

            e.preventDefault();
            open();
          }
        });
      }

    function buildAttendanceBlock(session, opts) {
      opts = opts || {};
      const styled = !!opts.styled;
      const cl = getClassById(session.classId);
      const students = (cl && cl.students) || [];
      if (!session.attendance) session.attendance = {};
      const wrap = document.createElement("div");
      if (styled) {
        wrap.className = "sm-section sm-section--attendance";
      } else {
        wrap.style.cssText = "margin-top:1rem;border-top:1px solid var(--border);padding-top:1rem";
      }

      const renderUI = () => {
        const att = session.attendance;
        const list = students.length ? students : Object.keys(att);
        const presentCount = list.filter((n) => att[n] === "present").length;
        const absentCount = list.filter((n) => att[n] === "absent").length;
        const lateCount = list.filter((n) => att[n] === "late").length;
        const notMarked = list.length - presentCount - absentCount - lateCount;

        const btnStyle = (name, val) => {
          const active = att[name] === val;
          const colors = { present: "#16a34a", absent: "#dc2626", late: "#d97706" };
          return active
            ? `background:${colors[val]};color:#fff;font-weight:700;border:none`
            : `background:transparent;color:var(--fg);border:1px solid var(--border)`;
        };

        let rows = "";
        if (students.length) {
          rows = list.map((name) =>
            `<div style="display:flex;align-items:center;gap:.4rem;padding:.35rem 0;border-bottom:1px solid var(--border)" data-student="${escapeHtml(name)}">
              <span style="flex:1;font-size:.88rem;font-weight:500">${escapeHtml(name)}</span>
              <button type="button" class="btn btn-sm att-btn" data-name="${escapeHtml(name)}" data-val="present" style="padding:.2rem .55rem;font-size:.75rem;border-radius:20px;${btnStyle(name, "present")}">Présent</button>
              <button type="button" class="btn btn-sm att-btn" data-name="${escapeHtml(name)}" data-val="late" style="padding:.2rem .55rem;font-size:.75rem;border-radius:20px;${btnStyle(name, "late")}">Retard</button>
              <button type="button" class="btn btn-sm att-btn" data-name="${escapeHtml(name)}" data-val="absent" style="padding:.2rem .55rem;font-size:.75rem;border-radius:20px;${btnStyle(name, "absent")}">Absent</button>
            </div>`
          ).join("");
        } else {
          rows = `<p class="kpi-sub">Aucun élève importé pour cette classe. Ajoutez-les via Réglages > Mes classes > ⚙️.</p>`;
        }

        const allPresentBtn = students.length
          ? `<button type="button" class="btn btn-sm" id="att-all-present" style="background:#16a34a;color:#fff;font-weight:700;font-size:.78rem;padding:.3rem .7rem;border-radius:20px">✓ Tous présents</button>`
          : "";

        const attHeadStyled = `<div class="sm-section__head" style="display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;flex-wrap:wrap">
            <p class="sm-section__title" style="margin:0">📋 Appel</p>
            ${allPresentBtn}
            <span class="kpi-sub" style="margin-left:auto">${presentCount > 0 ? `<span style="color:#16a34a;font-weight:600">${presentCount} P</span>` : ""}${lateCount > 0 ? ` <span style="color:#d97706;font-weight:600">${lateCount} R</span>` : ""}${absentCount > 0 ? ` <span style="color:#dc2626;font-weight:600">${absentCount} A</span>` : ""}${notMarked > 0 ? ` <span>${notMarked} non pointé(s)</span>` : ""}</span>
          </div>`;
        const attHeadClassic = `<div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem;flex-wrap:wrap">
            <p style="font-weight:700;margin:0">📋 Appel</p>
            ${allPresentBtn}
            <span class="kpi-sub" style="margin-left:auto">${presentCount > 0 ? `<span style="color:#16a34a;font-weight:600">${presentCount} P</span>` : ""}${lateCount > 0 ? ` <span style="color:#d97706;font-weight:600">${lateCount} R</span>` : ""}${absentCount > 0 ? ` <span style="color:#dc2626;font-weight:600">${absentCount} A</span>` : ""}${notMarked > 0 ? ` <span>${notMarked} non pointé(s)</span>` : ""}</span>
          </div>`;
        wrap.innerHTML = `${styled ? attHeadStyled : attHeadClassic}<div style="max-height:280px;overflow-y:auto">${rows}</div>`;

        wrap.querySelectorAll(".att-btn").forEach((b) => {
          b.addEventListener("click", () => {
            const name = b.getAttribute("data-name");

            session.attendance[name] = session.attendance[name] === val ? undefined : val;
            if (session.attendance[name] === undefined) delete session.attendance[name];

      const blockingEventCount = dayEvents.filter((h) => h.blocksSessions).length + daySchoolBlocking.length;
      const sessionCount = todaySessions.filter((s) => {

    function currentWeekRangeMonSun(refDate) {
      const d = new Date(refDate || new Date());
      d.setHours(0, 0, 0, 0);
      const mon = addDays(d, -dayIndexMon0(d));
      const sun = addDays(mon, 6);
      return { start: fmtISODate(mon), end: fmtISODate(sun) };
    }

    function coerceISODateString(s) {
      const raw = String(s || "").trim();
      if (!raw) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
      const isoPrefix = raw.match(/^(\d{4}-\d{2}-\d{2})/);
      if (isoPrefix) return isoPrefix[1];
      const fr = raw.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/);
      if (fr) {
        return `${fr[3]}-${String(fr[2]).padStart(2, "0")}-${String(fr[1]).padStart(2, "0")}`;
      }
      return "";
    }

    function normalizeReminder(raw) {
      if (!raw || typeof raw !== "object") return null;
      const text = String(raw.text || "").trim();
      const date = coerceISODateString(raw.date);
      if (!date || !text) return null;
      const daysBefore =
        Number.isInteger(raw.daysBefore) && raw.daysBefore >= 0 ? raw.daysBefore : 7;
      return {
        id: raw.id || uid(),
        date,
        text,
        daysBefore,
        schoolEventId: raw.schoolEventId ? String(raw.schoolEventId) : "",
        holidayId: raw.holidayId ? String(raw.holidayId) : "",
        schoolTermId: raw.schoolTermId ? String(raw.schoolTermId) : "",
      };
    }

      return opts

    function readReminderDaysBeforeFromForm(root, fieldId) {
      const el = root && root.querySelector("#" + (fieldId || "f-reminder-days-before"));
      const n = el ? parseInt(el.value, 10) : 7;
      return Number.isInteger(n) && n >= 0 ? n : 7;
    }

    /** Rappel visible sur la date affichée : de J-N (inclus) jusqu'à J (inclus), puis masqué. */
    function isReminderVisibleOnViewDate(reminder, viewDate) {
      if (!reminder) return false;
      const eventIso = coerceISODateString(reminder.date);
      const viewIso = fmtISODate(viewDate);
      if (!eventIso || !viewIso) return false;
      const event = parseISODate(eventIso);
      const view = parseISODate(viewIso);
      if (isNaN(event.getTime()) || isNaN(view.getTime())) return false;
      const daysBefore =
        Number.isInteger(reminder.daysBefore) && reminder.daysBefore >= 0
          ? reminder.daysBefore
          : 7;
      const windowStartIso = fmtISODate(addDays(event, -daysBefore));
      return viewIso >= windowStartIso && viewIso <= eventIso;
    }

    function removeReminderById(reminderId) {
      if (!reminderId) return false;
      const before = (appData.reminders || []).length;
      appData.reminders = (appData.reminders || []).filter((x) => x && x.id !== reminderId);
      return (appData.reminders || []).length < before;
    }

    function addReminderEntry(entry) {
      const date = coerceISODateString(entry.date);
      const text = String(entry.text || "").trim();
      if (!date || !text) return null;
      const item = normalizeReminder({
        id: uid(),
        date,
        text,
        daysBefore: entry.daysBefore,
        schoolEventId: entry.schoolEventId || "",
        holidayId: entry.holidayId || "",
        schoolTermId: entry.schoolTermId || "",
      });
      if (!item) return null;
      if (!Array.isArray(appData.reminders)) appData.reminders = [];
      appData.reminders.push(item);
      return item;
    }

    function activeDashboardReminders() {

    function schoolEventReminderText(event) {
      const kind = String(event?.kind || "").trim();
      const title = String(event?.title || "").trim();
      if (kind && kind !== "Autre" && title && title !== kind) return `${kind} — ${title}`;
      return title || kind || "Événement établissement";
    }

    function holidayReminderText(holiday) {
      const name = String(holiday?.name || "").trim();
      const type = String(holiday?.type || "").trim();
      if (name && type) return `${name} (${type})`;
      return name || type || "Événement calendrier";
    }

    function findReminderForSchoolEvent(event) {
      if (!event) return null;
      const byId = (appData.reminders || [])
        .map(normalizeReminder)
        .filter(Boolean)
        .find((r) => r.schoolEventId && r.schoolEventId === event.id);
      if (byId) return byId;
      const text = schoolEventReminderText(event);
      const date = String(event.date || "").trim();
      if (!date || !text) return null;
      return (
        (appData.reminders || [])
          .map(normalizeReminder)
          .filter(Boolean)
          .find((r) => r.date === date && r.text === text) || null
      );
    }

    function reminderExistsForSchoolEvent(event) {
      return !!findReminderForSchoolEvent(event);
    }

    function schoolTermCount(mode) {
      return mode === "semestre" ? 2 : 3;
    }

    function schoolTermLabel(mode, index) {
      const n = index + 1;
      return mode === "semestre" ? `Semestre ${n}` : `Trimestre ${n}`;
    }

    function schoolTermShortLabel(mode, index) {
      const n = index + 1;
      return mode === "semestre" ? `S${n}` : `T${n}`;
    }

    function normalizeSchoolTermSchedule() {
      if (!appData.schoolTermSchedule || typeof appData.schoolTermSchedule !== "object") {
        appData.schoolTermSchedule = { mode: "trimestre", terms: [] };
      }
      const sched = appData.schoolTermSchedule;
      sched.mode = sched.mode === "semestre" ? "semestre" : "trimestre";
      if (!Array.isArray(sched.terms)) sched.terms = [];
      const count = schoolTermCount(sched.mode);
      const next = [];
      for (let i = 0; i < count; i++) {
        const prev = sched.terms[i] || {};
        next.push({
          id: prev.id || uid(),
          startDate: coerceISODateString(prev.startDate) || "",
          endDate: coerceISODateString(prev.endDate) || "",
        });
      }
      sched.terms = next;
      const ids = new Set(next.map((t) => t.id));
      appData.reminders = (appData.reminders || []).filter((r) => !r.schoolTermId || ids.has(r.schoolTermId));
    }

    function getSchoolTermSchedule() {
      normalizeSchoolTermSchedule();
      return appData.schoolTermSchedule;
    }

    function schoolTermsHaveDates() {
      const sched = getSchoolTermSchedule();
      return sched.terms.some((t) => t.startDate || t.endDate);
    }

    function getSchoolTermsOnDate(dateStr) {
      const sched = getSchoolTermSchedule();
      const items = [];
      sched.terms.forEach((term, index) => {
        if (term.startDate === dateStr) {
          items.push({ type: "start", term, index, label: schoolTermLabel(sched.mode, index) });
        }
        if (term.endDate === dateStr) {
          items.push({ type: "end", term, index, label: schoolTermLabel(sched.mode, index) });
        }
      });
      return items;
    }

    function getSchoolTermDayKind(dateStr) {
      const items = getSchoolTermsOnDate(dateStr);
      const hasStart = items.some((i) => i.type === "start");
      const hasEnd = items.some((i) => i.type === "end");
      if (hasStart && hasEnd) return "both";
      if (hasEnd) return "end";
      if (hasStart) return "start";
      return "";
    }

    function calCellTermClass(dateStr) {
      const kind = getSchoolTermDayKind(dateStr);
      if (!kind) return "";
      if (kind === "both") return " cal-cell--term-start cal-cell--term-end";
      return ` cal-cell--term-${kind}`;
    }

    function calWeekDayTermClass(dateStr) {
      const kind = getSchoolTermDayKind(dateStr);
      return kind ? ` cal-week-day--term-${kind}` : "";
    }

      if (!schoolTermsHaveDates()) return "";

    function resolveSchoolTermForReminder(main, termId) {
      const sched = getSchoolTermSchedule();
      const idx = sched.terms.findIndex((t) => t.id === termId);
      if (idx < 0) return null;
      const term = { ...sched.terms[idx] };
      const endEl = main?.querySelector(`.school-term-end[data-id="${termId}"]`);
      const startEl = main?.querySelector(`.school-term-start[data-id="${termId}"]`);
      if (endEl?.value) term.endDate = coerceISODateString(endEl.value);
      if (startEl?.value) term.startDate = coerceISODateString(startEl.value);
      return { term, mode: sched.mode, index: idx };
    }

    function schoolTermReminderText(term, mode, index) {
      return `Fin du ${schoolTermLabel(mode, index).toLowerCase()}`;
    }

    function findReminderForSchoolTerm(term, mode, index) {
      if (!term) return null;
      const byId = (appData.reminders || [])
        .map(normalizeReminder)
        .filter(Boolean)
        .find((r) => r.schoolTermId && r.schoolTermId === term.id);
      if (byId) return byId;
      if (!term.endDate) return null;
      const text = schoolTermReminderText(term, mode, index);
      return (
        (appData.reminders || [])
          .map(normalizeReminder)
          .filter(Boolean)
          .find((r) => r.date === term.endDate && r.text === text) || null
      );
    }

    function syncSchoolTermReminderDates() {
      const sched = getSchoolTermSchedule();
      (appData.reminders || []).forEach((r) => {
        if (!r.schoolTermId) return;
        const idx = sched.terms.findIndex((t) => t.id === r.schoolTermId);
        if (idx < 0) return;
        const term = sched.terms[idx];
        if (term.endDate) {
          r.date = term.endDate;
          r.text = schoolTermReminderText(term, sched.mode, idx);
        }
      });
    }

    function readSchoolTermsFromForm(main) {
      if (!main || !main.querySelector(".school-term-start")) return false;
      const mode = main.querySelector("#school-term-mode")?.value === "semestre" ? "semestre" : "trimestre";
      const count = schoolTermCount(mode);
      const prevSched = appData.schoolTermSchedule || { mode: "trimestre", terms: [] };
      const terms = [];
      for (let i = 0; i < count; i++) {
        const startEl = main.querySelector(`.school-term-start[data-index="${i}"]`);
        const endEl = main.querySelector(`.school-term-end[data-index="${i}"]`);
        const prev = prevSched.terms && prevSched.terms[i] ? prevSched.terms[i] : {};
        terms.push({
          id: (startEl && startEl.getAttribute("data-id")) || prev.id || uid(),
          startDate: coerceISODateString(startEl?.value || ""),
          endDate: coerceISODateString(endEl?.value || ""),
        });
      }
      appData.schoolTermSchedule = { mode, terms };
      normalizeSchoolTermSchedule();
      return true;
    }

    function persistSchoolTermsFromForm(main, opts) {
      opts = opts || {};
      if (!readSchoolTermsFromForm(main)) return false;
      if (opts.syncReminders) syncSchoolTermReminderDates();
      saveData({ skipAutoRegen: true });
      return true;
    }

      let resolved = resolveSchoolTermForReminder(main, termId);

      const { term, mode, index } = resolved;
      const existing = findReminderForSchoolTerm(term, mode, index);

        removeReminderById(existing.id);
        saveData({ skipAutoRegen: true });
        render();
        return;

      const body = el(`<div>
        <p class="kpi-sub" style="margin:0 0 .65rem;line-height:1.5"><strong>${escapeHtml(fmtDateFr(term.endDate))}</strong> — ${escapeHtml(schoolTermReminderText(term, mode, index))}</p>

        addReminderEntry({
          date: endDate,

          daysBefore: readReminderDaysBeforeFromForm(body),
          schoolTermId: t.id,

        saveData({ skipAutoRegen: true });
        render();
        return true;
      });

    function upcomingAssociationCompetitions() {
      const today = fmtISODate(new Date());
      const items = [];
      const activities = (appData.association && appData.association.activities) || [];
      activities.forEach((a) => {
        (a.competitions || []).forEach((c) => {
          if (!c || !c.date || c.date < today) return;
          normalizeAssociationCompetition(c);
          items.push({
            competitionId: c.id,
            activityId: a.id,
            activityName: a.name || "—",
            date: c.date,
            place: c.place || "",
            category: c.category || "",
            categoryAge: c.categoryAge || "",
            sex: c.sex || "",
            coach: c.coach || "",
          });
        });
      });
      return items.sort((x, y) => String(x.date).localeCompare(String(y.date)));
    }

    function filterAssociationCompetitions(items, filters) {
      const activityId = filters?.activityId || "";
      const sex = filters?.sex || "";
      const categoryAge = filters?.categoryAge || "";
      return items.filter((c) => {
        if (activityId && c.activityId !== activityId) return false;
        if (categoryAge && c.categoryAge !== categoryAge) return false;
        if (sex) {
          const cs = c.sex || "";
          if (sex === "filles" && cs !== "filles" && cs !== "tous") return false;
          if (sex === "garçons" && cs !== "garçons" && cs !== "tous") return false;
          if (sex === "tous" && cs !== "tous") return false;
        }
        return true;
      });
    }

    function associationCompetitionSexLabel(sex) {
      if (sex === "filles") return "Filles";
      if (sex === "garçons") return "Garçons";
      if (sex === "tous") return "Mixte";
      return "";
    }

    function associationCompetitionCategoryLabel(categoryAge) {
      if (categoryAge === "benjamins") return "Benjamins";
      if (categoryAge === "minimes") return "Minimes";
      return categoryAge ? categoryAge.charAt(0).toUpperCase() + categoryAge.slice(1) : "";
    }

    function renderAssociationUpcomingCompetitionsRowsHtml(items) {
      if (!items.length) return '<p class="kpi-sub" style="margin:0">Aucune compétition à venir.</p>';
      return `<div>${items
        .map((c) => {
          const metaParts = [];
          if (c.category) metaParts.push(c.category);
          else {
            const built = [associationCompetitionCategoryLabel(c.categoryAge), associationCompetitionSexLabel(c.sex)]
              .filter(Boolean)
              .join(" ");
            if (built) metaParts.push(built);
          }
          if (c.place) metaParts.push(c.place);
          if (c.coach) metaParts.push(c.coach);
          const meta = metaParts.map((x) => escapeHtml(x)).join(" · ");
          return `<div class="dash-as-comp-row">
              <span class="dash-as-comp-date">${escapeHtml(fmtDateFr(c.date))}</span>
              · <span class="dash-as-comp-activity">${escapeHtml(c.activityName)}</span>
              ${meta ? `<div class="kpi-sub" style="margin-top:.1rem">${meta}</div>` : ""}
            </div>`;
        })
        .join("")}</div>`;
    }

    function refreshAssociationUpcomingCompetitionsList() {
      const listRoot = document.getElementById("as-upcoming-comp-list");
      const countEl = document.getElementById("as-upcoming-comp-count");
      const emptyHint = document.getElementById("as-upcoming-comp-empty-hint");
      if (!listRoot) return;
      const all = upcomingAssociationCompetitions();
      const filtered = filterAssociationCompetitions(all, associationCompetitionFilters);
      listRoot.innerHTML = renderAssociationUpcomingCompetitionsRowsHtml(filtered);
      if (countEl) {
        const n = filtered.length;
        const total = all.length;
        countEl.textContent = n ? ` (${n}${n !== total ? " / " + total : ""})` : "";
      }
      if (emptyHint) {
        const hasFilters =
          associationCompetitionFilters.activityId ||
          associationCompetitionFilters.sex ||
          associationCompetitionFilters.categoryAge;
        emptyHint.hidden = !(hasFilters && !filtered.length && all.length);
      }
    }

    function wireAssociationCompetitionFilters(main) {
      const readFiltersFromDom = () => {
        associationCompetitionFilters = {
          activityId: main.querySelector("#as-comp-filter-activity")?.value || "",

        refreshAssociationUpcomingCompetitionsList();
      };
      main.querySelector("#as-comp-filter-activity")?.addEventListener("change", apply);
      main.querySelector("#as-comp-filter-sex")?.addEventListener("change", apply);
      main.querySelector("#as-comp-filter-category")?.addEventListener("change", apply);
      main.querySelector("#as-comp-filter-reset")?.addEventListener("click", () => {

        const sex = main.querySelector("#as-comp-filter-sex");
        const cat = main.querySelector("#as-comp-filter-category");
        if (act) act.value = "";

<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="EPS Dashboard" />
  <meta name="theme-color" content="#eef2f7" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>EPS Collège — Tableau de bord pédagogique</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236c8cff' width='100' height='100' rx='20'/><text x='50' y='68' text-anchor='middle' font-size='48' fill='white' font-family='sans-serif' font-weight='bold'>EPS</text></svg>" />
  <style>
    /* ========== VARIABLES & RESET ========== */
    :root {
      --bg: #0a0c12;
      --bg-elevated: #171c28;
      --surface: #1f2638;
      --border: rgba(255, 255, 255, 0.14);
      --border-strong: rgba(255, 255, 255, 0.26);
      --text: #f4f6fb;
      --text-muted: #b4bdd0;
      --accent: #8ba4ff;
      --accent-soft: rgba(139, 164, 255, 0.24);
      --success: #4ade80;
      --warning: #fcd34d;
      --danger: #fb7185;
      --app-safe-top: env(safe-area-inset-top, 0px);
      --app-safe-right: env(safe-area-inset-right, 0px);
      --app-safe-bottom: env(safe-area-inset-bottom, 0px);
      --app-safe-left: env(safe-area-inset-left, 0px);
      --color-teal: #2dd4bf;
      --color-violet: #a5b4fc;
      --color-sky: #38bdf8;
      --color-rose: #fb7185;
      --color-amber: #fcd34d;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
      --shadow-sm: 0 2px 14px rgba(0, 0, 0, 0.35);
      --shadow-zone: 0 6px 24px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      --sidebar-w: 260px;
      --fg: var(--text);
      --card: var(--bg-elevated);
      --hover: rgba(139, 164, 255, 0.14);
    }
    [data-theme="light"] {
      --bg: #eef2f7;
      --bg-elevated: #ffffff;
      --surface: #ffffff;
      --border: rgba(15, 23, 42, 0.12);
      --border-strong: rgba(15, 23, 42, 0.18);
      --text: #0f172a;
      --text-muted: #475569;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --shadow: 0 10px 32px rgba(15, 23, 42, 0.1);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-zone: 0 4px 16px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.06);
      --hover: rgba(37, 99, 235, 0.06);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      height: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body { height: 100%; overflow-x: hidden; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(139, 164, 255, 0.2), transparent),
        radial-gradient(900px 500px at 100% 0%, rgba(45, 212, 191, 0.14), transparent),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background 0.35s ease, color 0.25s ease;
      min-width: 0;
    }
    [data-theme="light"] body {
      background:
        radial-gradient(ellipse 90% 50% at 0% -10%, rgba(37, 99, 235, 0.07), transparent 55%),
        radial-gradient(ellipse 70% 45% at 100% 0%, rgba(13, 148, 136, 0.06), transparent 50%),
        var(--bg);
    }
    a { color: var(--accent); text-decoration: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    ul { list-style: none; }
    .hidden { display: none !important; }
    /* ========== LAYOUT ========== */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      padding: 1.25rem 1rem;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.3s ease;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.35rem 0.5rem;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: #fff;
      box-shadow: var(--shadow);
    }
    .brand h1 { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand span { font-size: 0.72rem; color: var(--text-muted); }
    .nav-section { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); padding: 0.5rem 0.75rem; }
    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.65rem;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .nav-btn:hover { background: var(--accent-soft); color: var(--text); }
    .nav-btn.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
    .nav-btn svg { width: 18px; height: 18px; opacity: 0.85; }
    .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .theme-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 0.85rem; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--surface);
      box-shadow: var(--shadow-sm);
      font-size: 0.8rem;
    }
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 1.25rem 1.5rem calc(5.5rem + env(safe-area-inset-bottom, 0));
      max-width: 1400px;
      min-width: 0;
      width: 100%;
    }
    .dash-date-nav {
      display: grid;
      grid-template-columns: 2.5rem minmax(0, 1fr) 2.5rem;
      align-items: center;
      gap: 0.35rem;
      width: 100%;
      margin-bottom: 0.35rem;
      padding: 0 0.1rem;
      box-sizing: border-box;
    }
    .dash-date-nav__side {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      width: 2.5rem;
    }
    .dash-date-nav__side--left {
      justify-content: flex-start;
    }
    .dash-date-nav__side--right {
      justify-content: flex-end;
    }
    .dash-date-nav__center {
      min-width: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }
    .dash-date-nav__date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 0.25rem;
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }
    .dash-date-nav__arrow {
      flex: 0 0 auto;
      width: 2.1rem;
      height: 2.1rem;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 1rem;
      line-height: 1;
      border-radius: var(--radius-sm);
    }
    .dash-date-label {
      flex: 1 1 0;
      min-width: 0;
      max-width: 100%;
      margin: 0;
      font-size: clamp(0.92rem, 3.1vw + 0.52rem, 1.58rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text);
      text-align: center;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dash-date-nav__today {
      flex-shrink: 0;
      font-size: 0.78rem;
      padding: 0.28rem 0.55rem;
      white-space: nowrap;
    }
    .dash-date-nav__side .btn-help,
    .dash-date-nav__side .btn-reminder-icon,
    .dash-date-nav__side .btn-theme-icon {
      width: 2.1rem;
      height: 2.1rem;
      min-width: 36px;
      min-height: 36px;
    }
    .dash-date-nav__side .btn-help svg {
      width: 15px;
      height: 15px;
    }
    .dash-date-nav__side .btn-reminder-icon,
    .dash-date-nav__side .btn-theme-icon {
      font-size: 0.95rem;
    }
    .dash-weather {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0 0 1rem;
      padding: 0 0.5rem;
      text-align: center;
    }
    .dash-weather-line {
      display: block;
      max-width: 100%;
      font-size: 0.88rem;
      line-height: 1.35;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dash-weather-line .weather-temp {
      color: #38bdf8;
      font-weight: 700;
    }
    [data-theme="light"] .dash-weather-line .weather-temp { color: #0284c7; }
    .dash-reminders-zone {
      margin: 0 0 0.6rem;
    }
    .dash-reminder-banner {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      padding: 0.48rem 0.72rem;
      border-radius: 10px;
      background: color-mix(in srgb, #94a3b8 16%, var(--surface));
      border: 1px dashed color-mix(in srgb, #94a3b8 56%, var(--border));
      box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 6%, transparent);
      font-size: 0.8rem;
      line-height: 1.35;
      color: var(--text-muted);
    }
    .dash-reminder-banner__list {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
    }
    .dash-reminder-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .dash-reminder-item + .dash-reminder-item {
      padding-top: 0.28rem;
      border-top: 1px dashed color-mix(in srgb, #94a3b8 38%, var(--border));
    }
    .dash-reminder-banner__dismiss {
      flex-shrink: 0;
      width: 1.65rem;
      height: 1.65rem;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .dash-reminder-banner__dismiss:hover {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 45%, var(--border));
      background: color-mix(in srgb, var(--danger) 10%, transparent);
    }
    .dash-reminder-banner__badge {
      flex-shrink: 0;
      font-size: 0.56rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 0.18rem 0.42rem;
      border-radius: 6px;
      color: color-mix(in srgb, #cbd5e1 78%, var(--text));
      background: color-mix(in srgb, #64748b 26%, transparent);
      line-height: 1.2;
    }
    .dash-reminder-banner__content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.15rem 0.4rem;
    }
    .dash-reminder-banner__date {
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      font-size: 0.78rem;
    }
    .dash-reminder-banner__text {
      color: var(--text-muted);
      font-weight: 500;
    }
    [data-theme="light"] .dash-reminder-banner {
      background: color-mix(in srgb, #e2e8f0 72%, #fff);
      border-color: color-mix(in srgb, #94a3b8 45%, var(--border));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }
    .btn-school-event-reminder,
    .btn-school-term-reminder {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      font-size: 0.88rem;
      line-height: 1;
      padding: 0;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.12s, box-shadow 0.2s;
    }
    .btn-school-event-reminder:hover,
    .btn-school-term-reminder:hover {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      background: var(--accent-soft);
      transform: scale(1.05);
    }
    .btn-school-event-reminder.is-active,
    .btn-school-term-reminder.is-active {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 38%, transparent);
      cursor: pointer;
    }
    .btn-school-event-reminder.is-active:hover,
    .btn-school-term-reminder.is-active:hover {
      background: color-mix(in srgb, var(--accent) 88%, #000);
      transform: scale(1.05);
    }
    .btn-calendar-icon,
    .btn-reminder-icon,
    .btn-theme-icon,
    .btn-regen-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      line-height: 1;
      color: var(--text-muted);
      border: 1px solid var(--border);
      background: transparent;
      transition: color 0.2s, background 0.2s, transform 0.15s;
    }
    .btn-calendar-icon:hover,
    .btn-reminder-icon:hover,
    .btn-theme-icon:hover,
    .btn-regen-icon:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .btn-regen-icon:hover { transform: rotate(-24deg); }
    .btn-calendar-icon:active,
    .btn-reminder-icon:active,
    .btn-theme-icon:active,
    .btn-regen-icon:active { transform: scale(0.94); }
    .btn-regen-icon:active { transform: rotate(-24deg) scale(0.94); }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      gap: 0.35rem;
      background: linear-gradient(180deg, #1e2640 0%, #141a2e 100%);
      border-top: 2px solid rgba(139, 164, 255, 0.35);
      padding: 0.5rem 0.5rem calc(0.5rem + env(safe-area-inset-bottom, 0));
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.45);
    }
    [data-theme="light"] .bottom-nav {
      background: linear-gradient(180deg, #ffffff 0%, #eef2fb 100%);
      border-top-color: rgba(37, 99, 235, 0.2);
      box-shadow: 0 -8px 28px rgba(15, 23, 42, 0.12);
    }
    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.5rem 0.35rem;
      min-height: 58px;
      max-width: 160px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: color 0.2s, background 0.2s, transform 0.12s, box-shadow 0.2s;
      border-radius: 12px;
      margin: 0;
    }
    [data-theme="light"] .bottom-nav-item { color: var(--text-muted); }
    .bottom-nav-item:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
    [data-theme="light"] .bottom-nav-item:hover { color: var(--text); background: var(--accent-soft); }
    .bottom-nav-item.active { color: #fff; font-weight: 800; }
    .bottom-nav-item[data-tab="home"].active {
      background: linear-gradient(145deg, rgba(139, 164, 255, 0.45), rgba(108, 140, 255, 0.25));
      box-shadow: inset 0 0 0 1px rgba(139, 164, 255, 0.5), 0 2px 10px rgba(108, 140, 255, 0.35);
    }
    .bottom-nav-item[data-tab="classes"].active {
      background: linear-gradient(145deg, rgba(45, 212, 191, 0.4), rgba(20, 184, 166, 0.22));
      box-shadow: inset 0 0 0 1px rgba(45, 212, 191, 0.5), 0 2px 10px rgba(20, 184, 166, 0.3);
    }
    .bottom-nav-item[data-tab="settings"].active {
      background: linear-gradient(145deg, rgba(252, 211, 77, 0.35), rgba(245, 158, 11, 0.2));
      box-shadow: inset 0 0 0 1px rgba(252, 211, 77, 0.45), 0 2px 10px rgba(245, 158, 11, 0.25);
      color: #fef3c7;
    }
    [data-theme="light"] .bottom-nav-item[data-tab="home"].active { color: #1d4ed8; }
    [data-theme="light"] .bottom-nav-item[data-tab="classes"].active { color: #0f766e; }
    [data-theme="light"] .bottom-nav-item[data-tab="settings"].active { color: #b45309; }
    .bottom-nav-icon { font-size: 1.45rem; line-height: 1; }
    .tools-cards-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }
    .tools-card {
      min-width: min(100%, 200px);
      flex: 1 1 200px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      border-left: 5px solid var(--tools-c, var(--accent));
      background: linear-gradient(145deg, var(--tools-bg, var(--accent-soft)), var(--surface) 50%);
      box-shadow: var(--shadow-zone);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .tools-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .tools-card:active { transform: scale(0.98); }
    .tools-card__icon { font-size: 2rem; margin-bottom: 0.5rem; line-height: 1; }
    .tools-card__label {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--tools-c, var(--accent));
      text-transform: none;
      letter-spacing: -0.01em;
    }
    .tools-card__sub {
      margin-top: 0.3rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .tools-card--classes { --tools-c: #a5b4fc; --tools-bg: rgba(165, 180, 252, 0.28); }
    .tools-card--orgEPS { --tools-c: #8ba4ff; --tools-bg: rgba(139, 164, 255, 0.26); }
    .tools-card--calendriers { --tools-c: #2dd4bf; --tools-bg: rgba(45, 212, 191, 0.24); }
    .tools-card--backup { --tools-c: #fcd34d; --tools-bg: rgba(252, 211, 77, 0.2); }
    .cal-panel {
      border-radius: var(--radius);
      padding: 1rem 1rem 0.85rem;
      margin-bottom: 1.15rem;
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-sm);
    }
    .cal-panel--year {
      border-left: 5px solid #38bdf8;
      background: linear-gradient(165deg, rgba(56, 189, 248, 0.16) 0%, var(--surface) 38%);
    }
    .cal-panel--year .cal-panel__title { color: #0284c7; }
    [data-theme="light"] .cal-panel--year .cal-panel__title { color: #0369a1; }
    .cal-panel--official {
      border-left: 5px solid #2dd4bf;
      background: linear-gradient(165deg, rgba(45, 212, 191, 0.16) 0%, var(--surface) 38%);
    }
    .cal-panel--official .cal-panel__title { color: #0d9488; }
    [data-theme="light"] .cal-panel--official .cal-panel__title { color: #0f766e; }
    .cal-panel--official .cal-panel__title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-panel--school {
      border-left: 5px solid #f59e0b;
      background: linear-gradient(165deg, rgba(245, 158, 11, 0.14) 0%, var(--surface) 38%);
    }
    .cal-panel--school .card-header {
      flex-wrap: nowrap;
      align-items: center;
      gap: 0.55rem;
    }
    .cal-panel--school .cal-panel__title {
      color: #d97706;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(0.95rem, 2.6vw, 1.12rem);
      line-height: 1.15;
    }
    [data-theme="light"] .cal-panel--school .cal-panel__title { color: #b45309; }
    .cal-panel--school .btn-add-school-event-inline {
      margin: 0.45rem 0 0.8rem;
      width: fit-content;
      max-width: 100%;
    }
    .cal-panel__title {
      margin: 0 0 0.75rem;
      font-size: 1.08rem;
      line-height: 1.25;
    }
    .cal-panel__title--one-line,
    .title-one-line,
    .dash-block__title--inline {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      min-width: 0;
    }
    .cal-panel__title--one-line {
      font-size: clamp(0.82rem, 3.6vw, 1.05rem);
      line-height: 1.2;
      margin-bottom: 0.55rem;
    }
    .cal-panel__action-btns {

  <script>
    /* Ancienne build : isFileProtocol() s'appelait via window en boucle — retirer si présent */
    try {
      delete window.isFileProtocol;
    } catch (e) {
      window.isFileProtocol = undefined;
    }
    function epsIsBenignJsError(msg, src, line, col, err) {
      var m = String(msg || "");
      var ln = Number(line);
      var cl = Number(col);
      if (m === "Script error." && ln === 0 && cl === 0) return true;
      if (m === "Script error." && !String(src || "").trim()) return true;
      if (/^ResizeObserver loop/i.test(m)) return true;
      if (!err || !err.stack) {
        if (ln === 0 && cl === 0 && (!src || String(src).indexOf("eps-college-dashboard") < 0)) return true;
      }
      return false;
    }
    window.onerror = function(msg, src, line, col, err) {
      if (epsIsBenignJsError(msg, src, line, col, err)) {
        console.warn("[EPS] Erreur ignorée (faux positif Safari, souvent au Partager) :", msg, src || "");
        return true;
      }
      var s = String(src || "");
      if (s && s.indexOf(location.origin) !== 0 && s.indexOf("eps-college-dashboard") < 0 && Number(line) === 0) {
        console.warn("[EPS] Erreur cross-origin ignorée :", msg, s);
        return true;
      }
      console.error("[EPS] Erreur JS", msg, src, line, col, err);
      var mainEl = document.getElementById("main");
      if (mainEl) {
        mainEl.innerHTML =
          "<div style='padding:2rem;color:red;font-size:1rem;word-break:break-all'><h2>Erreur JS</h2><p><b>" +
          String(msg) +
          "</b></p><p>Ligne " +
          line +
          ", col " +
          col +
          "</p><pre style='white-space:pre-wrap'>" +
          (err && err.stack ? err.stack : "") +
          "</pre></div>";
      }
      return false;
    };
  </script>
  <script>
    /**
     * =============================================================================
     * EPS COLLÈGE — APPLICATION MONOLITHIQUE (HTML + CSS + JS, sans dépendance)
     * =============================================================================
     *
     * ARCHITECTURE (extensible) :
     * 1) DONNÉES — `appData` : classes, créneaux (schedules), APSA (activities),
     *    événements calendaires (holidays), annulations, séances générées (sessions).
     * 2) PERSISTANCE — localStorage (auto), export/import JSON, reset.
     * 3) MOTEUR — `regenerateSessions()` : parcourt l'année, applique chaque créneau (jour, alternance
     *    semaine A/B depuis la rentrée), exclut jours bloquants, rattache l'APSA par chevauchement de dates
     *    et par jours de pratique cochés sur l'APSA. `computeSessionStatus()` : annulation > férié > passé/futur.
     * 4) PRÉSENTATION — `render()` : vue « Tableau de bord », puis une vue par classe
     *    (`class:<id>` avec liste des séances et annulations), puis « Réglages & données »
     *    (sous-panneaux EDT / APSA / etc.). `wireEvents()` attache les interactions.
     *
     * Pour ajouter un module : étendre `appData`, créer les fonctions CRUD + une
     * fonction `viewMonModule()` puis une entrée dans `VIEWS` et le `switch` de render.
     * =============================================================================
     */

    /** @typedef {'dashboard'|'tools'|string} ViewId — les vues classe sont `class:<uuid>`. */

    const STORAGE_KEY = "eps_college_dashboard_v1";

    /**
     * Stockage compatible fichier local / AirDrop (iOS Safari) : `localStorage` peut être
     * indisponible ou lever SecurityError sur `file://`. On teste une fois puis repli mémoire.
     */
    const LS_MEMORY = {};
    let lsUsable = null;
    /** true si les données ne survivent pas au rechargement (mode fichier sans localStorage). */
    let appStorageIsMemory = false;
    function lsWorks() {
      if (lsUsable !== null) return lsUsable;
      try {
        if (typeof localStorage === "undefined" || !localStorage) {
          lsUsable = false;
          appStorageIsMemory = true;
          return false;
        }
        var t = "__eps_ls_probe__";
        localStorage.setItem(t, "1");
        localStorage.removeItem(t);
        lsUsable = true;
        appStorageIsMemory = false;
        return true;
      } catch (e) {
        lsUsable = false;
        appStorageIsMemory = true;
        return false;
      }
    }
    function lsGet(key) {
      if (lsWorks()) {
        try {
          return localStorage.getItem(key);
        } catch (e) {}
      }
      return Object.prototype.hasOwnProperty.call(LS_MEMORY, key) ? LS_MEMORY[key] : null;
    }
    function lsSet(key, val) {
      if (lsWorks()) {
        try {
          localStorage.setItem(key, val);
          return;
        } catch (e) {}
      }
      LS_MEMORY[key] = val;
    }
    function lsRemove(key) {
      if (lsWorks()) {
        try {
          localStorage.removeItem(key);
        } catch (e) {}
      }
      delete LS_MEMORY[key];
    }

    function isAppThemeLight() {
      return document.documentElement.getAttribute("data-theme") === "light";
    }

    function syncThemeColor() {
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", isAppThemeLight() ? "#eef2f7" : "#0a0c12");
    }

    function applyAppTheme(theme) {
      if (theme === "dark") {
        document.documentElement.removeAttribute("data-theme");
        lsSet("eps_theme", "dark");
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        lsSet("eps_theme", "light");
      }
      syncThemeColor();
      const label = theme === "dark" ? "Clair" : "Sombre";
      document.querySelectorAll(".btn-theme-toggle").forEach((btn) => {
        if (btn.classList.contains("btn-theme-icon")) {
          btn.textContent = theme === "dark" ? "☀️" : "🌙";
          btn.setAttribute("aria-label", "Changer le thème — passer en " + label.toLowerCase());
          btn.setAttribute("title", "Passer en " + label);
          return;
        }
        btn.textContent = "Passer en " + label;
        btn.setAttribute("aria-label", "Changer le thème — passer en " + label.toLowerCase());
      });
    }

    function toggleAppTheme() {
      applyAppTheme(isAppThemeLight() ? "dark" : "light");
    }

    /**
     * État global de l'application (source de vérité en mémoire).
     * sessions : générées automatiquement à partir des créneaux, vacances, fériés, APSA.
     */
    const appData = {
      settings: {
        schoolYearStart: "2025-09-01",
        schoolYearEnd: "2026-07-05",
        calendarSchoolYear: "2025-2026",
        zone: "C",

    /* -------------------------------------------------------------------------- */
    /* UTILITAIRES                                                                */

    function uid() {
      try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e) {}
      return "id-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    }

    function parseISODate(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function fmtISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function addDays(d, n) {
      const x = new Date(d);
      x.setDate(x.getDate() + n);
      return x;
    }

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function dayIndexMon0(d) {
      const i = d.getDay();
      return i === 0 ? 6 : i - 1;
    }

    /** Numéro de semaine (lundi → lundi) depuis le début d'année scolaire — pour alternance A/B. */
    function schoolWeekIndex(date) {
      const start = parseISODate(appData.settings.schoolYearStart);
      const monStart = addDays(start, -dayIndexMon0(start));
      const monD = addDays(new Date(date.getFullYear(), date.getMonth(), date.getDate()), -dayIndexMon0(date));
      const diff = Math.round((monD - monStart) / (7 * 86400000));
      return diff >= 0 ? diff : 0;
    }

    /** Créneau « semaine A » (pairs) ou « semaine B » (impairs) depuis la rentrée. */
    function matchesWeekParity(slot, date) {
      const p = slot.weekParity || "all";
      if (p === "all") return true;
      const idx = schoolWeekIndex(date);
      if (p === "A") return idx % 2 === 0;
      if (p === "B") return idx % 2 === 1;
      return true;
    }

    function weekParityLabel(slot) {
      const p = slot.weekParity || "all";
      if (p === "A") return "Semaine A";
      if (p === "B") return "Semaine B";
      return "Toutes";
    }

    function isDateInRange(date, startStr, endStr) {
      const t = fmtISODate(date);
      return t >= startStr && t <= endStr;
    }

    function todayStart() {
      const n = new Date();
      n.setHours(0, 0, 0, 0);
      return n;
    }

    function saveData(opts) {
      opts = opts || {};
      try {
        if (!opts.skipAutoRegen && !saveData._autoRegenLock) {
          saveData._autoRegenLock = true;
          regenerateSessions({ skipSave: true });
          saveData._autoRegenLock = false;
        }
        lsSet(STORAGE_KEY, JSON.stringify(appData));
      } catch (e) {
        saveData._autoRegenLock = false;
        console.error(e);
        alert("Sauvegarde impossible (quota navigateur ?).");
      }
    }

    function loadData() {
      try {
        const raw = lsGet(STORAGE_KEY);
        if (!raw) return false;
        const o = JSON.parse(raw);
        Object.assign(appData, o);
        return true;
      } catch {
        return false;
      }
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `eps-backup-${fmtISODate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importJSONFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const o = JSON.parse(reader.result);
          Object.keys(appData).forEach((k) => {
            if (o[k] !== undefined) appData[k] = o[k];
          });
          regenerateSessions();
          saveData();
          render();
          alert("Import réussi.");
        } catch {
          alert("Fichier JSON invalide.");
        }
      };
      reader.readAsText(file);
    }

    function resetAll() {
      if (!confirm("Effacer toutes les données locales ? Cette action est irréversible.")) return;
      lsRemove(STORAGE_KEY);

    /* -------------------------------------------------------------------------- */
